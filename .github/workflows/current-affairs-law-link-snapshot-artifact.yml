name: Temporary Current Affairs Law Link Snapshot Artifact

on:
  pull_request:
    paths:
      - '.github/workflows/current-affairs-law-link-snapshot-artifact.yml'
      - 'data/current_affairs_law_link_rules.v1.json'
      - 'scripts/current_affairs_law_links.py'
      - 'scripts/build_current_affairs_signals_snapshot.py'

permissions:
  contents: read

concurrency:
  group: swsi-temp-law-link-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate fail-closed law-link rules
        run: python scripts/current_affairs_law_links.py

      - name: Rebuild public current-affairs snapshots
        run: |
          set -euo pipefail
          python scripts/build_current_affairs_signals_snapshot.py \
            --input auto/current_affairs.json \
            --questions-shards-dir cdn/question-shards \
            --output auto/current_affairs_signals.json \
            --limit 30
          python scripts/build_current_affairs_events_snapshot.py \
            --news auto/current_affairs.json \
            --signals auto/current_affairs_signals.json \
            --output auto/current_affairs_events.json \
            --limit 30
          python scripts/build_current_affairs_trends_snapshot.py \
            --events auto/current_affairs_events.json \
            --output auto/current_affairs_trends.json \
            --limit 30

          cp auto/current_affairs_signals.json cdn/auto/current_affairs_signals.json
          cp auto/current_affairs_events.json cdn/auto/current_affairs_events.json
          cp auto/current_affairs_trends.json cdn/auto/current_affairs_trends.json

      - name: Verify target law links reach signals and trends
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          signals = json.loads(Path('auto/current_affairs_signals.json').read_text(encoding='utf-8'))['items']
          trends = json.loads(Path('auto/current_affairs_trends.json').read_text(encoding='utf-8'))['trends']

          def find(rows, needle):
              return next((row for row in rows if needle in str(row.get('title') or '')), None)

          wage = find(signals, '最低工資連11漲')
          childcare = find(signals, '企業托育補助新制')
          if not wage or '最低工資法' not in (wage.get('related_laws') or []):
              raise SystemExit(f'最低工資法 linkage missing: {wage}')
          if not childcare or '性別平等工作法' not in (childcare.get('related_laws') or []):
              raise SystemExit(f'性別平等工作法 linkage missing: {childcare}')
          if childcare.get('law_link_status') != 'law_linked':
              raise SystemExit(f'childcare law_link_status mismatch: {childcare.get("law_link_status")}')
          if not childcare.get('related_policy_instruments'):
              raise SystemExit('enterprise childcare policy instrument missing')

          wage_trend = find(trends, '最低工資連11漲')
          childcare_trend = find(trends, '企業托育補助新制')
          if not wage_trend or '最低工資法' not in (wage_trend.get('related_laws') or []):
              raise SystemExit('minimum-wage law did not propagate to trend snapshot')
          if not childcare_trend or '性別平等工作法' not in (childcare_trend.get('related_laws') or []):
              raise SystemExit('childcare law did not propagate to trend snapshot')
          print('Target law-link propagation: PASS')
          PY

      - name: Cheap snapshot smoke
        run: |
          python scripts/current_affairs_signals_smoke.py
          python scripts/current_affairs_events_smoke.py
          python scripts/public_monitoring_v2_smoke.py
          git diff --check

      - name: Upload rebuilt snapshots
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-law-link-snapshots
          retention-days: 1
          if-no-files-found: error
          path: |
            auto/current_affairs_signals.json
            auto/current_affairs_events.json
            auto/current_affairs_trends.json
            cdn/auto/current_affairs_signals.json
            cdn/auto/current_affairs_events.json
            cdn/auto/current_affairs_trends.json
