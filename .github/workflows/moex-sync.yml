name: Sync MOEX Social Worker Exams

on:
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'
  push:
    paths:
      - '.github/workflows/moex-sync.yml'
      - 'scripts/moex_sync.py.gz.b64'

permissions:
  contents: write

concurrency:
  group: moex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pymupdf scikit-learn

      - name: Decode and run MOEX sync
        shell: bash
        run: |
          mkdir -p auto
          base64 -d scripts/moex_sync.py.gz.b64 | gzip -dc > scripts/moex_sync.py
          set +e
          python scripts/moex_sync.py > /tmp/moex_sync.log 2>&1
          status=$?
          set -e
          {
            echo "exit_code=$status"
            echo "run_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- output ---"
            cat /tmp/moex_sync.log
          } > auto/action_diagnostic.txt
          rm -f scripts/moex_sync.py
          echo "MOEX_SYNC_EXIT_CODE=$status" >> "$GITHUB_ENV"

      - name: Commit updates and diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "自動同步考選部社工師最新考題"
            git push
          fi

      - name: Mark sync failure
        if: env.MOEX_SYNC_EXIT_CODE != '0'
        run: exit 1
