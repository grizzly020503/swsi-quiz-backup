name: MOEX 社工師題庫同步

on:
  push:
    paths:
      - 'scripts/moex_sync.py'
      - '.github/workflows/moex-sync.yml'
  workflow_dispatch:
  schedule:
    # 台灣時間每天 10:35；考選部通常於考畢次日上午 10:00 公布
    - cron: '35 2 * * *'

permissions:
  contents: write

concurrency:
  group: moex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: pip install --disable-pip-version-check requests pypdf

      - name: Fetch and parse current MOEX social-worker exams
        shell: bash
        run: |
          mkdir -p incoming
          ROC_YEAR=$(( $(TZ=Asia/Taipei date +%Y) - 1911 ))
          code="${ROC_YEAR}100"
          set +e
          python scripts/moex_sync.py --exam "$code" --output-dir incoming --skip-existing > /tmp/moex-sync.log 2>&1
          status=$?
          set -e
          {
            echo "exam_code=$code"
            echo "exit_code=$status"
            echo "run_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- parser output ---"
            cat /tmp/moex-sync.log
          } > incoming/last_run.txt
          echo "SYNC_EXIT=$status" >> "$GITHUB_ENV"

      - name: Validate generated payloads
        if: env.SYNC_EXIT == '0'
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          files=[x for x in glob.glob('incoming/*.json') if not x.endswith('last_run.json')]
          for fn in files:
              d=json.load(open(fn,encoding='utf-8'))
              assert len(d['questions']) == 200, (fn, len(d['questions']))
              assert len(d['essays']) == 10, (fn, len(d['essays']))
              assert len({q['id'] for q in d['questions']}) == 200
              assert all(q['answer'] in ('A','B','C','D') for q in d['questions'])
              assert all(q['question'] and q['opt_a'] and q['opt_b'] and q['opt_c'] and q['opt_d'] for q in d['questions'])
              print('validated', fn)
          PY

      - name: Commit payload and diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "自動收錄考選部最新社工師試題"
            git push
          fi

      - name: Mark parser failure
        if: env.SYNC_EXIT != '0'
        run: exit 1
