name: MOEX 社工師題庫同步

on:
  push:
    paths:
      - 'scripts/moex_sync.py'
      - '.github/workflows/moex-sync.yml'
  workflow_dispatch:
  schedule:
    # 台灣時間每天 10:35；考選部通常於考畢次日上午 10:00 公布
    - cron: '35 2 * * *'

permissions:
  contents: write

concurrency:
  group: moex-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: pip install --disable-pip-version-check requests pypdf

      - name: Fetch and parse current MOEX social-worker exams
        shell: bash
        run: |
          set -e
          ROC_YEAR=$(( $(TZ=Asia/Taipei date +%Y) - 1911 ))
          for suffix in 030 100; do
            code="${ROC_YEAR}${suffix}"
            # 115030 已由舊題庫完整收錄；避免因歷史 ID 格式不同重複匯入。
            if [ "$code" = "115030" ]; then
              echo "skip legacy exam $code"
              continue
            fi
            python scripts/moex_sync.py --exam "$code" --output-dir incoming --skip-existing || true
          done

      - name: Validate generated payloads
        shell: bash
        run: |
          python - <<'PY'
          import json, glob
          for fn in glob.glob('incoming/*.json'):
              d=json.load(open(fn,encoding='utf-8'))
              assert len(d['questions']) == 200, (fn, len(d['questions']))
              assert len(d['essays']) == 10, (fn, len(d['essays']))
              assert len({q['id'] for q in d['questions']}) == 200
              assert all(q['answer'] in ('A','B','C','D') for q in d['questions'])
              assert all(q['question'] and q['opt_a'] and q['opt_b'] and q['opt_c'] and q['opt_d'] for q in d['questions'])
              print('validated', fn)
          PY

      - name: Commit newly discovered exam payloads
        shell: bash
        run: |
          if [ -z "$(git status --porcelain incoming 2>/dev/null)" ]; then
            echo "No new exam payloads."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming/
          git commit -m "自動收錄考選部最新社工師試題"
          git push
