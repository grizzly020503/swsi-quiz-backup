name: SWSI 104-1 Isolated PostgreSQL 17 Rollback Rehearsal

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/official-1041-isolated-pg-rehearsal.yml'
      - 'scripts/official_1041_ds_isolated_pg_rehearsal.py'
      - 'scripts/official_1041_ds_release_candidate_builder.py'
      - 'scripts/official_1041_ds_successor_overlay_smoke.py'
      - 'audit/official_104_1_live_seven_trigger_definitions_20261031.json'
      - 'audit/official_104_1_direct_service_three_shadow_readonly_20261031.sql'
      - 'audit/official_104_1_direct_service_three_ocr_candidate_20261031.json'

permissions:
  contents: read

jobs:
  isolated-pg:
    if: github.event.pull_request.head.ref == 'audit/104-1-ds-three-ocr-review-20261031'
    name: 4800-row actual PostgreSQL BEGIN/ROLLBACK and AI trigger guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: swsi_ci
          POSTGRES_USER: swsi_ci
          POSTGRES_PASSWORD: isolated_only
        options: >-
          --health-cmd "pg_isready -U swsi_ci -d swsi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4

      - name: Generate isolated 4800 public-row PostgreSQL test SQL
        run: |
          python3 -m py_compile scripts/official_1041_ds_isolated_pg_rehearsal.py
          python3 scripts/official_1041_ds_isolated_pg_rehearsal.py \
            --out /tmp/swsi-1041-isolated-postgres-rollback.sql

      - name: Run true local PostgreSQL transactions with rollback and AI event stubs
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U swsi_ci -d swsi_ci -v ON_ERROR_STOP=1 -X \
            < /tmp/swsi-1041-isolated-postgres-rollback.sql

      - name: Stage offline 104-1 shard, manifest and official lock (NEVER PUBLISH)
        shell: bash
        run: |
          python3 -m py_compile scripts/official_1041_ds_release_candidate_builder.py
          python3 scripts/official_1041_ds_release_candidate_builder.py \
            --out /tmp/swsi-1041-unapproved-release-candidate
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/swsi-1041-unapproved-release-candidate/candidate-evidence.json')
          d=json.loads(path.read_text(encoding='utf-8'))
          assert d['status']=='STAGED_ONLY_HUMAN_APPROVAL_FALSE_PRODUCTION_NO_GO'
          assert d['grading_unchanged_count']==4800
          assert d['unaffected_exact_row_count']==4797
          assert d['changed_official_lock_count']==3
          assert d['essay_lock_count']==240
          assert d['staged_ready_count']==4664 and d['staged_review_count']==136
          assert d['human_approval'] is False and d['published'] is False
          print('DRAFT ONLY: official-candidate shard/manifest/lock staging verified, no tracked file changed')
          PY

      - name: Validate staged shard, manifest and Official Core lock in a disposable code copy
        shell: bash
        run: |
          set -eu
          qa_dir="$(mktemp -d /tmp/swsi-1041-release-validation-XXXXXX)"
          git archive HEAD | tar -x -C "$qa_dir"
          cp /tmp/swsi-1041-unapproved-release-candidate/cdn/question-shards/104-1.json \
            "$qa_dir/cdn/question-shards/104-1.json"
          cp /tmp/swsi-1041-unapproved-release-candidate/cdn/question-shards/manifest.json \
            "$qa_dir/cdn/question-shards/manifest.json"
          cp /tmp/swsi-1041-unapproved-release-candidate/data/official_exam_readonly.lock.json \
            "$qa_dir/data/official_exam_readonly.lock.json"
          # Verify the staged FUTURE release has *exactly* one 3-row official
          # overlay and reconstructs the immutable published predecessor,
          # including its SHA-pinned manifest and immutable Official Core locks.
          python3 -m py_compile scripts/official_1041_ds_successor_overlay_smoke.py
          python3 scripts/official_1041_ds_successor_overlay_smoke.py \
            --candidate /tmp/swsi-1041-unapproved-release-candidate \
            --out /tmp/swsi-1041-recovered-published-predecessor \
            --adversarial-selftest
          predecessor_dir="$(mktemp -d /tmp/swsi-1041-recovered-regression-XXXXXX)"
          git archive HEAD | tar -x -C "$predecessor_dir"
          cp /tmp/swsi-1041-recovered-published-predecessor/cdn/question-shards/104-1.json \
            "$predecessor_dir/cdn/question-shards/104-1.json"
          cp /tmp/swsi-1041-recovered-published-predecessor/cdn/question-shards/manifest.json \
            "$predecessor_dir/cdn/question-shards/manifest.json"
          cp /tmp/swsi-1041-recovered-published-predecessor/data/official_exam_readonly.lock.json \
            "$predecessor_dir/data/official_exam_readonly.lock.json"
          (
            cd "$predecessor_dir"
            python3 scripts/official_exam_readonly_guard.py
            python3 scripts/official_ten_source_integration_smoke.py
            python3 scripts/official_shared_context_13row_integration_smoke.py
          )
          # Independently validate the staged, unpublished FUTURE snapshot.
          (
            cd "$qa_dir"
            python3 scripts/official_exam_readonly_guard.py
            python3 scripts/full_corpus_qa.py \
              --out /tmp/swsi-1041-candidate-full-corpus-qa.json --fail-on blocked
          )
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/swsi-1041-candidate-full-corpus-qa.json').read_text())
          assert d['summary']['total_mcq']==4800
          assert d['summary']['total_essays']==240
          assert d['summary']['official_blocked']==0
          print('OFFLINE CANDIDATE QA PASS: 4800 MCQ + 240 essays, Official Core lock valid; no checked-in files modified')
          PY

      - name: Retain unapproved release candidate for independent human review
        uses: actions/upload-artifact@v4
        with:
          name: swsi-1041-DS-3row-DO-NOT-PUBLISH-candidate
          path: /tmp/swsi-1041-unapproved-release-candidate/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Write review-only evidence summary
        run: |
          echo '## Isolated SWSI PostgreSQL 17 transaction proof' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- 4,800 public question rows seeded from verified local shards; 3 full 37-column live preimages.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Real BEGIN/UPDATE/ROLLBACK executed **only** against disposable PostgreSQL service.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unsafe combined Official Core + status UPDATE produces pending and mock scheduling event; rollback.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Safe two-step transaction: official question update then status-only Review update, no mock AI job enable, with all seven live question trigger definitions.' >> "$GITHUB_STEP_SUMMARY"
          echo '- After ROLLBACK all 4,800 records match original baseline and AI job remains disabled.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Seven exact live question trigger definitions reproduced; external AI cron/net helpers are harmless stubs, not a complete production replica.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Human signoff and explicit production merge/deploy approval remain NO-GO.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Staged 104-1 shard + manifest + Official Core lock emitted to an UNAPPROVED artifact only, never main/CDN.' >> "$GITHUB_STEP_SUMMARY"
