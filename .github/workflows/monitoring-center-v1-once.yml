name: Monitoring Center V1 Once

on:
  push:
    branches:
      - feat/monitoring-center-v1-20260901

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply monitoring center patch
        run: python scripts/monitoring_center_v1_apply.py
      - name: Rebuild maintained runtime artifacts
        run: |
          cat monthly_patch_parts/*.part > monthly_patch.js
          cp monthly_patch.js cdn/monthly_patch.js
          node --check monthly_patch.js
          node --check cdn/monthly_patch.js
          grep -q 'SWSI Public Branding / Monitoring Center V1 2026-09-01' monthly_patch.js
          grep -q 'data-swsi-public-info="monitor"' monthly_patch.js
          grep -q 'total_questions)!==4800' monthly_patch.js
          grep -q "method:'OPTIONS'" monthly_patch.js
      - name: Scope and safety gate
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "cdn/monthly_patch.js monthly_patch.js monthly_patch_parts/89.public-branding-info.part "
          ! git diff | grep -E 'SUPABASE_SERVICE_ROLE_KEY|accepted_answers|grading_mode|GROQ_KEY|SWSI_INTERNAL_KEY'
      - name: Commit feature runtime
        run: |
          git config user.name "swsi-monitoring-v1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add monthly_patch_parts/89.public-branding-info.part monthly_patch.js cdn/monthly_patch.js
          git commit -m "feat: add public monitoring center v1"
          git push
