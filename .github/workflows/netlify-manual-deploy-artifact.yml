name: Netlify Manual Deploy Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/netlify-manual-deploy-artifact.yml'
      - 'docs/NETLIFY_MANUAL_DEPLOY.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/netlify-manual-deploy-artifact.yml'
      - 'index.html'

permissions:
  contents: read

jobs:
  build-netlify-manual-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build exactly as Netlify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/swsi-netlify-build.sh
          import tomllib
          from pathlib import Path

          cfg = tomllib.loads(Path('netlify.toml').read_text(encoding='utf-8'))
          command = cfg['build']['command']
          publish = cfg['build']['publish']
          if publish != '_site':
              raise SystemExit(f'Unexpected Netlify publish directory: {publish!r}')
          print('set -euo pipefail')
          print(command)
          PY
          bash /tmp/swsi-netlify-build.sh

      - name: Verify deploy root
        shell: bash
        run: |
          set -euo pipefail
          # Keep every release guard fail-closed, but label the precise failed
          # condition so maintainer does not have to guess from exit code 1.
          for file in \
            _site/index.html \
            _site/admin/index.html \
            _site/monthly_patch.js \
            _site/manifest.json \
            _site/sw.js \
            _site/auto/current_affairs.json \
            _site/auto/current_affairs_signals.json \
            _site/auto/current_affairs_events.json \
            _site/auto/current_affairs_trends.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Netlify manual package missing required file: $file" >&2
              exit 1
            fi
          done
          if [ ! -d _site/icons ]; then
            echo '::error::Netlify manual package missing icons directory' >&2
            exit 1
          fi
          if ! grep -q 'swsi-netlify-release" content="2026-09-26-history-v2.2' _site/index.html; then
            echo '::error::Netlify manual package release marker mismatch' >&2
            exit 1
          fi
          # The canonical installer deliberately replaced the legacy trend radar
          # with three curated exam priorities. Assert the active UI, not the retired label.
          if ! grep -q '目前 3 個國考重點' _site/index.html; then
            echo '::error::Netlify manual package missing canonical current-affairs priority UI' >&2
            exit 1
          fi
          if ! grep -q "const VERSION = 'v7'" _site/sw.js; then
            echo '::error::Netlify manual package service worker version mismatch' >&2
            exit 1
          fi
          node --check _site/monthly_patch.js

          python - <<'PY'
          import json
          from pathlib import Path
          current=json.loads(Path('_site/auto/current_affairs.json').read_text(encoding='utf-8'))
          signals=json.loads(Path('_site/auto/current_affairs_signals.json').read_text(encoding='utf-8'))
          events=json.loads(Path('_site/auto/current_affairs_events.json').read_text(encoding='utf-8'))
          trends=json.loads(Path('_site/auto/current_affairs_trends.json').read_text(encoding='utf-8'))
          assert int(current.get('source_feed_count') or 0) >= 17, current.get('source_feed_count')
          feed_error_count = current.get('feed_error_count')
          assert feed_error_count is not None and int(feed_error_count) == 0, feed_error_count
          assert int(signals.get('questions_loaded') or 0) == 4800
          assert int(signals.get('item_count') or -1) == len(signals.get('items') or [])
          assert int(events.get('event_count') or -1) == len(events.get('events') or [])
          assert int(trends.get('event_count') or -1) == len(trends.get('trends') or [])
          assert trends.get('method') == 'deterministic-v2.2', trends.get('method')
          print(
              'NETLIFY MANUAL ARTIFACT V2.2 CONTRACT OK '
              f"sources={current['source_feed_count']} "
              f"signals={signals['item_count']}/4800 "
              f"events={events['event_count']} "
              f"trends={trends['event_count']}/history-v2.2"
          )
          PY

      - name: Package Netlify manual deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f swsi-netlify-manual-deploy.zip swsi-netlify-manual-deploy.sha256 NETLIFY_MANUAL_DEPLOY_INFO.txt
          (
            cd _site
            zip -q -r ../swsi-netlify-manual-deploy.zip .
          )
          sha256sum swsi-netlify-manual-deploy.zip > swsi-netlify-manual-deploy.sha256
          {
            echo 'SWSI Netlify manual deploy package'
            echo 'Release contract: 2026-09-26-history-v2.2'
            echo "Commit: ${GITHUB_SHA}"
            echo "Built from: ${GITHUB_REF_NAME}"
            echo 'Required: SW v7, >=17 current-affairs sources, 0 feed errors, 4,800-question signals, deterministic-v2.2 trends.'
            echo 'Publish root: contents of _site at ZIP root'
            echo 'Upload swsi-netlify-manual-deploy.zip to the existing Netlify site manual deploy UI.'
            echo 'This package updates the static frontend only. It does not deploy Supabase migrations/Edge Functions or Cloudflare Worker code.'
          } > NETLIFY_MANUAL_DEPLOY_INFO.txt
          unzip -t swsi-netlify-manual-deploy.zip

      - name: Upload manual deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: swsi-netlify-manual-deploy-history-v22
          path: |
            swsi-netlify-manual-deploy.zip
            swsi-netlify-manual-deploy.sha256
            NETLIFY_MANUAL_DEPLOY_INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
