name: Historical Law Stage 4 Probe

on:
  pull_request:
    paths:
      - '.github/workflows/historical-law-stage4-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moj-history-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe official MOJ history and one derived old-version URL
        run: |
          mkdir -p auto/qa
          python - <<'PY'
          import re
          import requests
          from pathlib import Path

          headers={'User-Agent':'swsi-stage4-probe/1.1'}
          history='https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=D0050075'
          old='https://law.moj.gov.tw/LawClass/LawOldVer.aspx?pcode=D0050075&lnndate=20140129&lser=001'

          for label,url in [('history',history),('oldver',old)]:
              r=requests.get(url,timeout=30,headers=headers)
              r.raise_for_status()
              Path(f'auto/qa/moj_{label}_D0050075.html').write_text(r.text,encoding='utf-8')
              print(label,'status',r.status_code,'bytes',len(r.text),'url',r.url)
              print(label,'title',re.search(r'<title>(.*?)</title>',r.text,re.I|re.S).group(1).strip())
              print(label,'article heading count',len(re.findall(r'第\s*\d+(?:-\d+)?\s*條',r.text)))
              print(label,'LawOldVer',r.text.lower().count('lawoldver'))
              print(label,'lnndate',r.text.lower().count('lnndate'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moj-history-D0050075-raw
          path: |
            auto/qa/moj_history_D0050075.html
            auto/qa/moj_oldver_D0050075.html
          if-no-files-found: error
          retention-days: 1
