name: Historical Law Stage 4 Probe

on:
  pull_request:
    paths:
      - '.github/workflows/historical-law-stage4-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moj-history-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Fetch one official MOJ LawHistory raw page
        run: |
          mkdir -p auto/qa
          python - <<'PY'
          import requests
          from pathlib import Path
          url='https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=D0050075'
          r=requests.get(url,timeout=30,headers={'User-Agent':'swsi-stage4-probe/1.0'})
          r.raise_for_status()
          Path('auto/qa/moj_history_D0050075.html').write_text(r.text,encoding='utf-8')
          print('status',r.status_code,'bytes',len(r.text),'url',r.url)
          for token in ['LawOldVer','lnndate','lser','doPostBack','History']:
              print(token, r.text.lower().count(token.lower()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: moj-history-D0050075-raw
          path: auto/qa/moj_history_D0050075.html
          if-no-files-found: error
          retention-days: 1
