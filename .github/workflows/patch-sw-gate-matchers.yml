name: Patch Service Worker Gate Matchers

on:
  workflow_dispatch:
  push:
    branches:
      - fix/code-health-p0-20260826
    paths:
      - scripts/patch_sw_gate_matchers.py
      - .github/workflows/patch-sw-gate-matchers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact gate matcher patch
        run: python3 scripts/patch_sw_gate_matchers.py

      - name: Verify gates against current Service Worker
        run: |
          node scripts/p0_frontend_preflight.js
          python3 scripts/monthly_frontend_smoke.py --site . || true
          grep -q "networkFirstAfterCleanup(req, null, true)" scripts/monthly_frontend_smoke.py
          grep -q "networkFirstAfterCleanup" scripts/p0_frontend_preflight.js

      - name: Commit matcher repair
        run: |
          if git diff --quiet -- scripts/p0_frontend_preflight.js scripts/monthly_frontend_smoke.py; then
            echo "Gate matchers already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/p0_frontend_preflight.js scripts/monthly_frontend_smoke.py
          git commit -m "同步 Service Worker cleanup 後的 QA matcher"
          git push origin HEAD:fix/code-health-p0-20260826
