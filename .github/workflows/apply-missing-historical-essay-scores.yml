name: Apply Missing Historical Essay Scores

on:
  push:
    paths:
      - '.github/workflows/apply-missing-historical-essay-scores.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install health-check dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Apply verified MOEX score-line fixes
        run: python scripts/fix_missing_historical_essay_scores.py
      - name: Run permanent local health check
        run: python scripts/health_check.py --local
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'swsi-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html auto/health.json
          git diff --check
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m '補齊六題考選部歷屆申論官方分數'
          git push
