name: Install Spaced Review V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install_spaced_review_v2.py'
      - '.github/workflows/install-spaced-review-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install spaced review v2
        run: python scripts/install_spaced_review_v2.py
      - name: Syntax check inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          assert '間隔複習 2.0 START' in html
          assert 'startDueReview' in html
          assert 'REVIEW_INTERVAL_DAYS=[1,3,7,14,30]' in html
          PY
          node --check /tmp/index-inline.js
      - name: Commit verified upgrade
        run: |
          git config user.name 'swsi-feature-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Already installed.'
            exit 0
          fi
          git commit -m '升級錯題本為間隔複習2.0'
          git push
