name: Monthly Frontend QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monthly-frontend-qa.yml'
      - 'monthly_patch_parts/**'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/monthly_frontend_smoke.py'
      - 'scripts/browser_interaction_smoke.js'
      - 'scripts/knowledge_path_smoke.js'
      - 'scripts/theory_trust_smoke.js'
      - 'scripts/knowledge_catalog_audit.js'
      - 'scripts/netlify_ignore.py'
      - 'netlify.toml'
      - 'sw.js'
      - 'index.html'
      - 'auto/essays_auto.json'

permissions:
  contents: read

concurrency:
  group: swsi-monthly-frontend-qa
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax
        run: cat monthly_patch_parts/*.part > /tmp/monthly_patch.js && node --check /tmp/monthly_patch.js && node --check sw.js && node --check scripts/browser_interaction_smoke.js && node --check scripts/knowledge_path_smoke.js && node --check scripts/theory_trust_smoke.js && node --check scripts/knowledge_catalog_audit.js

      - name: Knowledge catalog audit
        run: node scripts/knowledge_catalog_audit.js index.html

      - name: Python syntax
        run: python -m py_compile scripts/monthly_patch_build.py scripts/monthly_frontend_smoke.py scripts/netlify_ignore.py

      - name: Build production-shaped site
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html essay_guides.js manifest.json sw.js apple-touch-icon.png _site/
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Static smoke
        run: python scripts/monthly_frontend_smoke.py --site _site

      - name: Guard deploy-sensitive files
        run: |
          grep -q "window.__SWSI_BOOT_DEFERRED__=true" _site/index.html
          grep -q "monthly_patch.js" _site/index.html
          grep -q "const VERSION = 'v5'" _site/sw.js
          grep -q 'SWSI Theory Trust Batch 1 2026-08-26' _site/monthly_patch.js
          grep -q 'Bowen 家庭系統理論' _site/monthly_patch.js
          grep -q 'Minuchin 結構家庭治療' _site/monthly_patch.js

      - name: Production HTTP smoke
        env:
          SITE: https://swsi-quiznetlify.netlify.app
        run: |
          set -euo pipefail
          fetch_prod() {
            path="$1"
            out="$2"
            code="$(curl --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 -o "$out" -w '%{http_code}' "$SITE$path" || true)"
            echo "PROD $path -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Production endpoint $path returned HTTP $code"
              return 1
            fi
          }
          fetch_prod / /tmp/prod-index.html
          fetch_prod /sw.js /tmp/prod-sw.js
          fetch_prod /monthly_patch.js /tmp/prod-monthly-patch.js
          fetch_prod /auto/essays_auto.json /tmp/prod-essays.json
          grep -q 'monthly_patch.js' /tmp/prod-index.html || { echo '::error::Production index is missing monthly_patch.js'; exit 1; }
          grep -q '社工師國考免費題庫｜SWSI' /tmp/prod-index.html || { echo '::error::Production index is missing the new SEO title'; exit 1; }
          grep -q "const VERSION = 'v5'" /tmp/prod-sw.js || { echo '::error::Production service worker is not v5'; exit 1; }
          grep -q 'SWSI Monthly Frontend Patch 2026-08-25' /tmp/prod-monthly-patch.js || { echo '::error::Production monthly patch marker not found'; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/prod-essays.json').read_text(encoding='utf-8'))
          raw=json.dumps(payload,ensure_ascii=False)
          for bad in ('\ue129','\ue12a','\ue12b'):
              assert bad not in raw, f'production essay payload still contains {bad!r}'
          assert '（一）' in raw and '（二）' in raw, 'normalized sub-question labels not found'
          print('PRODUCTION HTTP SMOKE OK')
          PY

  interaction-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build browser-test site
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html essay_guides.js manifest.json sw.js apple-touch-icon.png _site/
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser interaction smoke
        run: |
          python -m http.server 4173 --directory _site >/tmp/swsi-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_interaction_smoke.js http://127.0.0.1:4173/
          node scripts/knowledge_path_smoke.js http://127.0.0.1:4173/
          node scripts/theory_trust_smoke.js http://127.0.0.1:4173/
