name: Monthly Frontend QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monthly-frontend-qa.yml'
      - 'monthly_patch_parts/**'
      - 'data/laws.canonical.json'
      - 'data/theories.canonical.json'
      - 'essay_guides.js'
      - 'scripts/build_essay_guides_runtime.js'
      - 'scripts/p0_frontend_preflight.js'
      - 'scripts/grading_contract_smoke.js'
      - 'scripts/service_worker_upgrade_smoke.js'
      - 'scripts/shard_integrity_browser_smoke.js'
      - 'scripts/service_worker_update_smoke.js'
      - 'scripts/cloudflare_worker_smoke.js'
      - 'scripts/supabase_contract_smoke.js'
      - 'scripts/moex_importer_integrity_smoke.js'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'supabase/functions/import-moex-social-worker/index.ts'
      - 'supabase/migrations/20260825094110_production_qa_consolidation.sql'
      - 'supabase/migrations/20260825110853_preserve_official_grading_mode.sql'
      - 'supabase/migrations/20260827031000_align_recovery_reset_with_grading_mode.sql'
      - 'cdn/question-shards/**'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/monthly_frontend_smoke.py'
      - 'scripts/browser_interaction_smoke.js'
      - 'scripts/knowledge_path_smoke.js'
      - 'scripts/theory_trust_smoke.js'
      - 'scripts/theory_trust_batch2_smoke.js'
      - 'scripts/theory_trust_final_smoke.js'
      - 'scripts/feedback_smoke.js'
      - 'scripts/knowledge_catalog_audit.js'
      - 'scripts/netlify_ignore.py'
      - 'netlify.toml'
      - 'sw.js'
      - 'index.html'
      - 'auto/essays_auto.json'
  pull_request:
    paths:
      - '.github/workflows/monthly-frontend-qa.yml'
      - 'monthly_patch_parts/**'
      - 'data/laws.canonical.json'
      - 'data/theories.canonical.json'
      - 'essay_guides.js'
      - 'scripts/build_essay_guides_runtime.js'
      - 'scripts/p0_frontend_preflight.js'
      - 'scripts/grading_contract_smoke.js'
      - 'scripts/service_worker_upgrade_smoke.js'
      - 'scripts/shard_integrity_browser_smoke.js'
      - 'scripts/service_worker_update_smoke.js'
      - 'scripts/cloudflare_worker_smoke.js'
      - 'scripts/supabase_contract_smoke.js'
      - 'scripts/moex_importer_integrity_smoke.js'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'supabase/functions/import-moex-social-worker/index.ts'
      - 'supabase/migrations/20260825094110_production_qa_consolidation.sql'
      - 'supabase/migrations/20260825110853_preserve_official_grading_mode.sql'
      - 'supabase/migrations/20260827031000_align_recovery_reset_with_grading_mode.sql'
      - 'cdn/question-shards/**'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/monthly_frontend_smoke.py'
      - 'scripts/browser_interaction_smoke.js'
      - 'scripts/knowledge_path_smoke.js'
      - 'scripts/theory_trust_smoke.js'
      - 'scripts/theory_trust_batch2_smoke.js'
      - 'scripts/theory_trust_final_smoke.js'
      - 'scripts/feedback_smoke.js'
      - 'scripts/knowledge_catalog_audit.js'
      - 'scripts/netlify_ignore.py'
      - 'netlify.toml'
      - 'sw.js'
      - 'index.html'
      - 'auto/essays_auto.json'

permissions:
  contents: read

concurrency:
  group: swsi-monthly-frontend-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: JavaScript syntax
        run: |
          cat monthly_patch_parts/*.part > /tmp/monthly_patch.js
          node --check /tmp/monthly_patch.js
          node --check sw.js
          node --check scripts/build_essay_guides_runtime.js
          node --check scripts/p0_frontend_preflight.js
          node --check scripts/grading_contract_smoke.js
          node --check scripts/service_worker_upgrade_smoke.js
          node --check scripts/shard_integrity_browser_smoke.js
          node --check scripts/service_worker_update_smoke.js
          node --check scripts/cloudflare_worker_smoke.js
          node --check scripts/supabase_contract_smoke.js
          node --check scripts/moex_importer_integrity_smoke.js
          node --check cloudflare/wandering-wave-4418/worker.js
          node --check scripts/browser_interaction_smoke.js
          node --check scripts/knowledge_path_smoke.js
          node --check scripts/theory_trust_smoke.js
          node --check scripts/theory_trust_batch2_smoke.js
          node --check scripts/theory_trust_final_smoke.js
          node --check scripts/feedback_smoke.js
          node --check scripts/knowledge_catalog_audit.js

      - name: P0 frontend preflight
        run: node scripts/p0_frontend_preflight.js

      - name: Service Worker, Worker and Supabase contracts
        run: |
          node scripts/service_worker_update_smoke.js
          node scripts/cloudflare_worker_smoke.js
          node scripts/moex_importer_integrity_smoke.js
          node scripts/supabase_contract_smoke.js
          deno check supabase/functions/import-moex-social-worker/index.ts

      - name: Question shard artifact integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('cdn/question-shards')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          expected = {row['file'] for row in manifest['shards']}
          actual = {p.name for p in root.glob('*.json') if p.name != 'manifest.json'}
          assert actual == expected, {'missing': sorted(expected-actual), 'extra': sorted(actual-expected)}
          assert manifest['shard_count'] == len(expected)
          assert manifest['total_questions'] == sum(int(row['question_count']) for row in manifest['shards'])
          for row in manifest['shards']:
              raw = (root / row['file']).read_bytes()
              assert len(raw) == int(row['bytes']), (row['file'], len(raw), row['bytes'])
              assert hashlib.sha256(raw).hexdigest() == row['sha256'], row['file']
          print(f"QUESTION SHARD ARTIFACT INTEGRITY OK: shards={len(expected)}")
          PY

      - name: Knowledge catalog audit
        run: node scripts/knowledge_catalog_audit.js index.html

      - name: Python syntax
        run: python -m py_compile scripts/monthly_patch_build.py scripts/monthly_frontend_smoke.py scripts/netlify_ignore.py

      - name: Build production-shaped site
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html manifest.json sw.js apple-touch-icon.png _site/
          node scripts/build_essay_guides_runtime.js essay_guides.js _site/essay_guides.js
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          node --check _site/essay_guides.js
          node --check _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Static smoke
        run: python scripts/monthly_frontend_smoke.py --site _site

      - name: Guard deploy-sensitive files
        run: |
          grep -q "window.__SWSI_BOOT_DEFERRED__=true" _site/index.html
          grep -q "monthly_patch.js" _site/index.html
          grep -q "const VERSION = 'v7'" _site/sw.js
          grep -q 'Generated from essay_guides.js by scripts/build_essay_guides_runtime.js' _site/essay_guides.js
          grep -q '三理論整合' _site/essay_guides.js
          grep -q 'SWSI Code Health P0 Runtime Guard 2026-08-26' _site/monthly_patch.js
          grep -q '2026-08-26.fail-closed.v2' _site/monthly_patch.js
          grep -q '2026-08-26.sha256.v2' _site/monthly_patch.js
          grep -q 'SWSI MK Unified Grading Contract 2026-08-26' _site/monthly_patch.js
          grep -q '2026-08-26.unified-grading.v2' _site/monthly_patch.js
          grep -q '2026-08-27.schema-guard.v3' _site/monthly_patch.js
          grep -q 'SWSI Product V1 Lock 2026-08-26' _site/monthly_patch.js
          grep -q 'SWSI Law Trust Final Batch 2026-08-26' _site/monthly_patch.js
          grep -q 'SWSI Theory Trust Batch 1 2026-08-26' _site/monthly_patch.js
          grep -q 'SWSI Theory Trust Batch 2 2026-08-26' _site/monthly_patch.js
          grep -q 'SWSI Theory Trust Final Batch 2026-08-26' _site/monthly_patch.js
          grep -q 'SWSI Feedback / Quality Report V1 2026-08-26' _site/monthly_patch.js
          grep -q 'SWSI Feedback Context State Owner 2026-08-27' _site/monthly_patch.js
          grep -q 'swsi-feedback' _site/monthly_patch.js
          grep -q 'Bowen 家庭系統理論' data/theories.canonical.json
          grep -q 'Minuchin 結構家庭治療' data/theories.canonical.json
          grep -q '資產建構／資產累積理論' data/theories.canonical.json
          grep -q '無條件基本收入 UBI' data/theories.canonical.json
          grep -q 'ABCD 的「社區資產」不等於 Sherraden' data/theories.canonical.json
          grep -q '符號互動論的主要分析層次是微觀互動' data/theories.canonical.json
          grep -q '社會投資與傳統社會保護常是互補' data/theories.canonical.json
          if grep -q 'SWSI CLOUDFLARE FRONTEND PREVIEW' _site/index.html; then
            echo 'Preview marker leaked into production-shaped build' >&2
            exit 1
          fi
          if grep -q 'swsi-preview-banner' _site/index.html; then
            echo 'Preview banner leaked into production-shaped build' >&2
            exit 1
          fi

      - name: Live feedback API safety smoke
        env:
          ENDPOINT: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/swsi-feedback
        run: |
          set -euo pipefail
          check_origin() {
            origin="$1"
            headers="$(mktemp)"
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -X OPTIONS -D "$headers" -o /dev/null -w '%{http_code}' \
              -H "Origin: $origin" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,x-swsi-client-id' \
              "$ENDPOINT")"
            test "$code" = '204'
            tr -d '\r' < "$headers" | grep -qi "^access-control-allow-origin: $origin$"
            tr -d '\r' < "$headers" | grep -qi '^access-control-allow-methods: .*POST'
          }
          check_origin 'https://swsi-quiznetlify.netlify.app'
          check_origin 'https://wandering-wave-4418.c022050333.workers.dev'

          body='{"category":"site_bug","context_type":"general","source_kind":"swsi","message":"x"}'
          code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            -o /tmp/feedback-invalid.json -w '%{http_code}' \
            -X POST "$ENDPOINT" \
            -H 'Origin: https://wandering-wave-4418.c022050333.workers.dev' \
            -H 'Content-Type: application/json' \
            -H 'X-SWSI-Client-ID: swsi_ci_invalid_feedback_probe_20260826' \
            --data "$body")"
          test "$code" = '400'
          grep -q '請至少寫 3 個字' /tmp/feedback-invalid.json
          echo 'LIVE FEEDBACK API SAFETY SMOKE OK'

  interaction-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: P0 frontend preflight
        run: node scripts/p0_frontend_preflight.js

      - name: Build browser-test site
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html manifest.json sw.js apple-touch-icon.png _site/
          node scripts/build_essay_guides_runtime.js essay_guides.js _site/essay_guides.js
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          node --check _site/essay_guides.js
          node --check _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser interaction smoke
        run: |
          python -m http.server 4173 --directory _site >/tmp/swsi-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/grading_contract_smoke.js http://127.0.0.1:4173/
          node scripts/shard_integrity_browser_smoke.js http://127.0.0.1:4173/
          node scripts/browser_interaction_smoke.js http://127.0.0.1:4173/
          node scripts/knowledge_path_smoke.js http://127.0.0.1:4173/
          node scripts/theory_trust_smoke.js http://127.0.0.1:4173/
          node scripts/theory_trust_batch2_smoke.js http://127.0.0.1:4173/
          node scripts/theory_trust_final_smoke.js http://127.0.0.1:4173/
          node scripts/feedback_smoke.js http://127.0.0.1:4173/
          node scripts/service_worker_upgrade_smoke.js
