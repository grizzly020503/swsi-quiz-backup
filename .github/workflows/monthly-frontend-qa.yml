name: Monthly Frontend QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monthly-frontend-qa.yml'
      - 'monthly_patch_parts/**'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/monthly_frontend_smoke.py'
      - 'scripts/netlify_ignore.py'
      - 'netlify.toml'
      - 'sw.js'
      - 'index.html'
      - 'auto/essays_auto.json'

permissions:
  contents: read

concurrency:
  group: swsi-monthly-frontend-qa
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax
        run: cat monthly_patch_parts/*.part > /tmp/monthly_patch.js && node --check /tmp/monthly_patch.js && node --check sw.js

      - name: Python syntax
        run: python -m py_compile scripts/monthly_patch_build.py scripts/monthly_frontend_smoke.py scripts/netlify_ignore.py

      - name: Build production-shaped site
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html essay_guides.js manifest.json sw.js apple-touch-icon.png _site/
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Static smoke
        run: python scripts/monthly_frontend_smoke.py --site _site

      - name: Guard deploy-sensitive files
        run: |
          grep -q "window.__SWSI_BOOT_DEFERRED__=true" _site/index.html
          grep -q "monthly_patch.js" _site/index.html
          grep -q "const VERSION = 'v5'" _site/sw.js

      - name: Production HTTP smoke
        env:
          SITE: https://swsi-quiznetlify.netlify.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$SITE/" -o /tmp/prod-index.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$SITE/sw.js" -o /tmp/prod-sw.js
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$SITE/monthly_patch.js" -o /tmp/prod-monthly-patch.js
          curl --fail --silent --show-error --retry 5 --retry-all-errors --connect-timeout 10 --max-time 30 "$SITE/auto/essays_auto.json" -o /tmp/prod-essays.json
          grep -q 'monthly_patch.js' /tmp/prod-index.html
          grep -q '社工師國考免費題庫｜SWSI' /tmp/prod-index.html
          grep -q "const VERSION = 'v5'" /tmp/prod-sw.js
          grep -q 'SWSI Monthly Frontend Patch 2026-08-25' /tmp/prod-monthly-patch.js
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/prod-essays.json').read_text(encoding='utf-8'))
          raw=json.dumps(payload,ensure_ascii=False)
          for bad in ('\ue129','\ue12a','\ue12b'):
              assert bad not in raw, f'production essay payload still contains {bad!r}'
          assert '（一）' in raw and '（二）' in raw, 'normalized sub-question labels not found'
          print('PRODUCTION HTTP SMOKE OK')
          PY
