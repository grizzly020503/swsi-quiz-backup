name: Historical Law Provenance QA
# Temporary write-enabled patch runner; restored to read-only before merge.

on:
  pull_request:
    paths:
      - 'scripts/historical_law_provenance.py'
      - 'scripts/historical_law_provenance_selftest.py'
      - 'data/law_question_links_priority10.v1.json'
      - 'data/legal_watch_report.json'
      - '.github/workflows/historical-law-provenance-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'release/historical-law-provenance-v1-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: release/historical-law-provenance-v1-20261001
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Patch parser and legal-watch indexing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/historical_law_provenance.py')
          text = p.read_text(encoding='utf-8')

          normalize = '''def normalize_article_no(value: str) -> str | None:
              s = unicodedata.normalize("NFKC", str(value or "")).strip().replace("之", "-")
              s = re.sub(r"\\s+", "", s)
              if not s:
                  return None
              parts = s.split("-")
              out = []
              for part in parts:
                  if part.isdigit():
                      number = int(part)
                  else:
                      number = chinese_integer(part)
                  if number is None:
                      return None
                  out.append(str(number))
              return "-".join(out)
          
          
          '''
          text, n = re.subn(
              r'def normalize_article_no\(value: str\) -> str \| None:\n.*?(?=def article_key)',
              lambda _m: normalize,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'normalize_article_no patch count={n}')

          extract = '''def extract_explicit_articles(text: str) -> list[str]:
              """Extract only article numbers explicitly written in a question stem."""
              s = unicodedata.normalize("NFKC", str(text or ""))
              number = r"[0-9一二三四五六七八九十百零〇○Ｏ]+"
              pattern = re.compile(
                  rf"第\\s*({number})(?:\\s*之\\s*({number}))?\\s*條(?:\\s*之\\s*({number}))?"
              )
              found: set[str] = set()
              for m in pattern.finditer(s):
                  main = m.group(1)
                  sub = m.group(2) or m.group(3)
                  raw = main + (f"-{sub}" if sub else "")
                  normalized = normalize_article_no(raw)
                  if normalized:
                      found.add(normalized)
              return sorted(found, key=article_key)
          
          
          '''
          text, n = re.subn(
              r'def extract_explicit_articles\(text: str\) -> list\[str\]:\n.*?(?=def _article_groups)',
              lambda _m: extract,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'extract_explicit_articles patch count={n}')

          helper = '''def watch_record_map(watch: dict) -> dict[str, dict]:
              """Normalize legal-watch records from current list schema or legacy dict schema."""
              raw = watch.get("records") or []
              if isinstance(raw, dict):
                  return {
                      clean_text(name): row
                      for name, row in raw.items()
                      if clean_text(name) and isinstance(row, dict)
                  }
              out: dict[str, dict] = {}
              if isinstance(raw, list):
                  for row in raw:
                      if not isinstance(row, dict):
                          continue
                      name = clean_text(
                          row.get("canonical_name") or row.get("law_name") or row.get("name")
                      )
                      if name:
                          out[name] = row
              return out
          
          
          '''
          if 'def watch_record_map(' not in text:
              marker = 'def build_report(links: dict, watch: dict, live: bool) -> dict:\n'
              if marker not in text:
                  raise SystemExit('build_report marker missing')
              text = text.replace(marker, helper + marker, 1)

          old = '    watch_records = watch.get("records") or {}\n'
          new = '    watch_records = watch_record_map(watch)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('watch-record indexing anchor missing')

          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/historical_law_provenance.py scripts/historical_law_provenance_selftest.py
          python scripts/historical_law_provenance_selftest.py
          python scripts/historical_law_provenance.py --output /tmp/historical_law_provenance.json
          git diff --check
      - name: Commit provenance fixes
        run: |
          set -euo pipefail
          git config user.name 'swsi-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/historical_law_provenance.py
          if git diff --cached --quiet; then
            echo 'Provenance fixes already applied.'
            exit 0
          fi
          git commit -m 'fix: harden historical law provenance triage'
          git push origin HEAD:release/historical-law-provenance-v1-20261001
