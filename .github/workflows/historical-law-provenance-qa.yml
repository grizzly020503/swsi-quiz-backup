name: Historical Law Provenance QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_provenance.py'
      - 'scripts/historical_law_provenance_core.py'
      - 'scripts/historical_law_provenance_selftest.py'
      - 'scripts/historical_law_exam_date_refiner.py'
      - 'scripts/historical_law_stage2_selftest.py'
      - 'data/law_question_links_priority10.v1.json'
      - 'data/legal_watch_report.json'
      - '.github/workflows/historical-law-provenance-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Syntax check
        run: python -m py_compile scripts/historical_law_provenance.py scripts/historical_law_provenance_core.py scripts/historical_law_provenance_selftest.py scripts/historical_law_exam_date_refiner.py scripts/historical_law_stage2_selftest.py
      - name: Existing V1 compatibility regression
        working-directory: scripts
        run: python historical_law_provenance_selftest.py
      - name: Stage 2 exact-date regression
        working-directory: scripts
        run: python historical_law_stage2_selftest.py
      - name: 86-link repository contract
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import historical_law_provenance_core as hp

          links = json.loads(Path('data/law_question_links_priority10.v1.json').read_text(encoding='utf-8'))
          watch = json.loads(Path('data/legal_watch_report.json').read_text(encoding='utf-8'))
          cards = links.get('cards') or []
          link_rows = [(card['law_name'], q) for card in cards for q in (card.get('questions') or [])]
          assert len(cards) == 10, len(cards)
          assert len(link_rows) == 86, len(link_rows)
          link_keys = [(law, q.get('question_id')) for law, q in link_rows]
          assert all(qid for _, qid in link_keys), 'every law-question link needs a question_id'
          assert len(set(link_keys)) == 86, 'duplicate law-question mapping'
          unique_question_ids = {qid for _, qid in link_keys}
          assert len(unique_question_ids) == 85, len(unique_question_ids)
          assert all(q.get('match_strength') == 'metadata_only' for _, q in link_rows)
          assert all(q.get('historical_version_checked') is False for _, q in link_rows)
          indexed = hp.watch_record_map(watch)
          for card in cards:
              law = card['law_name']
              assert law in indexed, law
              assert hp.pcode_from_url(indexed[law].get('official_url')), law
          report = hp.build_report(links, watch, live=False)
          assert report['question_count'] == 86
          assert sum(report['status_counts'].values()) == 86
          assert all(q['historical_version_checked'] is False for q in report['questions'])
          print('HISTORICAL LAW 86-LINK CONTRACT OK: 86 mappings / 85 unique questions / 1 cross-law overlap')
          PY
      - name: Protected-core AST safety boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path('scripts/historical_law_provenance_core.py'),
              Path('scripts/historical_law_exam_date_refiner.py'),
          ]
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          violations = []

          def const_key(node):
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return node.value
              return None

          def check_target(path, node, lineno):
              if isinstance(node, (ast.Tuple, ast.List)):
                  for child in node.elts:
                      check_target(path, child, lineno)
                  return
              if isinstance(node, ast.Subscript):
                  key = const_key(node.slice)
                  if key in protected:
                      violations.append(f'{path}:{lineno}: protected field assignment: {key}')

          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          check_target(path, target, node.lineno)
                  elif isinstance(node, ast.AnnAssign):
                      check_target(path, node.target, node.lineno)
                  elif isinstance(node, ast.AugAssign):
                      check_target(path, node.target, node.lineno)
                  elif isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      method = node.func.attr
                      if method == 'setdefault' and node.args:
                          key = const_key(node.args[0])
                          if key in protected:
                              violations.append(f'{path}:{node.lineno}: protected setdefault: {key}')
                      if method in {'update', '__setitem__'}:
                          for arg in node.args:
                              if isinstance(arg, ast.Dict):
                                  for key_node in arg.keys:
                                      key = const_key(key_node)
                                      if key in protected:
                                          violations.append(f'{path}:{node.lineno}: protected update: {key}')
                          if method == '__setitem__' and node.args:
                              key = const_key(node.args[0])
                              if key in protected:
                                  violations.append(f'{path}:{node.lineno}: protected __setitem__: {key}')
                  elif isinstance(node, ast.Dict):
                      for key_node, value_node in zip(node.keys, node.values):
                          if const_key(key_node) == 'historical_version_checked':
                              if isinstance(value_node, ast.Constant) and value_node.value is True:
                                  violations.append(f'{path}:{node.lineno}: historical_version_checked=True is forbidden')

          if violations:
              raise SystemExit('\n'.join(violations))
          print('HISTORICAL LAW AST SAFETY BOUNDARY OK: protected official-core writes absent')
          PY
          git diff --check

  live-readonly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch official MOEX/MOJ evidence
        id: live
        continue-on-error: true
        run: python scripts/historical_law_exam_date_refiner.py
      - name: Show live evidence summary
        if: always()
        run: |
          if [ -f auto/qa/historical_law_exam_date_stage2.v1.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('auto/qa/historical_law_exam_date_stage2.v1.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'mapping_count': d.get('mapping_count', d.get('question_count')),
              'unique_question_count': d.get('unique_question_count'),
              'cross_law_overlap_count': d.get('cross_law_overlap_count'),
              'candidate_count': d.get('candidate_count'),
              'historical_version_checked_count': d.get('historical_version_checked_count'),
              'status_counts': d.get('status_counts'),
              'exception_queue_counts': {k: len(v) for k, v in (d.get('exception_queue') or {}).items()},
          }, ensure_ascii=False, indent=2))
          PY
          else
            echo 'No live report produced.'
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-law-stage2-live-evidence
          path: auto/qa/historical_law_exam_date_stage2.v1.json
          if-no-files-found: warn
          retention-days: 14
