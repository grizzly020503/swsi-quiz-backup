name: Historical Law Stage 1-6 QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_provenance.py'
      - 'scripts/historical_law_provenance_core.py'
      - 'scripts/historical_law_provenance_selftest.py'
      - 'scripts/historical_law_exam_date_refiner.py'
      - 'scripts/historical_law_stage2_selftest.py'
      - 'scripts/historical_law_stage2_history_snapshot.py'
      - 'scripts/historical_law_moj_api_probe.py'
      - 'scripts/historical_law_article_resolver.py'
      - 'scripts/historical_law_article_resolver_selftest.py'
      - 'scripts/historical_law_oldver_stage4.py'
      - 'scripts/historical_law_stage4_selftest.py'
      - 'scripts/historical_law_stage4_snapshot_runner.py'
      - 'scripts/historical_law_stage5_promotion.py'
      - 'scripts/historical_law_stage5_selftest.py'
      - 'scripts/historical_law_stage6_semantic.py'
      - 'scripts/historical_law_stage6_selftest.py'
      - 'scripts/historical_law_stage6_snapshot_semantic.py'
      - 'scripts/historical_law_snapshot_pipeline_selftest.py'
      - 'scripts/build_historical_law_provenance_report.py'
      - 'scripts/historical_law_provenance_report_smoke.py'
      - 'data/law_question_links_priority10.v1.json'
      - 'data/legal_watch_report.json'
      - 'data/historical_law_provenance_priority10.v1.json'
      - 'data/moex_social_worker_exam_dates.v1.json'
      - 'cdn/question-shards/**'
      - '.github/workflows/historical-law-stage1-6-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-stage1-6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax and deterministic regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/historical_law_provenance.py \
            scripts/historical_law_provenance_core.py \
            scripts/historical_law_provenance_selftest.py \
            scripts/historical_law_exam_date_refiner.py \
            scripts/historical_law_stage2_selftest.py \
            scripts/historical_law_stage2_history_snapshot.py \
            scripts/historical_law_moj_api_probe.py \
            scripts/historical_law_article_resolver.py \
            scripts/historical_law_article_resolver_selftest.py \
            scripts/historical_law_oldver_stage4.py \
            scripts/historical_law_stage4_selftest.py \
            scripts/historical_law_stage4_snapshot_runner.py \
            scripts/historical_law_stage5_promotion.py \
            scripts/historical_law_stage5_selftest.py \
            scripts/historical_law_stage6_semantic.py \
            scripts/historical_law_stage6_selftest.py \
            scripts/historical_law_stage6_snapshot_semantic.py \
            scripts/historical_law_snapshot_pipeline_selftest.py \
            scripts/build_historical_law_provenance_report.py \
            scripts/historical_law_provenance_report_smoke.py
          (cd scripts && python historical_law_provenance_selftest.py)
          (cd scripts && python historical_law_stage2_selftest.py)
          (cd scripts && python historical_law_article_resolver_selftest.py)
          (cd scripts && python historical_law_stage4_selftest.py)
          (cd scripts && python historical_law_stage5_selftest.py)
          (cd scripts && python historical_law_stage6_selftest.py)
          (cd scripts && python historical_law_snapshot_pipeline_selftest.py)
          git diff --check

      - name: Offline V1 contract on real 86 mappings
        run: |
          set -euo pipefail
          python scripts/historical_law_provenance.py --output /tmp/historical_law_provenance.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('/tmp/historical_law_provenance.json').read_text(encoding='utf-8'))
          rows = d.get('questions') or []
          assert d.get('question_count') == len(rows) == 86
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all(r.get('official_history_url') for r in rows)
          assert set(d.get('status_counts') or {}).issubset(
              {'article_resolution_required', 'official_history_unavailable'}
          )
          print('HISTORICAL LAW V1 OFFLINE CONTRACT OK:', d.get('status_counts'))
          PY

      - name: Materialized V1 baseline contract
        run: python scripts/historical_law_provenance_report_smoke.py

      - name: Protected-core trust boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = [
              Path('scripts/historical_law_provenance_core.py'),
              Path('scripts/historical_law_exam_date_refiner.py'),
              Path('scripts/historical_law_stage2_history_snapshot.py'),
              Path('scripts/historical_law_moj_api_probe.py'),
              Path('scripts/historical_law_article_resolver.py'),
              Path('scripts/historical_law_oldver_stage4.py'),
              Path('scripts/historical_law_stage4_snapshot_runner.py'),
              Path('scripts/historical_law_stage5_promotion.py'),
              Path('scripts/historical_law_stage6_semantic.py'),
              Path('scripts/historical_law_stage6_snapshot_semantic.py'),
              Path('scripts/build_historical_law_provenance_report.py'),
          ]
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          violations = []

          def const_key(node):
              return node.value if isinstance(node, ast.Constant) and isinstance(node.value, str) else None

          def check_target(path, node, lineno):
              if isinstance(node, (ast.Tuple, ast.List)):
                  for child in node.elts:
                      check_target(path, child, lineno)
                  return
              if isinstance(node, ast.Subscript):
                  key = const_key(node.slice)
                  if key in protected:
                      violations.append(f'{path}:{lineno}: protected field assignment: {key}')

          for path in files:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          check_target(path, target, node.lineno)
                  elif isinstance(node, ast.AnnAssign):
                      check_target(path, node.target, node.lineno)
                  elif isinstance(node, ast.AugAssign):
                      check_target(path, node.target, node.lineno)
                  elif isinstance(node, ast.Dict):
                      for key_node, value_node in zip(node.keys, node.values):
                          if const_key(key_node) == 'historical_version_checked':
                              if isinstance(value_node, ast.Constant) and value_node.value is True:
                                  violations.append(
                                      f'{path}:{node.lineno}: historical_version_checked=True forbidden'
                                  )

          if violations:
              raise SystemExit('\n'.join(violations))
          print('HISTORICAL LAW STAGE1-6 TRUST BOUNDARY OK')
          PY

  live-readonly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install live HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Stage 2 — exam dates plus MOJ history handoff
        id: stage2
        continue-on-error: true
        run: python scripts/historical_law_stage2_history_snapshot.py

      - name: Validate Stage 2 and history snapshot if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_exam_date_stage2.v1.json ]; then
            python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          def payload_sha(value):
              raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              return hashlib.sha256(raw.encode('utf-8')).hexdigest()

          d = json.loads(Path('auto/qa/historical_law_exam_date_stage2.v1.json').read_text(encoding='utf-8'))
          rows = d.get('questions') or []
          dates = d.get('exam_dates') or {}
          assert d.get('mapping_count') == len(rows) == 86
          assert d.get('unique_question_count') == 85
          assert d.get('cross_law_overlap_count') == 1
          assert d.get('historical_version_checked_count') == 0
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all('official_answer' not in r for r in rows)
          assert sum((d.get('status_counts') or {}).values()) == 86
          assert d.get('exam_date_error_count') == 0, dates
          assert d.get('exam_date_registry_hit_count') == len(dates), dates
          assert d.get('exam_date_live_hit_count') == 0, dates
          assert all(v.get('status') == 'official_pinned' for v in dates.values())

          hpath = Path('auto/qa/historical_law_history_snapshot.v1.json')
          assert hpath.exists(), 'Stage 2 history snapshot missing'
          h = json.loads(hpath.read_text(encoding='utf-8'))
          hrows = h.get('records') or []
          assert h.get('schema_version') == 1
          assert h.get('record_count') == len(hrows)
          assert h.get('ready_count') + h.get('source_failure_count') == len(hrows)
          assert h.get('historical_version_checked_count') == 0
          assert h.get('protected_core_mutation_count') == 0
          for row in hrows:
              assert 'official_answer' not in row
              if row.get('status') == 'official_history_ready':
                  entries = row.get('entries') or []
                  digest = str(row.get('entries_sha256') or '')
                  assert entries and row.get('entry_count') == len(entries)
                  assert re.fullmatch(r'[0-9a-f]{64}', digest)
                  assert payload_sha(entries) == digest

          print(json.dumps({
              'stage2_status_counts': d.get('status_counts'),
              'history_ready': h.get('ready_count'),
              'history_source_failure': h.get('source_failure_count'),
          }, ensure_ascii=False))
          PY
          fi

      - name: MOJ Open API — current target snapshot
        id: moj_api
        if: always()
        continue-on-error: true
        run: python scripts/historical_law_moj_api_probe.py

      - name: Validate MOJ Open API snapshot if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_moj_api_targets.v1.json ]; then
            python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          def sha_text(value):
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          def payload_sha(value):
              raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
              return sha_text(raw)

          p = json.loads(Path('auto/qa/historical_law_moj_api_probe.v1.json').read_text(encoding='utf-8'))
          t = json.loads(Path('auto/qa/historical_law_moj_api_targets.v1.json').read_text(encoding='utf-8'))
          rows = t.get('records') or []
          assert p.get('target_count') == 10
          assert p.get('historical_version_checked_count') == 0
          assert p.get('protected_core_mutation_count') == 0
          assert t.get('schema_version') == 1
          assert t.get('record_count') == len(rows)
          assert t.get('historical_version_checked_count') == 0
          assert t.get('protected_core_mutation_count') == 0
          for row in rows:
              endpoint = row.get('endpoint')
              assert endpoint in {
                  'https://law.moj.gov.tw/api/ch/law/json',
                  'https://law.moj.gov.tw/api/ch/order/json',
              }
              assert row.get('collection') in {'law', 'order'}
              pcode = str(row.get('pcode') or '')
              assert re.fullmatch(r'[A-Z]\d{7}', pcode)
              assert f'pcode={pcode}' in str(row.get('law_url') or '')
              articles = row.get('articles') or []
              assert articles and row.get('article_count') == len(articles)
              assert row.get('articles_sha256') == payload_sha(articles)
              identity = {
                  'endpoint': endpoint,
                  'collection': row.get('collection'),
                  'update_date': row.get('update_date'),
                  'pcode': pcode,
                  'law_name': row.get('law_name'),
                  'law_url': row.get('law_url'),
                  'modified_date': row.get('modified_date'),
                  'article_count': row.get('article_count'),
                  'articles_sha256': row.get('articles_sha256'),
              }
              assert row.get('source_identity_sha256') == payload_sha(identity)
              assert 'official_answer' not in row
              for article in articles:
                  assert article.get('article_no') and article.get('text')
                  assert article.get('sha256') == sha_text(str(article.get('text')))
                  assert 'official_answer' not in article

          print(json.dumps({
              'api_probe_ready': p.get('ready_count'),
              'api_probe_not_found': p.get('not_found_count'),
              'target_snapshot_records': t.get('record_count'),
          }, ensure_ascii=False))
          PY
          fi

      - name: Stage 3 — article candidates and shadow calibration
        id: stage3
        if: always()
        continue-on-error: true
        run: python scripts/historical_law_article_resolver.py

      - name: Validate Stage 3 if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_article_stage3.v1.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('auto/qa/historical_law_article_stage3.v1.json').read_text(encoding='utf-8'))
          rows = d.get('records') or []
          controls = d.get('controls') or []
          assert d.get('mapping_count') == 86
          assert d.get('target_count') == len(rows)
          assert d.get('explicit_control_count') == len(controls) == 10
          assert d.get('target_count') + d.get('explicit_control_count') == 86
          assert d.get('historical_version_checked_count') == 0
          assert d.get('question_shard_error_count') == 0, d.get('question_shard_errors')
          assert d.get('explicit_control_top1_match_count', 0) >= 9, controls
          assert d.get('explicit_control_top3_match_count', 0) >= 9, controls
          assert d.get('explicit_control_false_machine_candidate_count') == 0, controls
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all('official_answer' not in r for r in rows)
          for row in rows:
              if row.get('confidence') == 'conflict':
                  assert row.get('route') == 'ai_review', row
              if row.get('route') == 'machine_candidate':
                  assert row.get('confidence') == 'high', row
          print(json.dumps({
              'route_counts': d.get('route_counts'),
              'top1': d.get('explicit_control_top1_match_count'),
              'top3': d.get('explicit_control_top3_match_count'),
              'false_machine': d.get('explicit_control_false_machine_candidate_count'),
              'law_source_error_count': d.get('law_source_error_count'),
          }, ensure_ascii=False))
          PY
          fi

      - name: Stage 4 — hybrid official historical text evidence
        id: stage4
        if: always()
        continue-on-error: true
        run: |
          if [ -f auto/qa/historical_law_article_stage3.v1.json ] \
             && [ -f auto/qa/historical_law_history_snapshot.v1.json ] \
             && [ -f auto/qa/historical_law_moj_api_targets.v1.json ]; then
            python scripts/historical_law_stage4_snapshot_runner.py
          fi

      - name: Validate hybrid Stage 4 if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_oldver_stage4.v1.json ]; then
            python - <<'PY'
          import json, re
          from collections import Counter
          from pathlib import Path

          s3 = json.loads(Path('auto/qa/historical_law_article_stage3.v1.json').read_text(encoding='utf-8'))
          d = json.loads(Path('auto/qa/historical_law_oldver_stage4.v1.json').read_text(encoding='utf-8'))
          rows = d.get('records') or []
          machine = [r for r in (s3.get('records') or []) if r.get('route') == 'machine_candidate']
          allowed = {
              'historical_text_evidence_ready',
              'stage3_candidate_missing_article',
              'exam_date_missing',
              'law_source_missing',
              'source_failure',
              'source_identity_mismatch',
              'history_version_unavailable',
              'exam_window_version_conflict',
              'effective_date_review',
              'article_missing_in_selected_version',
          }
          assert d.get('stage3_machine_candidate_count') == len(machine)
          assert d.get('record_count') == len(rows) == len(machine)
          assert d.get('historical_version_checked_count') == 0
          assert d.get('protected_core_mutation_count') == 0
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all('official_answer' not in r for r in rows)
          assert set(d.get('status_counts') or {}).issubset(allowed), d.get('status_counts')
          assert sum((d.get('status_counts') or {}).values()) == len(rows)

          methods = Counter()
          for row in rows:
              if row.get('status') != 'historical_text_evidence_ready':
                  continue
              assert re.fullmatch(r'[0-9a-f]{64}', row.get('historical_article_sha256') or '')
              selected = row.get('selected_version') or {}
              snapshot = row.get('historical_version_snapshot') or {}
              assert snapshot.get('source_url') == selected.get('url')
              assert re.fullmatch(r'[0-9a-f]{64}', snapshot.get('snapshot_id') or '')
              assert re.fullmatch(r'[0-9a-f]{64}', snapshot.get('evidence_sha256') or '')
              assert snapshot.get('article_count') == len(snapshot.get('articles') or [])
              assert snapshot.get('article_count', 0) > 0
              method = snapshot.get('source_identity_method')
              assert row.get('source_identity_method') == method
              methods[method] += 1
              if method == 'moj_open_api_current':
                  assert selected.get('kind') == 'current'
                  assert snapshot.get('api_endpoint') in {
                      'https://law.moj.gov.tw/api/ch/law/json',
                      'https://law.moj.gov.tw/api/ch/order/json',
                  }
                  assert re.fullmatch(
                      r'[0-9a-f]{64}', snapshot.get('api_source_identity_sha256') or ''
                  )
              elif method == 'stage4_moj_title':
                  assert selected.get('kind') == 'oldver'
                  assert re.fullmatch(r'[0-9a-f]{64}', snapshot.get('page_sha256') or '')
              else:
                  raise AssertionError(method)

          assert d.get('verified_snapshot_count') == sum(methods.values())
          assert (d.get('source_identity_method_counts') or {}) == dict(sorted(methods.items()))
          assert d.get('current_api_ready_count') == methods.get('moj_open_api_current', 0)
          assert d.get('oldver_html_ready_count') == methods.get('stage4_moj_title', 0)
          print(json.dumps({
              'status_counts': d.get('status_counts'),
              'identity_methods': d.get('source_identity_method_counts'),
              'oldver_unique_urls': d.get('fulltext_unique_url_count'),
              'oldver_requests': d.get('fulltext_request_count_total'),
          }, ensure_ascii=False))
          PY
          fi

      - name: Stage 5 — promotion contract
        id: stage5
        if: always()
        continue-on-error: true
        run: |
          if [ -f auto/qa/historical_law_article_stage3.v1.json ] \
             && [ -f auto/qa/historical_law_oldver_stage4.v1.json ]; then
            python scripts/historical_law_stage5_promotion.py
          fi

      - name: Validate Stage 5 if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_stage5_promotion.v1.json ]; then
            python - <<'PY'
          import json, re
          from pathlib import Path
          d = json.loads(Path('auto/qa/historical_law_stage5_promotion.v1.json').read_text(encoding='utf-8'))
          rows = d.get('records') or []
          cal = d.get('calibration') or {}
          assert cal.get('false_machine_candidate_count') == 0, cal
          assert cal.get('promotion_calibration_safe') is True, cal
          assert d.get('historical_version_checked_count') == 0
          assert d.get('protected_core_mutation_count') == 0
          assert d.get('record_count') == len(rows) == d.get('stage3_machine_candidate_count')
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all('official_answer' not in r for r in rows)
          for row in rows:
              if row.get('promotion_status') == 'promotion_candidate':
                  assert not row.get('blockers'), row
                  assert row.get('stage4_status') == 'historical_text_evidence_ready', row
                  assert re.fullmatch(r'[0-9a-f]{64}', row.get('historical_article_sha256') or ''), row
          print(json.dumps({
              'promotion_status_counts': d.get('promotion_status_counts'),
              'calibration': cal,
          }, ensure_ascii=False))
          PY
          fi

      - name: Stage 6 — semantic cross-check from Stage 4 snapshot
        id: stage6
        if: always()
        continue-on-error: true
        run: |
          if [ -f auto/qa/historical_law_stage5_promotion.v1.json ] \
             && [ -f auto/qa/historical_law_oldver_stage4.v1.json ]; then
            set -euo pipefail
            python scripts/historical_law_stage6_snapshot_semantic.py \
              --output /tmp/historical_law_stage6_first.json
            python scripts/historical_law_stage6_snapshot_semantic.py
            cmp /tmp/historical_law_stage6_first.json \
              auto/qa/historical_law_stage6_semantic.v1.json
          fi

      - name: Validate snapshot Stage 6 if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_stage6_semantic.v1.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          s5 = json.loads(Path('auto/qa/historical_law_stage5_promotion.v1.json').read_text(encoding='utf-8'))
          d = json.loads(Path('auto/qa/historical_law_stage6_semantic.v1.json').read_text(encoding='utf-8'))
          rows = d.get('records') or []
          allowed = {
              'historical_semantic_confirmed',
              'historical_semantic_support',
              'historical_semantic_conflict',
              'question_link_missing',
              'source_identity_mismatch',
          }
          assert d.get('stage5_promotion_candidate_count') == s5.get('promotion_candidate_count')
          assert d.get('record_count') == len(rows) == d.get('stage5_promotion_candidate_count')
          assert d.get('question_shard_error_count') == 0, d.get('question_shard_errors')
          assert d.get('historical_version_checked_count') == 0
          assert d.get('protected_core_mutation_count') == 0
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all('official_answer' not in r for r in rows)
          assert set(d.get('status_counts') or {}).issubset(allowed), d.get('status_counts')
          identities = d.get('source_identity_method_counts') or {}
          assert set(identities).issubset({'moj_open_api_current', 'stage4_moj_title'})
          semantic = sum((d.get('status_counts') or {}).get(k, 0) for k in (
              'historical_semantic_confirmed',
              'historical_semantic_support',
              'historical_semantic_conflict',
          ))
          assert sum(identities.values()) == semantic
          print(json.dumps({
              'status_counts': d.get('status_counts'),
              'identity_methods': identities,
              'confirmed': d.get('historical_semantic_confirmed_count'),
              'support': d.get('historical_semantic_support_count'),
              'conflict': d.get('historical_semantic_conflict_count'),
          }, ensure_ascii=False))
          PY
          fi

      - name: Upload Stage 2-6 read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-law-stage2-6-live-evidence
          path: |
            auto/qa/historical_law_exam_date_stage2.v1.json
            auto/qa/historical_law_history_snapshot.v1.json
            auto/qa/historical_law_moj_api_probe.v1.json
            auto/qa/historical_law_moj_api_targets.v1.json
            auto/qa/historical_law_article_stage3.v1.json
            auto/qa/historical_law_oldver_stage4.v1.json
