name: Build Cloudflare Frontend Preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-frontend-preview.yml'
      - 'monthly_patch_parts/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'essay_guides.js'
      - 'scripts/build_essay_guides_runtime.js'
      - 'scripts/p0_frontend_preflight.js'
      - 'scripts/service_worker_update_smoke.js'
      - 'auto/essays_auto.json'
      - 'auto/questions_auto.json'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/monthly_frontend_smoke.py'

permissions:
  contents: write

concurrency:
  group: swsi-cloudflare-frontend-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build current monthly frontend
        run: |
          set -euo pipefail
          rm -rf /tmp/swsi-preview
          mkdir -p /tmp/swsi-preview/icons
          cp index.html manifest.json sw.js apple-touch-icon.png /tmp/swsi-preview/
          node scripts/build_essay_guides_runtime.js essay_guides.js /tmp/swsi-preview/essay_guides.js
          cat monthly_patch_parts/*.part > /tmp/swsi-preview/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png /tmp/swsi-preview/icons/
          if [ -d auto ]; then cp -R auto /tmp/swsi-preview/; fi
          python scripts/monthly_patch_build.py /tmp/swsi-preview/index.html
          node scripts/p0_frontend_preflight.js
          node scripts/service_worker_update_smoke.js
          node --check /tmp/swsi-preview/essay_guides.js
          node --check /tmp/swsi-preview/monthly_patch.js
          node --check /tmp/swsi-preview/sw.js
          python scripts/monthly_frontend_smoke.py --site /tmp/swsi-preview
          grep -q 'SWSI Font Size Control Fix 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Product V1 Lock 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q '不知道怎麼下筆？先照這 5 步' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Essay Trust Layer 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Essay Guide Audit Batch 1 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Essay Metadata Labels 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Learning Loop V1 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q '這題你為什麼會錯？' /tmp/swsi-preview/monthly_patch.js
          grep -q '今天下一步' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Knowledge Path V1 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q '從理論接到考題' /tmp/swsi-preview/monthly_patch.js
          grep -q '從法規接到考題' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Law Trust Layer V1 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Law Trust Batch 2 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Law Trust Final Batch 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI New Resident Basic Act Status Fix 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI AI Copy Polish 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Theory Trust Batch 1 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Theory Trust Batch 2 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Theory Trust Final Batch 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Feedback / Quality Report V1 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Feedback Context State Fix 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'SWSI Feedback Compact UI V2 2026-08-26' /tmp/swsi-preview/monthly_patch.js
          grep -q 'Bowen 家庭系統理論' /tmp/swsi-preview/monthly_patch.js
          grep -q 'Minuchin 結構家庭治療' /tmp/swsi-preview/monthly_patch.js
          grep -q '資產建構／資產累積理論' /tmp/swsi-preview/monthly_patch.js
          grep -q '無條件基本收入 UBI' /tmp/swsi-preview/monthly_patch.js
          grep -q '符號互動論的主要分析層次是微觀互動' /tmp/swsi-preview/monthly_patch.js
          grep -q '社會投資與傳統社會保護常是互補' /tmp/swsi-preview/monthly_patch.js
          grep -q '不等同生活模型' /tmp/swsi-preview/monthly_patch.js
          grep -q '文化謙遜' /tmp/swsi-preview/monthly_patch.js
          grep -q '個案管理是一種服務方法' /tmp/swsi-preview/monthly_patch.js
          grep -q '手寫照片可一次 1–3 張' /tmp/swsi-preview/monthly_patch.js
          grep -q '當地區公告最低生活費' /tmp/swsi-preview/monthly_patch.js
          grep -q '已制定公布・施行日另定' /tmp/swsi-preview/monthly_patch.js
          grep -q '34人以上' /tmp/swsi-preview/monthly_patch.js
          grep -q '緊急保護令' /tmp/swsi-preview/monthly_patch.js
          grep -q '行政輔導先行' /tmp/swsi-preview/monthly_patch.js
          grep -q '社會福利基本法' /tmp/swsi-preview/monthly_patch.js
          grep -q '精神衛生法' /tmp/swsi-preview/monthly_patch.js
          grep -q '兒童權利公約施行法' /tmp/swsi-preview/monthly_patch.js
          grep -q '公務人員退休資遣撫卹法' /tmp/swsi-preview/monthly_patch.js
          grep -q '正式考題本身.*最高依據' /tmp/swsi-preview/monthly_patch.js
          grep -q '平台整理・可能相關理論' /tmp/swsi-preview/monthly_patch.js
          if grep -A80 'SWSI Essay Trust Layer 2026-08-26' /tmp/swsi-preview/monthly_patch.js | grep -q '校過骨架'; then
            echo 'Essay Trust Layer still contains forbidden overclaim: 校過骨架' >&2
            exit 1
          fi

      - name: Mark as isolated preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/swsi-preview/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SWSI CLOUDFLARE FRONTEND PREVIEW 20260826 -->'
          if marker not in s:
              s=s.replace('<head>', '<head>\n'+marker+'\n<meta name="robots" content="noindex,nofollow,noarchive">', 1)
          s=s.replace('<title>社工師國考免費題庫｜SWSI</title>', '<title>【新版預覽】社工師國考免費題庫｜SWSI</title>', 1)
          s=s.replace('src="monthly_patch.js"', 'src="monthly_patch.js?v=preview-code-health-p0-20260826-2"', 1)
          banner='''<div id="swsi-preview-banner" style="position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#111;color:#fff;text-align:center;padding:7px 10px;font:600 13px/1.4 system-ui,-apple-system,sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.3)">新版預覽｜正式 Netlify 網址完全沒有變動</div><style>body{padding-top:34px!important}</style>'''
          if 'id="swsi-preview-banner"' not in s:
              import re
              s=re.sub(r'(<body[^>]*>)', r'\1'+banner, s, count=1, flags=re.I)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'SWSI CLOUDFLARE FRONTEND PREVIEW 20260826' /tmp/swsi-preview/index.html
          grep -q 'monthly_patch.js?v=preview-code-health-p0-20260826-2' /tmp/swsi-preview/index.html
          grep -q "const VERSION = 'v6'" /tmp/swsi-preview/sw.js

      - name: Publish preview files into existing Cloudflare static assets
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/swsi-main-publish
          git worktree add --detach /tmp/swsi-main-publish origin/main
          trap 'git worktree remove --force /tmp/swsi-main-publish >/dev/null 2>&1 || true' EXIT

          rm -rf /tmp/swsi-main-publish/cdn/preview
          mkdir -p /tmp/swsi-main-publish/cdn/preview
          cp -a /tmp/swsi-preview/. /tmp/swsi-main-publish/cdn/preview/

          cd /tmp/swsi-main-publish
          git config user.name 'swsi-preview-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cdn/preview
          if git diff --cached --quiet; then
            echo 'Preview files already current.'
            exit 0
          fi
          git commit -m '發布 Cloudflare 新版前端預覽'
          git push origin HEAD:main

      - name: Wait for Cloudflare preview deployment
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          URL='https://wandering-wave-4418.c022050333.workers.dev/preview/index.html'
          PATCH_URL='https://wandering-wave-4418.c022050333.workers.dev/preview/monthly_patch.js'
          code=''
          for i in $(seq 1 36); do
            code="$(curl --silent --show-error --location -o /tmp/live-preview.html -w '%{http_code}' "$URL?check=$GITHUB_RUN_ID-$i" || true)"
            patch_code="$(curl --silent --show-error --location -o /tmp/live-preview-patch.js -w '%{http_code}' "$PATCH_URL?check=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = '200' ] && [ "$patch_code" = '200' ] \
               && grep -q 'SWSI CLOUDFLARE FRONTEND PREVIEW 20260826' /tmp/live-preview.html \
               && grep -q 'monthly_patch.js?v=preview-code-health-p0-20260826-2' /tmp/live-preview.html \
               && grep -q 'SWSI Essay Trust Layer 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Essay Guide Audit Batch 1 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Essay Metadata Labels 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Learning Loop V1 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Knowledge Path V1 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Law Trust Layer V1 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Law Trust Batch 2 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Law Trust Final Batch 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI New Resident Basic Act Status Fix 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI AI Copy Polish 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Theory Trust Batch 1 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Theory Trust Batch 2 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Theory Trust Final Batch 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Feedback / Quality Report V1 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Feedback Context State Fix 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'SWSI Feedback Compact UI V2 2026-08-26' /tmp/live-preview-patch.js \
               && grep -q 'Bowen 家庭系統理論' /tmp/live-preview-patch.js \
               && grep -q 'Minuchin 結構家庭治療' /tmp/live-preview-patch.js \
               && grep -q '資產建構／資產累積理論' /tmp/live-preview-patch.js \
               && grep -q '無條件基本收入 UBI' /tmp/live-preview-patch.js \
               && grep -q '符號互動論的主要分析層次是微觀互動' /tmp/live-preview-patch.js \
               && grep -q '社會投資與傳統社會保護常是互補' /tmp/live-preview-patch.js \
               && grep -q '文化謙遜' /tmp/live-preview-patch.js \
               && grep -q '個案管理是一種服務方法' /tmp/live-preview-patch.js \
               && grep -q '不等同生活模型' /tmp/live-preview-patch.js \
               && grep -q '手寫照片可一次 1–3 張' /tmp/live-preview-patch.js \
               && grep -q '當地區公告最低生活費' /tmp/live-preview-patch.js \
               && grep -q '已制定公布・施行日另定' /tmp/live-preview-patch.js \
               && grep -q '34人以上' /tmp/live-preview-patch.js \
               && grep -q '行政輔導先行' /tmp/live-preview-patch.js \
               && grep -q '從理論接到考題' /tmp/live-preview-patch.js \
               && grep -q '從法規接到考題' /tmp/live-preview-patch.js \
               && grep -q '正式考題本身.*最高依據' /tmp/live-preview-patch.js; then
              echo "CLOUDFLARE FRONTEND PREVIEW OK: $URL"
              exit 0
            fi
            echo "Waiting for preview deploy: attempt=$i html=$code patch=$patch_code"
            sleep 5
          done
          echo 'Cloudflare preview did not become ready within polling window.' >&2
          exit 1