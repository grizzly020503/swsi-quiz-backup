name: Admin Auth Copy Once

on:
  push:
    branches:
      - fix/admin-auth-copy-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin auth messages
        shell: python
        run: |
          from pathlib import Path

          files = [Path('admin/index.html'), Path('cdn/admin/index.html')]
          replacements = [
              (
                  '管理者專用。帳號已經存在，不需要另外註冊。',
                  '管理者專用。只有已登錄的管理員帳號可進入；其他 Email 無法取得管理權限。'
              ),
              (
                  '密碼重設信已寄出。請從信件中的連結回到 SWSI，會直接看到「設定新的管理密碼」。',
                  '如果這個 Email 是已登錄的管理員帳號，系統會寄出密碼重設信；若不是，不會寄送。為了安全，畫面不會透露帳號是否存在。'
              ),
              (
                  '一次性登入連結已寄出。開啟後會自動建立登入狀態。',
                  '如果這個 Email 是已登錄的管理員帳號，系統會寄出一次性登入連結；若不是，不會寄送。為了安全，畫面不會透露帳號是否存在。'
              ),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

      - name: Verify scope
        run: |
          git diff --check
          git diff -- admin/index.html cdn/admin/index.html
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "admin/index.html cdn/admin/index.html "
          ! git diff | grep -E 'SUPABASE_SERVICE_ROLE_KEY|grading_mode|accepted_answers|questions/'
      - name: Commit patch
        run: |
          git config user.name "swsi-admin-copy-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin/index.html cdn/admin/index.html
          git commit -m "fix: clarify admin recovery security messaging"
          git push
