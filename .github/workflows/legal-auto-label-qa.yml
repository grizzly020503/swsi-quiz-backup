name: Legal Auto Label QA

# Behavioural check of the daily automatic legal-status labels
# (supabase/migrations/20261127100000_legal_auto_label.sql) and of the
# registry-driven law-name extractor (20261128090000). Runs on a
# throwaway Postgres 17 service in one rolled-back transaction; it never
# connects to Supabase.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/legal_auto_label_pg_selftest.py'
      - 'scripts/legal_names_registry_pg_selftest.py'
      - '.github/workflows/legal-auto-label-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/legal_auto_label_pg_selftest.py'
      - 'scripts/legal_names_registry_pg_selftest.py'
      - '.github/workflows/legal-auto-label-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-auto-label-pg17:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: swsi_fixture
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: swsi_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swsi_fixture -d swsi_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ephemeral PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Check every labelling branch, dry run, idempotence and replay
        env:
          SWSI_DISPOSABLE_PG: I_CONFIRM_DISPOSABLE_FIXTURE
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: swsi_fixture
          PGPASSWORD: ci-only-synthetic-password
          PGDATABASE: swsi_fixture
        run: |
          python -m py_compile scripts/legal_auto_label_pg_selftest.py scripts/legal_names_registry_pg_selftest.py
          python scripts/legal_auto_label_pg_selftest.py
          python scripts/legal_names_registry_pg_selftest.py
