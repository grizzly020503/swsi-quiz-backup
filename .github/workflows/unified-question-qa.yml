name: Unified Question QA

on:
  push:
    paths:
      - 'UNIFIED_QUESTION_QA_PIPELINE.md'
      - 'data/question_qa_policy_v1.json'
      - 'data/legal_watch_report.json'
      - 'scripts/unified_question_qa.py'
      - 'scripts/unified_question_qa_selftest.py'
      - 'scripts/build_question_qa_dashboard.py'
      - '.github/workflows/unified-question-qa.yml'
  pull_request:
    paths:
      - 'UNIFIED_QUESTION_QA_PIPELINE.md'
      - 'data/question_qa_policy_v1.json'
      - 'data/legal_watch_report.json'
      - 'scripts/unified_question_qa.py'
      - 'scripts/unified_question_qa_selftest.py'
      - 'scripts/build_question_qa_dashboard.py'
      - '.github/workflows/unified-question-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Synthetic intake QA self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile QA scripts
        run: |
          python -m py_compile scripts/unified_question_qa.py
          python -m py_compile scripts/unified_question_qa_selftest.py
          python -m py_compile scripts/build_question_qa_dashboard.py

      - name: Run synthetic QA invariants
        run: python scripts/unified_question_qa_selftest.py

      - name: Run current 115-2 snapshot through unified QA
        run: |
          python scripts/unified_question_qa.py \
            --mcq cdn/question-shards/115-2.json \
            --essays auto/essays_auto.json \
            --year 115 \
            --round 第二次 \
            --legal-watch data/legal_watch_report.json \
            --trust-current-legal-watch \
            --out /tmp/question-qa-115-2.json \
            --fail-on never > /dev/null

      - name: Build compact admin dashboard payload
        run: |
          python scripts/build_question_qa_dashboard.py \
            /tmp/question-qa-115-2.json \
            --out /tmp/question-qa-dashboard-115-2.json > /dev/null

      - name: Assert compact dashboard invariants
        run: |
          python - <<'PY'
          import json
          d = json.load(open('/tmp/question-qa-dashboard-115-2.json', encoding='utf-8'))
          assert d['official_core']['total'] == 210
          assert d['official_core']['blocked'] == 0
          assert d['official_core']['release_ready'] is True
          assert d['human_queue']['total'] == 0
          assert d['generation_backlog']['total'] == 185
          assert len(d['human_queue']['items']) == 0
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
