name: Unified Question QA

on:
  push:
    paths:
      - 'UNIFIED_QUESTION_QA_PIPELINE.md'
      - 'data/question_qa_policy_v1.json'
      - 'data/enrichment_decision_policy.v1.json'
      - 'data/legal_watch_names.json'
      - 'data/exam_scheme_registry.v1.json'
      - 'data/legal_watch_report.json'
      - 'cdn/question-shards/**'
      - 'auto/questions_auto.json'
      - 'auto/essays_auto.json'
      - 'scripts/exam_scheme.py'
      - 'scripts/exam_scheme_qa_policy.py'
      - 'scripts/unified_question_qa.py'
      - 'scripts/unified_question_qa_current.py'
      - 'scripts/unified_question_qa_selftest.py'
      - 'scripts/enrichment_decision.py'
      - 'scripts/enrichment_decision_selftest.py'
      - 'scripts/build_question_qa_dashboard.py'
      - '.github/workflows/unified-question-qa.yml'
  pull_request:
    paths:
      - 'UNIFIED_QUESTION_QA_PIPELINE.md'
      - 'data/question_qa_policy_v1.json'
      - 'data/enrichment_decision_policy.v1.json'
      - 'data/legal_watch_names.json'
      - 'data/exam_scheme_registry.v1.json'
      - 'data/legal_watch_report.json'
      - 'cdn/question-shards/**'
      - 'auto/questions_auto.json'
      - 'auto/essays_auto.json'
      - 'scripts/exam_scheme.py'
      - 'scripts/exam_scheme_qa_policy.py'
      - 'scripts/unified_question_qa.py'
      - 'scripts/unified_question_qa_current.py'
      - 'scripts/unified_question_qa_selftest.py'
      - 'scripts/enrichment_decision.py'
      - 'scripts/enrichment_decision_selftest.py'
      - 'scripts/build_question_qa_dashboard.py'
      - '.github/workflows/unified-question-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Synthetic intake QA self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile QA scripts
        run: |
          python -m py_compile scripts/exam_scheme.py
          python -m py_compile scripts/exam_scheme_qa_policy.py
          python -m py_compile scripts/unified_question_qa.py
          python -m py_compile scripts/unified_question_qa_current.py
          python -m py_compile scripts/unified_question_qa_selftest.py
          python -m py_compile scripts/enrichment_decision.py
          python -m py_compile scripts/enrichment_decision_selftest.py
          python -m py_compile scripts/build_question_qa_dashboard.py

      - name: Run synthetic QA invariants
        run: |
          python scripts/unified_question_qa_selftest.py
          python scripts/enrichment_decision_selftest.py

      - name: Resolve latest published exam from manifest
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('cdn/question-shards/manifest.json').read_text(encoding='utf-8'))
          shards=manifest.get('shards') or []
          if not shards:
              raise SystemExit('question shard manifest is empty')
          def key(x):
              y=int(str(x.get('year') or 0))
              r=str(x.get('round') or '')
              rv=2 if r in ('2','第二次','第2次') else 1
              return (y,rv)
          latest=max(shards,key=key)
          file=str(latest.get('file') or '')
          if not file or not Path('cdn/question-shards',file).is_file():
              raise SystemExit(f'latest shard missing: {file!r}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"LATEST_YEAR={latest['year']}\n")
              f.write(f"LATEST_ROUND={latest['round']}\n")
              f.write(f"LATEST_SHARD=cdn/question-shards/{file}\n")
          print('latest exam:', latest['year'], latest['round'], file)
          PY

      - name: Run latest published snapshot through scheme-derived Unified QA
        run: |
          python scripts/unified_question_qa_current.py \
            --mcq "$LATEST_SHARD" \
            --essays auto/essays_auto.json \
            --year "$LATEST_YEAR" \
            --round "$LATEST_ROUND" \
            --legal-watch data/legal_watch_report.json \
            --trust-current-legal-watch \
            --out /tmp/question-qa-latest.json \
            --fail-on blocked > /dev/null

      - name: Run advisory enrichment decision baseline
        run: |
          python scripts/enrichment_decision.py \
            --input "$LATEST_SHARD" \
            --out /tmp/enrichment-decision-latest.json \
            --fail-on never > /dev/null
          python - <<'PY'
          import json
          report=json.load(open('/tmp/enrichment-decision-latest.json',encoding='utf-8'))
          assert report['contract'] == 'swsi_enrichment_decision_v1', report.get('contract')
          assert report['mode'] == 'advisory_dry_run', report.get('mode')
          assert report['summary']['items'] == 200, report['summary']
          assert report['safety']['official_core_modified'] is False
          assert report['safety']['production_write_performed'] is False
          print(json.dumps(report['summary'],ensure_ascii=False,indent=2))
          PY

      - name: Build compact admin dashboard payload
        run: |
          python scripts/build_question_qa_dashboard.py \
            /tmp/question-qa-latest.json \
            --out /tmp/question-qa-dashboard-latest.json > /dev/null

      - name: Assert latest dashboard invariants from approved profile
        run: |
          python - <<'PY'
          import json
          raw=json.load(open('/tmp/question-qa-latest.json',encoding='utf-8'))
          d=json.load(open('/tmp/question-qa-dashboard-latest.json',encoding='utf-8'))
          scheme=raw.get('exam_scheme') or {}
          expected=int(scheme.get('expected_total_items') or 0)
          if expected <= 0:
              raise SystemExit(f'missing scheme-derived expected total: {scheme}')
          assert d['official_core']['total'] == expected, (d['official_core'], scheme)
          assert d['official_core']['blocked'] == 0, d['official_core']
          assert d['official_core']['release_ready'] is True, d['official_core']
          assert 0 <= d['generation_backlog']['total'] <= expected, d['generation_backlog']
          assert d['human_queue']['total'] == len(d['human_queue']['items'])
          print(json.dumps({
              'year': d.get('year'),
              'round': d.get('round'),
              'exam_scheme_profile': scheme.get('profile_id'),
              'expected_total_items': expected,
              'health': d.get('health'),
              'official_core': d['official_core'],
              'human_queue_total': d['human_queue']['total'],
              'generation_backlog': d['generation_backlog']['total'],
          },ensure_ascii=False,indent=2))
          PY
