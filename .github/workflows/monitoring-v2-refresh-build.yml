# one-shot refresh retrigger after syncing canonical current-affairs snapshot
name: Monitoring V2 Refresh Build

on:
  push:
    branches:
      - feat/monitoring-v2-refresh-20260906
    paths:
      - '.github/workflows/monitoring-v2-refresh-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild canonical runtime
        run: |
          set -euo pipefail
          cat monthly_patch_parts/*.part > cdn/monthly_patch.js
          node --check cdn/monthly_patch.js
          python -m py_compile scripts/build_public_legal_watch_snapshot.py scripts/public_monitoring_v2_smoke.py scripts/public_uptime_smoke.py
          python scripts/public_monitoring_v2_smoke.py
      - name: Commit regenerated runtime
        run: |
          set -euo pipefail
          if git diff --quiet -- cdn/monthly_patch.js; then
            echo 'Runtime already canonical.'
            exit 0
          fi
          git config user.name 'swsi-monitoring-refresh-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cdn/monthly_patch.js
          git commit -m 'Monitoring V2: rebuild canonical runtime on current main'
          git push origin HEAD:${GITHUB_REF_NAME}
