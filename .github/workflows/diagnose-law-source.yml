name: Diagnose MOJ Law Source

on:
  push:
    paths:
      - '.github/workflows/diagnose-law-source.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test official MOJ endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from urllib.parse import quote

          urls = [
              'https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050125',
              'https://law.moj.gov.tw/Law/LawSearchResult.aspx?ty=ONEBAR&kw=' + quote('社會工作師法'),
              'https://sendlaw.moj.gov.tw/PublicData/GetFile.ashx?DType=XML&AuData=CF',
          ]
          for url in urls:
              print('\nURL', url)
              try:
                  r = requests.get(url, timeout=30, headers={'User-Agent':'swsi-law-watch-diagnostic/1.0'})
                  print('status=', r.status_code, 'bytes=', len(r.content), 'final=', r.url)
                  text = r.text[:500000]
                  print('has_name=', '社會工作師法' in text)
                  print('pcodes=', sorted(set(re.findall(r'[?&]pcode=([A-Z0-9]+)', text, flags=re.I)))[:10])
                  print('modified_hint=', bool(re.search(r'修正日期|最新異動日期', text)))
              except Exception as exc:
                  print('ERROR', type(exc).__name__, str(exc)[:500])
          PY
