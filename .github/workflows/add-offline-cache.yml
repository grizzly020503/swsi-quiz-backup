name: Add offline question cache

on:
  push:
    paths:
      - '.github/workflows/add-offline-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply offline cache patch
        run: python scripts/add_offline_cache.py

      - name: Commit offline cache support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "加入 4600 題 IndexedDB 離線備援"
            git push
          fi
