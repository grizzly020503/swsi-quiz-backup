name: Verify Production Site

on:
  push:
    paths:
      - '.github/workflows/verify-production-site.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed Netlify content
        shell: bash
        run: |
          set -euo pipefail
          url='https://swsi-quiznetlify.netlify.app/'
          curl --silent --show-error --fail -D /tmp/headers.txt "$url" -o /tmp/site.html
          echo '--- RESPONSE HEADERS ---'
          cat /tmp/headers.txt
          echo '--- SITE SIZE ---'
          wc -c /tmp/site.html
          echo '--- VERSION MARKERS ---'
          for marker in \
            '免費公開學習工具' \
            '僅供授權同學使用' \
            '🔒 隱私提醒' \
            '怎麼變成申論考點？' \
            '此類事件常見的申論思考方向' \
            'essays_2.js' \
            "onclick=\"go('admin')\" title=\"管理\"" \
            '兒童少年保護工作中，有關安全評估的重點為何？要考慮那些安全計畫？（25 分）'; do
            if grep -Fq "$marker" /tmp/site.html; then
              echo "YES | $marker"
            else
              echo "NO  | $marker"
            fi
          done
          echo '--- FOOTER SNIPPET ---'
          grep -o '.\{0,120\}© 2026 熊品澄.\{0,220\}' /tmp/site.html || true
