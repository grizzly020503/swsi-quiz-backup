name: Diagnose Historical Essay Integrity

on:
  push:
    paths:
      - '.github/workflows/diagnose-historical-essay-integrity.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan embedded historical essays
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          a=text.index('window.ESSAYS = ')+len('window.ESSAYS = ')
          b=text.index(';\n\nwindow.CLUSTER_ANCHORS = ',a)
          rows=json.loads(text[a:b])
          print('TOTAL',len(rows))
          print('\nNO_SCORE_MARKER')
          for r in rows:
              q=str(r.get('q') or '')
              if '分' not in q:
                  print(r['id'],'| points=',r.get('points'),'| len=',len(q),'|',q)
          print('\nSHORT_QUESTION_LT_45')
          for r in rows:
              q=str(r.get('q') or '')
              if len(q)<45:
                  print(r['id'],'| points=',r.get('points'),'| len=',len(q),'|',q)
          print('\nSUSPICIOUS_TOKENS')
          tokens=['【分析】','ErikErikson','malpracticc','該個按','準備結東','請問鑑','牆至親職','性關 的','論理 守則','情 境','發 展','工 作者']
          for r in rows:
              q=str(r.get('q') or '')
              hit=[x for x in tokens if x in q]
              if hit:
                  print(r['id'],'|',hit,'|',q)
          PY
