name: Handoff Refresh 2026-09-06

on:
  push:
    branches:
      - docs/handoff-current-20260906
    paths:
      - '.github/workflows/handoff-refresh-20260906.yml'

permissions:
  contents: write

jobs:
  prepend-current-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepend latest operational handoff
        run: |
          python3 <<'PY'
          from pathlib import Path
          handoff = Path('PROJECT_HANDOFF.md')
          prefix_file = Path('tmp/HANDOFF_CURRENT_PREFIX_20260906.md')
          text = handoff.read_text(encoding='utf-8')
          prefix = prefix_file.read_text(encoding='utf-8')
          marker = '## 2026-09-06 最新營運狀態（READ FIRST）'
          if marker in text:
              raise SystemExit('Latest handoff marker already exists; refusing duplicate prepend.')
          old_title = '# SWSI 社工師國考平台 — 專案交接／續聊清單\n\n'
          if text.startswith(old_title):
              text = text[len(old_title):]
          handoff.write_text(prefix + text, encoding='utf-8')
          PY
          git diff --check
          grep -q '## 2026-09-06 最新營運狀態（READ FIRST）' PROJECT_HANDOFF.md
          grep -q 'Runtime Owner gate 前移到 PR' PROJECT_HANDOFF.md
      - name: Commit handoff and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name 'swsi-handoff-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/handoff-refresh-20260906.yml
          git rm tmp/HANDOFF_CURRENT_PREFIX_20260906.md
          git add PROJECT_HANDOFF.md
          git diff --cached --check
          git commit -m 'docs: refresh SWSI current handoff state'
          git push origin HEAD:docs/handoff-current-20260906
