name: Apply Verified Historical Essay Fixes

on:
  push:
    paths:
      - '.github/workflows/apply-verified-essay-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply official historical essay corrections
        run: python scripts/fix_verified_historical_essays.py

      - name: Validate known corruption removed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -F '【分析】' index.html
          ! grep -F 'ErikErikson' index.html
          ! grep -F 'malpracticc' index.html
          ! grep -F '兒少保護牆至親職教育' index.html
          ! grep -F '該個按的問題性質' index.html
          ! grep -F '請問鑑對於委託' index.html
          ! grep -F '準備結東' index.html
          ! grep -F '與男友有性關 的男友同居' index.html
          grep -F '說明在準備階段需進行那些工作？（20 分）' index.html
          grep -F '四個主要工作階段（開始階段、評估階段、處遇階段與結案階段）' index.html

      - name: Commit verified essay fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'swsi-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No verified historical essay changes needed.'
            exit 0
          fi
          git commit -m '依考選部原卷修正歷屆申論題幹與分數'
          git push
