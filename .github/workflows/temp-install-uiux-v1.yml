name: TEMP Install UIUX V1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temp-install-uiux-v1
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UIUX V1
        run: |
          python scripts/install_uiux_v1.py
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          if '<!-- SWSI UIUX V1 START -->' not in text:
              raise SystemExit('UIUX marker missing')
          m=re.search(r'<script id="swsi-uiux-v1-script">(.*?)</script>', text, re.S)
          if not m:
              raise SystemExit('UIUX script missing')
          Path('/tmp/swsi-uiux-v1.js').write_text(m.group(1), encoding='utf-8')
          subprocess.run(['node','--check','/tmp/swsi-uiux-v1.js'], check=True)
          print('UIUX V1 JavaScript syntax OK.')
          PY

      - name: Commit UIUX V1
        run: |
          git config user.name 'swsi-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'UIUX V1 already installed.'
            exit 0
          fi
          git commit -m '套用 UIUX 整理版 V1'
          git push origin HEAD:main
