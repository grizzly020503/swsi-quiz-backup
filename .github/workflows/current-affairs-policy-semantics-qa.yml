name: Current Affairs Policy Semantics QA

on:
  pull_request:
    paths:
      - 'scripts/analyze_current_affairs_signals.py'
      - 'scripts/current_affairs_policy_semantics_smoke.py'
      - '.github/workflows/current-affairs-policy-semantics-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Policy/history semantics regression
        run: |
          python -m py_compile scripts/analyze_current_affairs_signals.py scripts/current_affairs_policy_semantics_smoke.py
          python scripts/current_affairs_policy_semantics_smoke.py

  refresh-pr-snapshots:
    if: github.event_name == 'pull_request'
    needs: semantics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: release/current-affairs-semantics-final-20261001
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild semantic snapshots
        run: |
          set -euo pipefail
          python scripts/build_current_affairs_signals_snapshot.py \
            --input auto/current_affairs.json \
            --questions-csv data/questions_master_backup_20260824_2220.csv \
            --output auto/current_affairs_signals.json \
            --limit 30
          python scripts/build_current_affairs_events_snapshot.py \
            --news auto/current_affairs.json \
            --signals auto/current_affairs_signals.json \
            --output auto/current_affairs_events.json \
            --limit 30
          python scripts/build_current_affairs_trends_snapshot.py \
            --events auto/current_affairs_events.json \
            --output auto/current_affairs_trends.json \
            --limit 30
          cp auto/current_affairs_signals.json cdn/auto/current_affairs_signals.json
          cp auto/current_affairs_events.json cdn/auto/current_affairs_events.json
          cp auto/current_affairs_trends.json cdn/auto/current_affairs_trends.json
          python scripts/current_affairs_policy_semantics_smoke.py
          python scripts/current_affairs_signals_smoke.py
          python scripts/current_affairs_events_smoke.py
          git diff --check

      - name: Commit rebuilt snapshots to PR branch
        run: |
          set -euo pipefail
          git config user.name 'swsi-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            auto/current_affairs_signals.json auto/current_affairs_events.json auto/current_affairs_trends.json \
            cdn/auto/current_affairs_signals.json cdn/auto/current_affairs_events.json cdn/auto/current_affairs_trends.json
          if git diff --cached --quiet; then
            echo 'Snapshots already current.'
            exit 0
          fi
          git commit -m 'chore: refresh current-affairs semantics snapshots'
          git push origin HEAD:release/current-affairs-semantics-final-20261001
