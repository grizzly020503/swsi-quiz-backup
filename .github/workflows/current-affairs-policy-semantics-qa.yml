name: Current Affairs Policy Semantics QA

on:
  pull_request:
    paths:
      - 'scripts/analyze_current_affairs_signals.py'
      - 'scripts/build_current_affairs_signals_snapshot.py'
      - 'scripts/current_affairs_policy_semantics_smoke.py'
      - 'scripts/current_affairs_history_precision_smoke.py'
      - '.github/workflows/current-affairs-policy-semantics-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Policy/history semantics regression
        run: |
          python -m py_compile \
            scripts/analyze_current_affairs_signals.py \
            scripts/build_current_affairs_signals_snapshot.py \
            scripts/current_affairs_policy_semantics_smoke.py \
            scripts/current_affairs_history_precision_smoke.py
          python scripts/current_affairs_policy_semantics_smoke.py
          python scripts/current_affairs_history_precision_smoke.py

      - name: Build semantic preview snapshots
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-affairs-semantic-preview
          python scripts/build_current_affairs_signals_snapshot.py \
            --input auto/current_affairs.json \
            --questions-csv data/questions_master_backup_20260824_2220.csv \
            --output /tmp/current-affairs-semantic-preview/current_affairs_signals.json \
            --limit 30
          cp auto/current_affairs_events.json /tmp/current-affairs-semantic-preview/current_affairs_events.json
          python scripts/build_current_affairs_events_snapshot.py \
            --news auto/current_affairs.json \
            --signals /tmp/current-affairs-semantic-preview/current_affairs_signals.json \
            --output /tmp/current-affairs-semantic-preview/current_affairs_events.json \
            --limit 30
          python scripts/build_current_affairs_trends_snapshot.py \
            --events /tmp/current-affairs-semantic-preview/current_affairs_events.json \
            --output /tmp/current-affairs-semantic-preview/current_affairs_trends.json \
            --limit 30

      - name: Upload semantic preview snapshots
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-semantic-preview-${{ github.sha }}
          path: /tmp/current-affairs-semantic-preview/
          if-no-files-found: error
          retention-days: 3
