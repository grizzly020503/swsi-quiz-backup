name: Materialize Knowledge Canonical Once

on:
  push:
    paths:
      - '.github/workflows/materialize-knowledge-canonical-once.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref_name == 'fix/code-health-p0-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build production-shaped site
        run: |
          rm -rf _site _knowledge_snapshot
          mkdir -p _site/icons
          cp index.html manifest.json sw.js apple-touch-icon.png _site/
          node scripts/build_essay_guides_runtime.js essay_guides.js _site/essay_guides.js
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture verified effective runtime
        run: |
          python -m http.server 4173 --directory _site >/tmp/swsi-knowledge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/knowledge_runtime_snapshot.js http://127.0.0.1:4173/ _knowledge_snapshot
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('data/knowledge_runtime_baseline.json').read_text(encoding='utf-8'))
          actual = json.loads(Path('_knowledge_snapshot/manifest.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit('refusing to materialize: runtime snapshot differs from pinned baseline')
          PY

      - name: Materialize canonical data
        run: |
          mkdir -p data
          cp _knowledge_snapshot/laws.runtime.json data/laws.canonical.json
          cp _knowledge_snapshot/theories.runtime.json data/theories.canonical.json
          cp _knowledge_snapshot/manifest.json data/knowledge_canonical_manifest.json
          python -m json.tool data/laws.canonical.json >/dev/null
          python -m json.tool data/theories.canonical.json >/dev/null
          python -m json.tool data/knowledge_canonical_manifest.json >/dev/null

      - name: Commit canonical data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/laws.canonical.json data/theories.canonical.json data/knowledge_canonical_manifest.json
          if git diff --cached --quiet; then
            echo 'Canonical data already materialized.'
            exit 0
          fi
          git commit -m 'data(knowledge): materialize canonical runtime snapshot'
          git push origin HEAD:fix/code-health-p0-20260826
