name: Publish Question Shards to Repo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/question-shards-publish.yml'
      - 'scripts/build_question_shards.py'
  schedule:
    # 台灣時間每天 11:10；接在 MOEX 10:35 每日同步之後。
    - cron: '10 3 * * *'

permissions:
  contents: write

concurrency:
  group: swsi-question-shards-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build verified shards
        run: python scripts/build_question_shards.py --output-dir /tmp/question-shards

      - name: Publish dataset or headers when changed
        id: publish
        run: |
          set -euo pipefail
          old_revision=''
          if [ -f cdn/question-shards/manifest.json ]; then
            old_revision="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('cdn/question-shards/manifest.json')
          try:
              print(json.loads(p.read_text(encoding='utf-8')).get('dataset_revision',''))
          except Exception:
              print('')
          PY
          )"
          fi
          new_revision="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/question-shards/manifest.json').read_text(encoding='utf-8'))['dataset_revision'])
          PY
          )"

          echo "revision=$new_revision" >> "$GITHUB_OUTPUT"
          echo "old_revision=$old_revision"
          echo "new_revision=$new_revision"

          if [ -z "$old_revision" ] || [ "$old_revision" != "$new_revision" ]; then
            rm -rf cdn/question-shards
            mkdir -p cdn/question-shards
            cp -a /tmp/question-shards/. cdn/question-shards/
          else
            echo 'Question dataset unchanged; keep existing shard files.'
          fi

          # One rule only. The previous exact-manifest + wildcard rules both matched
          # manifest.json and Cloudflare correctly joined duplicate CORS/cache headers.
          # A single public JSON rule keeps CORS valid and a 5-minute browser cache is
          # short enough for exam-bank updates while Cloudflare edge caching remains active.
          cat > cdn/_headers <<'EOF'
          /question-shards/*.json
            Access-Control-Allow-Origin: *
            Cache-Control: public, max-age=300, must-revalidate
            X-Content-Type-Options: nosniff
          EOF

          git config user.name 'swsi-shard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cdn/question-shards cdn/_headers
          if git diff --cached --quiet; then
            echo 'No shard or header changes; no repository commit.'
            exit 0
          fi
          git commit -m "更新 Cloudflare 題庫 shard/header ${new_revision}"
          git push

      - name: Smoke test Cloudflare production static assets
        env:
          EXPECTED_REVISION: ${{ steps.publish.outputs.revision }}
        run: |
          set -euo pipefail
          BASE='https://wandering-wave-4418.c022050333.workers.dev/question-shards'

          # A changed dataset/header triggers a separate Cloudflare Git deployment.
          # Poll until production serves both the expected revision and the non-duplicated headers.
          live_revision=''
          live_cors=''
          live_cache=''
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail \
              -D /tmp/manifest.headers.raw \
              -o /tmp/manifest.json \
              "$BASE/manifest.json"; then
              tr -d '\r' < /tmp/manifest.headers.raw > /tmp/manifest.headers
              live_revision="$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/manifest.json', encoding='utf-8')).get('dataset_revision',''))
          except Exception:
              print('')
          PY
          )"
              live_cors="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' /tmp/manifest.headers)"
              live_cache="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' /tmp/manifest.headers)"
              if [ -n "$EXPECTED_REVISION" ] \
                 && [ "$live_revision" = "$EXPECTED_REVISION" ] \
                 && [ "$live_cors" = '*' ] \
                 && [ "$live_cache" = 'public, max-age=300, must-revalidate' ]; then
                break
              fi
            fi
            echo "Waiting for Cloudflare assets: attempt $i rev=$live_revision cors=$live_cors cache=$live_cache"
            sleep 5
          done

          test -n "$EXPECTED_REVISION"
          test "$live_revision" = "$EXPECTED_REVISION"
          test "$live_cors" = '*'
          test "$live_cache" = 'public, max-age=300, must-revalidate'

          python - <<'PY'
          import json
          m=json.load(open('/tmp/manifest.json', encoding='utf-8'))
          assert int(m['shard_count']) >= 24, m
          assert int(m['total_questions']) == int(m['shard_count']) * 200, m
          assert len(m['shards']) == int(m['shard_count']), m
          print('manifest runtime OK:', m['dataset_revision'], m['total_questions'], m['shard_count'])
          PY

          echo '--- manifest response headers ---'
          cat /tmp/manifest.headers
          grep -qi '^x-content-type-options: nosniff' /tmp/manifest.headers
          grep -qi '^cf-cache-status:' /tmp/manifest.headers

          curl --silent --show-error --fail \
            -D /tmp/shard.headers.raw \
            -o /tmp/shard.json \
            "$BASE/115-2.json"
          tr -d '\r' < /tmp/shard.headers.raw > /tmp/shard.headers
          python - <<'PY'
          import json
          s=json.load(open('/tmp/shard.json', encoding='utf-8'))
          assert s['year']=='115' and s['round']=='第二次'
          assert s['question_count']==200 and len(s['questions'])==200
          assert all('accepted_answers' in q for q in s['questions'])
          print('115-2 runtime shard OK:', len(s['questions']))
          PY
          echo '--- shard response headers ---'
          cat /tmp/shard.headers
          shard_cors="$(awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' /tmp/shard.headers)"
          shard_cache="$(awk 'BEGIN{IGNORECASE=1} /^cache-control:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' /tmp/shard.headers)"
          test "$shard_cors" = '*'
          test "$shard_cache" = 'public, max-age=300, must-revalidate'
          grep -qi '^x-content-type-options: nosniff' /tmp/shard.headers
          grep -qi '^cf-cache-status:' /tmp/shard.headers

          # No Origin means the request reaches the existing AI Worker and is rejected
          # before rate-limit / D1 / Groq. Static Assets therefore did not replace the API route.
          api_status="$(curl --silent --show-error -o /tmp/api-body.json -w '%{http_code}' \
            -X POST 'https://wandering-wave-4418.c022050333.workers.dev/' \
            -H 'Content-Type: application/json' \
            --data '{"model":"qwen/qwen3.6-27b","messages":[{"role":"user","content":"smoke"}]}')"
          test "$api_status" = '403'
          echo "AI Worker route runtime OK: no-Origin POST -> $api_status"
