name: Fix Internal AI Header Name

on:
  push:
    paths:
      - '.github/workflows/fix-internal-header-name.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align internal header name
        run: python scripts/fix_internal_header_name.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '"X-SWSI-Internal-Key": internalKey' supabase/functions/analyze-pending-questions/index.ts
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'swsi-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/analyze-pending-questions/index.ts
          git commit -m '校正後台 AI Proxy 內部 header 名稱'
          git push
