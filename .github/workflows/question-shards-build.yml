name: Question Shards Build Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build_question_shards.py'
      - '.github/workflows/question-shards-build.yml'
  push:
    paths:
      - 'scripts/build_question_shards.py'
      - '.github/workflows/question-shards-build.yml'

permissions:
  contents: read

jobs:
  build-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Build read-only question shards
        run: python scripts/build_question_shards.py --output-dir /tmp/question-shards

      - name: Verify artifact and historical grading contract
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          root=Path('/tmp/question-shards')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          shards=manifest['shards']

          assert manifest['baseline_shard_count']==24, manifest
          assert manifest['shard_count']>=24, manifest
          assert manifest['total_questions']==manifest['shard_count']*200, manifest
          assert len(shards)==manifest['shard_count'], manifest

          expected_baseline={f'{year}-{round_no}.json' for year in range(104,116) for round_no in (1,2)}
          actual_files={meta['file'] for meta in shards}
          assert expected_baseline.issubset(actual_files), sorted(expected_baseline-actual_files)

          all_rows=[]
          for meta in shards:
              p=root/meta['file']
              assert p.exists(), p
              data=json.loads(p.read_text(encoding='utf-8'))
              assert data['question_count']==200, meta
              assert len(data['questions'])==200, meta
              all_rows.extend(data['questions'])

          # Historical official baseline is immutable. Future exams may add more
          # rows/multi-answer/special-grading cases, but ROC 104–115 must not drift.
          baseline=[q for q in all_rows if 104 <= int(str(q.get('year') or 0)) <= 115]
          assert len(baseline)==4800, len(baseline)

          mode_counts=Counter(str(q.get('grading_mode') or '') for q in baseline)
          assert mode_counts==Counter({
              'standard': 4784,
              'all_credit': 12,
              'any_answer': 4,
          }), mode_counts

          multi=[q for q in baseline if q.get('accepted_answers')]
          assert len(multi)==25, len(multi)
          assert all(q.get('grading_mode')=='standard' for q in multi)
          assert all(isinstance(q.get('accepted_answers'),list) and len(q['accepted_answers'])>=2 for q in multi)

          special=[q for q in baseline if q.get('grading_mode') in {'all_credit','any_answer'}]
          assert len(special)==16, len(special)
          assert all(q.get('answer')=='一律給分' for q in special)
          assert all(q.get('accepted_answers') is None for q in special)

          expected_any_answer_ids={
              'SW-105-1-17',
              'SW-106-1-36',
              'HBSE-108-2-039',
              'HBSE-110-2-034',
          }
          actual_any_answer_ids={str(q.get('id')) for q in baseline if q.get('grading_mode')=='any_answer'}
          assert actual_any_answer_ids==expected_any_answer_ids, {
              'expected': sorted(expected_any_answer_ids),
              'actual': sorted(actual_any_answer_ids),
          }

          # Executable frontend grading contract. The actual monthly frontend
          # helper must implement these same semantics instead of guessing from
          # answer='一律給分'.
          def correct(q,picked):
              mode=q.get('grading_mode')
              if mode=='all_credit':
                  return picked is None or picked in {'A','B','C','D'}
              if mode=='any_answer':
                  return picked in {'A','B','C','D'}
              if mode=='standard':
                  accepted=set(q.get('accepted_answers') or [q.get('answer')])
                  return picked is not None and picked in accepted
              return False

          for q in baseline:
              mode=q['grading_mode']
              if mode=='all_credit':
                  assert correct(q,None), q['id']
                  assert all(correct(q,x) for x in 'ABCD'), q['id']
              elif mode=='any_answer':
                  assert not correct(q,None), q['id']
                  assert all(correct(q,x) for x in 'ABCD'), q['id']
              else:
                  accepted=set(q.get('accepted_answers') or [q.get('answer')])
                  assert not correct(q,None), q['id']
                  for x in 'ABCD':
                      assert correct(q,x)==(x in accepted), (q['id'],x,accepted)

          print(json.dumps({
              'ok': True,
              'questions': len(all_rows),
              'shards': len(shards),
              'baseline_questions': len(baseline),
              'baseline_multi_answer_rows': len(multi),
              'baseline_grading_modes': dict(mode_counts),
              'frontend_grading_contract': 'pass',
              'total_uncompressed_bytes': manifest['total_uncompressed_bytes'],
              'dataset_revision': manifest['dataset_revision'],
          }, ensure_ascii=False))
          PY

      - name: Simulate future 116-1 exam auto expansion
        run: |
          python - <<'PY'
          import copy
          import importlib.util
          import json
          from pathlib import Path

          spec=importlib.util.spec_from_file_location('builder','scripts/build_question_shards.py')
          builder=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)

          root=Path('/tmp/question-shards')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          rows=[]
          for meta in manifest['shards']:
              rows.extend(json.loads((root/meta['file']).read_text(encoding='utf-8'))['questions'])

          source=json.loads((root/'115-2.json').read_text(encoding='utf-8'))['questions']
          future=[]
          for row in source:
              q=copy.deepcopy(row)
              q['year']='116'
              q['round']='第一次'
              q['id']='FUTURE-116-1-'+str(q['id'])
              q['source_exam_code']='116030'
              future.append(q)

          future_rows=rows+future
          grouped=builder.validate(future_rows)
          out=Path('/tmp/question-shards-future')
          future_manifest=builder.build(future_rows, grouped, out)

          assert future_manifest['shard_count']==manifest['shard_count']+1, future_manifest
          assert future_manifest['total_questions']==manifest['total_questions']+200, future_manifest
          assert (out/'116-1.json').exists()
          payload=json.loads((out/'116-1.json').read_text(encoding='utf-8'))
          assert payload['question_count']==200 and len(payload['questions'])==200
          print(json.dumps({
              'future_auto_expand_ok': True,
              'shards': future_manifest['shard_count'],
              'questions': future_manifest['total_questions'],
              'new_file': '116-1.json',
          }, ensure_ascii=False))
          PY

      - name: Upload shard artifact only
        uses: actions/upload-artifact@v4
        with:
          name: swsi-question-shards-preview
          path: /tmp/question-shards/
          if-no-files-found: error
          retention-days: 3
