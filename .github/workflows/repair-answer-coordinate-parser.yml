name: Repair MOEX answer coordinate parser

on:
  push:
    paths:
      - 'scripts/patch_answer_coordinate_parser.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install coordinate parser patch
        run: python scripts/patch_answer_coordinate_parser.py
      - name: Syntax check
        run: python -m py_compile scripts/moex_sync.py
      - name: Commit repaired parser
        run: |
          git config user.name 'swsi-moex-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/moex_sync.py
          if git diff --cached --quiet; then
            echo 'No parser changes.'
            exit 0
          fi
          git commit -m '改用PDF座標解析官方答案'
          git push
