name: Historical MOEX Answer Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/historical-answer-audit.yml'
      - 'scripts/historical_answer_audit.py'
      - 'scripts/historical_answer_audit_v2.py'
      - 'scripts/historical_answer_audit_v3.py'
      - 'scripts/historical_answer_audit_v4.py'

permissions:
  contents: write

concurrency:
  group: swsi-historical-answer-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf pdfplumber beautifulsoup4

      - name: Compare 4,800 answers and grading modes with MOEX final subject PDFs
        run: python scripts/historical_answer_audit_v4.py --output-dir audit_output

      - name: Save audit report in repository
        run: |
          set -euo pipefail
          mkdir -p audit
          cp audit_output/historical_answer_audit.json audit/
          cp audit_output/historical_answer_audit.md audit/
          git config user.name 'swsi-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audit/historical_answer_audit.json audit/historical_answer_audit.md
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
          else
            git commit -m '更新考選部歷屆答案與給分模式稽核報告'
            # 其他後端 workflow 可能在 audit 執行期間推進 main；先 rebase
            # 再 push，避免資料比對成功卻因 non-fast-forward 被標成紅燈。
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "push race on attempt $attempt; retrying..."
            done
            echo 'Unable to save audit report after 3 push attempts.' >&2
            exit 1
          fi

      - name: Upload read-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-answer-audit
          path: audit_output/
          if-no-files-found: warn
