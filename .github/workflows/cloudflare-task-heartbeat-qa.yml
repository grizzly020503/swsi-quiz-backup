name: Cloudflare Independent Task Heartbeat QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/wandering-wave-4418/*.js'
      - 'cloudflare/wandering-wave-4418/d1/**'
      - 'wrangler.jsonc'
      - 'data/ops_task_registry.v1.json'
      - 'scripts/cloudflare_task_heartbeat*'
      - '.github/workflows/cloudflare-task-heartbeat-qa.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/wandering-wave-4418/*.js'
      - 'wrangler.jsonc'
      - 'scripts/cloudflare_task_heartbeat*'
      - '.github/workflows/cloudflare-task-heartbeat-qa.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-task-heartbeat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - run: |
          node --check cloudflare/wandering-wave-4418/worker.js
          node --check cloudflare/wandering-wave-4418/entry.js
          node --check cloudflare/wandering-wave-4418/task-heartbeat.js
          node scripts/cloudflare_worker_smoke.js
          node scripts/cloudflare_task_heartbeat_selftest.js
          python3 scripts/cloudflare_task_heartbeat_sql_selftest.py
          python3 scripts/cloudflare_d1_recovery_smoke.py
  actual-schedule:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Observe scheduled Cloudflare execution (no trigger or writes)
        run: python3 scripts/cloudflare_task_heartbeat_live.py
