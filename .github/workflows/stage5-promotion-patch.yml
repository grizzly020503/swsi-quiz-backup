name: Stage 5 Promotion Resolver Patch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/stage5-promotion-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch Stage 3 shadow calibration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/historical_law_article_resolver.py')
          text = p.read_text(encoding='utf-8')
          old = '''            if explicit:\n                ranked = rank_articles(\n                    strip_explicit_article_refs(stem), law, articles, option_texts=option_texts\n                )\n                expected_rank = next(\n                    (i + 1 for i, row in enumerate(ranked) if row["article_no"] in explicit), None\n                )\n                controls.append({\n                    "law_name": law,\n                    "question_id": question.get("question_id") or question.get("id"),\n                    "expected_articles": explicit,\n                    "top_candidate": ranked[0]["article_no"] if ranked else None,\n                    "expected_rank": expected_rank,\n                    "top1_match": expected_rank == 1,\n                    "top3_match": bool(expected_rank and expected_rank <= 3),\n                    "used_options": bool(option_texts),\n                })\n                continue\n'''
          new = '''            if explicit:\n                ranked = rank_articles(\n                    strip_explicit_article_refs(stem), law, articles, option_texts=option_texts\n                )\n                expected_rank = next(\n                    (i + 1 for i, row in enumerate(ranked) if row["article_no"] in explicit), None\n                )\n                metadata_articles = extract_metadata_articles(question)\n                shadow_route, shadow_confidence, shadow_reason = classify_candidates(\n                    ranked, metadata_articles\n                )\n                shadow_false_machine = bool(\n                    shadow_route == "machine_candidate" and expected_rank != 1\n                )\n                controls.append({\n                    "law_name": law,\n                    "question_id": question.get("question_id") or question.get("id"),\n                    "expected_articles": explicit,\n                    "top_candidate": ranked[0]["article_no"] if ranked else None,\n                    "expected_rank": expected_rank,\n                    "top1_match": expected_rank == 1,\n                    "top3_match": bool(expected_rank and expected_rank <= 3),\n                    "used_options": bool(option_texts),\n                    "metadata_articles": metadata_articles,\n                    "shadow_route": shadow_route,\n                    "shadow_confidence": shadow_confidence,\n                    "shadow_decision_reason": shadow_reason,\n                    "shadow_false_machine_candidate": shadow_false_machine,\n                })\n                continue\n'''
          if 'shadow_false_machine_candidate' not in text:
              if old not in text:
                  raise SystemExit('Stage 3 explicit-control block not found')
              text = text.replace(old, new, 1)

          old2 = '''    control_top1 = sum(bool(row["top1_match"]) for row in controls)\n    control_top3 = sum(bool(row["top3_match"]) for row in controls)\n'''
          new2 = '''    control_top1 = sum(bool(row["top1_match"]) for row in controls)\n    control_top3 = sum(bool(row["top3_match"]) for row in controls)\n    control_shadow_machine = sum(\n        row.get("shadow_route") == "machine_candidate" for row in controls\n    )\n    control_false_machine = sum(\n        bool(row.get("shadow_false_machine_candidate")) for row in controls\n    )\n'''
          if 'control_false_machine = sum(' not in text:
              if old2 not in text:
                  raise SystemExit('Stage 3 control-count block not found')
              text = text.replace(old2, new2, 1)

          old3 = '''        "explicit_control_top1_match_count": control_top1,\n        "explicit_control_top3_match_count": control_top3,\n'''
          new3 = '''        "explicit_control_top1_match_count": control_top1,\n        "explicit_control_top3_match_count": control_top3,\n        "explicit_control_shadow_machine_candidate_count": control_shadow_machine,\n        "explicit_control_false_machine_candidate_count": control_false_machine,\n'''
          if '"explicit_control_false_machine_candidate_count": control_false_machine' not in text:
              if old3 not in text:
                  raise SystemExit('Stage 3 report-count block not found')
              text = text.replace(old3, new3, 1)

          old4 = '''        "explicit_control_top1_match_count": report["explicit_control_top1_match_count"],\n        "explicit_control_top3_match_count": report["explicit_control_top3_match_count"],\n'''
          new4 = '''        "explicit_control_top1_match_count": report["explicit_control_top1_match_count"],\n        "explicit_control_top3_match_count": report["explicit_control_top3_match_count"],\n        "explicit_control_shadow_machine_candidate_count": report["explicit_control_shadow_machine_candidate_count"],\n        "explicit_control_false_machine_candidate_count": report["explicit_control_false_machine_candidate_count"],\n'''
          if 'report["explicit_control_false_machine_candidate_count"]' not in text:
              if old4 not in text:
                  raise SystemExit('Stage 3 print-count block not found')
              text = text.replace(old4, new4, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit resolver patch
        shell: bash
        run: |
          if git diff --quiet -- scripts/historical_law_article_resolver.py; then
            echo 'No resolver patch needed.'
            exit 0
          fi
          git config user.name 'swsi-data-guardian-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/historical_law_article_resolver.py
          git commit -m 'feat: add Stage 3 shadow calibration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
