name: Cloudflare Production Artifact QA

on:
  pull_request:
    paths:
      - 'cdn/index.html'
      - 'cdn/monthly_patch.js'
      - 'cdn/sw.js'
      - 'scripts/cloudflare_release_artifact_smoke.py'
      - '.github/workflows/cloudflare-production-artifact-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'cdn/index.html'
      - 'cdn/monthly_patch.js'
      - 'cdn/sw.js'
      - 'scripts/cloudflare_release_artifact_smoke.py'
      - '.github/workflows/cloudflare-production-artifact-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swsi-cloudflare-production-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile scripts/cloudflare_release_artifact_smoke.py
      - name: Verify tracked production artifacts
        run: python scripts/cloudflare_release_artifact_smoke.py
