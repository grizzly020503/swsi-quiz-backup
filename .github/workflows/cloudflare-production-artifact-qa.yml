name: Cloudflare Production Artifact QA

on:
  pull_request:
    paths:
      - 'cdn/index.html'
      - 'cdn/monthly_patch.js'
      - 'cdn/sw.js'
      - 'cdn/_headers'
      - 'cdn/question-shards/**'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'wrangler.jsonc'
      - 'scripts/cloudflare_release_artifact_smoke.py'
      - 'scripts/cloudflare_production_http_smoke.py'
      - 'scripts/cloudflare_live_browser_smoke.js'
      - '.github/workflows/cloudflare-production-artifact-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'cdn/index.html'
      - 'cdn/monthly_patch.js'
      - 'cdn/sw.js'
      - 'cdn/_headers'
      - 'cdn/question-shards/**'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'wrangler.jsonc'
      - 'scripts/cloudflare_release_artifact_smoke.py'
      - 'scripts/cloudflare_production_http_smoke.py'
      - 'scripts/cloudflare_live_browser_smoke.js'
      - '.github/workflows/cloudflare-production-artifact-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swsi-cloudflare-production-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          python -m py_compile scripts/cloudflare_release_artifact_smoke.py
          python -m py_compile scripts/cloudflare_production_http_smoke.py
      - name: Verify tracked production artifacts
        run: python scripts/cloudflare_release_artifact_smoke.py
      - name: Decide live production check
        id: live
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$GITHUB_BASE_REF"
          if git diff --quiet "origin/$GITHUB_BASE_REF...HEAD" -- \
            cdn/index.html \
            cdn/monthly_patch.js \
            cdn/sw.js \
            cdn/_headers \
            cdn/question-shards \
            cloudflare/wandering-wave-4418/worker.js \
            wrangler.jsonc; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping live parity before deployment-sensitive Cloudflare changes are merged.'
          fi
      - name: Verify hosted Cloudflare production parity
        if: steps.live.outputs.run == 'true'
        run: python scripts/cloudflare_production_http_smoke.py --check "$GITHUB_RUN_ID"

  live-browser-acceptance:
    # Live website checks are read-only and never deploy or modify private data.
    # On PR, this tests the CURRENT hosted site, not unmerged CDN source.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user 1001
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Playwright and verify shipped browser binaries
        timeout-minutes: 5
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          node -e 'const fs=require("fs"),pw=require("playwright");if(require("playwright/package.json").version!=="1.55.0")throw Error("Playwright version drift");for(const name of ["chromium","webkit"])if(!fs.existsSync(pw[name].executablePath()))throw Error(name+" missing")'
      - name: Verify live Cloudflare mobile, desktop, iPhone and 10-question navigation
        run: |
          set -euo pipefail
          node --check scripts/cloudflare_live_browser_smoke.js
          node scripts/cloudflare_live_browser_smoke.js
