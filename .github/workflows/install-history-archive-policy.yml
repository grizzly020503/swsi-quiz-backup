name: 安裝十年主題庫與歷史題庫策略

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/install_history_archive_policy.py'
      - '.github/workflows/install-history-archive-policy.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 套用歷史題庫策略
        run: python .github/scripts/install_history_archive_policy.py

      - name: 檢查 JavaScript 語法
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          parts=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower():
                  parts.append(m.group(2))
          Path('/tmp/swsi-inline.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/swsi-inline.js

      - name: 提交更新
        run: |
          if git diff --quiet; then
            echo '沒有需要更新的內容'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '建立十年主題庫與歷史題庫分流'
          git push
