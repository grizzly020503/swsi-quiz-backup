name: TEMP Install Current Affairs UI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

concurrency:
  group: temp-current-affairs-ui-install
  cancel-in-progress: true

jobs:
  install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install live radar UI
        run: |
          python scripts/install_current_affairs_ui.py
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<!-- SWSI CURRENT AFFAIRS RADAR V1 -->'
          if marker not in text:
              raise SystemExit('current-affairs UI marker missing')
          segment = text.split(marker, 1)[1]
          m = re.search(r'<script>(.*?)</script>', segment, re.S)
          if not m:
              raise SystemExit('current-affairs UI script missing')
          Path('/tmp/current-affairs-ui.js').write_text(m.group(1), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/current-affairs-ui.js'], check=True)
          print('Current-affairs UI syntax OK.')
          PY

      - name: Commit installed UI to main
        run: |
          git config user.name 'swsi-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'UI already installed.'
            exit 0
          fi
          git commit -m '安裝既有時事庫最新雷達介面'
          git push origin HEAD:main
