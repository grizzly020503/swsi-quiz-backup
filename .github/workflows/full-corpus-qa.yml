name: Full Corpus Question QA

on:
  workflow_dispatch:
  schedule:
    # 長期低成本基線：每月 1 日 03:47 UTC 跑一次完整 manifest。
    - cron: '47 3 1 * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/full-corpus-qa.yml'
      - 'scripts/full_corpus_qa.py'
      - 'scripts/exam_scheme.py'
      - 'scripts/exam_scheme_qa_policy.py'
      - 'scripts/unified_question_qa.py'
      - 'scripts/unified_question_qa_current.py'
      - 'scripts/unified_question_qa_selftest.py'
      - 'scripts/official_exam_readonly_guard.py'
      - 'scripts/build_question_shards.py'
      - 'scripts/historical_source_url_guard.py'
      - 'scripts/historical_source_url_guard_selftest.py'
      - 'scripts/historical_source_url_repair_plan.py'
      - 'scripts/historical_source_url_repair_plan_selftest.py'
      - 'scripts/official_live_snapshot_parity.py'
      - 'scripts/official_live_snapshot_parity_selftest.py'
      - 'scripts/moex_essay_extraction_probe.py'
      - 'scripts/moex_essay_extraction_probe_selftest.py'
      - 'data/moex_source_subjects.v1.json'
      - 'data/exam_scheme_registry.v1.json'
      - 'data/question_qa_policy_v1.json'
      - 'data/official_exam_readonly.lock.json'
      - 'cdn/question-shards/**'
      - 'index.html'
      - 'auto/essays_auto.json'
  pull_request:
    paths:
      - '.github/workflows/full-corpus-qa.yml'
      - 'scripts/full_corpus_qa.py'
      - 'scripts/exam_scheme.py'
      - 'scripts/exam_scheme_qa_policy.py'
      - 'scripts/unified_question_qa.py'
      - 'scripts/unified_question_qa_current.py'
      - 'scripts/unified_question_qa_selftest.py'
      - 'scripts/official_exam_readonly_guard.py'
      - 'scripts/build_question_shards.py'
      - 'scripts/historical_source_url_guard.py'
      - 'scripts/historical_source_url_guard_selftest.py'
      - 'scripts/historical_source_url_repair_plan.py'
      - 'scripts/historical_source_url_repair_plan_selftest.py'
      - 'scripts/official_live_snapshot_parity.py'
      - 'scripts/official_live_snapshot_parity_selftest.py'
      - 'scripts/moex_essay_extraction_probe.py'
      - 'scripts/moex_essay_extraction_probe_selftest.py'
      - 'data/moex_source_subjects.v1.json'
      - 'data/exam_scheme_registry.v1.json'
      - 'data/question_qa_policy_v1.json'
      - 'data/official_exam_readonly.lock.json'
      - 'cdn/question-shards/**'
      - 'index.html'
      - 'auto/essays_auto.json'

permissions:
  contents: read

concurrency:
  group: swsi-full-corpus-question-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-corpus:
    name: Audit every manifest exam session
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile QA scripts
        run: |
          python -m py_compile scripts/full_corpus_qa.py
          python -m py_compile scripts/exam_scheme.py
          python -m py_compile scripts/exam_scheme_qa_policy.py
          python -m py_compile scripts/unified_question_qa.py
          python -m py_compile scripts/unified_question_qa_current.py
          python -m py_compile scripts/unified_question_qa_selftest.py
          python -m py_compile scripts/official_exam_readonly_guard.py

      - name: Run existing unified QA synthetic invariants
        run: python scripts/unified_question_qa_selftest.py

      - name: Verify immutable Official Core baseline
        run: python scripts/official_exam_readonly_guard.py

      - name: Prevent wrong-subject historic MOEX sources in rebuilt shards
        run: python scripts/historical_source_url_guard_selftest.py

      - name: Test official-source URL-only repair proposals (no writes)
        run: |
          python -m py_compile scripts/historical_source_url_repair_plan.py scripts/historical_source_url_repair_plan_selftest.py
          python scripts/historical_source_url_repair_plan_selftest.py
          python scripts/official_live_snapshot_parity_selftest.py

      - name: Test MOEX official essay parser failure diagnosis (synthetic, read only)
        run: |
          python -m py_compile scripts/moex_essay_extraction_probe.py scripts/moex_essay_extraction_probe_selftest.py
          python scripts/moex_essay_extraction_probe_selftest.py

      - name: One-off 108-2 immutable MOEX essay source probe (PR diagnostics only)
        if: github.event_name == 'pull_request' && github.head_ref == 'qa/sha-bound-moex-essay-parser-diagnostic-20261031'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pypdf==5.9.0' 'pdfplumber==0.11.6' 'requests==2.32.5'
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import urllib.request
          import hashlib
          from scripts.moex_essay_extraction_probe import registry_row
          row = registry_row("108-2", "社會工作研究方法")
          url = row["url"]
          u = urlsplit(url)
          if u.scheme != "https" or u.hostname != "wwwq.moex.gov.tw" or u.username or u.password or u.path != "/exam/wHandExamQandA_File.ashx":
              raise ValueError("wrong official source URL")
          class OfficialOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  r = urlsplit(newurl)
                  if r.scheme != "https" or r.hostname != "wwwq.moex.gov.tw" or r.username or r.password or r.path != "/exam/wHandExamQandA_File.ashx":
                      raise ValueError("official PDF redirected outside trusted host/path")
                  return super().redirect_request(request, fp, code, msg, headers, newurl)
          req = urllib.request.Request(url, headers={"User-Agent": "SWSI-official-essay-diagnostic/1.0"})
          with urllib.request.build_opener(OfficialOnly()).open(req, timeout=20) as response:
              raw = response.read(15 * 1024 * 1024 + 1)
          observed = hashlib.sha256(raw).hexdigest()
          print("OFFICIAL_PDF_OBSERVED_SHA256="+observed, flush=True)
          print("OFFICIAL_PDF_PINNED_SHA256="+row["pdf_sha256"], flush=True)
          if len(raw)>15*1024*1024 or not raw.startswith(b"%PDF-") or observed != row["pdf_sha256"]:
              raise ValueError("official PDF raw bytes mismatch pinned source; no parsing")
          Path("/tmp/swsi-108-2-official.pdf").write_bytes(raw)
          PY
          set +e
          python scripts/moex_essay_extraction_probe.py \
            --pdf /tmp/swsi-108-2-official.pdf \
            --session 108-2 --subject '社會工作研究方法' \
            --out /tmp/swsi-108-2-essay-probe.json
          rc=$?
          set -e
          echo "OFFICIAL_PDF_PARSER_DIAGNOSTIC_EXIT=$rc"
          python - <<'PY'
          import re
          from pathlib import Path
          import moex_sync
          raw=Path('/tmp/swsi-108-2-official.pdf').read_bytes()
          txt=moex_sync.pdf_text(raw)
          start=txt.find('甲、申論題部分')
          stop=txt.find('乙、測驗題部分')
          section=moex_sync.strip_headers(txt[start+len('甲、申論題部分'):stop])
          candidates=list(re.finditer(r'([一二])、',section))
          print('OFFICIAL_PDF_RAW_ESSAY_MARKERS',[(m.group(1),m.start(),repr(section[max(0,m.start()-35):m.end()+18])) for m in candidates],flush=True)
          print('OFFICIAL_PDF_BOUNDARY_SEGMENT_SCORE_FLAGS',[
              bool(re.search(r'[（(]\\s*\\d+\\s*分\\s*[）)]',section[candidates[i].end():(candidates[i+1].start() if i+1<len(candidates) else len(section))]))
              for i in range(len(candidates))
          ],flush=True)
          PY
          if [ "$rc" -gt 2 ]; then exit "$rc"; fi

      - name: Preserve one-off 108-2 essay diagnostic evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'qa/sha-bound-moex-essay-parser-diagnostic-20261031'
        uses: actions/upload-artifact@v4
        with:
          name: moex-108-2-essay-verified-diagnostic
          path: /tmp/swsi-108-2-essay-probe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Audit all manifest sessions through effective exam profiles
        run: |
          set +e
          python scripts/full_corpus_qa.py \
            --out /tmp/full-corpus-question-qa.json \
            --fail-on blocked > /tmp/full-corpus-question-qa.log 2>&1
          rc=$?
          cat /tmp/full-corpus-question-qa.log
          exit "$rc"

      - name: Monthly READ-ONLY production source URL drift audit
        # A failure in offline full-corpus QA must not silently suppress the
        # independent monthly live diagnostics. Cancelled jobs remain stopped.
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        run: |
          python -m pip install --disable-pip-version-check 'requests==2.32.5'
          python scripts/historical_source_url_repair_plan.py \
            --live --out /tmp/swsi-source-url-repair-proposals.json \
            --core-parity-out /tmp/swsi-live-official-core-parity.json \
            --fail-on-proposals --fail-on-core-drift

      - name: Preserve monthly source URL audit candidates
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: monthly-moex-source-url-review
          path: |
            /tmp/swsi-source-url-repair-proposals.json
            /tmp/swsi-live-official-core-parity.json
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize monthly source URL drift
        if: always() && github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          url_path=Path('/tmp/swsi-source-url-repair-proposals.json')
          core_path=Path('/tmp/swsi-live-official-core-parity.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('## Monthly public official-core audits (read only)\n\n')
              if url_path.exists():
                  url=json.loads(url_path.read_text(encoding='utf-8'))
                  f.write(f"- Verified papers: {url['verified_papers']}\n")
                  f.write(f"- Checked historic questions: {url['historical_rows_checked']}\n")
                  f.write(f"- Official URL repair proposals: **{url['proposed_url_changes']}**\n")
              else:
                  f.write('- Official URL proof: **FAILED / report unavailable**; inspect source gate.\n')
              if core_path.exists():
                  core=json.loads(core_path.read_text(encoding='utf-8'))
                  f.write(f"- Git-to-live Official Core parity: **{core['status']}**\n")
                  f.write(f"- Official wording discrepancies: **{core['summary']['official_wording_drift']}**\n")
                  f.write(f"- Grading discrepancies: **{core['summary']['grading_drift']}**\n")
                  f.write(f"- Missing/unpublished question IDs: {core['summary']['missing_live']}/{core['summary']['unpublished_live']}\n")
              else:
                  f.write('- Official Core parity: **FAILED / report unavailable**; inspect live API and local manifest.\n')
              f.write('- Reports are diagnostic only; no automated official-core or answer modifications.\n')
          PY

      - name: Publish compact job summary
        if: always()
        run: |
          if [ ! -f /tmp/full-corpus-question-qa.json ]; then
            echo '## SWSI full-corpus QA' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '- report was not produced' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path('/tmp/full-corpus-question-qa.json').read_text(encoding='utf-8'))
          s=report['summary']
          profiles=sorted({str(row.get('exam_scheme_profile') or '') for row in report.get('sessions',[]) if row.get('exam_scheme_profile')})
          lines=[
              '## SWSI full-corpus QA',
              '',
              f"- dataset revision: `{report.get('dataset_revision')}`",
              f"- exam-scheme profiles: `{json.dumps(profiles, ensure_ascii=False)}`",
              f"- audited sessions: **{report['audited_sessions']} / {report['manifest_shard_count']}**",
              f"- MCQ audited: **{s['total_mcq']}**",
              f"- essays audited: **{s['total_essays']}** (canonical source: {report['canonical_essay_source_count']})",
              f"- total audited items: **{s['total_items']}**",
              f"- official blocked: **{s['official_blocked']}**",
              f"- manual/enrichment review queue signals: **{s['manual_review_queue_count']}**",
              f"- manifest integrity: **{'OK' if s['manifest_integrity_ok'] else 'FAILED'}**",
              '',
              '> Artifact is diagnostic evidence only; it is not the long-term evidence store required by Issue #262.',
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-question-qa
          path: /tmp/full-corpus-question-qa.json
          if-no-files-found: ignore
          retention-days: 14
