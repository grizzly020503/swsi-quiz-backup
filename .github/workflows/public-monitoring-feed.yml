name: Public Monitoring Feed

on:
  workflow_dispatch:
  schedule:
    # 每 6 小時掃描一次社工／社福時事；比完整題庫同步輕量，避免每小時浪費 Actions 額度。
    - cron: '15 */6 * * *'
  workflow_run:
    # MOEX sync 使用 GITHUB_TOKEN 推資料 commit；GitHub 不會讓該 commit 再觸發一般 push workflow。
    # 只監聽 MOEX：Question Shards 本身已由 MOEX 完成事件觸發，再監聽 shards 會讓同一輪監測重跑兩次。
    workflows:
      - MOEX Social Worker Exam Sync
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      # 來源 registry／監測分析程式／MOEX-MOJ 內部報告一進 main 就立即重建公開快照；
      # 不監聽 auto/*.json 輸出，避免 monitoring bot 的 snapshot commit 再觸發自己。
      - '.github/workflows/public-monitoring-feed.yml'
      - 'data/current_affairs_sources.json'
      - 'data/legal_watch_report.json'
      - 'scripts/current_affairs_watch.py'
      - 'scripts/current_affairs_taxonomy.py'
      - 'scripts/social_work_knowledge_tree.py'
      - 'scripts/social_work_knowledge_tree_smoke.py'
      - 'scripts/current_affairs_sources_smoke.py'
      - 'scripts/current_affairs_supabase_sync_smoke.py'
      - 'supabase/functions/sync-current-affairs/index.ts'
      - 'scripts/build_current_affairs_snapshot.py'
      - 'scripts/current_affairs_snapshot_smoke.py'
      - 'scripts/current_affairs_event_cluster.py'
      - 'scripts/build_current_affairs_events_snapshot.py'
      - 'scripts/build_current_affairs_trends_snapshot.py'
      - 'scripts/analyze_current_affairs_signals.py'
      - 'scripts/build_current_affairs_signals_snapshot.py'
      - 'scripts/build_public_legal_watch_snapshot.py'
      - 'scripts/public_monitoring_v2_smoke.py'
  pull_request:
    paths:
      - '.github/workflows/public-monitoring-feed.yml'
      - '.github/workflows/moex-social-worker-sync.yml'
      - 'data/current_affairs_sources.json'
      - 'scripts/current_affairs_watch.py'
      - 'scripts/current_affairs_taxonomy.py'
      - 'scripts/social_work_knowledge_tree.py'
      - 'scripts/social_work_knowledge_tree_smoke.py'
      - 'scripts/current_affairs_sources_smoke.py'
      - 'scripts/current_affairs_supabase_sync_smoke.py'
      - 'supabase/functions/sync-current-affairs/index.ts'
      - 'scripts/build_current_affairs_snapshot.py'
      - 'scripts/current_affairs_snapshot_smoke.py'
      - 'scripts/current_affairs_event_cluster.py'
      - 'scripts/build_current_affairs_events_snapshot.py'
      - 'scripts/build_current_affairs_trends_snapshot.py'
      - 'scripts/current_affairs_events_smoke.py'
      - 'scripts/analyze_current_affairs_signals.py'
      - 'scripts/build_current_affairs_signals_snapshot.py'
      - 'scripts/current_affairs_signals_smoke.py'
      - 'scripts/current_affairs_ui_smoke.js'
      - 'scripts/install_current_affairs_ui.py'
      - 'scripts/build_public_legal_watch_snapshot.py'
      - 'scripts/public_monitoring_v2_smoke.py'
      - 'monthly_patch_parts/89.public-branding-info.part'
      - 'auto/current_affairs.json'
      - 'auto/current_affairs_signals.json'
      - 'auto/current_affairs_events.json'
      - 'auto/current_affairs_trends.json'
      - 'cdn/question-shards/**'
      - 'auto/legal_watch.json'
      - 'auto/health.json'
      - 'auto/sync_state.json'

permissions:
  contents: write

concurrency:
  group: swsi-public-monitoring-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitoring-feed:
    # workflow_run 事件若上游失敗，直接略過整個 job；避免仍花分鐘掃 RSS／重建 snapshots。
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # workflow_run 的 GITHUB_SHA 不代表被監聽 workflow 最後 push 的資料 commit；
          # 明確讀最新 main，確保拿到 MOEX/MOJ sync 剛寫入的 report/state。
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install RSS parser
        run: python -m pip install --disable-pip-version-check feedparser

      - name: Scan social-work current affairs
        if: github.event_name != 'pull_request'
        run: python scripts/current_affairs_watch.py --output /tmp/current_affairs_payload.json --days 21

      - name: Sync current-affairs candidates to Supabase
        id: current_affairs_supabase
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          CURRENT_AFFAIRS_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/sync-current-affairs
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -X POST "$CURRENT_AFFAIRS_URL" \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/current_affairs_payload.json
          echo

      - name: Build privacy-safe public snapshots
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python scripts/build_current_affairs_snapshot.py \
            --input /tmp/current_affairs_payload.json \
            --output auto/current_affairs.json \
            --limit 30
          python scripts/build_current_affairs_signals_snapshot.py \
            --input auto/current_affairs.json \
            --questions-csv data/questions_master_backup_20260824_2220.csv \
            --output auto/current_affairs_signals.json \
            --limit 30
          python scripts/build_current_affairs_events_snapshot.py \
            --news auto/current_affairs.json \
            --signals auto/current_affairs_signals.json \
            --output auto/current_affairs_events.json \
            --limit 30
          python scripts/build_current_affairs_trends_snapshot.py \
            --events auto/current_affairs_events.json \
            --output auto/current_affairs_trends.json \
            --limit 30
          python scripts/build_public_legal_watch_snapshot.py \
            --input data/legal_watch_report.json \
            --output auto/legal_watch.json

          mkdir -p cdn/auto
          cp auto/current_affairs.json cdn/auto/current_affairs.json
          cp auto/current_affairs_signals.json cdn/auto/current_affairs_signals.json
          cp auto/current_affairs_events.json cdn/auto/current_affairs_events.json
          cp auto/current_affairs_trends.json cdn/auto/current_affairs_trends.json
          cp auto/legal_watch.json cdn/auto/legal_watch.json
          cp auto/health.json cdn/auto/health.json
          cp auto/sync_state.json cdn/auto/sync_state.json

      - name: Rebuild deterministic monitoring contracts for PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/swsi-monitoring-pr
          python scripts/build_current_affairs_signals_snapshot.py \
            --input auto/current_affairs.json \
            --questions-csv data/questions_master_backup_20260824_2220.csv \
            --output /tmp/swsi-monitoring-pr/current_affairs_signals.json \
            --limit 30
          # Event clustering intentionally carries forward observation history
          # from the previous public snapshot. Seed the isolated output with the
          # tracked event state so this reproduces the production builder contract.
          cp auto/current_affairs_events.json /tmp/swsi-monitoring-pr/current_affairs_events.json
          python scripts/build_current_affairs_events_snapshot.py \
            --news auto/current_affairs.json \
            --signals /tmp/swsi-monitoring-pr/current_affairs_signals.json \
            --output /tmp/swsi-monitoring-pr/current_affairs_events.json \
            --limit 30
          python scripts/build_current_affairs_trends_snapshot.py \
            --events /tmp/swsi-monitoring-pr/current_affairs_events.json \
            --output /tmp/swsi-monitoring-pr/current_affairs_trends.json \
            --limit 30
          python scripts/build_public_legal_watch_snapshot.py \
            --input data/legal_watch_report.json \
            --output /tmp/swsi-monitoring-pr/legal_watch.json

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          tmp = Path('/tmp/swsi-monitoring-pr')
          pairs = [
              ('current_affairs_signals.json', 'auto/current_affairs_signals.json'),
              ('current_affairs_events.json', 'auto/current_affairs_events.json'),
              ('current_affairs_trends.json', 'auto/current_affairs_trends.json'),
              ('legal_watch.json', 'auto/legal_watch.json'),
          ]
          for generated, tracked in pairs:
              a = json.loads((tmp / generated).read_text(encoding='utf-8'))
              b = json.loads((root / tracked).read_text(encoding='utf-8'))

              # Snapshot builders stamp the rebuild time. PR verification is about
              # deterministic content/contract, not reproducing the historical
              # timestamp of the committed snapshot.
              a.pop('generated_at', None)
              b.pop('generated_at', None)

              if a != b:
                  raise SystemExit(
                      f'PR deterministic snapshot drift: {generated} != {tracked}. '
                      'Update the tracked snapshot in the same PR if the builder change is intentional.'
                  )
              print(f'PR DETERMINISTIC SNAPSHOT OK: {tracked}')
          PY

      - name: Validate current-affairs UI installer
        if: github.event_name == 'pull_request'
        run: |
          python scripts/install_current_affairs_ui.py
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<!-- SWSI CURRENT AFFAIRS RADAR V1 -->'
          if marker not in text:
            raise SystemExit('current-affairs UI marker missing')
          segment = text.split(marker, 1)[1]
          match = re.search(r'<script>(.*?)</script>', segment, re.S)
          if not match:
            raise SystemExit('current-affairs UI script missing')
          Path('/tmp/current-affairs-ui.js').write_text(match.group(1), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/current-affairs-ui.js'], check=True)
          print('Current-affairs UI JavaScript syntax OK.')
          PY
          node scripts/current_affairs_ui_smoke.js

      - name: Five-radar contract smoke
        run: |
          python -m py_compile \
            scripts/current_affairs_watch.py \
            scripts/current_affairs_taxonomy.py \
            scripts/social_work_knowledge_tree.py \
            scripts/social_work_knowledge_tree_smoke.py \
            scripts/current_affairs_sources_smoke.py \
            scripts/current_affairs_supabase_sync_smoke.py \
            scripts/build_current_affairs_snapshot.py \
            scripts/current_affairs_snapshot_smoke.py \
            scripts/current_affairs_event_cluster.py \
            scripts/build_current_affairs_events_snapshot.py \
            scripts/build_current_affairs_trends_snapshot.py \
            scripts/current_affairs_events_smoke.py \
            scripts/build_public_legal_watch_snapshot.py \
            scripts/public_monitoring_v2_smoke.py
          python scripts/social_work_knowledge_tree_smoke.py
          python scripts/current_affairs_snapshot_smoke.py
          python scripts/current_affairs_sources_smoke.py
          python scripts/current_affairs_supabase_sync_smoke.py
          python scripts/public_monitoring_v2_smoke.py
          python scripts/current_affairs_signals_smoke.py
          python scripts/current_affairs_events_smoke.py
          git diff --check

      - name: Publish changed monitoring snapshots
        if: >
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') ||
          (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          git config user.name 'swsi-monitoring-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            auto/current_affairs.json auto/current_affairs_signals.json \
            auto/current_affairs_events.json auto/current_affairs_trends.json auto/legal_watch.json \
            cdn/auto/current_affairs.json cdn/auto/current_affairs_signals.json \
            cdn/auto/current_affairs_events.json cdn/auto/current_affairs_trends.json cdn/auto/legal_watch.json \
            cdn/auto/health.json cdn/auto/sync_state.json
          if git diff --cached --quiet; then
            echo 'Public monitoring snapshots unchanged.'
            exit 0
          fi
          git commit -m '更新 SWSI 五大監測公開快照'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "monitoring snapshot push race on attempt $attempt; retrying..."
          done
          echo 'Unable to publish monitoring snapshots after 3 attempts.' >&2
          exit 1

      - name: Fail visibly if current-affairs Supabase sync failed
        if: github.event_name != 'pull_request' && steps.current_affairs_supabase.outcome != 'success'
        run: |
          echo '::error::Current-affairs public snapshots were allowed to rebuild/publish, but the Supabase candidate sync failed.'
          exit 1
