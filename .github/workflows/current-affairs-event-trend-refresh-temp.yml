name: Temporary Current Affairs Event Trend Refresh

on:
  pull_request:
    paths:
      - '.github/workflows/current-affairs-event-trend-refresh-temp.yml'
      - 'scripts/build_current_affairs_events_snapshot.py'
      - 'scripts/build_current_affairs_trends_snapshot.py'
      - 'auto/current_affairs_signals.json'
      - 'auto/current_affairs_events.json'
      - 'auto/current_affairs_trends.json'

permissions:
  contents: read

concurrency:
  group: swsi-temp-event-trend-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild event and trend snapshots
        run: |
          set -euo pipefail
          mkdir -p /tmp/swsi-event-trend
          cp auto/current_affairs_events.json /tmp/swsi-event-trend/current_affairs_events.json
          python scripts/build_current_affairs_events_snapshot.py \
            --news auto/current_affairs.json \
            --signals auto/current_affairs_signals.json \
            --output /tmp/swsi-event-trend/current_affairs_events.json \
            --limit 30
          python scripts/build_current_affairs_trends_snapshot.py \
            --events /tmp/swsi-event-trend/current_affairs_events.json \
            --output /tmp/swsi-event-trend/current_affairs_trends.json \
            --limit 30

      - name: Verify law-link evidence propagation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          events = json.loads(Path('/tmp/swsi-event-trend/current_affairs_events.json').read_text(encoding='utf-8'))['events']
          trends = json.loads(Path('/tmp/swsi-event-trend/current_affairs_trends.json').read_text(encoding='utf-8'))['trends']
          def find(rows, needle):
              return next((r for r in rows if needle in str(r.get('title') or '')), None)
          for rows, layer in ((events, 'events'), (trends, 'trends')):
              wage = find(rows, '最低工資連11漲')
              childcare = find(rows, '企業托育補助新制')
              if not wage or '最低工資法' not in (wage.get('related_laws') or []):
                  raise SystemExit(f'{layer}: minimum-wage law link missing')
              if not childcare or '性別平等工作法' not in (childcare.get('related_laws') or []):
                  raise SystemExit(f'{layer}: childcare law link missing')
              if childcare.get('law_link_status') != 'law_linked':
                  raise SystemExit(f'{layer}: childcare law-link status missing')
              if not childcare.get('related_policy_instruments'):
                  raise SystemExit(f'{layer}: childcare policy instrument missing')
              if not childcare.get('law_link_basis'):
                  raise SystemExit(f'{layer}: childcare law-link basis missing')
          print('Event/trend law-link evidence propagation: PASS')
          PY

      - name: Upload deterministic snapshots
        uses: actions/upload-artifact@v4
        with:
          name: current-affairs-event-trend-refresh
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/swsi-event-trend/current_affairs_events.json
            /tmp/swsi-event-trend/current_affairs_trends.json
