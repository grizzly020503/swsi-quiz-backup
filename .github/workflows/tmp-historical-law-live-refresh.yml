name: TEMP Historical Law Live Refresh

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-historical-law-live-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Build live MOJ provenance report
        run: |
          python scripts/build_historical_law_provenance_report.py \
            --output data/historical_law_provenance_priority10.v1.json
      - name: Validate report safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/historical_law_provenance_priority10.v1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['question_count'] == 86, d['question_count']
          assert d['law_count'] == 10, d['law_count']
          assert d['live_history_fetch'] is True
          assert all(q['historical_version_checked'] is False for q in d['questions'])
          assert all('official_answer' not in q for q in d['questions'])
          assert sum(d['status_counts'].values()) == 86
          assert d['law_fetch_error_count'] <= 10
          print('status_counts=', d['status_counts'])
          print('law_fetch_error_count=', d['law_fetch_error_count'])
          print('law_fetch_errors=', d['law_fetch_errors'])
          PY
      - name: Commit live report to PR branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'swsi-law-provenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/historical_law_provenance_priority10.v1.json
          if git diff --cached --quiet; then
            echo 'No report change'
            exit 0
          fi
          git commit -m 'data: refresh priority-law historical provenance report'
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
