name: MOEX Social Worker Exam Sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/moex-social-worker-sync.yml'
      - 'scripts/moex_sync.py'
      - 'scripts/build_auto_payload.py'
      - 'scripts/health_check.py'
      - 'scripts/moj_law_watch.py'
      - 'scripts/current_affairs_watch.py'
      - 'scripts/install_current_affairs_ui.py'
      - 'data/legal_watch_names.json'
  schedule:
    # 台灣時間每天 10:35（UTC 02:35）。國考與時事每日檢查；法規成功後 28 天才再抓，失敗至少隔 3 天再試。
    - cron: '35 2 * * *'

permissions:
  contents: write

concurrency:
  group: moex-social-worker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf pdfplumber feedparser

      - name: Install current-affairs live radar into existing library
        run: |
          python scripts/install_current_affairs_ui.py
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          marker = '<!-- SWSI CURRENT AFFAIRS RADAR V1 -->'
          if marker not in text:
              raise SystemExit('current-affairs UI marker missing after install')
          segment = text.split(marker, 1)[1]
          m = re.search(r'<script>(.*?)</script>', segment, re.S)
          if not m:
              raise SystemExit('current-affairs UI script missing')
          Path('/tmp/current-affairs-ui.js').write_text(m.group(1), encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/current-affairs-ui.js'], check=True)
          print('Current-affairs UI JavaScript syntax OK.')
          PY

      - name: Scan social-work current affairs
        id: current_affairs
        continue-on-error: true
        run: python scripts/current_affairs_watch.py --output /tmp/current_affairs_payload.json --days 21

      - name: Build public current-affairs snapshot
        if: steps.current_affairs.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path('/tmp/current_affairs_payload.json').read_text(encoding='utf-8'))
          items = []
          allowed = {
              'id','title','summary','source_name','source_url','published_at','region',
              'category','relevance_score','exam_tags','subjects'
          }
          for row in src.get('items', []):
              clean = {k: row.get(k) for k in allowed if k in row}
              clean['summary'] = str(clean.get('summary') or '')[:280]
              items.append(clean)
          public = {'schema_version': 1, 'items': items[:30]}
          out = Path('auto/current_affairs.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          old = None
          if out.exists():
              try:
                  old = json.loads(out.read_text(encoding='utf-8'))
              except Exception:
                  old = None
          if old == public:
              print('Public current-affairs snapshot unchanged.')
          else:
              out.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f"Public current-affairs snapshot updated: {len(items[:30])} items")
          PY

      - name: Sync current-affairs candidates to Supabase
        if: steps.current_affairs.outcome == 'success'
        continue-on-error: true
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          CURRENT_AFFAIRS_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/sync-current-affairs
        run: |
          curl --silent --show-error --fail-with-body \
            -X POST "$CURRENT_AFFAIRS_URL" \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/current_affairs_payload.json
          echo

      - name: Check official MOJ law changes
        id: law_watch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          force=''
          if [ '${{ github.event_name }}' != 'schedule' ]; then
            force='--force'
          fi
          python scripts/moj_law_watch.py \
            --watchlist data/legal_watch_names.json \
            --state data/legal_watch_state.json \
            --report data/legal_watch_report.json \
            --attempt-state data/legal_watch_attempt.json \
            $force
          if git status --porcelain -- data/legal_watch_state.json data/legal_watch_report.json | grep -q .; then
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'updated=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Send legal watch snapshot to Supabase
        if: steps.law_watch.outputs.updated == 'true'
        continue-on-error: true
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          LEGAL_WATCH_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/sync-legal-watch
        shell: bash
        run: |
          set -euo pipefail
          if curl --silent --show-error --fail-with-body \
            -X POST "$LEGAL_WATCH_URL" \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @data/legal_watch_report.json; then
            echo
            echo 'Official legal watch synced to Supabase.'
          else
            echo '::warning::Legal watch sync failed; restore monitoring files so a future run retries it.'
            for file in data/legal_watch_state.json data/legal_watch_report.json data/legal_watch_attempt.json; do
              if git cat-file -e "HEAD:$file" 2>/dev/null; then
                git restore --source=HEAD --worktree -- "$file"
              else
                rm -f "$file"
              fi
            done
          fi

      - name: Fetch official Social Worker exams
        # 每天重新抓當年度第一次/第二次官方 PDF，以便自動偵測後續更正答案。
        run: python scripts/moex_sync.py --output-dir incoming

      - name: Remove timestamp-only rewrites
        # fetched_at 改變不算題庫更新；只有題目、選項、答案或申論內容真的變動才留下差異。
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for p in sorted(Path('incoming').glob('[0-9][0-9][0-9][0-9][0-9][0-9].json')):
              try:
                  old_raw = subprocess.check_output(
                      ['git', 'show', f'HEAD:{p.as_posix()}'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  print(f'new official payload: {p}')
                  continue
              old = json.loads(old_raw)
              new = json.loads(p.read_text(encoding='utf-8'))
              old_cmp = dict(old)
              new_cmp = dict(new)
              old_cmp.pop('fetched_at', None)
              new_cmp.pop('fetched_at', None)
              if old_cmp == new_cmp:
                  p.write_text(old_raw, encoding='utf-8')
                  print(f'unchanged official content: {p}')
              else:
                  print(f'official content changed: {p}')
          PY

      - name: Build website backup payloads
        run: python scripts/build_auto_payload.py

      - name: Local question bank health check
        run: python scripts/health_check.py --local

      - name: Import only changed verified exams to Supabase
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          IMPORT_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/import-moex-social-worker
        run: |
          set -euo pipefail
          for file in incoming/[0-9][0-9][0-9][0-9][0-9][0-9].json; do
            [ -e "$file" ] || continue
            code="$(basename "$file" .json)"

            # 115030 已包含在原始 4600 題母庫；舊 ID 格式不同，禁止重複匯入。
            if [ "$code" = "115030" ]; then
              echo "Skip baseline exam $code"
              continue
            fi

            # tracked 修改或新檔案才匯入；官方內容沒變就不重複 upsert。
            if [ -z "$(git status --porcelain -- "$file")" ]; then
              echo "No official changes for $code; skip Supabase import"
              continue
            fi

            echo "Importing verified Social Worker exam $code"
            response="$(curl --silent --show-error --fail-with-body \
              -X POST "$IMPORT_URL" \
              -H "Authorization: Bearer $GH_REPO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$file")"
            echo "$response"
          done

      - name: Supabase health check
        # 驗證母庫總數，以及每個自動考次都必須是 200 題選擇＋10 題申論。
        run: python scripts/health_check.py --remote

      - name: Commit verified official payloads and monitoring snapshots
        run: |
          git config user.name 'swsi-moex-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html incoming/ auto/
          for file in data/legal_watch_state.json data/legal_watch_report.json data/legal_watch_attempt.json; do
            [ -f "$file" ] && git add "$file"
          done
          if git diff --cached --quiet; then
            echo 'No official, backup, current-affairs, or legal-watch changes.'
            exit 0
          fi
          git commit -m '更新官方考題、申論時事雷達與健康檢查備援'
          git push
