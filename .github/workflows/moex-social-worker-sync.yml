name: MOEX Social Worker Exam Sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/moex-social-worker-sync.yml'
      - 'scripts/moex_sync.py'
      - 'scripts/build_auto_payload.py'
  schedule:
    # 台灣時間每天 10:35（UTC 02:35），官方公布後自動檢查。
    - cron: '35 2 * * *'

permissions:
  contents: write

concurrency:
  group: moex-social-worker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf

      - name: Fetch only Professional Social Worker exams
        run: python scripts/moex_sync.py --skip-existing --output-dir incoming

      - name: Validate staged exam files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          allowed = {
              '社會工作',
              '社會工作直接服務',
              '社會政策與社會立法',
              '人類行為與社會環境',
              '社會工作研究方法',
          }
          for p in sorted(Path('incoming').glob('[0-9][0-9][0-9][0-9][0-9][0-9].json')):
              data = json.loads(p.read_text(encoding='utf-8'))
              if data.get('exam_type') != '專門職業及技術人員高等考試社會工作師':
                  raise SystemExit(f'{p}: exam_type 不符，拒絕提交')
              qs = data.get('questions', [])
              es = data.get('essays', [])
              if len(qs) != 200 or len(es) != 10:
                  raise SystemExit(f'{p}: 題數異常 MC={len(qs)} Essay={len(es)}')
              subjects = {q.get('subject') for q in qs}
              if subjects != allowed:
                  raise SystemExit(f'{p}: 科目集合異常 {subjects}')
              if any(q.get('source_exam_code') != data.get('exam_code') for q in qs):
                  raise SystemExit(f'{p}: source_exam_code 不一致')
              print(f'OK {p}: {len(qs)} MC + {len(es)} essays')
          PY

      - name: Import verified new exams to Supabase
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          IMPORT_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/import-moex-social-worker
        run: |
          set -euo pipefail
          for file in incoming/[0-9][0-9][0-9][0-9][0-9][0-9].json; do
            [ -e "$file" ] || continue
            code="$(basename "$file" .json)"
            # 115030 已存在原始 4600 題母庫；舊 ID 命名格式不同，禁止重複匯入。
            if [ "$code" = "115030" ]; then
              echo "Skip baseline exam $code"
              continue
            fi
            echo "Importing verified Social Worker exam $code"
            response="$(curl --silent --show-error --fail-with-body \
              -X POST "$IMPORT_URL" \
              -H "Authorization: Bearer $GH_REPO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$file")"
            echo "$response"
          done

      - name: Build website incremental question bank
        run: python scripts/build_auto_payload.py

      - name: Commit official exam payloads and website increment
        run: |
          git config user.name 'swsi-moex-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add incoming/ auto/
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m '更新考選部社工師增量題庫'
          git push
