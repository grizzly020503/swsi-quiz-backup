name: MOEX Social Worker Exam Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/moex-social-worker-sync.yml'
      - 'scripts/moex_sync.py'
      - 'scripts/moex_sync_v2.py'
      - 'scripts/test_moex_grading_modes.py'
      - 'scripts/build_auto_payload.py'
      - 'scripts/health_check.py'
      - 'scripts/health_check_v2.py'
      - 'scripts/moex_workflow_ownership_smoke.py'
      - 'scripts/moj_law_watch.py'
      - 'data/legal_watch_names.json'
  schedule:
    # 零成本正常模式：台灣時間每週一 10:35（UTC 02:35）。
    # 國考資料平時低頻檢查；接近已知考試放榜／更正窗口時，用 workflow_dispatch
    # 手動加跑即可。時事掃描／Supabase candidate sync 由 Public Monitoring Feed 每 6 小時單一持有；
    # 法規本身仍有 min-days fail-soft 節流。
    - cron: '35 2 * * 1'

permissions:
  contents: write

concurrency:
  group: moex-social-worker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf pdfplumber feedparser

      - name: Unit-test official grading modes
        run: python scripts/test_moex_grading_modes.py

      - name: Verify MOEX workflow ownership
        run: python scripts/moex_workflow_ownership_smoke.py

      - name: Check official MOJ law changes
        id: law_watch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          force=''
          if [ '${{ github.event_name }}' != 'schedule' ]; then
            force='--force'
          fi
          python scripts/moj_law_watch.py \
            --watchlist data/legal_watch_names.json \
            --state data/legal_watch_state.json \
            --report data/legal_watch_report.json \
            --attempt-state data/legal_watch_attempt.json \
            --min-days 7 \
            $force
          if git status --porcelain -- data/legal_watch_state.json data/legal_watch_report.json | grep -q .; then
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          else
            echo 'updated=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Send legal watch snapshot to Supabase
        if: steps.law_watch.outputs.updated == 'true'
        continue-on-error: true
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          LEGAL_WATCH_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/sync-legal-watch
        shell: bash
        run: |
          set -euo pipefail
          if curl --silent --show-error --fail-with-body \
            -X POST "$LEGAL_WATCH_URL" \
            -H "Authorization: Bearer $GH_REPO_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @data/legal_watch_report.json; then
            echo
            echo 'Official legal watch synced to Supabase.'
          else
            echo '::warning::Legal watch sync failed; restore monitoring files so a future run retries it.'
            for file in data/legal_watch_state.json data/legal_watch_report.json data/legal_watch_attempt.json; do
              if git cat-file -e "HEAD:$file" 2>/dev/null; then
                git restore --source=HEAD --worktree -- "$file"
              else
                rm -f "$file"
              fi
            done
          fi

      - name: Fetch official Social Worker exams
        # 正常排程每週重新抓當年度第一次/第二次官方 PDF；已知發布／更正窗口可手動加跑。
        run: python scripts/moex_sync_v2.py --output-dir incoming

      - name: Remove timestamp-only rewrites
        # fetched_at 或既有普通題補 grading_mode=standard 不算官方內容更新。
        # 特殊給分題若缺 grading_mode 則不能猜，仍保留差異讓後續驗證/匯入處理。
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def comparable(payload):
              out = dict(payload)
              out.pop('fetched_at', None)
              questions = []
              for row in out.get('questions') or []:
                  q = dict(row)
                  if not str(q.get('grading_mode') or '').strip() and q.get('answer') != '一律給分':
                      q['grading_mode'] = 'standard'
                  questions.append(q)
              out['questions'] = questions
              return out

          for p in sorted(Path('incoming').glob('[0-9][0-9][0-9][0-9][0-9][0-9].json')):
              try:
                  old_raw = subprocess.check_output(
                      ['git', 'show', f'HEAD:{p.as_posix()}'],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  print(f'new official payload: {p}')
                  continue
              old = json.loads(old_raw)
              new = json.loads(p.read_text(encoding='utf-8'))
              if comparable(old) == comparable(new):
                  p.write_text(old_raw, encoding='utf-8')
                  print(f'unchanged official content: {p}')
              else:
                  print(f'official content changed: {p}')
          PY

      - name: Build website backup payloads
        run: python scripts/build_auto_payload.py

      - name: Local question bank health check
        run: python scripts/health_check_v2.py --local

      - name: Import only changed verified exams to Supabase
        env:
          GH_REPO_TOKEN: ${{ github.token }}
          IMPORT_URL: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/import-moex-social-worker
        run: |
          set -euo pipefail
          for file in incoming/[0-9][0-9][0-9][0-9][0-9][0-9].json; do
            [ -e "$file" ] || continue
            code="$(basename "$file" .json)"

            # 115030 已包含在原始 4600 題母庫；舊 ID 格式不同，禁止重複匯入。
            if [ "$code" = "115030" ]; then
              echo "Skip baseline exam $code"
              continue
            fi

            # tracked 修改或新檔案才匯入；官方內容沒變就不重複 upsert。
            if [ -z "$(git status --porcelain -- "$file")" ]; then
              echo "No official changes for $code; skip Supabase import"
              continue
            fi

            echo "Importing verified Social Worker exam $code"
            response="$(curl --silent --show-error --fail-with-body \
              -X POST "$IMPORT_URL" \
              -H "Authorization: Bearer $GH_REPO_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$file")"
            echo "$response"
          done

      - name: Supabase health check
        # 驗證母庫總數、每個自動考次完整性，以及 grading_mode 三態與一律給分語意一致。
        run: python scripts/health_check_v2.py --remote

      - name: Commit verified official payloads and owned state
        run: |
          set -euo pipefail
          git config user.name 'swsi-moex-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            incoming/ \
            auto/questions_auto.json auto/essays_auto.json \
            auto/sync_state.json auto/health.json
          for file in data/legal_watch_state.json data/legal_watch_report.json data/legal_watch_attempt.json; do
            [ -f "$file" ] && git add "$file"
          done
          if git diff --cached --quiet; then
            echo 'No official exam, backup, health, sync-state, or legal-watch changes.'
            exit 0
          fi
          git commit -m '更新官方考題與健康檢查備援'
          # 其他後端 workflow 可能同時更新 main；rebase 後再 push，避免 non-fast-forward 假失敗。
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push race on attempt $attempt; retrying..."
          done
          echo 'Unable to save MOEX monitoring updates after 3 push attempts.' >&2
          exit 1
