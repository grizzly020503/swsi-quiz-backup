name: Cloudflare Production Smoke 20260901

on:
  push:
    branches: [qa/cloudflare-production-smoke-20260901]
    paths: ['.github/workflows/cloudflare-production-smoke-20260901.yml']

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ORIGIN: https://wandering-wave-4418.c022050333.workers.dev
      FEEDBACK_ENDPOINT: https://yumjtrdctaxyczpspuyo.supabase.co/functions/v1/swsi-feedback
    steps:
      - name: Diagnose public root, PWA, Admin, privacy and shard manifest
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          curl --silent --show-error --fail --retry 3 "$ORIGIN/?smoke=$GITHUB_RUN_ID" -o /tmp/root.html || failed=1
          curl --silent --show-error --fail --retry 3 "$ORIGIN/manifest.json?smoke=$GITHUB_RUN_ID" -o /tmp/pwa.json || failed=1
          curl --silent --show-error --fail --retry 3 "$ORIGIN/sw.js?smoke=$GITHUB_RUN_ID" -o /tmp/sw.js || failed=1
          curl --silent --show-error --fail --retry 3 "$ORIGIN/admin/index.html?smoke=$GITHUB_RUN_ID" -o /tmp/admin.html || failed=1
          curl --silent --show-error --fail --retry 3 "$ORIGIN/question-shards/manifest.json?smoke=$GITHUB_RUN_ID" -o /tmp/questions.json || failed=1

          check_has() { if grep -qF "$2" "$1"; then echo "PASS has: $3"; else echo "FAIL missing: $3"; failed=1; fi; }
          check_absent() { if grep -qF "$2" "$1"; then echo "FAIL leaked: $3"; failed=1; else echo "PASS absent: $3"; fi; }

          check_has /tmp/root.html 'SWSI CLOUDFLARE PUBLIC SOFT LAUNCH' 'soft-launch marker'
          check_has /tmp/root.html '<meta name="robots" content="noindex,nofollow,noarchive">' 'noindex guard'
          check_has /tmp/root.html '<link rel="canonical" href="https://wandering-wave-4418.c022050333.workers.dev/">' 'canonical final origin'
          check_has /tmp/root.html 'const AI_PROXY_URL = "https://wandering-wave-4418.c022050333.workers.dev";' 'AI final origin'
          check_absent /tmp/root.html '蔡宇庭' 'third-party name'
          check_absent /tmp/root.html '老師提供的學長姐心得' 'third-party source marker'
          check_absent /tmp/root.html '資深學長姐的應考心得' 'third-party guide marker'
          check_has /tmp/admin.html '<title>SWSI 管理中心</title>' 'Admin title'
          check_absent /tmp/admin.html 'DEFAULT_ADMIN_EMAIL' 'default Admin identity marker'
          check_has /tmp/sw.js "const VERSION = 'v6'" 'Service Worker v6'

          python - <<'PY' || failed=1
          import json
          p=json.load(open('/tmp/pwa.json',encoding='utf-8'))
          q=json.load(open('/tmp/questions.json',encoding='utf-8'))
          print('PWA VALUES', {'start_url':p.get('start_url'),'scope':p.get('scope'),'display':p.get('display')})
          print('QUESTION VALUES', {'total_questions':q.get('total_questions'),'shard_count':q.get('shard_count'),'len_shards':len(q.get('shards',[]))})
          assert p.get('start_url')=='./'
          assert p.get('scope')=='./'
          assert p.get('display')=='standalone'
          assert int(q['total_questions'])==4800
          assert int(q['shard_count'])==24
          assert len(q['shards'])==24
          PY
          test "$failed" = '0'

      - name: Verify all 24 shards and grading invariants
        run: |
          python - <<'PY'
          import json, urllib.request, collections
          origin='https://wandering-wave-4418.c022050333.workers.dev'
          with urllib.request.urlopen(origin+'/question-shards/manifest.json?corpus=1', timeout=30) as r:
              m=json.load(r)
          rows=[]
          for shard in m['shards']:
              url=origin+'/question-shards/'+shard['file']+'?corpus=1'
              with urllib.request.urlopen(url, timeout=30) as r:
                  data=json.load(r)
              if isinstance(data,list): qs=data
              elif isinstance(data,dict): qs=data.get('questions', data.get('items', []))
              else: raise AssertionError((shard['file'], type(data)))
              assert len(qs)==int(shard['question_count']), (shard['file'],len(qs),shard['question_count'])
              rows.extend(qs)
          assert len(rows)==4800, len(rows)
          modes=collections.Counter(str(x.get('grading_mode') or 'standard') for x in rows)
          print('GRADING MODES', dict(modes))
          assert modes==collections.Counter({'standard':4784,'all_credit':12,'any_answer':4}), modes
          multi=sum(1 for x in rows if isinstance(x.get('accepted_answers'),list) and len(x.get('accepted_answers'))>1)
          print('MULTI ANSWER', multi)
          assert multi==24, multi
          print('CORPUS PASS', len(rows))
          PY

      - name: Verify AI POST route without model call
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --request POST "$ORIGIN/" --header "Origin: $ORIGIN" --header 'Content-Type: application/json' --data '{}' --dump-header /tmp/ai.headers --output /tmp/ai.body --write-out '%{http_code}')"
          echo "AI invalid-request HTTP=$code"
          test "$code" = '400'
          grep -qiF "access-control-allow-origin: $ORIGIN" /tmp/ai.headers
          grep -qF 'Invalid AI request' /tmp/ai.body
          echo 'AI ROUTE PASS: no model call / no daily quota reservation'

      - name: Verify feedback CORS without write
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --request OPTIONS "$FEEDBACK_ENDPOINT" --header "Origin: $ORIGIN" --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: content-type' --dump-header /tmp/fb.headers --output /tmp/fb.body --write-out '%{http_code}')"
          echo "Feedback preflight HTTP=$code"
          test "$code" = '204'
          grep -qiF "access-control-allow-origin: $ORIGIN" /tmp/fb.headers
          echo 'FEEDBACK CORS PASS: no row written'

      - name: Confirm Netlify fallback still reachable
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' 'https://swsi-quiznetlify.netlify.app/?fallback-smoke=1')"
          echo "Netlify fallback HTTP=$code"
          test "$code" = '200'
          echo 'NETLIFY FALLBACK PASS'
