name: Monitoring Refresh Test Selector Once

on:
  push:
    branches:
      - fix/monitoring-refresh-click-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monitoring-refresh-click-20260901
      - name: Tighten modal selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/browser_interaction_smoke.js')
          s=p.read_text(encoding='utf-8')
          old="  await page.getByRole('button', { name: '隱私', exact: true }).click();"
          new="  await page.locator('[data-swsi-info-nav=\"privacy\"]').click();"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/browser_interaction_smoke.js
          git diff --check
          test "$(git diff --name-only)" = "scripts/browser_interaction_smoke.js"
      - name: Commit
        run: |
          git config user.name 'swsi-monitoring-hotfix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/browser_interaction_smoke.js
          git commit -m 'test: scope monitoring modal selector'
          git push origin HEAD:fix/monitoring-refresh-click-20260901
