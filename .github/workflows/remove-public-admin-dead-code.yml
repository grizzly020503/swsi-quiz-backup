name: Remove Public Admin Dead Code

on:
  push:
    paths:
      - '.github/workflows/remove-public-admin-dead-code.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install health dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Remove old public admin code
        run: python scripts/remove_public_admin_dead_code.py
      - name: Run permanent local health check
        run: python scripts/health_check.py --local
      - name: Validate student bundle
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -F 'renderAdmin' index.html
          ! grep -F 'adminUser' index.html
          ! grep -F 'Papa.parse' index.html
          ! grep -F 'CSV UTF-8' index.html
          ! grep -F "go('admin')" index.html
          grep -F 'function parseExp(raw){' index.html
      - name: Commit cleaned student bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'swsi-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html auto/health.json
          if git diff --cached --quiet; then
            echo 'No cleanup changes needed.'
            exit 0
          fi
          git commit -m '移除學生端舊管理登入與 CSV 寫入程式'
          git push
