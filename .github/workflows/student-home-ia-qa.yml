name: Student Home IA QA

on:
  pull_request:
    paths:
      - '.github/workflows/student-home-ia-qa.yml'
      - 'monthly_patch_parts/20.product-philosophy.part'
      - 'scripts/student_home_ia_contract.py'
      - 'audit/student_home_ia_20261003.md'

permissions:
  contents: read

concurrency:
  group: swsi-student-home-ia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  home-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Student homepage IA contract
        run: |
          python -m py_compile scripts/student_home_ia_contract.py
          python scripts/student_home_ia_contract.py
          git diff --check
