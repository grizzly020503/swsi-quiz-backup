name: Verified MOEX Auto CDN QA

on:
  pull_request:
    paths:
      - 'scripts/verified_auto_cdn_sync.py'
      - 'scripts/verified_essay_cdn_pending_sync.py'
      - 'scripts/test_verified_essay_cdn_pending_sync.py'
      - 'scripts/cloudflare_auto_mirror_live_smoke.py'
      - '.github/workflows/question-shards-publish.yml'
      - '.github/workflows/verified-auto-cdn-qa.yml'
      - 'auto/questions_auto.json'
      - 'auto/essays_auto.json'
      - 'cdn/auto/essays_auto.json'
      - 'incoming/**'
      - 'cdn/question-shards/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/verified_auto_cdn_sync.py'
      - 'scripts/verified_essay_cdn_pending_sync.py'
      - 'scripts/test_verified_essay_cdn_pending_sync.py'
      - 'scripts/cloudflare_auto_mirror_live_smoke.py'
      - '.github/workflows/question-shards-publish.yml'
      - '.github/workflows/verified-auto-cdn-qa.yml'

permissions:
  contents: read

jobs:
  official-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fail-closed synthetic fixtures
        run: |
          set -euo pipefail
          python -m py_compile scripts/verified_auto_cdn_sync.py
          python scripts/verified_auto_cdn_sync.py --selftest
          python -m py_compile scripts/cloudflare_auto_mirror_live_smoke.py
          python scripts/cloudflare_auto_mirror_live_smoke.py --selftest
          python -m py_compile scripts/verified_essay_cdn_pending_sync.py
          python -m unittest -v scripts/test_verified_essay_cdn_pending_sync.py
      - name: Verify actual tracked MOEX source against Supabase shards (read-only)
        run: |
          set -euo pipefail
          python scripts/verified_auto_cdn_sync.py \
            --incoming incoming \
            --auto auto/questions_auto.json \
            --shards cdn/question-shards
          python scripts/verified_essay_cdn_pending_sync.py \
            --incoming incoming \
            --auto auto/essays_auto.json \
            --cdn cdn/auto/essays_auto.json \
            --registry data/exam_scheme_registry.v1.json
          python scripts/cdn_auto_essay_core_parity.py
          git diff --check

      # Live parity is performed inside the owning question-shards-publish job
      # AFTER its GITHUB_TOKEN commit and hosted shard smoke. A separate push
      # workflow is not reliable for bot-originated publication and can race.
