name: Disaster Recovery Restore Drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/disaster-recovery-drill.yml'
      - 'supabase/recovery/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'cloudflare/wandering-wave-4418/d1/**'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'scripts/supabase_recovery_dry_run.py'
      - 'scripts/disaster_recovery_repo_inventory.py'
      - 'scripts/cloudflare_d1_recovery_smoke.py'
      - 'scripts/supabase_contract_smoke.js'
      - 'scripts/moex_importer_integrity_smoke.js'
      - 'scripts/browser_interaction_smoke.js'
      - 'scripts/shard_integrity_browser_smoke.js'
      - 'scripts/pwa_resilience_smoke.js'
      - 'scripts/admin_auth_recovery_smoke.js'
      - 'scripts/admin_identity_privacy_build.py'
      - 'scripts/admin_auth_build.py'
      - 'admin/**'
      - 'cdn/question-shards/**'
      - 'netlify.toml'
      - 'index.html'
      - 'monthly_patch_parts/**'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/public_content_sanitize.py'
      - 'scripts/cache_bust_runtime.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/disaster-recovery-drill.yml'
      - 'supabase/recovery/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'cloudflare/wandering-wave-4418/d1/**'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'scripts/supabase_recovery_dry_run.py'
      - 'scripts/disaster_recovery_repo_inventory.py'
      - 'scripts/cloudflare_d1_recovery_smoke.py'
      - 'scripts/admin_auth_recovery_smoke.js'
      - 'cdn/question-shards/**'

permissions:
  contents: read

concurrency:
  group: swsi-disaster-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swsi_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swsi_recovery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: swsi_recovery

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start restore timer
        run: |
          echo "DR_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "DR_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Syntax, manifest, inventory and secret-value checks
        run: |
          set -euo pipefail
          python -m py_compile scripts/supabase_recovery_dry_run.py
          python -m py_compile scripts/disaster_recovery_repo_inventory.py
          python -m py_compile scripts/cloudflare_d1_recovery_smoke.py
          python -m json.tool supabase/recovery/recovery_manifest.json >/dev/null
          python -m json.tool supabase/recovery/edge_functions.json >/dev/null
          python scripts/disaster_recovery_repo_inventory.py
          node --check cloudflare/wandering-wave-4418/worker.js
          git diff --check

      - name: Wait for disposable PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; then
              exit 0
            fi
            sleep 1
          done
          echo 'Disposable PostgreSQL did not become ready.' >&2
          exit 1

      - name: Rebuild Supabase schema and restore official question dataset
        run: |
          set -euo pipefail
          python scripts/supabase_recovery_dry_run.py

      - name: Verify restored runtime DB contracts
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/recovery/postgres_runtime_contract.sql

      - name: Rebuild Cloudflare D1 contract from empty SQLite
        run: |
          set -euo pipefail
          python scripts/cloudflare_d1_recovery_smoke.py

      - name: Compile exact Edge Function recovery inventory
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r fn; do
            echo "DENO CHECK $fn"
            deno check "$fn"
            count=$((count + 1))
          done < <(find supabase/functions -name index.ts -type f | sort)
          test "$count" = '10'
          echo "EDGE FUNCTION SOURCE COMPILE OK count=$count"

      - name: Verify backend source contracts
        run: |
          set -euo pipefail
          node --check scripts/supabase_contract_smoke.js
          node --check scripts/moex_importer_integrity_smoke.js
          node scripts/supabase_contract_smoke.js
          node scripts/moex_importer_integrity_smoke.js

      - name: Rebuild static frontend from repository source
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/swsi-dr-static-build.sh
          import tomllib
          from pathlib import Path
          cfg=tomllib.loads(Path('netlify.toml').read_text(encoding='utf-8'))
          assert cfg['build']['publish']=='_site'
          print('set -euo pipefail')
          print(cfg['build']['command'])
          PY
          bash /tmp/swsi-dr-static-build.sh

          test -f _site/index.html
          test -f _site/monthly_patch.js
          test -f _site/sw.js
          grep -q "const VERSION = 'v7'" _site/sw.js
          grep -q 'swsi-exam-date-label' _site/monthly_patch.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('cdn/question-shards/manifest.json').read_text(encoding='utf-8'))
          assert m['total_questions']==4800
          assert m['shard_count']==24
          print('STATIC RECOVERY BUILD OK questions=4800 shards=24 sw=v7')
          PY

      - name: Install isolated browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Local-only student browser and PWA restore smoke
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory _site >/tmp/swsi-dr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/shard_integrity_browser_smoke.js http://127.0.0.1:4173/
          node scripts/browser_interaction_smoke.js http://127.0.0.1:4173/
          node scripts/pwa_resilience_smoke.js http://127.0.0.1:4173/
          echo 'LOCAL-ONLY STUDENT BROWSER/PWA RESTORE SMOKE OK'

      - name: Isolated admin auth and recovery smoke
        run: |
          set -euo pipefail
          rm -rf /tmp/swsi-admin
          mkdir -p /tmp/swsi-admin
          cp -a admin/. /tmp/swsi-admin/
          python scripts/admin_identity_privacy_build.py /tmp/swsi-admin/index.html
          python scripts/admin_auth_build.py /tmp/swsi-admin/index.html
          python -m http.server 4174 --directory /tmp/swsi-admin >/tmp/swsi-admin-dr-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/index.html >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/admin_auth_recovery_smoke.js http://127.0.0.1:4174/index.html

      - name: Write restore evidence
        if: always()
        run: |
          set -euo pipefail
          start="${DR_START_EPOCH:-$(date +%s)}"
          started="${DR_STARTED_AT:-unknown}"
          end="$(date +%s)"
          elapsed=$((end - start))
          mkdir -p /tmp/swsi-dr-evidence
          cat > /tmp/swsi-dr-evidence/restore-report.md <<EOF
          # SWSI isolated disaster-recovery restore evidence

          - source commit: ${GITHUB_SHA}
          - workflow run: ${GITHUB_RUN_ID}
          - started UTC: ${started}
          - finished UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - measured isolated full-platform RTO: ${elapsed} seconds
          - repo-source RPO: 0 commits (exact checked-out source commit)
          - hosted mutable-data RPO: intentionally not copied or exercised in CI
          - PostgreSQL target: disposable postgres:16 service
          - D1 target: isolated local SQLite recovery smoke
          - official question restore: 4,800 questions / 24 shards / SHA-256 verified
          - Edge Function source inventory: exact 10 source directories; compile-only, no provider calls
          - student browser/PWA target: localhost; non-local requests are aborted by the reused smokes
          - admin auth/recovery target: localhost with mocked Supabase SDK/API
          - production writes: none
          - production bindings changed: none
          - production secrets used: none
          EOF
          cat /tmp/swsi-dr-evidence/restore-report.md

      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swsi-disaster-recovery-${{ github.sha }}
          path: /tmp/swsi-dr-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Recovery drill summary
        if: success()
        run: |
          echo 'SWSI DISASTER RECOVERY DRILL OK'
          echo 'Production writes: none'
          echo 'Production secrets: none'
          echo 'Private production data copied: none'
