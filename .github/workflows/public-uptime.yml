name: Public Uptime Sentinel

on:
  workflow_dispatch:
  schedule:
    # Once daily. 00:17 UTC = 08:17 Asia/Taipei.
    # Intentionally low-frequency to conserve the included Actions allowance.
    - cron: '17 0 * * *'
  pull_request:
    paths:
      - '.github/workflows/public-uptime.yml'
      - 'scripts/public_uptime_smoke.py'
      - 'UPTIME_MONITORING.md'

permissions:
  contents: read

concurrency:
  group: swsi-public-uptime
  cancel-in-progress: true

jobs:
  public-uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python syntax
        run: python3 -m py_compile scripts/public_uptime_smoke.py

      - name: Check public SWSI dependencies
        run: python3 scripts/public_uptime_smoke.py
