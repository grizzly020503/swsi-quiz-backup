name: Public Uptime Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  workflow_run:
    # Final public parity runs only after the controlled fallback bridge has
    # either deployed Netlify or proved that no deploy was necessary.
    workflows:
      - Netlify Controlled Production Deploy
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/public-uptime.yml'
      - 'scripts/public_uptime_smoke.py'
  pull_request:
    paths:
      - '.github/workflows/public-uptime.yml'
      - 'scripts/public_uptime_smoke.py'

permissions:
  contents: read

concurrency:
  group: swsi-public-uptime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-uptime:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout triggering revision
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v7

      - name: Checkout current main after Cloudflare production parity
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile scripts/public_uptime_smoke.py
      - name: Read-only public availability checks
        shell: bash
        run: |
          set -euo pipefail
          args='--monitoring-v2'
          # Monitoring V2 is now the established live production baseline, so PRs
          # validate it too. Exact fallback release parity is checked only from
          # main/scheduled/manual runs because a feature branch may intentionally
          # contain an unreleased marker.
          if [ "$GITHUB_EVENT_NAME" != 'pull_request' ]; then
            args="$args --fallback-parity"
          fi
          python scripts/public_uptime_smoke.py $args
