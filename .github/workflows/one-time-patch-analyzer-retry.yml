name: One-time patch analyzer structural retry

on:
  push:
    branches:
      - fix/analyzer-structural-retry-20261002
    paths:
      - '.github/workflows/one-time-patch-analyzer-retry.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/analyzer-structural-retry-20261002
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply exact analyzer retry patch
        run: python scripts/one_time_patch_analyzer_retry.py
      - name: Verify analyzer hardening
        run: |
          set -euo pipefail
          python -m py_compile scripts/analyzer_proxy_route_smoke.py scripts/analyzer_retry_contract_smoke.py
          python scripts/analyzer_proxy_route_smoke.py
          python scripts/analyzer_retry_contract_smoke.py
          deno check supabase/functions/analyze-pending-questions/index.ts
          git diff --check
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/analyze-pending-questions/index.ts scripts/analyzer_retry_contract_smoke.py .github/workflows/ai-analyzer-route-qa.yml
          git commit -m 'fix: retry analyzer structural output failures without relaxing QA'
          git push origin HEAD:fix/analyzer-structural-retry-20261002
