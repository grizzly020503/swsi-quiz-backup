name: Official MOEX Figure UI QA
on:
  pull_request:
    paths:
      - 'official-figures/**'
      - 'cdn/official-figures/**'
      - 'index.html'
      - 'cdn/index.html'
      - 'sw.js'
      - 'cdn/sw.js'
      - 'netlify.toml'
      - 'data/official_figure_assets.v1.json'
      - 'audit/official_genogram_core_transition_20261031.json'
      - 'cdn/question-shards/**'
      - 'data/official_exam_readonly.lock.json'
      - 'scripts/official_figure_ui_qa.py'
      - 'scripts/official_shared_context_13row_integration_smoke.py'
      - 'audit/official_shared_context*.json'
      - 'audit/official_105_2_shared_context_20261028.json'
      - 'audit/official_107_2_shared_context_20261028.json'
      - 'scripts/official_figure_mobile_browser_smoke.js'
      - 'monthly_patch_parts/**'
      - 'cdn/monthly_patch.js'
      - '.github/workflows/official-figure-ui-qa.yml'
  push:
    branches: [main]
    paths:
      - 'official-figures/**'
      - 'cdn/official-figures/**'
      - 'data/official_figure_assets.v1.json'
      - 'audit/official_genogram_core_transition_20261031.json'
      - 'cdn/question-shards/**'
      - 'data/official_exam_readonly.lock.json'
      - 'scripts/official_figure_ui_qa.py'
      - 'scripts/official_shared_context_13row_integration_smoke.py'
      - 'audit/official_shared_context*.json'
      - 'audit/official_105_2_shared_context_20261028.json'
      - 'audit/official_107_2_shared_context_20261028.json'
permissions:
  contents: read
concurrency:
  group: swsi-official-figures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-original-figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check exact original figures and protected grading contract
        run: |
          python -m py_compile scripts/official_figure_ui_qa.py
          python scripts/official_111_2_shared_context_six_smoke.py
          python scripts/official_figure_ui_qa.py
          python scripts/official_exam_readonly_guard.py
  mobile-quiz-and-mock:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user 1001
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Playwright without downloading browser binaries
        timeout-minutes: 5
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          node -e 'const fs=require("fs"),pw=require("playwright");if(require("playwright/package.json").version!=="1.55.0")throw Error("Playwright version drift");for(const name of ["chromium","webkit"])if(!fs.existsSync(pw[name].executablePath()))throw Error(name+" missing")'
      - name: Real iPhone-sized quiz and timed mock figure acceptance
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --directory cdn >/tmp/swsi-figures-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4176/index.html >/dev/null; then break; fi
            sleep 1
          done
          node --check scripts/official_figure_mobile_browser_smoke.js
          node scripts/official_figure_mobile_browser_smoke.js http://127.0.0.1:4176/
