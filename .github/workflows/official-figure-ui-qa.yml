name: Official MOEX Figure UI QA
on:
  pull_request:
    paths:
      - 'official-figures/**'
      - 'cdn/official-figures/**'
      - 'index.html'
      - 'cdn/index.html'
      - 'sw.js'
      - 'cdn/sw.js'
      - 'netlify.toml'
      - 'data/official_figure_assets.v1.json'
      - 'scripts/official_figure_ui_qa.py'
      - '.github/workflows/official-figure-ui-qa.yml'
  push:
    branches: [main]
    paths:
      - 'official-figures/**'
      - 'cdn/official-figures/**'
      - 'data/official_figure_assets.v1.json'
      - 'scripts/official_figure_ui_qa.py'
permissions:
  contents: read
jobs:
  verify-original-figures:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check exact official image identity and both frontend gates
        run: |
          python -m py_compile scripts/official_figure_ui_qa.py
          python scripts/official_figure_ui_qa.py
          python scripts/official_exam_readonly_guard.py
