name: AI Question Analysis Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-analysis-smoke.yml'
      - 'scripts/ai_analyze_questions.py'

permissions:
  contents: write

concurrency:
  group: ai-analysis-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Analyze and audit one official question
        env:
          AI_PROXY_URL: https://wandering-wave-4418.c022050333.workers.dev
          AI_MODEL: qwen/qwen3.6-27b
        run: python scripts/ai_analyze_questions.py --exam 115100 --batch-size 1 --limit 1 --output analysis/smoke_115100.json --force
      - name: Commit smoke result
        run: |
          git config user.name 'swsi-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/smoke_115100.json
          if git diff --cached --quiet; then
            echo 'Smoke output unchanged.'
            exit 0
          fi
          git commit -m '雙階段AI解析單題測試通過'
          git push
