name: AI Question Analysis Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-analysis-smoke.yml'
      - 'scripts/ai_analyze_questions.py'
      - 'scripts/ai_analyze_questions_verified.py'

permissions:
  contents: write

concurrency:
  group: ai-analysis-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Cross-model smoke with diagnostic log
        id: smoke
        continue-on-error: true
        env:
          AI_PROXY_URL: https://wandering-wave-4418.c022050333.workers.dev
          AI_MODEL: qwen/qwen3.6-27b
          AI_AUDIT_MODEL: openai/gpt-oss-120b
        shell: bash
        run: |
          mkdir -p analysis
          set +e
          python scripts/ai_analyze_questions_verified.py --exam 115100 --batch-size 1 --limit 1 --output analysis/smoke_115100.json --force > analysis/smoke_run.log 2>&1
          code=$?
          echo "exit_code=$code" >> analysis/smoke_run.log
          cat analysis/smoke_run.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit smoke diagnostics/result
        run: |
          git config user.name 'swsi-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add analysis/smoke_run.log analysis/smoke_115100.json
          if git diff --cached --quiet; then
            echo 'No diagnostic changes.'
            exit 0
          fi
          git commit -m '記錄跨模型AI解析測試結果'
          git push
      - name: Fail if smoke was blocked
        if: steps.smoke.outputs.code != '0'
        run: exit 1
