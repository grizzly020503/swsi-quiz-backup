name: Historical Law Snapshot Pilot QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_stage2_history_snapshot.py'
      - 'scripts/historical_law_stage4_snapshot_runner.py'
      - 'scripts/historical_law_stage6_snapshot_semantic.py'
      - 'scripts/historical_law_snapshot_pipeline_selftest.py'
      - 'scripts/historical_law_moj_api_probe.py'
      - '.github/workflows/historical-law-snapshot-pilot-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-snapshot-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Snapshot handoff regression
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/historical_law_stage2_history_snapshot.py \
            scripts/historical_law_stage4_snapshot_runner.py \
            scripts/historical_law_stage6_snapshot_semantic.py \
            scripts/historical_law_snapshot_pipeline_selftest.py \
            scripts/historical_law_moj_api_probe.py
          (cd scripts && python historical_law_snapshot_pipeline_selftest.py)
          git diff --check

  live-snapshot-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install live HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Stage 2 — exact exam dates plus MOJ history handoff
        run: python scripts/historical_law_stage2_history_snapshot.py

      - name: Probe official MOJ Open API current corpus
        run: python scripts/historical_law_moj_api_probe.py
      - name: Validate MOJ Open API coverage
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path

          def sha_text(value):
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          def payload_sha(value):
              raw=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))
              return sha_text(raw)

          d=json.loads(Path('auto/qa/historical_law_moj_api_probe.v1.json').read_text(encoding='utf-8'))
          rows=d.get('records') or []
          assert d.get('target_count') == len(rows) == 10, d
          assert d.get('ready_count') == 10, d
          assert d.get('not_found_count') == 0, d
          assert d.get('historical_version_checked_count') == 0
          assert d.get('protected_core_mutation_count') == 0
          assert all(r.get('status') == 'ready' for r in rows)
          assert all(r.get('name_matches') is True for r in rows)
          assert all(r.get('url_pcode_matches') is True for r in rows)
          assert all(int(r.get('article_count') or 0) > 0 for r in rows)
          assert all('official_answer' not in r for r in rows)

          targets=json.loads(Path('auto/qa/historical_law_moj_api_targets.v1.json').read_text(encoding='utf-8'))
          target_rows=targets.get('records') or []
          assert targets.get('schema_version') == 1
          assert targets.get('record_count') == len(target_rows) == 10, targets
          assert targets.get('historical_version_checked_count') == 0
          assert targets.get('protected_core_mutation_count') == 0
          for row in target_rows:
              assert row.get('endpoint') in {
                  'https://law.moj.gov.tw/api/ch/law/json',
                  'https://law.moj.gov.tw/api/ch/order/json',
              }
              assert row.get('collection') in {'law','order'}
              pcode=str(row.get('pcode') or '')
              assert re.fullmatch(r'[A-Z]\d{7}',pcode), pcode
              assert row.get('law_name')
              law_url=str(row.get('law_url') or '')
              assert law_url.startswith('https://law.moj.gov.tw/')
              assert f'pcode={pcode}' in law_url
              articles=row.get('articles') or []
              assert row.get('article_count') == len(articles) and articles
              assert row.get('articles_sha256') == payload_sha(articles)
              identity={
                  'endpoint':row.get('endpoint'),
                  'collection':row.get('collection'),
                  'update_date':row.get('update_date'),
                  'pcode':row.get('pcode'),
                  'law_name':row.get('law_name'),
                  'law_url':row.get('law_url'),
                  'modified_date':row.get('modified_date'),
                  'article_count':row.get('article_count'),
                  'articles_sha256':row.get('articles_sha256'),
              }
              assert row.get('source_identity_sha256') == payload_sha(identity)
              assert 'official_answer' not in row
              for article in articles:
                  assert article.get('article_no') and article.get('text')
                  assert article.get('sha256') == sha_text(str(article.get('text')))
                  assert 'official_answer' not in article

          print(json.dumps({
              'law_update_date':d.get('law_update_date'),
              'order_update_date':d.get('order_update_date'),
              'law_corpus_count':d.get('law_corpus_count'),
              'order_corpus_count':d.get('order_corpus_count'),
              'ready_count':d.get('ready_count'),
              'target_snapshot_record_count':targets.get('record_count'),
              'targets':[
                  {'law_name':r.get('law_name'),'pcode':r.get('pcode'),'collection':r.get('collection'),'article_count':r.get('article_count')}
                  for r in rows
              ],
          },ensure_ascii=False,indent=2))
          PY

      - name: Stage 3 — article candidates
        run: python scripts/historical_law_article_resolver.py
      - name: Stage 4 — reuse Stage 2 history and capture verified MOJ full-text snapshot
        run: python scripts/historical_law_stage4_snapshot_runner.py
      - name: Stage 5 — promotion contract
        run: python scripts/historical_law_stage5_promotion.py
      - name: Stage 6 — semantic rerank from snapshot, pass 1
        run: python scripts/historical_law_stage6_snapshot_semantic.py --output /tmp/historical_law_stage6_first.json
      - name: Stage 6 — semantic rerank from same snapshot, pass 2
        run: |
          set -euo pipefail
          python scripts/historical_law_stage6_snapshot_semantic.py
          cmp /tmp/historical_law_stage6_first.json auto/qa/historical_law_stage6_semantic.v1.json

      - name: Validate snapshot pipeline
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          s2=json.loads(Path('auto/qa/historical_law_exam_date_stage2.v1.json').read_text(encoding='utf-8'))
          hs=json.loads(Path('auto/qa/historical_law_history_snapshot.v1.json').read_text(encoding='utf-8'))
          s3=json.loads(Path('auto/qa/historical_law_article_stage3.v1.json').read_text(encoding='utf-8'))
          s4=json.loads(Path('auto/qa/historical_law_oldver_stage4.v1.json').read_text(encoding='utf-8'))
          s5=json.loads(Path('auto/qa/historical_law_stage5_promotion.v1.json').read_text(encoding='utf-8'))
          s6=json.loads(Path('auto/qa/historical_law_stage6_semantic.v1.json').read_text(encoding='utf-8'))

          assert s2.get('mapping_count') == 86
          assert s2.get('law_fetch_error_count') == 0, s2.get('law_fetch_errors')
          assert hs.get('record_count',0) > 0
          assert hs.get('ready_count') == hs.get('record_count'), hs
          assert hs.get('source_failure_count') == 0, hs
          assert hs.get('historical_version_checked_count') == 0
          assert hs.get('protected_core_mutation_count') == 0
          for row in hs.get('records') or []:
              assert row.get('status') == 'official_history_ready'
              assert re.fullmatch(r'[0-9a-f]{64}', row.get('entries_sha256') or '')
              assert row.get('entry_count') == len(row.get('entries') or [])
              assert row.get('entry_count',0) > 0
              assert 'official_answer' not in row

          machine=[r for r in (s3.get('records') or []) if r.get('route') == 'machine_candidate']
          assert len(machine) == 19, s3.get('route_counts')
          assert s4.get('record_count') == len(machine) == 19
          assert s4.get('stage2_history_snapshot_bundle_count') == hs.get('ready_count')
          assert s4.get('historical_text_evidence_ready_count') == 19, s4.get('status_counts')
          assert s4.get('verified_snapshot_count') == 19, s4.get('status_counts')
          assert s4.get('historical_version_checked_count') == 0
          assert s4.get('protected_core_mutation_count') == 0
          for row in s4.get('records') or []:
              assert row.get('historical_version_checked') is False
              assert 'official_answer' not in row
              snap=row.get('historical_version_snapshot') or {}
              assert re.fullmatch(r'[0-9a-f]{64}', snap.get('snapshot_id') or '')
              assert re.fullmatch(r'[0-9a-f]{64}', snap.get('page_sha256') or '')
              assert snap.get('source_identity_method') == 'stage4_moj_title'
              assert snap.get('source_url') == (row.get('selected_version') or {}).get('url')
              assert snap.get('article_count') == len(snap.get('articles') or [])
              assert snap.get('article_count',0) > 0

          assert s5.get('promotion_candidate_count') == 19, s5.get('promotion_status_counts')
          assert s6.get('record_count') == 19
          assert s6.get('stage5_promotion_candidate_count') == 19
          assert s6.get('historical_version_checked_count') == 0
          assert s6.get('protected_core_mutation_count') == 0
          assert s6.get('question_shard_error_count') == 0
          allowed={'historical_semantic_confirmed','historical_semantic_support','historical_semantic_conflict'}
          assert set(s6.get('status_counts') or {}).issubset(allowed), s6.get('status_counts')
          assert sum((s6.get('status_counts') or {}).values()) == 19
          assert (s6.get('source_identity_method_counts') or {}).get('stage4_verified_snapshot') == 19
          assert all(r.get('historical_version_checked') is False for r in (s6.get('records') or []))
          assert all('official_answer' not in r for r in (s6.get('records') or []))
          print(json.dumps({
              'stage2_history_ready':hs.get('ready_count'),
              'stage3_route_counts':s3.get('route_counts'),
              'stage4_status_counts':s4.get('status_counts'),
              'verified_snapshot_count':s4.get('verified_snapshot_count'),
              'verified_snapshot_article_count':s4.get('verified_snapshot_article_count'),
              'stage5_promotion_status_counts':s5.get('promotion_status_counts'),
              'stage6_status_counts':s6.get('status_counts'),
              'stage6_identity_methods':s6.get('source_identity_method_counts'),
          },ensure_ascii=False,indent=2))
          PY

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-law-snapshot-pilot-evidence
          path: |
            auto/qa/historical_law_exam_date_stage2.v1.json
            auto/qa/historical_law_history_snapshot.v1.json
            auto/qa/historical_law_moj_api_probe.v1.json
            auto/qa/historical_law_moj_api_targets.v1.json
            auto/qa/historical_law_oldver_stage4.v1.json
            auto/qa/historical_law_stage5_promotion.v1.json
            auto/qa/historical_law_stage6_semantic.v1.json
          if-no-files-found: warn
          retention-days: 14
