name: Progressive Explanation QA

on:
  pull_request:
    paths:
      - '.github/workflows/progressive-explanation-qa.yml'
      - 'monthly_patch_parts/00.part'
      - 'monthly_patch_parts/70.learning-loop.part'
      - 'monthly_patch_parts/86.law-trust-ui.part'
      - 'monthly_patch_parts/88.theory-trust-ui.part'
      - 'monthly_patch_parts/zzzz_product_v1_lock.part'
      - 'scripts/progressive_explanation_contract.py'
      - 'scripts/question_trust_labels_contract.py'
      - 'scripts/historical_law_student_surface_contract.py'
      - 'audit/progressive_explanation_20261003.md'
      - 'audit/question_trust_labels_20261003.md'
      - 'audit/historical_law_student_surface_20261003.md'
      - 'data/historical_law_verified_priority10.v1.json'
      - 'cdn/question-shards/**'

permissions:
  contents: read

concurrency:
  group: swsi-progressive-explanation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Progressive explanation and trust contracts
        run: |
          python -m py_compile scripts/progressive_explanation_contract.py scripts/question_trust_labels_contract.py scripts/historical_law_student_surface_contract.py
          python scripts/progressive_explanation_contract.py
          python scripts/question_trust_labels_contract.py
          python scripts/historical_law_student_surface_contract.py
          cat monthly_patch_parts/*.part >/tmp/monthly_patch.js
          node --check /tmp/monthly_patch.js
          git diff --check
