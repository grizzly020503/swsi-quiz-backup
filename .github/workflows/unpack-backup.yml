name: 展開完整救援備份

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: 取回儲存庫
        uses: actions/checkout@v4

      - name: 解壓完整救援包
        shell: bash
        run: |
          set -e
          ZIP='swsi_quiz_GitHub-ready_20260824.zip'
          test -f "$ZIP"
          rm -rf .unpack_tmp
          mkdir .unpack_tmp
          unzip -q "$ZIP" -d .unpack_tmp
          rsync -a --exclude='.git' .unpack_tmp/swsi-quiz-backup/ ./
          rm -rf .unpack_tmp

      - name: 將展開後的檔案提交回 main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '沒有需要提交的變更'
            exit 0
          fi
          git commit -m '展開完整救援專案'
          git push
