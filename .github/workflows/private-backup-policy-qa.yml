name: Private Backup Policy QA

on:
  pull_request:
    paths:
      - '.github/workflows/private-backup-policy-qa.yml'
      - '.gitignore'
      - 'scripts/supabase_private_backup_local.sh'
      - 'scripts/verify_supabase_private_backup_local.sh'
      - 'scripts/restore_supabase_private_backup_isolated.sh'
      - 'scripts/private_backup_policy_smoke.py'
      - 'scripts/private_backup_sidecar_guard.py'
      - 'scripts/private_backup_sidecar_guard_selftest.py'
      - 'scripts/private_backup_safe_extract.py'
      - 'scripts/private_backup_safe_extract_selftest.py'
      - 'scripts/private_backup_counts_guard.py'
      - 'scripts/private_backup_count_query.py'
      - 'scripts/private_backup_count_query_selftest.py'
      - 'scripts/private_backup_pg17_synthetic_smoke.py'
      - 'scripts/private_backup_counts_guard_selftest.py'
      - 'scripts/private_restore_target_preflight.py'
      - 'scripts/private_restore_target_preflight_selftest.py'
      - 'scripts/restore_destination_guard.py'
      - 'scripts/restore_destination_guard_selftest.py'
      - 'docs/SUPABASE_FREE_TIER_PRIVATE_BACKUP.md'
      - 'ZERO_COST_OPERATIONS.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/private-backup-policy-qa.yml'
      - '.gitignore'
      - 'scripts/supabase_private_backup_local.sh'
      - 'scripts/verify_supabase_private_backup_local.sh'
      - 'scripts/restore_supabase_private_backup_isolated.sh'
      - 'scripts/private_backup_policy_smoke.py'
      - 'scripts/private_backup_sidecar_guard.py'
      - 'scripts/private_backup_sidecar_guard_selftest.py'
      - 'scripts/private_backup_safe_extract.py'
      - 'scripts/private_backup_safe_extract_selftest.py'
      - 'scripts/private_backup_counts_guard.py'
      - 'scripts/private_backup_count_query.py'
      - 'scripts/private_backup_count_query_selftest.py'
      - 'scripts/private_backup_pg17_synthetic_smoke.py'
      - 'scripts/private_backup_counts_guard_selftest.py'
      - 'scripts/private_restore_target_preflight.py'
      - 'scripts/private_restore_target_preflight_selftest.py'
      - 'scripts/restore_destination_guard.py'
      - 'scripts/restore_destination_guard_selftest.py'
      - 'docs/SUPABASE_FREE_TIER_PRIVATE_BACKUP.md'
      - 'ZERO_COST_OPERATIONS.md'

permissions:
  contents: read

concurrency:
  group: swsi-private-backup-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Shell and policy checks
        run: |
          set -euo pipefail
          bash -n scripts/supabase_private_backup_local.sh
          bash -n scripts/verify_supabase_private_backup_local.sh
          bash -n scripts/restore_supabase_private_backup_isolated.sh
          python -m py_compile scripts/private_backup_policy_smoke.py
          python scripts/private_backup_policy_smoke.py
          python scripts/private_backup_safe_extract_selftest.py
          python scripts/private_backup_sidecar_guard_selftest.py
          python scripts/private_backup_counts_guard_selftest.py
          python scripts/private_backup_count_query_selftest.py
          python scripts/private_restore_target_preflight_selftest.py
          python scripts/restore_destination_guard_selftest.py
          git diff --check

      - name: Prove private backup refuses CI execution
        run: |
          set -euo pipefail
          set +e
          output="$(CI=true bash scripts/supabase_private_backup_local.sh 2>&1)"
          rc=$?
          set -e
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -q 'refuses to run in CI'
          echo 'PRIVATE BACKUP CI REFUSAL OK'

      - name: Prove isolated restore refuses CI execution
        run: |
          set -euo pipefail
          set +e
          output="$(CI=true bash scripts/restore_supabase_private_backup_isolated.sh /tmp/nonexistent.tar.age 2>&1)"
          rc=$?
          set -e
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -q 'refuses to run in CI'
          echo 'PRIVATE RESTORE CI REFUSAL OK'

  native-postgres17:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: swsi_fixture
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: swsi_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swsi_fixture -d swsi_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client for ephemeral container
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Verify absent and present optional Ops schema on PostgreSQL 17
        env:
          SWSI_SYNTHETIC_PG17_CI: I_CONFIRM_DISPOSABLE_FIXTURE
        run: |
          python3 scripts/private_backup_pg17_synthetic_smoke.py
