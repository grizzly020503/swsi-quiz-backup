name: Law Study Priority QA

on:
  pull_request:
    paths:
      - 'data/law_question_links_priority10.v1.json'
      - 'scripts/build_law_study_priority.py'
      - 'scripts/law_study_priority_smoke.py'
      - 'auto/law_study_priority.json'
      - 'cdn/auto/law_study_priority.json'
      - 'monthly_patch_parts/86a.law-study-priority.part'
      - '.github/workflows/law-study-priority-qa.yml'

permissions:
  contents: read

jobs:
  law-study-priority:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build deterministic snapshot
        run: |
          python scripts/build_law_study_priority.py --output /tmp/law_study_priority.json
          cat /tmp/law_study_priority.json
      - name: Validate contract
        run: |
          python -m py_compile scripts/build_law_study_priority.py
          if [ -f scripts/law_study_priority_smoke.py ]; then python scripts/law_study_priority_smoke.py; fi
          git diff --check
