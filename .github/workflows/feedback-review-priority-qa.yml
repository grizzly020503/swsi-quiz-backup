name: Feedback Review Priority QA

on:
  pull_request:
    paths:
      - '.github/workflows/feedback-review-priority-qa.yml'
      - 'supabase/functions/swsi-admin/index.ts'
      - 'supabase/functions/swsi-admin/feedback_priority.mjs'
      - 'scripts/feedback_review_priority_smoke.mjs'
      - 'scripts/materialize_cloudflare_runtime.py'
      - 'audit/feedback_review_priority_20261003.md'
      - 'FEEDBACK_TRIAGE_POLICY.md'
      - 'cdn/monthly_patch.js'
      - 'cdn/index.html'

permissions:
  contents: write

concurrency:
  group: swsi-feedback-review-priority-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v7

      - name: Deterministic priority self-test
        run: |
          set -euo pipefail
          node scripts/feedback_review_priority_smoke.mjs
          python -m py_compile scripts/materialize_cloudflare_runtime.py
          grep -q 'deriveFeedbackPriority' supabase/functions/swsi-admin/index.ts
          grep -q 'persisted_v1' supabase/functions/swsi-admin/index.ts
          grep -q 'derived_fallback_v1' supabase/functions/swsi-admin/feedback_priority.mjs
          if grep -Eq 'fetch\(|createClient|SUPABASE_|github|deploy|merge' supabase/functions/swsi-admin/feedback_priority.mjs; then
            echo 'ERROR: deterministic priority module gained network/credential/action authority' >&2
            exit 1
          fi
          git diff --check

      - name: Checkout PR head for one-time materialization
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Materialize tracked runtime on PR branch only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python scripts/materialize_cloudflare_runtime.py
          git add cdn/monthly_patch.js cdn/index.html
          if git diff --cached --quiet; then
            echo 'Tracked runtime already current.'
            exit 0
          fi
          git config user.name 'swsi-runtime-materializer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'build: refresh tracked Cloudflare runtime artifact'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
