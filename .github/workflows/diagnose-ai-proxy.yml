name: Diagnose AI Proxy Guard

on:
  push:
    paths:
      - '.github/workflows/diagnose-ai-proxy.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify origin guard and 3-per-minute limiter
        shell: bash
        run: |
          set -euo pipefail
          url='https://wandering-wave-4418.c022050333.workers.dev'

          echo '--- ORIGIN GUARD ---'
          code=$(curl --silent --show-error --max-time 20 -o /tmp/b -w '%{http_code}' \
            -X POST "$url" -H 'content-type: application/json' -H 'Origin: https://evil.example' --data '{}')
          echo "foreign=$code"
          test "$code" = '403'

          echo '--- SWSI RATE LIMIT ---'
          for i in 1 2 3 4; do
            code=$(curl --silent --show-error --max-time 20 -D /tmp/h -o /tmp/b -w '%{http_code}' \
              -X POST "$url" \
              -H 'content-type: application/json' \
              -H 'Origin: https://swsi-quiznetlify.netlify.app' \
              -H 'User-Agent: swsi-rate-limit-test/1.0' \
              --data '{}')
            echo "request_$i=$code"
            if [ "$i" -le 3 ]; then test "$code" = '400'; else test "$code" = '429'; fi
          done

          echo 'RATE LIMIT VERIFIED'
