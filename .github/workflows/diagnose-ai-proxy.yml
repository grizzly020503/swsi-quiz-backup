name: Diagnose AI Proxy Guard

on:
  push:
    paths:
      - '.github/workflows/diagnose-ai-proxy.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Observe permissive Cloudflare rate limiter behavior
        shell: bash
        run: |
          set -euo pipefail
          url='https://wandering-wave-4418.c022050333.workers.dev'

          echo '--- ORIGIN GUARD ---'
          code=$(curl --silent --show-error --max-time 20 -o /tmp/b -w '%{http_code}' \
            -X POST "$url" -H 'content-type: application/json' -H 'Origin: https://evil.example' --data '{}')
          echo "foreign=$code"
          test "$code" = '403'

          echo '--- SWSI RATE LIMIT OBSERVATION ---'
          seen429=0
          for i in $(seq 1 12); do
            code=$(curl --silent --show-error --max-time 20 -o /tmp/b -w '%{http_code}' \
              -X POST "$url" \
              -H 'content-type: application/json' \
              -H 'Origin: https://swsi-quiznetlify.netlify.app' \
              -H 'User-Agent: swsi-rate-limit-observe/1.0' \
              --data '{}')
            echo "request_$i=$code"
            if [ "$code" = '429' ]; then seen429=1; fi
          done
          echo "seen429=$seen429"
