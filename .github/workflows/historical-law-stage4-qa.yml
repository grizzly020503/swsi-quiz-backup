name: Historical Law Stage 4 QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_oldver_stage4.py'
      - 'scripts/historical_law_stage4_selftest.py'
      - 'scripts/historical_law_article_resolver.py'
      - 'scripts/historical_law_provenance_core.py'
      - 'data/law_question_links_priority10.v1.json'
      - 'data/legal_watch_report.json'
      - 'data/moex_social_worker_exam_dates.v1.json'
      - 'cdn/question-shards/**'
      - '.github/workflows/historical-law-stage4-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-stage4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Syntax and Stage 4 deterministic regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/historical_law_oldver_stage4.py \
            scripts/historical_law_stage4_selftest.py
          (cd scripts && python historical_law_stage4_selftest.py)

      - name: Protected-core safety boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/historical_law_oldver_stage4.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          violations = []

          def const_key(node):
              if isinstance(node, ast.Constant) and isinstance(node.value, str):
                  return node.value
              return None

          for node in ast.walk(tree):
              if isinstance(node, ast.Subscript) and isinstance(node.ctx, ast.Store):
                  key = const_key(node.slice)
                  if key in protected:
                      violations.append(f'{path}:{node.lineno}: protected field assignment: {key}')
              if isinstance(node, ast.Dict):
                  for key_node, value_node in zip(node.keys, node.values):
                      if const_key(key_node) == 'historical_version_checked':
                          if isinstance(value_node, ast.Constant) and value_node.value is True:
                              violations.append(f'{path}:{node.lineno}: historical_version_checked=True is forbidden')
          if violations:
              raise SystemExit('\n'.join(violations))
          print('HISTORICAL LAW STAGE4 SAFETY BOUNDARY OK')
          PY
          git diff --check

  live-readonly-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install live HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Rebuild Stage 3 machine candidates
        id: stage3
        continue-on-error: true
        run: python scripts/historical_law_article_resolver.py

      - name: Build Stage 4 official historical-text evidence
        id: stage4
        if: always()
        continue-on-error: true
        run: |
          if [ -f auto/qa/historical_law_article_stage3.v1.json ]; then
            python scripts/historical_law_oldver_stage4.py
          else
            echo 'Stage 3 artifact unavailable; Stage 4 remains fail-soft.'
          fi

      - name: Validate Stage 4 evidence if available
        if: always()
        run: |
          if [ -f auto/qa/historical_law_oldver_stage4.v1.json ]; then
            python - <<'PY'
          import json
          import re
          from pathlib import Path

          s3 = json.loads(Path('auto/qa/historical_law_article_stage3.v1.json').read_text(encoding='utf-8'))
          d = json.loads(Path('auto/qa/historical_law_oldver_stage4.v1.json').read_text(encoding='utf-8'))
          rows = d.get('records') or []
          machine = [r for r in (s3.get('records') or []) if r.get('route') == 'machine_candidate']
          allowed = {
              'historical_text_evidence_ready',
              'stage3_candidate_missing_article',
              'exam_date_missing',
              'law_source_missing',
              'source_failure',
              'history_version_unavailable',
              'exam_window_version_conflict',
              'effective_date_review',
              'article_missing_in_selected_version',
          }
          assert d.get('stage3_machine_candidate_count') == len(machine)
          assert d.get('record_count') == len(rows) == len(machine)
          assert d.get('historical_version_checked_count') == 0
          assert d.get('protected_core_mutation_count') == 0
          assert all(r.get('historical_version_checked') is False for r in rows)
          assert all('official_answer' not in r for r in rows)
          assert set(d.get('status_counts') or {}).issubset(allowed), d.get('status_counts')
          assert sum((d.get('status_counts') or {}).values()) == len(rows)
          for row in rows:
              if row.get('status') == 'historical_text_evidence_ready':
                  assert row.get('eligible_for_historical_version_checked') is True
                  assert re.fullmatch(r'[0-9a-f]{64}', row.get('historical_article_sha256') or '')
                  assert row.get('historical_article_char_count', 0) > 0
                  assert (row.get('selected_version') or {}).get('url')
                  assert row.get('official_history_url')
                  assert row.get('exam_date_source_url')
          print(json.dumps({
              'stage3_machine_candidate_count': d.get('stage3_machine_candidate_count'),
              'record_count': d.get('record_count'),
              'status_counts': d.get('status_counts'),
              'historical_text_evidence_ready_count': d.get('historical_text_evidence_ready_count'),
              'eligible_for_historical_version_checked_count': d.get('eligible_for_historical_version_checked_count'),
              'historical_version_checked_count': d.get('historical_version_checked_count'),
          }, ensure_ascii=False, indent=2))
          PY
          else
            echo 'No Stage 4 evidence produced; external MOJ source failure remains fail-soft.'
          fi

      - name: Upload read-only Stage 4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-law-stage4-live-evidence
          path: |
            auto/qa/historical_law_article_stage3.v1.json
            auto/qa/historical_law_oldver_stage4.v1.json
          if-no-files-found: warn
          retention-days: 14
