name: Inspect Public Admin Dead Code

on:
  push:
    paths:
      - '.github/workflows/check-netlify-secrets.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate admin-only code in public index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          lines=text.splitlines()
          needles=('renderAdmin','adminLogin','adminLogout','doImport','CSV','ADMIN','admin')
          for i,line in enumerate(lines,1):
              if any(n in line for n in needles):
                  clipped=line if len(line)<700 else line[:700]+'…'
                  print(f'{i}: {clipped}')
          PY
