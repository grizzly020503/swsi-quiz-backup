name: Check Netlify Deployment Secrets

on:
  push:
    paths:
      - '.github/workflows/check-netlify-secrets.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check common Netlify secret names without exposing values
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          NETLIFY_SITE: ${{ secrets.NETLIFY_SITE }}
        shell: bash
        run: |
          for name in NETLIFY_AUTH_TOKEN NETLIFY_SITE_ID NETLIFY_TOKEN NETLIFY_API_TOKEN NETLIFY_SITE; do
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
