name: Fix Supabase SDK fallback

on:
  push:
    paths:
      - '.github/workflows/fix-sdk-fallback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='''async function fetchQuestionPage(from,to,maxAttempts=3){
            let lastError=null;
            for(let attempt=1; attempt<=maxAttempts; attempt++){
              try{
                showLoadProgress(from,attempt);
                const {data,error}=await sb.from('questions').select('*').range(from,to);
                if(error) throw error;
                return data||[];
              }catch(err){
                lastError=err;
                if(attempt<maxAttempts){
                  await sleep(700*attempt);
                }
              }
            }
            throw lastError || new Error('題庫載入失敗');
          }
          '''
          new='''async function fetchQuestionPage(from,to,maxAttempts=3){
            let lastError=null;
            for(let attempt=1; attempt<=maxAttempts; attempt++){
              try{
                showLoadProgress(from,attempt);
                if(sb && typeof sb.from==='function'){
                  const {data,error}=await sb.from('questions').select('*').range(from,to);
                  if(error) throw error;
                  return data||[];
                }
                const limit=to-from+1;
                const url=CONFIG.url.replace(/\\\/$/,'')+`/rest/v1/questions?select=*&offset=${from}&limit=${limit}`;
                const res=await fetch(url,{method:'GET',headers:{apikey:CONFIG.key,Authorization:`Bearer ${CONFIG.key}`,Accept:'application/json'},cache:'no-store'});
                if(!res.ok){
                  let detail='';
                  try{ detail=await res.text(); }catch(_e){}
                  throw new Error(`題庫 API ${res.status}${detail?': '+detail.slice(0,120):''}`);
                }
                const data=await res.json();
                return Array.isArray(data)?data:[];
              }catch(err){
                lastError=err;
                if(attempt<maxAttempts){ await sleep(700*attempt); }
              }
            }
            throw lastError || new Error('題庫載入失敗');
          }
          '''
          if old not in text:
              raise SystemExit('fetchQuestionPage block not found')
          text=text.replace(old,new,1)
          old2='''  try{
            sb=window.supabase.createClient(CONFIG.url,CONFIG.key);
            const {data:{session}}=await sb.auth.getSession();
            adminUser=session?session.user:null;
            await loadAll();
            tabbar.style.display='flex';
            if(ALL.length===0){ go('admin'); } else { go('home'); }
          }catch(e){
            app.innerHTML=`<div class="empty"><div class="ico">⚠</div><h3>暫時無法載入題庫</h3><p>${e.message||'網路連線失敗'}</p><p style="margin-top:8px">已自動重試 3 次。你的題庫不會因此消失，請稍後再試。</p><button class="btn" style="margin-top:18px" onclick="init()">重新連線</button></div>`;
          }
          '''
          new2='''  try{
            if(window.supabase && typeof window.supabase.createClient==='function'){
              sb=window.supabase.createClient(CONFIG.url,CONFIG.key);
              try{
                const {data:{session}}=await sb.auth.getSession();
                adminUser=session?session.user:null;
              }catch(_authErr){ adminUser=null; }
            }else{
              sb=null;
              adminUser=null;
            }
            await loadAll();
            tabbar.style.display='flex';
            if(ALL.length===0){ go('admin'); } else { go('home'); }
          }catch(e){
            app.innerHTML=`<div class="empty"><div class="ico">⚠</div><h3>暫時無法載入題庫</h3><p>${e.message||'網路連線失敗'}</p><p style="margin-top:8px">已自動重試 3 次。題庫已另有完整備份，不會因此消失。</p><button id="retry-load-btn" type="button" class="btn" style="margin-top:18px;position:relative;z-index:5;pointer-events:auto" onclick="retryLoad()">重新連線</button></div>`;
          }
          '''
          if old2 not in text:
              raise SystemExit('init block not found')
          text=text.replace(old2,new2,1)
          anchor='''/* ---------- 導航 ---------- */\n'''
          retry='''async function retryLoad(){\n  const btn=document.getElementById('retry-load-btn');\n  if(btn){ btn.disabled=true; btn.textContent='重新連線中…'; }\n  ALL=[]; SUBJECTS=[];\n  await init();\n}\n\n'''
          if anchor not in text:
              raise SystemExit('nav anchor not found')
          text=text.replace(anchor,retry+anchor,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "修正 Supabase SDK 載入失敗：加入 REST 備援與可用重試按鈕" || exit 0
          git push
