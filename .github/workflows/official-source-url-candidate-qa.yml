name: Official Source URL Candidate QA
on:
  pull_request:
    paths:
      - 'data/source_url_promotion_config.json'
      - 'scripts/source_url_promotion_stage.py'
      - 'scripts/source_url_promotion_selftest.py'
      - 'scripts/source_url_pg17_rehearsal.py'
      - 'scripts/source_url_exact_target_replay.py'
      - 'scripts/source_url_db_rollback_plan.py'
      - 'scripts/source_url_live_preflight.py'
      - 'scripts/historical_source_url_guard.py'
      - 'data/moex_source_subjects.v1.json'
      - '.github/workflows/official-source-url-candidate-qa.yml'
  push:
    branches: [main]
    paths:
      - 'data/source_url_promotion_config.json'
      - 'scripts/source_url_promotion_stage.py'
      - 'scripts/source_url_promotion_selftest.py'
      - 'scripts/source_url_pg17_rehearsal.py'
      - 'scripts/source_url_exact_target_replay.py'
      - 'scripts/source_url_db_rollback_plan.py'
      - 'scripts/source_url_live_preflight.py'
      - 'scripts/historical_source_url_guard.py'
      - 'data/moex_source_subjects.v1.json'
      - '.github/workflows/official-source-url-candidate-qa.yml'
permissions:
  contents: read
jobs:
  source-url-exact-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate exact 3,920 URL-only review candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/source_url_promotion_stage.py scripts/source_url_promotion_selftest.py scripts/source_url_exact_target_replay.py scripts/historical_source_url_guard.py scripts/source_url_live_preflight.py
          python3 scripts/source_url_exact_target_replay.py --root . --fixture-before "${RUNNER_TEMP}/swsi-pinned-before"
          SWSI_SOURCE_URL_TEST_ROOT="${RUNNER_TEMP}/swsi-pinned-before" python3 scripts/source_url_promotion_selftest.py
          python3 -m pip install --disable-pip-version-check requests
          python3 scripts/source_url_live_preflight.py --selftest
          python3 scripts/source_url_live_preflight.py --live
          git diff --exit-code
          git diff --check
  native-postgres17-source-url:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: swsi_fixture
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: swsi_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swsi_fixture -d swsi_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ephemeral PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Rehearse exact 3920 URL edits in PG TEMP tables and roll back
        env:
          SWSI_SYNTHETIC_PG17_CI: I_CONFIRM_DISPOSABLE_FIXTURE
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: swsi_fixture
          PGPASSWORD: ci-only-synthetic-password
          PGDATABASE: swsi_fixture
        run: |
          python3 scripts/source_url_exact_target_replay.py --root . --fixture-before "${RUNNER_TEMP}/swsi-pg-before"
          python3 scripts/source_url_pg17_rehearsal.py --root "${RUNNER_TEMP}/swsi-pg-before"
          python3 scripts/source_url_db_rollback_plan.py --root . --scratch "${RUNNER_TEMP}/swsi-dbplan-before" --sql-out "${RUNNER_TEMP}/swsi-url-ROLLBACK.sql" --synthetic-seed-out "${RUNNER_TEMP}/swsi-url-SEED.sql"
          psql -X -qAt -v ON_ERROR_STOP=1 < "${RUNNER_TEMP}/swsi-url-SEED.sql" | grep -Fx SOURCE_URL_QA_FIXTURE_4800_PASS
          before="$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT md5(string_agg(id||chr(31)||source_url, chr(30) ORDER BY id)) FROM public.questions")"
          psql -X -qAt -v ON_ERROR_STOP=1 < "${RUNNER_TEMP}/swsi-url-ROLLBACK.sql" > "${RUNNER_TEMP}/swsi-url-execution.log"
          grep -Fx SOURCE_URL_QA_POSTIMAGE_3920_PASS "${RUNNER_TEMP}/swsi-url-execution.log"
          grep -Fx SOURCE_URL_QA_ROLLBACK_DONE "${RUNNER_TEMP}/swsi-url-execution.log"
          after="$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT md5(string_agg(id||chr(31)||source_url, chr(30) ORDER BY id)) FROM public.questions")"
          test "$before" = "$after"
          echo 'NATIVE PG17 URL QA ONLY: 3920 source_url updates validated and FULL ROLLBACK verified'
