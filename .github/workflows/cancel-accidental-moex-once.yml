name: Cancel Accidental MOEX Run Once

on:
  push:
    branches:
      - feat/monitoring-v2-five-radars-20260901

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel feature-branch MOEX run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN: '33504987552'
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error -o /tmp/cancel.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/cancel")"
          if [ "$code" != '202' ] && [ "$code" != '409' ]; then
            cat /tmp/cancel.json >&2
            echo "unexpected cancel status: $code" >&2
            exit 1
          fi
          echo "MOEX run cancel request accepted/status=$code"
