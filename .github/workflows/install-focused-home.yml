name: Install Focused Home

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-focused-home.yml'
      - 'scripts/simplify_frontend_focus.py'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused-home patch
        run: python scripts/simplify_frontend_focus.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          text=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
          checked=0
          for i,src in enumerate(scripts):
              if not src.strip():
                  continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(src); name=f.name
              subprocess.run(['node','--check',name],check=True)
              checked+=1
          print('validated inline scripts:',checked)
          PY
      - name: Commit focused interface
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change.'
            exit 0
          fi
          git config user.name 'swsi-ui-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m '收斂首頁並加入指定歷屆刷題'
          git push
