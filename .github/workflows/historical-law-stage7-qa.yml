name: Historical Law Stage 7 QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_stage7_materialize.py'
      - 'scripts/historical_law_stage7_selftest.py'
      - 'scripts/historical_law_verified_registry_smoke.py'
      - 'scripts/historical_law_evidence_adjudication.py'
      - 'scripts/historical_law_evidence_adjudication_selftest.py'
      - 'scripts/historical_law_runtime_evidence_contract_smoke.py'
      - 'scripts/historical_law_runtime_sync_workflow_smoke.py'
      - 'scripts/historical_law_runtime_bootstrap_once_smoke.py'
      - 'data/historical_law_verified_priority10.v1.json'
      - 'data/historical_law_evidence_adjudication.v1.json'
      - 'data/historical_law_evidence_snapshot.v1.json'
      - 'data/law_question_links_priority10.v1.json'
      - 'cdn/question-shards/**'
      - 'audit/historical_law_evidence_adjudication_20261003.md'
      - 'supabase/functions/_shared/github_actions_oidc.ts'
      - 'supabase/functions/_shared/github_actions_oidc_test.ts'
      - 'supabase/functions/sync-historical-law-evidence/**'
      - 'supabase/migrations/20261005050000_historical_law_runtime_evidence.sql'
      - 'supabase/migrations/20261005062000_historical_law_runtime_evidence_least_privilege.sql'
      - 'supabase/recovery/edge_functions.json'
      - '.github/workflows/historical-law-runtime-sync.yml'
      - '.github/workflows/historical-law-runtime-bootstrap-once.yml'
      - '.github/workflows/historical-law-stage7-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-stage7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Syntax and deterministic materializer regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/historical_law_stage7_materialize.py \
            scripts/historical_law_stage7_selftest.py \
            scripts/historical_law_verified_registry_smoke.py \
            scripts/historical_law_evidence_adjudication.py \
            scripts/historical_law_evidence_adjudication_selftest.py \
            scripts/historical_law_runtime_evidence_contract_smoke.py \
            scripts/historical_law_runtime_sync_workflow_smoke.py \
            scripts/historical_law_runtime_bootstrap_once_smoke.py
          (cd scripts && python historical_law_stage7_selftest.py)
          python scripts/historical_law_verified_registry_smoke.py
          (cd scripts && python historical_law_evidence_adjudication_selftest.py)
          python scripts/historical_law_runtime_evidence_contract_smoke.py
          python scripts/historical_law_runtime_sync_workflow_smoke.py
          python scripts/historical_law_runtime_bootstrap_once_smoke.py
          python scripts/historical_law_evidence_adjudication.py --output /tmp/historical_law_verified_combined.v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/historical_law_verified_combined.v1.json').read_text(encoding='utf-8'))
          assert d['verified_record_count'] == 19, d['verified_record_count']
          assert d['historical_version_checked_count'] == 19
          assert d['verification_level_counts'] == {
              'machine_verified_historical_v1': 13,
              'evidence_adjudicated_historical_v1': 6,
          }
          protected={'stem','question','options','official_answer','answer','accepted_answers','grading_mode'}
          for row in d.get('records') or []:
              overlap=protected & set(row)
              assert not overlap, (row.get('question_id'), sorted(overlap))
          print('HISTORICAL LAW COMBINED VERIFIED REGISTRY OK: 13 machine + 6 evidence adjudicated = 19')
          PY
          git diff --check
      - name: Runtime evidence projection and sync candidate contract
        run: |
          set -euo pipefail
          deno test supabase/functions/_shared/github_actions_oidc_test.ts
          deno test supabase/functions/sync-historical-law-evidence/runtime_evidence_test.ts
          deno check supabase/functions/_shared/github_actions_oidc.ts
          deno check supabase/functions/sync-historical-law-evidence/runtime_evidence.ts
          deno check supabase/functions/sync-historical-law-evidence/index.ts
          deno eval --allow-read=/tmp/historical_law_verified_combined.v1.json '
            import { normalizeRegistry, materializeRegistry } from "./supabase/functions/sync-historical-law-evidence/runtime_evidence.ts";
            const payload = JSON.parse(await Deno.readTextFile("/tmp/historical_law_verified_combined.v1.json"));
            const normalized = normalizeRegistry(payload);
            if (normalized.record_count !== 19) throw new Error(`expected 19 runtime records, got ${normalized.record_count}`);
            if (normalized.machine_verified_count !== 13 || normalized.evidence_adjudicated_count !== 6) throw new Error("verification-level counts drift");
            const materialized = await materializeRegistry(normalized);
            if (!/^[0-9a-f]{64}$/.test(materialized.registry_sha256)) throw new Error("registry fingerprint invalid");
            if (materialized.rows.some((row) => !/^[0-9a-f]{64}$/.test(row.evidence_sha256))) throw new Error("record fingerprint invalid");
            console.log(`HISTORICAL LAW RUNTIME EVIDENCE OK records=${normalized.record_count} registry_sha256=${materialized.registry_sha256}`);
          '
      - name: Stage 7 trust-boundary AST guard
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/historical_law_stage7_materialize.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          violations = []
          checked_true_count = 0
          for node in ast.walk(tree):
              if isinstance(node, ast.Subscript) and isinstance(node.ctx, ast.Store):
                  key = node.slice.value if isinstance(node.slice, ast.Constant) else None
                  if key in protected:
                      violations.append(f'{path}:{node.lineno}: protected write {key}')
              if isinstance(node, ast.Dict):
                  for key_node, value_node in zip(node.keys, node.values):
                      key = key_node.value if isinstance(key_node, ast.Constant) else None
                      if key in protected:
                          violations.append(f'{path}:{node.lineno}: protected output field {key}')
                      if key == 'historical_version_checked' and isinstance(value_node, ast.Constant) and value_node.value is True:
                          checked_true_count += 1
          if violations:
              raise SystemExit('\n'.join(violations))
          assert checked_true_count == 1, f'expected exactly one Stage7 verification promotion site, got {checked_true_count}'
          print('HISTORICAL LAW STAGE7 TRUST BOUNDARY OK')
          PY
      - name: Registry cannot contain protected official-core fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path('data/historical_law_verified_priority10.v1.json').read_text(encoding='utf-8'))
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          for row in d.get('records') or []:
              overlap = protected & set(row)
              assert not overlap, (row.get('question_id'), sorted(overlap))
          print('HISTORICAL LAW VERIFIED REGISTRY PROTECTED CORE OK')
          PY
