name: Historical Law Stage 7 QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_stage7_materialize.py'
      - 'scripts/historical_law_stage7_selftest.py'
      - 'scripts/historical_law_verified_registry_smoke.py'
      - 'data/historical_law_verified_priority10.v1.json'
      - 'data/law_question_links_priority10.v1.json'
      - '.github/workflows/historical-law-stage7-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-stage7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax and deterministic materializer regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/historical_law_stage7_materialize.py \
            scripts/historical_law_stage7_selftest.py \
            scripts/historical_law_verified_registry_smoke.py
          (cd scripts && python historical_law_stage7_selftest.py)
          python scripts/historical_law_verified_registry_smoke.py
          git diff --check
      - name: Stage 7 trust-boundary AST guard
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/historical_law_stage7_materialize.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          violations = []
          checked_true_count = 0
          for node in ast.walk(tree):
              if isinstance(node, ast.Subscript) and isinstance(node.ctx, ast.Store):
                  key = node.slice.value if isinstance(node.slice, ast.Constant) else None
                  if key in protected:
                      violations.append(f'{path}:{node.lineno}: protected write {key}')
              if isinstance(node, ast.Dict):
                  for key_node, value_node in zip(node.keys, node.values):
                      key = key_node.value if isinstance(key_node, ast.Constant) else None
                      if key in protected:
                          violations.append(f'{path}:{node.lineno}: protected output field {key}')
                      if key == 'historical_version_checked' and isinstance(value_node, ast.Constant) and value_node.value is True:
                          checked_true_count += 1
          if violations:
              raise SystemExit('\n'.join(violations))
          assert checked_true_count == 1, f'expected exactly one Stage7 verification promotion site, got {checked_true_count}'
          print('HISTORICAL LAW STAGE7 TRUST BOUNDARY OK')
          PY
      - name: Registry cannot contain protected official-core fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(Path('data/historical_law_verified_priority10.v1.json').read_text(encoding='utf-8'))
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          for row in d.get('records') or []:
              overlap = protected & set(row)
              assert not overlap, (row.get('question_id'), sorted(overlap))
          print('HISTORICAL LAW VERIFIED REGISTRY PROTECTED CORE OK')
          PY
