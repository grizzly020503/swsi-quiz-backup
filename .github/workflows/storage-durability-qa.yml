name: Storage Durability QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/storage-durability-qa.yml'
      - 'monthly_patch_parts/**'
      - 'scripts/storage_durability_smoke.js'
      - 'scripts/monthly_patch_build.py'
      - 'index.html'
  pull_request:
    paths:
      - '.github/workflows/storage-durability-qa.yml'
      - 'monthly_patch_parts/**'
      - 'scripts/storage_durability_smoke.js'
      - 'scripts/monthly_patch_build.py'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: swsi-storage-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-storage-qa:
    runs-on: ubuntu-latest
    # Use the same pinned browser image exercised by Launch Readiness QA.
    # Feature branches rely on pull_request; main keeps push-time regression coverage.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax and source contract
        run: |
          set -euo pipefail
          test -f monthly_patch_parts/60.storage-durability.part
          test ! -e monthly_patch_parts/zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz_storage_durability.part
          grep -q 'SWSI Storage Durability Guard 2026-08-27' monthly_patch_parts/60.storage-durability.part
          grep -q '2026-08-27.schema-guard.v3' monthly_patch_parts/60.storage-durability.part
          if grep -q 'storageToast' monthly_patch_parts/zzzzzzzzzzzzzzzzzzzzzzzzzz_code_health_p0.part; then
            echo 'Code Health must not own storage persistence anymore.' >&2
            exit 1
          fi
          cat monthly_patch_parts/*.part > /tmp/monthly_patch.js
          node --check /tmp/monthly_patch.js
          node --check scripts/storage_durability_smoke.js
          grep -q 'SWSI Storage Durability Guard 2026-08-27' /tmp/monthly_patch.js
          grep -q '2026-08-27.schema-guard.v3' /tmp/monthly_patch.js
          grep -q 'HISTORY_MAX_RECORDS=8000' /tmp/monthly_patch.js
          grep -q 'quarantineCorruptStorage' /tmp/monthly_patch.js
          grep -q 'validReviewState' /tmp/monthly_patch.js

      - name: Build browser-test site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/icons
          cp index.html manifest.json sw.js apple-touch-icon.png _site/
          node scripts/build_essay_guides_runtime.js essay_guides.js _site/essay_guides.js
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Verify pinned Playwright and preinstalled Chromium
        timeout-minutes: 5
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          node -e 'const fs=require("fs"),p=require("playwright");if(require("playwright/package.json").version!=="1.55.0")throw Error("Playwright version mismatch");if(!fs.existsSync(p.chromium.executablePath()))throw Error("Chromium missing from pinned container")'

      - name: Storage durability browser smoke
        run: |
          set -euo pipefail
          python -m http.server 4173 --directory _site >/tmp/swsi-storage-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/storage_durability_smoke.js http://127.0.0.1:4173/
