name: Fix MOEX exam page check

on:
  push:
    paths:
      - '.github/workflows/fix-moex-exam-check.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relax page-level check while keeping PDF validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/moex_sync.py')
          s=p.read_text(encoding='utf-8')
          old='''    html = r.text\n    # 只承認「專技高考／高等考試_社會工作師」區塊；同一考試頁上的護理師、營養師等不算。\n    has_target_category = any(label in html for label in TARGET_CATEGORY_LABELS)\n    has_target_exam = TARGET_EXAM_PHRASE in html and TARGET_CLASS_NAME in html\n    return has_target_category and has_target_exam\n'''
          new='''    # 考試總頁同時列出多個專技類科，HTML 分類標籤並不固定；\n    # 此處只確認頁面確實含社會工作師與場次。真正的防呆在每份 PDF 標頭驗證。\n    html = r.text\n    compact = re.sub(r"\\s+", "", html)\n    return TARGET_CLASS_NAME in compact and ("第一次" in compact or "第二次" in compact)\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/moex_sync.py
          git commit -m "放寬考選部考試頁判斷並保留 PDF 防呆"
          git push
