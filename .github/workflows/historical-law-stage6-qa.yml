name: Historical Law Stage 6 QA

on:
  pull_request:
    paths:
      - 'scripts/historical_law_stage6_semantic.py'
      - 'scripts/historical_law_stage6_selftest.py'
      - '.github/workflows/historical-law-stage6-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-law-stage6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Syntax and deterministic regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/historical_law_stage6_semantic.py \
            scripts/historical_law_stage6_selftest.py
          (cd scripts && python historical_law_stage6_selftest.py)
          git diff --check
      - name: Protected-core trust boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('scripts/historical_law_stage6_semantic.py')
          tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          protected = {'stem', 'options', 'official_answer', 'accepted_answers', 'grading_mode'}
          violations = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Subscript) and isinstance(node.ctx, ast.Store):
                  key = node.slice.value if isinstance(node.slice, ast.Constant) else None
                  if key in protected:
                      violations.append(f'{path}:{node.lineno}: protected write {key}')
              if isinstance(node, ast.Dict):
                  for key_node, value_node in zip(node.keys, node.values):
                      key = key_node.value if isinstance(key_node, ast.Constant) else None
                      if key == 'historical_version_checked' and isinstance(value_node, ast.Constant) and value_node.value is True:
                          violations.append(f'{path}:{node.lineno}: historical_version_checked=True forbidden')
          if violations:
              raise SystemExit('\n'.join(violations))
          print('HISTORICAL LAW STAGE6 TRUST BOUNDARY OK')
          PY

  live-readonly-semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install live HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Rebuild Stage 3 candidates
        run: python scripts/historical_law_article_resolver.py
      - name: Rebuild Stage 4 official historical evidence
        run: python scripts/historical_law_oldver_stage4.py
      - name: Rebuild Stage 5 promotion contract
        run: python scripts/historical_law_stage5_promotion.py
      - name: Build Stage 6 historical semantic cross-check
        run: python scripts/historical_law_stage6_semantic.py
      - name: Validate Stage 6 read-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          s5 = json.loads(Path('auto/qa/historical_law_stage5_promotion.v1.json').read_text(encoding='utf-8'))
          s6 = json.loads(Path('auto/qa/historical_law_stage6_semantic.v1.json').read_text(encoding='utf-8'))
          rows = s6.get('records') or []
          assert s6.get('stage5_promotion_candidate_count') == s5.get('promotion_candidate_count')
          assert s6.get('record_count') == len(rows)
          assert s6.get('question_shard_error_count') == 0, s6.get('question_shard_errors')
          assert s6.get('historical_version_checked_count') == 0
          assert s6.get('protected_core_mutation_count') == 0
          assert all(row.get('historical_version_checked') is False for row in rows)
          assert all('official_answer' not in row for row in rows)
          assert sum((s6.get('status_counts') or {}).values()) == len(rows)
          allowed = {
              'historical_semantic_confirmed',
              'historical_semantic_support',
              'historical_semantic_conflict',
              'question_link_missing',
              'selected_version_missing',
              'source_failure',
              'source_identity_mismatch',
              'historical_articles_unavailable',
          }
          assert set(s6.get('status_counts') or {}).issubset(allowed), s6.get('status_counts')
          print(json.dumps({
              'stage5_promotion_candidate_count': s6.get('stage5_promotion_candidate_count'),
              'status_counts': s6.get('status_counts'),
              'historical_semantic_confirmed_count': s6.get('historical_semantic_confirmed_count'),
              'historical_semantic_support_count': s6.get('historical_semantic_support_count'),
              'historical_semantic_conflict_count': s6.get('historical_semantic_conflict_count'),
              'historical_version_checked_count': s6.get('historical_version_checked_count'),
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: historical-law-stage6-live-evidence
          path: |
            auto/qa/historical_law_article_stage3.v1.json
            auto/qa/historical_law_oldver_stage4.v1.json
            auto/qa/historical_law_stage5_promotion.v1.json
            auto/qa/historical_law_stage6_semantic.v1.json
          if-no-files-found: error
          retention-days: 14
