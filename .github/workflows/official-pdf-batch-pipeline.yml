name: Official PDF Batch Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - '.github/workflows/official-pdf-batch-pipeline.yml'
permissions:
  contents: read
concurrency:
  group: official-pdf-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Audit a reviewed immutable candidate; never merge or serve its held content.
      - uses: actions/checkout@v7
        with:
          ref: 7cd99a23f98ecc62fa18f104f154084650bef9c8
          fetch-depth: 1
      - name: Fetch only the pinned candidate preimage
        run: |
          base=$(python -c 'import json,re; p=json.load(open("audit/official_pdf_stem_repairs_20261029.json")); s=p["base_commit"]; assert re.fullmatch("[0-9a-f]{40}",s); print(s)')
          git fetch --no-tags --depth=1 origin "$base"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PDF text extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test checkpoint and source safety
        run: python scripts/official_pdf_batch_pipeline_selftest.py
      - name: Fingerprint exact audit inputs
        id: inputs
        run: echo "fingerprint=$(python scripts/official_pdf_batch_pipeline.py --fingerprint)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swsi-pdf-batch
          key: pdf-batch-${{ steps.inputs.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pdf-batch-${{ steps.inputs.outputs.fingerprint }}-
      - name: Resume bounded official source audit
        run: |
          python scripts/official_pdf_batch_pipeline.py \
            --out "$RUNNER_TEMP/swsi-pdf-batch" --download --batch-size 25 \
            --max-batches 4 --max-sources 12
      - name: Persist checkpoint after success or source outage
        if: always() && steps.inputs.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swsi-pdf-batch
          key: pdf-batch-${{ steps.inputs.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build priority-sorted reviewer index (evidence only)
        # One index over the immutable review queue; no official edits or approvals.
        # Skip after upstream failure to avoid a secondary monitoring alert.
        if: success()
        run: |
          python - <<'PY'
          import csv, hashlib, json, os, re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          base = Path(os.environ['RUNNER_TEMP']) / 'swsi-pdf-batch'
          report = json.loads((base / 'latest.json').read_text(encoding='utf-8'))
          key = str(report['input_fingerprint'])
          assert re.fullmatch(r'[0-9a-f]{64}', key)
          work = base / key
          queue = json.loads((work / 'queue.json').read_text(encoding='utf-8'))
          state = json.loads((work / 'checkpoint.json').read_text(encoding='utf-8'))
          rows = queue['rows']
          ids = [str(row['id']) for row in rows]
          assert len(rows) == report['queue_total'] == queue['unresolved']
          assert len(set(ids)) == len(ids)
          assert report['release_status'] == 'NO-GO'
          assert report['human_approval'] is False and queue['release_approval'] is False
          assert report['official_core_modified'] is False
          assert report['production_write'] is False and report['backup_operation'] is False
          assert all(row['status'] == 'review' and row['human_approval'] is False
                     and row['automatic_release_approval'] is False for row in rows)
          prepared = set(state['packets']).intersection(ids)
          assert len(prepared) == report['prepared_packets']
          counts = Counter(str(row['priority']) for row in rows)
          assert set(counts) <= {'0', '1', '2'}
          assert set(queue['priority_counts']) == set(counts)
          assert all(int(queue['priority_counts'][k]) == v for k, v in counts.items())

          out = base / 'priority-review-index.csv'
          with out.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow(['priority', 'kind', 'question_id', 'risk_flags',
                               'official_pdf_url', 'pdf_sha256', 'packet_prepared',
                               'human_approved', 'release_approved'])
              for row in rows:
                  source = str(row.get('source_url') or '')
                  if source:
                      url = urlsplit(source)
                      assert (url.scheme == 'https' and url.hostname == 'wwwq.moex.gov.tw'
                              and url.path == '/exam/wHandExamQandA_File.ashx'
                              and not url.username and not url.password)
                  sha = str(row.get('pdf_sha256') or '')
                  assert re.fullmatch(r'[0-9a-f]{64}', sha)
                  writer.writerow([row['priority'], row['kind'], row['id'],
                                   '; '.join(row['flags']), source, sha,
                                   row['id'] in prepared, False, False])

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Official PDF source-review priorities (NOT APPROVED)\n\n')
              summary.write(f"Prepared evidence packets: **{len(prepared)}/{len(rows)}**. ")
              summary.write("These are source-review candidates, not verified corrections.\n\n")
              summary.write('| Review priority | Records | Meaning |\n|---|---:|---|\n')
              for rank, label in [('0', 'Numbers / negations / grading'), 
                                  ('1', 'Text / glyph / extraction'),
                                  ('2', 'Punctuation only')]:
                  summary.write(f'| {rank} | {counts[rank]} | {label} |\n')
              summary.write('\n### Priority 0 — compare the original PDF page first\n\n')
              summary.write('| Question | Risk flags | Evidence prepared | Official PDF |\n')
              summary.write('|---|---|---|---|\n')
              for row in rows:
                  if row['priority'] != 0:
                      continue
                  ident = str(row['id']).replace('|', '\\|')
                  flags = ', '.join(row['flags']).replace('|', '\\|')
                  official = str(row.get('source_url') or '')
                  link = f'[source PDF]({official})' if official else 'source missing'
                  ready = 'yes' if row['id'] in prepared else 'no'
                  summary.write(f'| {ident} | {flags} | {ready} | {link} |\n')
              summary.write('\n**NO-GO:** source evidence and risk flags never constitute '
                            'human approval. No official question, answer, scoring, AI, '
                            'Cloudflare or Netlify changes are authorized here.\n')
          print(f"REVIEW INDEX OK: total={len(rows)} prepared={len(prepared)} "
                f"p0={counts['0']} p1={counts['1']} p2={counts['2']} no_approvals=1")
          PY
      - name: Crosscheck held P0 against current main (read only)
        if: success()
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          python - <<'PY'
          import csv,hashlib,json,os,re,subprocess
          from collections import Counter
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'swsi-pdf-batch'
          report=json.loads((root/'latest.json').read_text())
          work=root/report['input_fingerprint']
          queue=json.loads((work/'queue.json').read_text())
          checkpoint=json.loads((work/'checkpoint.json').read_text())
          assert queue['unresolved']==report['queue_total']==428
          assert report['release_status']=='NO-GO' and report['human_approval'] is False
          main=subprocess.check_output(['git','rev-parse','FETCH_HEAD'],text=True).strip()
          assert re.fullmatch('[0-9a-f]{40}',main)
          cache={}
          result=[]
          for item in queue['rows']:
              if item['priority']!=0:continue
              ident=item['id']
              if item['kind']=='essay':
                  result.append((ident,'essay','not_compared','',item['source_url']))
                  continue
              assert item['kind']=='mcq'
              m=re.search(r'(10[4-9]|11[0-5])-([12])-\d+$',ident)
              assert m
              name=f'cdn/question-shards/{m[1]}-{m[2]}.json'
              if name not in cache:
                  data=json.loads(subprocess.check_output(['git','show',main+':'+name],text=True))
                  assert len(data['questions'])==200
                  cache[name]={x['id']:x for x in data['questions']}
              live=cache[name][ident]
              file=work/'packets'/(hashlib.sha256(ident.encode()).hexdigest()+'.json')
              raw=file.read_bytes()
              assert hashlib.sha256(raw).hexdigest()==checkpoint['packets'][ident]
              old=json.loads(raw)['current_official_record']
              keys=('question','opt_a','opt_b','opt_c','opt_d',
                    'answer','accepted_answers','grading_mode')
              diff=[k for k in keys if old.get(k)!=live.get(k)]
              result.append((ident,'mcq','changed' if diff else 'same',
                             ';'.join(diff),item['source_url']))
          assert len(result)==queue['priority_counts']['0']==27
          c=Counter(x[2] for x in result)
          assert c['not_compared']==4 and c['changed']+c['same']==23
          with (root/'priority0-main-comparison.csv').open('w',encoding='utf-8-sig',newline='') as fp:
              w=csv.writer(fp)
              w.writerow(['id','kind','current_main_vs_pinned','changed_fields',
                          'official_pdf','main_sha','approved'])
              for ident,kind,status,diff,url in result:
                  w.writerow([ident,kind,status,diff,url,main,False])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as fp:
              fp.write('\n## Current main versus old pinned P0 candidate\n\n')
              fp.write('main='+main+'; content change is not official proof.\n\n')
              fp.write('Changed: '+str(c['changed'])+'; unchanged: '+str(c['same'])+
                       '; essays not compared: '+str(c['not_compared'])+'.\n\n')
              fp.write('**NO-GO**: all 428 source reviews remain pending independent approval.\n')
          print('P0 MAIN COMPARISON OK '+json.dumps(dict(c),sort_keys=True))
          PY
      - name: Preserve exact-head audit and candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-pdf-batch-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/swsi-pdf-batch/latest.json
            ${{ runner.temp }}/swsi-pdf-batch/**/summary.json
            ${{ runner.temp }}/swsi-pdf-batch/**/checkpoint.json
            ${{ runner.temp }}/swsi-pdf-batch/**/inputs.json
            ${{ runner.temp }}/swsi-pdf-batch/**/checks.json
            ${{ runner.temp }}/swsi-pdf-batch/**/check-*.log
            ${{ runner.temp }}/swsi-pdf-batch/**/full-corpus.json
            ${{ runner.temp }}/swsi-pdf-batch/**/queue.json
            ${{ runner.temp }}/swsi-pdf-batch/priority-review-index.csv
            ${{ runner.temp }}/swsi-pdf-batch/priority0-main-comparison.csv
            ${{ runner.temp }}/swsi-pdf-batch/**/packets/*.json
            ${{ runner.temp }}/swsi-pdf-batch/**/verified-candidate/**
          retention-days: 14
          if-no-files-found: warn
      - name: Publish measured progress and unchanged release hold
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'swsi-pdf-batch/latest.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Official PDF batch pipeline\n\n')
              if not path.exists():
                  out.write('No completed summary. Check failure logs/checkpoint artifact; no release approval.\n')
              else:
                  report=json.loads(path.read_text())
                  out.write('```json\n'+json.dumps(report,ensure_ascii=False,indent=2)+'\n```\n')
                  out.write('\nPrepared packets are pending source review, not corrected/approved questions. Existing PDF/AI release gates still apply.\n')
          PY
