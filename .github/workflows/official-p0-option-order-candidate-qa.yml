name: Official P0 Option Order Candidate QA

# No production import, writes, sync, or owner approval.
on:
  pull_request:
    paths:
      - 'audit/official_p0_option_order_candidate_20261110.json'
      - 'audit/official_p0_option_order_live_preflight_20261110.sql'
      - 'audit/official_p0_option_order_live_trigger_preflight_20261111.sql'
      - 'audit/official_p0_option_order_pg17_synthetic_rollback_20261111.sql'
      - 'scripts/official_p0_option_order_candidate_selftest.py'
      - 'scripts/official_p0_option_order_release_rehearsal.py'
      - '.github/workflows/official-p0-option-order-candidate-qa.yml'
      - 'cdn/question-shards/104-2.json'
      - 'cdn/question-shards/107-1.json'

permissions:
  contents: read

jobs:
  candidate:
    name: Verify official answer and option mapping (draft only)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile proof validator
        run: python -m py_compile scripts/official_p0_option_order_candidate_selftest.py scripts/official_p0_option_order_release_rehearsal.py
      - name: Verify official options, exact production preimages, and read-only hold
        run: python scripts/official_p0_option_order_candidate_selftest.py
      - name: Rehearse two-shard manifest and official lock projection, then byte-restore
        run: python scripts/official_p0_option_order_release_rehearsal.py
      - name: Check immutable official corpus
        run: python scripts/official_exam_readonly_guard.py
      - name: Preserve human review gate
        if: always()
        run: |
          echo "## TWO P0 OPTION-ORDER CANDIDATES — NOT PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
          echo "- 2 records, 5 option corrections, official answer unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Read-only 37-column SHA-256 production preflight pinned (NOT executed by PR CI)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Two-shard / 4,800 MCQ / 240 essay locks simulated and byte-reversed in temporary directory only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source-review queue: 428 unresolved; human/owner release approval: NO-GO" >> "$GITHUB_STEP_SUMMARY"

  synthetic-pg17:
    name: Rehearse guarded UPDATE then ROLLBACK (isolated PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: swsi_fixture
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: swsi_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swsi_fixture -d swsi_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Guard against production URLs and execute disposable SQL transaction
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: swsi_fixture
          PGPASSWORD: ci-only-synthetic-password
          PGDATABASE: swsi_fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = "127.0.0.1"
          test "$PGUSER" = "swsi_fixture"
          test "$PGDATABASE" = "swsi_fixture"
          sql="audit/official_p0_option_order_pg17_synthetic_rollback_20261111.sql"
          psql -X -qAt -v ON_ERROR_STOP=1 -f "$sql" | tee "$RUNNER_TEMP/p0-pg17-rehearsal.log"
          grep -Fx 'P0_OPTION_PG17_SYNTHETIC_ROLLBACK_PASS' "$RUNNER_TEMP/p0-pg17-rehearsal.log"
      - name: Report fixture-only verdict
        if: always()
        run: |
          echo "## PG17 synthetic transaction rehearsal only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synthetic source-change trigger resets AI to pending; option-only SQL avoids AFTER UPDATE OF analysis_status."\n          echo "- All 37 columns of two synthetic rows restored after real SQL UPDATE and ROLLBACK." >> "$GITHUB_STEP_SUMMARY"
          echo "- No Supabase credentials, no production connection, no full trigger parity or release approval." >> "$GITHUB_STEP_SUMMARY"
