name: Current Affairs Supabase Sync QA

on:
  pull_request:
    paths:
      - 'data/current_affairs_sources.json'
      - 'scripts/current_affairs_watch.py'
      - 'scripts/current_affairs_supabase_sync_smoke.py'
      - 'scripts/moex_workflow_ownership_smoke.py'
      - 'supabase/functions/sync-current-affairs/index.ts'
      - 'supabase/functions/sync-current-affairs/payload_contract.ts'
      - 'supabase/functions/sync-current-affairs/payload_contract_test.ts'
      - 'supabase/functions/_shared/github_actions_oidc.ts'
      - 'supabase/functions/_shared/github_actions_oidc_test.ts'
      - '.github/workflows/public-monitoring-feed.yml'
      - '.github/workflows/moex-social-worker-sync.yml'
      - '.github/workflows/current-affairs-supabase-sync-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install scanner parser dependency
        run: python -m pip install --disable-pip-version-check feedparser
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify GitHub OIDC negative-claims regression and Edge typecheck
        run: |
          deno test supabase/functions/_shared/github_actions_oidc_test.ts
          deno test supabase/functions/sync-current-affairs/payload_contract_test.ts
          deno check supabase/functions/sync-current-affairs/payload_contract.ts
          deno check supabase/functions/sync-current-affairs/index.ts
      - name: Verify source/category/auth/owner policy contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/current_affairs_watch.py \
            scripts/current_affairs_supabase_sync_smoke.py \
            scripts/moex_workflow_ownership_smoke.py
          python scripts/current_affairs_supabase_sync_smoke.py
          python scripts/moex_workflow_ownership_smoke.py
          git diff --check
