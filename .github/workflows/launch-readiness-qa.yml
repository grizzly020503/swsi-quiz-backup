name: Launch Readiness QA

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/launch-readiness-qa.yml'
      - 'monthly_patch_parts/**'
      - 'scripts/launch_readiness_smoke.js'
      - 'scripts/pwa_resilience_smoke.js'
      - 'scripts/prelaunch_deadend_smoke.js'
      - 'scripts/prelaunch_error_states_smoke.js'
      - 'scripts/prelaunch_accessibility_touch_smoke.js'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/build_essay_guides_runtime.js'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'essay_guides.js'
      - 'auto/**'
      - 'cdn/question-shards/**'
  pull_request:
    paths:
      - '.github/workflows/launch-readiness-qa.yml'
      - 'monthly_patch_parts/**'
      - 'scripts/launch_readiness_smoke.js'
      - 'scripts/pwa_resilience_smoke.js'
      - 'scripts/prelaunch_deadend_smoke.js'
      - 'scripts/prelaunch_error_states_smoke.js'
      - 'scripts/prelaunch_accessibility_touch_smoke.js'
      - 'scripts/monthly_patch_build.py'
      - 'scripts/build_essay_guides_runtime.js'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'essay_guides.js'
      - 'auto/**'
      - 'cdn/question-shards/**'

permissions:
  contents: read

concurrency:
  group: swsi-launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-launch-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        run: |
          node --check scripts/launch_readiness_smoke.js
          node --check scripts/pwa_resilience_smoke.js
          node --check scripts/prelaunch_deadend_smoke.js
          node --check scripts/prelaunch_error_states_smoke.js
          node --check scripts/prelaunch_accessibility_touch_smoke.js
          node --check sw.js

      - name: Build browser-test site
        run: |
          rm -rf _site
          mkdir -p _site/icons
          cp index.html manifest.json sw.js apple-touch-icon.png _site/
          node scripts/build_essay_guides_runtime.js essay_guides.js _site/essay_guides.js
          cat monthly_patch_parts/*.part > _site/monthly_patch.js
          node --check _site/monthly_patch.js
          cp icons/icon-192.png icons/icon-512.png _site/icons/
          if [ -d auto ]; then cp -R auto _site/; fi
          python scripts/monthly_patch_build.py _site/index.html

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Mobile launch, dead-end, error-state, accessibility and PWA resilience smoke
        run: |
          python -m http.server 4173 --directory _site >/tmp/swsi-launch-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/launch_readiness_smoke.js http://127.0.0.1:4173/
          node scripts/prelaunch_deadend_smoke.js http://127.0.0.1:4173/
          node scripts/prelaunch_error_states_smoke.js http://127.0.0.1:4173/
          node scripts/prelaunch_accessibility_touch_smoke.js http://127.0.0.1:4173/
          node scripts/pwa_resilience_smoke.js http://127.0.0.1:4173/

  production-release-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact production URL and Round 8 release files
        env:
          SITE: https://swsi-quiznetlify.netlify.app
        run: |
          set -euo pipefail
          fetch_prod() {
            path="$1"
            out="$2"
            code="$(curl --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -o "$out" -w '%{http_code}' "$SITE$path?release_check=$GITHUB_RUN_ID")"
            echo "PRODUCTION $path -> HTTP $code"
            test "$code" = '200'
          }

          fetch_prod / /tmp/prod-index.html
          fetch_prod /sw.js /tmp/prod-sw.js
          fetch_prod /monthly_patch.js /tmp/prod-monthly-patch.js
          fetch_prod /auto/essays_auto.json /tmp/prod-essays.json

          grep -q '社工師國考免費題庫｜SWSI' /tmp/prod-index.html
          grep -q 'monthly_patch.js' /tmp/prod-index.html
          grep -q "const VERSION = 'v6'" /tmp/prod-sw.js
          ! grep -q "const VERSION = 'v5'" /tmp/prod-sw.js
          grep -q '2026-08-26.fail-closed.v2' /tmp/prod-monthly-patch.js
          grep -q '2026-08-26.sha256.v2' /tmp/prod-monthly-patch.js
          grep -q '2026-08-26.unified-grading.v2' /tmp/prod-monthly-patch.js
          grep -q '2026-08-26.typed-errors.v2' /tmp/prod-monthly-patch.js
          grep -q '2026-08-27.schema-guard.v3' /tmp/prod-monthly-patch.js
          grep -q 'SWSI Product V1 Lock 2026-08-26' /tmp/prod-monthly-patch.js
          grep -q 'SWSI Law Trust Final Batch 2026-08-26' /tmp/prod-monthly-patch.js
          grep -q 'SWSI Theory Trust Final Batch 2026-08-26' /tmp/prod-monthly-patch.js
          grep -q '資產建構／資產累積理論' /tmp/prod-index.html
          grep -q '無條件基本收入 UBI' /tmp/prod-index.html

          if grep -q 'SWSI CLOUDFLARE FRONTEND PREVIEW' /tmp/prod-index.html; then
            echo 'Preview marker found on production' >&2
            exit 1
          fi
          if grep -q 'swsi-preview-banner' /tmp/prod-index.html; then
            echo 'Preview banner found on production' >&2
            exit 1
          fi
          if grep -q 'noindex,nofollow,noarchive' /tmp/prod-index.html; then
            echo 'Preview noindex leaked to production' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/prod-essays.json').read_text(encoding='utf-8'))
          raw=json.dumps(payload,ensure_ascii=False)
          for bad in ('\ue129','\ue12a','\ue12b'):
              assert bad not in raw, f'production essay payload contains private-use glyph {bad!r}'
          assert '（一）' in raw and '（二）' in raw
          print('NETLIFY PRODUCTION HTTP RELEASE CHECK OK')
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real browser smoke on official Netlify URL
        run: |
          node scripts/grading_contract_smoke.js 'https://swsi-quiznetlify.netlify.app/?release_check=${{ github.run_id }}'
          node scripts/browser_interaction_smoke.js 'https://swsi-quiznetlify.netlify.app/?release_check=${{ github.run_id }}'
          echo 'NETLIFY PRODUCTION BROWSER RELEASE CHECK OK'
