name: AI Analyzer Route QA

on:
  pull_request:
    paths:
      - 'supabase/functions/analyze-pending-questions/index.ts'
      - 'supabase/functions/analyze-pending-questions/current_legal_trust.ts'
      - 'supabase/functions/analyze-pending-questions/current_legal_trust_test.ts'
      - 'supabase/functions/analyze-pending-questions/enrichment_route.ts'
      - 'supabase/functions/analyze-pending-questions/enrichment_route_test.ts'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'scripts/cloudflare_worker_smoke.js'
      - 'ai_eval/golden_set.json'
      - 'data/enrichment_decision_policy.v1.json'
      - 'data/question_qa_policy_v1.json'
      - 'data/legal_watch_names.json'
      - '.github/workflows/question-shards-publish.yml'
      - 'scripts/analyzer_proxy_route_smoke.py'
      - 'scripts/analyzer_retry_contract_smoke.py'
      - 'scripts/analyzer_trust_routing_activation_smoke.py'
      - 'scripts/enrichment_decision.py'
      - 'scripts/enrichment_decision_current.py'
      - 'scripts/analyzer_enrichment_route_plan.py'
      - 'scripts/analyzer_enrichment_route_plan_selftest.py'
      - '.github/workflows/ai-analyzer-route-qa.yml'
      - '.github/workflows/prepare-cloudflare-soft-launch-artifact.yml'
      - '.github/workflows/cloudflare-public-candidate.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/analyze-pending-questions/index.ts'
      - 'supabase/functions/analyze-pending-questions/current_legal_trust.ts'
      - 'supabase/functions/analyze-pending-questions/current_legal_trust_test.ts'
      - 'supabase/functions/analyze-pending-questions/enrichment_route.ts'
      - 'supabase/functions/analyze-pending-questions/enrichment_route_test.ts'
      - 'cloudflare/wandering-wave-4418/worker.js'
      - 'scripts/cloudflare_worker_smoke.js'
      - 'ai_eval/golden_set.json'
      - 'data/enrichment_decision_policy.v1.json'
      - 'data/question_qa_policy_v1.json'
      - 'data/legal_watch_names.json'
      - '.github/workflows/question-shards-publish.yml'
      - 'scripts/analyzer_proxy_route_smoke.py'
      - 'scripts/analyzer_retry_contract_smoke.py'
      - 'scripts/analyzer_trust_routing_activation_smoke.py'
      - 'scripts/enrichment_decision.py'
      - 'scripts/enrichment_decision_current.py'
      - 'scripts/analyzer_enrichment_route_plan.py'
      - 'scripts/analyzer_enrichment_route_plan_selftest.py'
      - '.github/workflows/ai-analyzer-route-qa.yml'
      - '.github/workflows/prepare-cloudflare-soft-launch-artifact.yml'
      - '.github/workflows/cloudflare-public-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify canonical AI analyzer route, model, and enrichment decision boundary
        run: |
          python -m py_compile \
            scripts/analyzer_proxy_route_smoke.py \
            scripts/analyzer_retry_contract_smoke.py \
            scripts/analyzer_trust_routing_activation_smoke.py \
            scripts/enrichment_decision.py \
            scripts/enrichment_decision_current.py \
            scripts/analyzer_enrichment_route_plan.py \
            scripts/analyzer_enrichment_route_plan_selftest.py
          python scripts/analyzer_proxy_route_smoke.py
          python scripts/analyzer_retry_contract_smoke.py
          python scripts/analyzer_trust_routing_activation_smoke.py
          python scripts/analyzer_enrichment_route_plan_selftest.py
          deno test supabase/functions/analyze-pending-questions/current_legal_trust_test.ts
          deno test supabase/functions/analyze-pending-questions/enrichment_route_test.ts
          deno check supabase/functions/analyze-pending-questions/current_legal_trust.ts
          deno check supabase/functions/analyze-pending-questions/enrichment_route.ts
          deno check supabase/functions/analyze-pending-questions/index.ts
