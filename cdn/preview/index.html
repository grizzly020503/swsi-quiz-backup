/* ===== 外觀精修 START（純樣式，不改任何功能；可整段刪除還原） ===== */
:root{
  --card:#FBFCFB; --line-soft:#E8EEEA;
  --e1:0 1px 2px rgba(42,44,42,.045), 0 6px 16px -10px rgba(42,44,42,.18);
  --e2:0 2px 6px rgba(42,44,42,.06), 0 16px 32px -14px rgba(42,44,42,.22);
  --hi:inset 0 1px 0 rgba(255,255,255,.7);
}

/* —— 卡片：統一圓角 + 紙感層次 —— */
.time-card,.qcard,.ecard,.gcard,.sumcard{ background:var(--card); box-shadow:var(--e1),var(--hi); }
.time-card,.ecard,.gcard{ border-radius:16px; }
.qcard,.sumcard{ border-radius:20px; }
.time-card:hover,.gcard:hover,.ecard:hover,.ecard.open{ box-shadow:var(--e2),var(--hi); }

/* —— 主按鈕：收斂字距、柔和漸層、按下微沉 —— */
.btn{ letter-spacing:2px; background:linear-gradient(180deg,#54857C,var(--pine-deep));
  box-shadow:0 6px 16px -6px rgba(63,105,97,.5),var(--hi);
  transition:transform .15s,box-shadow .15s,filter .15s; }
.btn:hover{ filter:brightness(1.04); }
.btn:active{ transform:translateY(1px); box-shadow:0 3px 10px -6px rgba(63,105,97,.5); }
.btn:disabled{ background:#C2C9C4; box-shadow:none; filter:none; transform:none; }
.btn.ghost{ background:none; box-shadow:none; }
.btn.ghost:active{ transform:translateY(1px); }

/* —— 選項：圓形編號 —— */
.opt{ align-items:center; }
.opt .lab{ width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:13px;
  background:#fff; border:1px solid var(--line); color:var(--ink-soft); transition:.16s; }
.opt.sel .lab{ background:var(--pine); color:#fff; border-color:var(--pine); }
.opt.correct .lab{ background:var(--correct); color:#fff; border-color:var(--correct); }
.opt.wrong .lab{ background:var(--wrong); color:#fff; border-color:var(--wrong); }

/* —— Hero：層次漸層 + 內光（文字浮在上層） —— */
.hero{ position:relative; overflow:hidden;
  background:linear-gradient(152deg,#52837A 0%,#456E66 48%,#385A53 100%);
  box-shadow:0 12px 34px -10px rgba(43,62,57,.34),0 2px 8px rgba(43,62,57,.14); }
.hero::before{ content:""; position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background:radial-gradient(120% 80% at 88% -10%,rgba(255,255,255,.18),transparent 55%); }
.hero::after{ content:""; position:absolute; left:0; right:0; top:0; height:1px; background:rgba(255,255,255,.3); z-index:0; }
.hero>*{ position:relative; z-index:1; }

/* —— 底部分頁：當前頁綠色指示條 + 圖示去灰 —— */
.tabbar button{ position:relative; }
.tabbar .ico{ filter:grayscale(1) opacity(.55); transition:.16s; }
.tabbar button.on .ico{ filter:none; }
.tabbar button.on::before{ content:""; position:absolute; top:0; width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--pine); }

/* —— 小元件 —— */
.stat{ border-radius:14px; box-shadow:var(--e1),var(--hi); }
.field input{ border-radius:12px; }

/* —— 功能列改為「懸浮」：整條往上浮、離開螢幕最底邊緣（下方露出背景，避開保護殼／Home 列）—— */
.tabbar{
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: calc(100% - 24px);

inson 的成年發展八階段為何？（10 分） (二)對於中高齡失業所造成的各種影響，社會工作者要如何因應並提出解決的方法。（15 分）","points":"25","topic":"Levinson成人發展理論","major":"人類行為與社會環境","keywords":["中高齡","失業","Levinson","成年發展八階段","中年危機"],"theories":["Levinson成人發展理論"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["中年發展","就業服務"],"cluster":"DEV1","cluster_name":"心理社會與認知道德發展理論"},{"id":"人類行為與社會環境-105-2-申論1","subject":"人類行為與社會環境","year":"105","round":"第2次","qno":"1","q":"照顧是一份愛的勞動，雖然失能老人主要家庭照顧者可以從過程中獲得一些正向回饋，但是長 期且繁重的照顧工作對主要照顧者而言，仍是沉重的負荷。試說明此沉重的照顧負荷對失能老 人主要家庭照顧者可能引發的負面影響為何？並且進一步說明他們所需要的協助。(25 分)","points":"25","topic":"家庭照顧者負荷","major":"老人福利","keywords":["失能老人","家庭照顧者","照顧負荷","長期照顧","喘息服務"],"theories":["照顧者壓力理論"],"laws":["長期照顧服務法"],"difficulty":"中等","frequency":"中頻","qtype":"理論說明題","related":["長期照顧","老人福利"],"cluster":"AGE1","cluster_name":"老人福利.長照.老人保護"},{"id":"人類行為與社會環境-105-2-申論2","subject":"人類行為與社會環境","year":"105","round":"第2次","qno":"2","q":"「家庭」，應該提供兒童少年成長過程中必要之保護與協助，但是兒童少年來自家庭的虐待事件 仍不斷發生。試說明造成家庭中兒童少年虐待事件發生的可能原因為何？以及受虐事件對兒童 少年可能造成的影響為何？(25 分)","points":"25","topic":"兒少虐待成因與影響","major":"保護性社會工作","keywords":["兒童虐待","家庭暴力","受虐影響","兒少保護","風險因子"],"theories":["生態系統理論"],"laws":["兒童及少年福利與權益保障法"],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["目睹兒童","家庭暴力"],"cluster":"PRO1","cluster_name":"兒少保護"},{"id":"人類行為與社會環境-104-1-申論1","subject":"人類行為與社會環境","year":"104","round":"第1次","qno":"1","q":"貧窮會有世代承襲的惡性循環，導致貧窮的原因可能為何？試以功能主義、衝突理論及互動理論 的觀點來解釋貧窮之原因。（25 分）","points":"25","topic":"貧窮與社會階層","major":"人類行為與社會環境","keywords":["貧窮","世代循環","功能主義","衝突理論","符號互動論"],"theories":["功能主義","衝突理論","符號互動論"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"比較題","related":["社會流動","社會排除","社會階層"],"cluster":"SOC1","cluster_name":"社會學理論與社會問題"},{"id":"人類行為與社會環境-104-1-申論2","subject":"人類行為與社會環境","year":"104","round":"第1次","qno":"2","q":"最近社會新聞時有報導恐怖情人事件（victim precipitation of rape），試以指責強暴受害者 觀點、加害者精神病理學論（psychopathology of rapists）以及女性主義觀點（feminist perspective），分別敘述強暴之觀點，另外一般女性對強暴之迷思為何？（25 分）","points":"25","topic":"性別暴力與強 三十，這將影響原本服務的規模。請問您如何應用上述的四種資源分配的標準提供案主服務？（25 分）","points":"25","topic":"倫理兩難(資源分配 間接實務)","major":"社會工作理論","keywords":["倫理兩難","Reamer","資源分配","間接實務","倫理決策"],"theories":["Reamer倫理抉擇","專業倫理"],"laws":[],"difficulty":"困難","frequency":"高頻","qtype":"理論說明題","related":["倫理決策模式","社會正義"],"cluster":"ETH2","cluster_name":"倫理兩難與倫理決策"},{"id":"社會工作-111-2-申論1","subject":"社會工作","year":"111","round":"第2次","qno":"1","q":"試以在短期家外安置受虐兒童少年保護工作中，依據生態觀點（ecological perspective）說明基 本假設、指認案主系統，以及生態評估要點？（25 分）","points":"25","topic":"生態觀點(兒少保護)","major":"保護性社會工作","keywords":["生態觀點","生態系統","兒少保護","家外安置","案主系統"],"theories":["生態系統理論"],"laws":["兒童及少年福利與權益保障法"],"difficulty":"中等","frequency":"高頻","qtype":"案例分析題","related":["安置","生態評估"],"cluster":"PRO1","cluster_name":"兒少保護"},{"id":"社會工作-111-2-申論2","subject":"社會工作","year":"111","round":"第2次","qno":"2","q":"中輟未成年少女懷孕後結婚，和新生兒住婆家。案主希望完成高中學業。婆家表示：自家有生 意，不需去外面找工作，在家照顧孩子就好；案主的丈夫與原生家庭也覺得，當了媽媽就該為 孩子考慮。案主面對來自家人的期望，身為母親對孩子的責任與自己的心願，非常為難。請運 用女性主義實務原則，說明社會工作者可以和案主討論的議題有那些？（25 分）","points":"25","topic":"女性主義社會工作","major":"社會工作理論","keywords":["女性主義","女性主義實務","未成年懷孕","充權","性別"],"theories":["女性主義觀點"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"案例分析題","related":["增權","性別"],"cluster":"CRI1","cluster_name":"反壓迫.結構.批判.女性主義"},{"id":"社會工作-110-1-申論1","subject":"社會工作","year":"110","round":"第1次","qno":"1","q":"試論述運用任務中心取向（Task-Centered Approach）提供服務，對社會工作責信（accountability） 有何意義？（25 分）","points":"25","topic":"任務中心模式與責信","major":"社會工作直接服務","keywords":["任務中心","責信","accountability","處遇成效","短期處遇"],"theories":["任務中心模式"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"理論說明題","related":["責信","短期處遇"],"cluster":"TCM1","cluster_name":"任務中心模式"},{"id":"社會工作-110-1-申論2","subject":"社會工作","year":"110","round":"第1次","qno":"2","q":"臺灣的東南亞裔女性新住民人口日增，不少研究顯示：這些新住民易處於不公平與不友善的環 境，並面臨各類生活考驗。例如：婚姻關係、家庭問題，和子女生養與教育問題；甚至還有居 留與工作權、種族歧視、污名化等社會問題，易陷入多重弱勢生活困境。試問在臺灣社會工作 者如何增權新住民女性？（25 分）","points":"25","topic":"增強權能(新住民)","major":"社會工作理論","keywords":["增強權能","增權","新住民","多重弱勢","充權"],"theories":[ 的 女兒一樣。李小姐計劃今年暑假出國，林社工建議可以讓李媽媽短期安置到另一家全日照顧 之養護中心。但是李小姐表示媽媽可能無法適應，希望林社工晚上到家裡幫忙照顧。林社工 在難以拒絕請求下答應。事後機構同事王社工得知林社工晚間到府提供照顧服務，其實是私 下收了李小姐的金錢，但對外說這是朋友之間的幫忙，是私事。請問王社工應有何倫理和文 化考量？應如何做倫理判斷和決定是否舉報？（25 分）","points":"25","topic":"雙重關係與倫理判斷","major":"社會工作理論","keywords":["雙重關係","利益衝突","倫理判斷","通報","倫理決策"],"theories":["專業倫理"],"laws":["社會工作師法"],"difficulty":"困難","frequency":"高頻","qtype":"案例分析題","related":["倫理兩難","倫理決策模式"],"cluster":"ETH2","cluster_name":"倫理兩難與倫理決策"},{"id":"社會工作-108-2-申論2","subject":"社會工作","year":"108","round":"第2次","qno":"2","q":"依據家庭生命週期與家庭系統理論，一對育有3 歲及8 歲子女的身心障礙父母可能面對那些 家庭生活困境？社會工作者應如何介入及處遇？（25 分）","points":"25","topic":"家庭生命週期與家庭系統","major":"家庭社會工作","keywords":["家庭生命週期","家庭系統理論","身障父母","介入","困境"],"theories":["家庭系統理論","家庭生命週期理論"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"案例分析題","related":["身障家庭","家庭評估"],"cluster":"FAM1","cluster_name":"家庭發展理論與家庭評估"},{"id":"社會工作-107-1-申論1","subject":"社會工作","year":"107","round":"第1次","qno":"1","q":"「78 歲的黃先生不願入住長期照顧機構，但社工評估其有長期照顧需求且居住環境不佳；黃 先生的女兒已婚並未與黃先生同住，其照顧能力也相當有限」。根據此案例，請討論臺灣社 會工作倫理守則中對於案主自我決定權的規範？以及社工在考量黃先生的自我決定權時會面 臨那些倫理兩難（ethical dilemmas）？（25 分）","points":"25","topic":"案主自決與倫理兩難","major":"社會工作理論","keywords":["案主自決","倫理兩難","自我決定","長照需求","倫理守則"],"theories":["專業倫理"],"laws":["社會工作師法"],"difficulty":"中等","frequency":"高頻","qtype":"案例分析題","related":["倫理原則","老人"],"cluster":"ETH2","cluster_name":"倫理兩難與倫理決策"},{"id":"社會工作-107-1-申論2","subject":"社會工作","year":"107","round":"第1次","qno":"2","q":"試分別說明：認知行為學派、社會支持理論以及優勢觀點等三種理論觀點的重點，並舉出一個服務案例討論社工如何同時運用此三種理論觀點？（25 分）","points":"25","topic":"社會工作實施理論(認知行為 社會支持 優勢)","major":"社會工作理論","keywords":["認知行為學派","社會支持理論","優勢觀點","實施理論","三理論"],"theories":["認知行為理論","社會支持理論","優勢觀點"],"laws":[],"difficulty":"中等","frequency":"低頻","qtype":"理論說明題","related":["優勢觀點","增權"],"cluster":"IMP1","cluster_name":"個案工作實施理論"},{"id":"社會工作-107-2-申論1","subject":"社會工作","year":"107","round":"第2次","qno":"1","q":"隨著社會日益多元化，「包容」(inclusion)也成為社會工作的重要價值。請說明「包容」的意義 為何？並以家庭社會工作為例，申論社工專業人員應以何種基本態度面對現代家庭的多樣化？ （25 分）","points":"2 ,"empowerment","充權","社區工作","層次"],"theories":["增強權能觀點"],"laws":[],"difficulty":"中等","frequency":"低頻","qtype":"理論說明題","related":["社區充權","賦權"],"cluster":"COM3","cluster_name":"社區培力與充權"},{"id":"社會工作直接服務-106-1-申論1","subject":"社會工作直接服務","year":"106","round":"第1次","qno":"1","q":"非自願案主拒絕服務的行為一直被心理動力論（psycho dynamic）視為是潛意識對改變的抗 拒心理（resistance）。試以法定強制對象為例，從充權觀點（empowerment perspective）說明 應如何規劃非自願案主團體工作的初期工作，以催化關係與團體目標建立？（25 分）","points":"25","topic":"非自願案主(團體初期)","major":"社會工作直接服務","keywords":["非自願案主","抗拒","充權觀點","團體工作","催化關係"],"theories":["增強權能觀點","心理動力論"],"laws":[],"difficulty":"中等","frequency":"低頻","qtype":"案例分析題","related":["團體階段","增權"],"cluster":"INV1","cluster_name":"非自願案主"},{"id":"社會工作直接服務-106-1-申論2","subject":"社會工作直接服務","year":"106","round":"第1次","qno":"2","q":"一名 15 歲少女因遭繼父性侵而進入兒少保護體系；事件發生後，少女表示不願意繼續住在家裡、也不願意進入安置機構，自行在外與已成年的男友同居。少女表示，與男友有性關係，且案母知情也默許，並會資助房租。負責此案的社工認為這是「案主自決」，故未採取任何干預措施。試說明此案是否適用「案主自決」，並說明此案處置是否有倫理過失？（25 分）","points":"25","topic":"案主自決與兒少保護倫理","major":"保護性社會工作","keywords":["案主自決","兒少保護","性侵害","倫理過失","安置"],"theories":[],"laws":["兒童及少年福利與權益保障法","兒童及少年性剝削防制條例"],"difficulty":"困難","frequency":"高頻","qtype":"案例分析題","related":["倫理兩難","兒少保護"],"cluster":"PRO1","cluster_name":"兒少保護"},{"id":"社會工作直接服務-106-2-申論1","subject":"社會工作直接服務","year":"106","round":"第2次","qno":"1","q":"社區工作目標之一是讓社區居民參與改造社區，讓社區變得更好。某兒童福利組織位於整個 都市中最早發展也曾經相當繁榮，但今日已是相當老舊的社區；社區內有許多情色場所、賭 博與電動遊樂場、幫派組織，社區中未成年的青少年常因為各種因素輟學或進入司法矯治機 構。請說明該社區內的兒童福利組織社會工作者如何應用「地方發展模式」（locality development）或「自助模式」（self-help）去改善該社區兒少生活狀況。（25 分）","points":"25","topic":"社區工作模式(地方發展 自助)","major":"社區工作","keywords":["地方發展模式","自助模式","社區組織","兒少","社區改造"],"theories":["Rothman社區工作模式"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"案例分析題","related":["社區組織","社會行動"],"cluster":"COM1","cluster_name":"社區工作模式"},{"id":"社會工作直接服務-106-2-申論2","subject":"社會工作直接服務","year":"106","round":"第2次","qno":"2","q":"社會工作者在執行個案工作時常需與個案密切互動，以了解個案需求與問題，因此 社會工 作者在個案工作中的專業關係也就格外重要。請說明社會工作者應該在社會 個案工作中掌 握那些重要的專業關係原則。(25 分)","points":"25","topic":"專業關係原則(Biestek)","major":"社會工作直接服務","keywords":["專業關係","個案工作","Biestek","助人關係","七大原則"],"theories":["Biestek專業關係原則"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["個案工作","會談"],"cluster":"CAS1","cluster_name":"個案工作技巧與個案管理"},{"id":"社會工作直接服務-105-1-申論1","subject":"社會工作直接服務","year":"105","round":"第1次","qno":"1","q":"從事社區工作並不是一件簡單的事，要永續經營一個社區更非易事。有學者認為社區價值 （community value）、社區能力（community capacity）及社會資本（social capital）三個項 目，是社區永續發展不可或缺的基礎。三者其中之一的社區能力，根據臺灣學者引述國外學 者吉利克曼與莎蒙（Glickman & Servon, 1998）的主張認為社區能力包含五種能力，請說明 這五種能力的內涵，並以實務經驗舉例之。（25 分）","points":"25","topic":"社區能力與社區永續","major":"社區工作","keywords":["社區能力","社區永續","社會資本","社區價值","社區發展"],"theories":["社區能力理論"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"理論說明題","related":["社區評估","社會資本"],"cluster":"COM2","cluster_name":"社區評估.能力.資產"},{"id":"社會工作直接服務-105-1-申論2","subject":"社會工作直接服務","year":"105","round":"第1次","qno":"2","q":"最近常聽到一些大學社工系教「社會團體工作」的老師感嘆說：「目前在臺灣社工實務界的 社工人員越來越少願意做團體工作，他們都把帶團體的工作委託給團體諮商專家，社工自己 都不做也不學，真擔心有一天社工會變成不會做團體工作的專業。我們有一種「不知為何而 教」的焦慮與沮喪。」而國外的專家也認為大部分的 團體工作實習學生或新進工作者對帶領 團體會有一些恐懼的情緒。請問團體工作實 習學生或新進工作者對帶領團體會有那些恐懼的 情緒？這些恐懼的情緒要如何克服，請舉出其中五種恐懼的情緒及其克服的方法，並以實務 經驗舉例之。（25 分）","points":"25","topic":"團體領導者議題","major":"社會工作直接服務","keywords":["團體工作","團體領導","恐懼情緒","新進工作者","領導克服"],"theories":[],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["團體動力","團體領導"],"cluster":"GRP1","cluster_name":"團體工作過程"},{"id":"社會工作直接服務-105-2-申論1","subject":"社會工作直接服務","year":"105","round":"第2次","qno":"1","q":"近年來，區域型中心強調「以家庭為核心、以社區為基礎」。請問其理論基礎為何？ 在社會 工作直接服務的運用上，有何特別的重點？（25 分）","points":"25","topic":"以家庭為中心社區為基礎","major":"社會工作直接服務","keywords":["家庭為核心","社區為基礎","區域型中心","直接服務","理論基礎"],"theories":["生態系統理論"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"理論說明題","related":["社福中心","家庭"],"cluster":"ECO1","cluster_name":"生態系統與生活模型"},{"id":"社會工作直接服務-105-2-申論2","subject":"社會工作直接服務","year":"105","round":"第2次","qno":"2","q":"社會工作者帶領一同志團體時，應有那些先備知識？於團體規劃時，應注意那些事項？團體 進行過程中，應運用那些團體工作技巧？（25 分）","points":"25","topic":"團體工作(同志團體)","major":"社會工作直接服務","keywords":["團體工作","同志團體","先備知識","團體技巧","多元"],"theories":[],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["團體技巧","多元文化"],"cluster":"GRP1","cluster_name":"團體工作過程"},{"id":"社會工作直接服務-104-1-申論1","subject":"社會工作直接服務","year":"104","round":"第1次","qno":"1","q":"「會談」是社會工作的基本技巧，一般人常把它與日常生活中的談話混淆。請比較「會談」 與一般「談話」的區別，並依其目的或性質，說明會談的種類。（25 分）","points":"25","topic":"會談技巧","major":"社會工作直接服務","keywords":["會談","談話","會談種類","溝通技巧","個案工作"],"theories":[],"laws":[],"difficulty":"基礎","frequency":"高頻","qtype":"比較題","related":["個案工作","溝通技巧"],"cluster":"CAS1","cluster_name":"個案工作技巧與個案管理"},{"id":"社會工作直接服務-104-1-申論2","subject":"社會工作直接服務","year":"104","round":"第1次","qno":"2","q":"社會行動「(social action)」是樓斯曼(J. Rothman）三大社區工作模式之一。它的內容有那 些？請試舉一例，申論之。(25 分)","points":"25","topic":"社區工作模式(社會行動)","major":"社區工作","keywords":["社會行動","Rothman","社區工作模式","社區組織","三大模式"],"theories":["Rothman社區工作模式"],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"理論說明題","related":["社區組織","地方發展"],"cluster":"COM1","cluster_name":"社區工作模式"},{"id":"社會工作直接服務-104-2-申論1","subject":"社會工作直接服務","year":"104","round":"第2次","qno":"1","q":"社會團體工作的結束階段對團體成員而言是一個關鍵過程。你是一位團體領導者，正在帶領一個梯次的處遇性團體，在團體工作進入到結束階段時，你的主要任務為何？你會設計與運用那些活動來準備結束？請試述之。（25 分）","points":"25","topic":"團體工作結束階段","major":"社會工作直接服務","keywords":["團體工作","結束階段","團體領導","處遇性團體","團體任務"],"theories":["團體發展階段理論"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["團體階段","團體動力"],"cluster":"GRP1","cluster_name":"團體工作過程"},{"id":"社會工作直接服務-104-2-申論2","subject":"社會工作直接服務","year":"104","round":"第2次","qno":"2","q":"社會工作者所服務的家庭經常存在著多重問題，家庭社會工作強調「問題」不完全是個人的責任，應把家庭視為一個整體，聚焦在家庭互動與情境脈絡上，並重視家庭與外在環境系統間的連結。試述在家庭社會工作的四個主要工作階段（開始階段、評估階段、處遇階段與結案階段）中，社會工作者分別擔負那些角色任務？（25 分）","points":"25","topic":"家庭社會工作(多重問題家庭)","major":"家庭社會工作","keywords":["家庭社會工作","多重問題家庭","家庭處遇","個人與環境","系統"],"theories":[],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["家庭評估","脆弱家庭"],"cluster":"FAM1","cluster_name":"家庭發展理論與家庭評估"},{"id":"社會工作研究方法-115-1-申論1","subject":"社會工作研究方法","year":"115","round":"第1次","qno":"1","q":"量化研究中，概念化與操作化是重要步驟，有位研究者正在規劃一項有關「大學生的生活滿 意度」的量化研究，試問何謂量化研究的「概念化」與「操作化」？並就「大學生生活滿意 度」量化研究說明概念化、操作化的定義及其測量方式。（20 分）","points":"20","topic":"概念化與操作化","major":"社會研究法","keywords":["概念化","操作化","測量","生活滿意度","操作型定義"],"theories":["測量理論"],"laws":[],"difficulty":"中等","frequency":"低頻","qtype":"理論說明題","related":["測量","變項"],"cluster":"RES5","cluster_name":"測量.信效度.概念操作化"},{"id":"社會工作研究方法-115-1-申論2","subject":"社會工作研究方法","year":"115","round":"第1次","qno":"2","q":"研究者探討某縣市兒少社會工作者對於兒童保護服務輸送系統的意見與想法。若你是該研究者，會使用個別深入訪談或是焦點團體訪談進行資料蒐集？試說明二種方法的內涵及選擇該方法的理由？根據你所選擇的研究方法，說明在準備階段需進行那些工作？（20 分）","points":"20","topic":"深度訪談與焦點團體比較","major":"社會研究法","keywords":["深度訪談","焦點團體","質性研究","資料蒐集","比較"],"theories":[],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"比較題","related":["質性研究","訪談"],"cluster":"RES7","cluster_name":"質性資料蒐集"},{"id":"社會工作研究方法-114-1-申論1","subject":"社會工作研究方法","year":"114","round":"第1次","qno":"1","q":"為降低學生染毒的風險，某國中輔導室主任邀請一位學者協助設計一個反毒介入方案，並評估 其效果。這位學者規劃一個兩階段的研究設計。首先瞭解染毒青少年的人口社經資料及染毒 的原因，接著依據角色模仿的「大哥哥大姐姐方案」設計介入方案，安排每一位染毒青少年 一位學長，並建議每週見一次面，評估其成效。試依據科學研究的演繹和歸納邏輯系統來說明 這兩個階段的進行各屬於那一種研究邏輯？各研究邏輯的思考步驟為何？兩個邏輯系統彼此 的關係為何？（25 分）","points":"25","topic":"演繹與歸納邏輯","major":"社會研究法","keywords":["演繹","歸納","研究邏輯","量化質性","反毒方案"],"theories":["科學研究邏輯"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"案例分析題","related":["研究典範","研究設計"],"cluster":"RES2","cluster_name":"研究典範.目的.邏輯"},{"id":"社會工作研究方法-114-1-申論2","subject":"社會工作研究方法","year":"114","round":"第1次","qno":"2","q":"請列舉五項行動研究的特性；並試以服務社區受暴者為例，若要採用參與式行動研究來處理其 所面臨的受暴議題，試擬出該行動研究的可能方向與進行方式。（25 分）","points":"25","topic":"參與式行動研究","major":"社會研究法","keywords":["行動研究","參與式行動研究","PAR","受暴者","賦權"],"theories":["行動研究"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["行動研究","質性研究"],"cluster":"RES7","cluster_name":"質性資料蒐集"},{"id":"社會工作研究方法-114-2-申論1","subject":"社會工作研究方法","year":"114","round":"第2次","qno":"1","q":"在科學研究過程中，演繹邏輯和歸納邏輯都是不可或缺的要素。請說明演繹和歸納的定義， 並舉一例說明兩種邏輯模式在研究中如何相輔相成，形成一種循環。（25 分）","points":"25","topic":"演繹與歸納邏輯","major":"社會研究法","keywords":["演繹","歸納","研究邏輯","循環","科學方法"],"theories":["科學研究邏輯"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["研究典範","理論建構"],"cluster":"RES2","cluster_name":"研究典範.目的.邏輯"},{"id":"社會工作研究方法-114-2-申論2","subject":"社會工作研究方法","year":"114","round":"第2次","qno":"2","q":"質性研究通常探究的是描述性、過程性、解釋性、差異性和評鑑性的研究問題，涵蓋著不同 的研究策略，試述質性各種研究策略具有的共同特質有那些？並請舉一例說明可行的研究策 略。（25 分）","points":"25","topic":"質性研究策略","major":"社會研究法","keywords":["質性研究","研究策略","共同特質","描述過程","策略"],"theories":[],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"理論說明題","related":["質性研究","研究設計"],"cluster":"RES7","cluster_name":"質性資料蒐集"},{"id":"社會工作研究方法-113-1-申論1","subject":"社會工作研究方法","year":"113","round":"第1次","qno":"1","q":"某縣政府想進行「婦女生活狀況與福利需求調查」，預定採用系統抽樣法（systematic sampling） 或分層隨機抽樣法（stratified randomsampling），試從樣本分布情形、施測成本、適用時機來 比較二者的差異。（25 分）","points":"25","topic":"抽樣方法比較","major":"社會研究法","keywords":["系統抽樣","分層隨機抽樣","抽樣比較","成本","機率抽樣"],"theories":[],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"比較題","related":["抽樣方法","抽樣架構"],"cluster":"RES1","cluster_name":"抽樣方法"},{"id":"社會工作研究方法-113-1-申論2","subject":"社會工作研究方法","year":"113","round":"第1次","qno":"2","q":"近幾年來卑親屬殺死尊親屬的重大老人保護案件頻傳，若研究者想要了解每件重大老人保護案 件的發生原因和脈絡，及各縣市老人保護社會工作者對於重大老人保護案件施虐者特質的想法， 試說明研究者如何運用「內容分析」及「焦點團體訪談」方法來進行資料的蒐集？以及這二種 方法的優、缺點？（25 分）","points":"25","topic":"內容分析與焦點團體","major":"社會研究法","keywords":["內容分析","焦點團體","質性研究","老人保護","優缺點"],"theories":["內容分析"],"laws":[],"difficulty":"中等","frequency":"高頻","qtype":"案例分析題","related":["焦點團體","質性研究"],"cluster":"RES7","cluster_name":"質性資料蒐集"},{"id":"社會工作研究方法-113-2-申論1","subject":"社會工作研究方法","year":"113","round":"第2次","qno":"1","q":"試說明何謂機率抽樣設計（probability sampling design）和非機率抽樣設計（non-probability sampling design），並各舉一實例說明上述兩種抽樣方法的應用。（25 分）","points":"25","topic":"抽樣方法","major":"社會研究法","keywords":["機率抽樣","非機率抽樣","抽樣設計","抽樣方法","應用"],"theories":[],"laws":[],"difficulty":"中等","frequency":"中頻","qtype":"理論說明題","relate 2.272，p＜.05。 教育程度：專科以下社工人員的離職傾向平均數是2.95，學院／大學的離職傾向平均數是 2.68，研究所以上的離職傾向平均數是3.06；檢驗數據為F = .412，p＞.05。 機構服務年資： 未滿1 年的離職傾向平均數是2.51， 滿1 年～未滿3 年的離職傾向平 均數是2.91， 滿3 年～未滿6 年的離職傾向平均數是2.81，滿6 年以上的離職傾向平 均數是2.72；檢驗數據為F = 3.047，p＜.05。事後比較結果：第1 組與第2 組有顯著差 異。 社工人員的主管關係（分數愈高代表關係愈好）與離職傾向的相關係數為r = -.394，p ＜.001；社工人員的同事關係（分數愈高代表關係愈好）與離職傾向的相關係數為r = - .019，p＞.05。","points":"25","topic":"統計結果判讀","major":"社會研究法","keywords":["統計判讀","t檢定","變異數分析","相關係數","p值"],"theories":["推論統計"],"laws":[],"difficulty":"困難","frequency":"低頻","qtype":"案例分析題","related":["假設檢定","統計分析"],"cluster":"RES6","cluster_name":"統計分析與假設檢定"},{"id":"社會工作研究方法-111-1-申論1","subject":"社會工作研究方法","year":"111","round":"第1次","qno":"1","q":"隨著人口快速高齡化，在尚無完善老年安全制度的建制下，退休後20 餘年的暮年生活勢將存 在各式各樣的經濟風險。最近，幾位學者立基於西方國家的經驗，提出「以房養老」的策 略，期待政府能夠採納這項資產活用的制度，來協助高齡者透過自有住宅的抵押來換取生活 資金。假如有研究單位邀請你對50 歲以上民眾進行接受度和影響因素之民意調查，該單位希 望你能採取「混合研究設計」的方法來進行這項民意調查，在量化取向方面，希望能採取 「郵寄問卷」的資料蒐集方法；在質化取向方面，希望能採取「焦點訪談」的方式來進行資 料蒐集。 請問你對此二種方法先後順序的設計與理由為何？並說明這二種方法進行的步驟，包括抽樣 方法、調查問卷內容、焦點討論議題設定、進行方式。（25 分）","points":"25","topic":"混合研究設計","major":"社會研究法","keywords":["混合研究","量化質化","順序設計","郵寄問卷","焦點訪談"],"theories":["混合研究方法"],"laws":[],"difficulty":"困難","frequency":"中頻","qtype":"案例分析題","related":["研究設計","焦點團體"],"cluster":"RES9","cluster_name":"調查.問卷.混合設計"},{"id":"社會工作研究方法-111-1-申論2","subject":"社會工作研究方法","year":"111","round":"第1次","qno":"2","q":"某教授承接政府委託的「老人生活狀況與福利需求調查」，將採用面對面訪問調查方法，預 定訪問900 位65 歲以上長輩，將培訓20 位訪員以協助面訪工作，請擬訂訪員訓練的內容。 （25 分）","points":"25","topic":"訪員訓練","major":"社會研究法","keywords":["訪員訓練","面訪","調查實施","訪問員","品質控制"],"theories":[],"laws":[],"difficulty":"基礎","frequency":"中頻","qtype":"理論說明題","related":["調查研究","面訪"],"cluster":"RES9","cluster_name":"調查.問卷.混合設計"},{"id":"社會工作研究方法-111-2-申論1","subject":"社會工作研究方法","year":"111","round":"第2次","qno":"1","q":"請說明質性研究信賴度的定義；並說明提升質性研究信賴度的方法。（25 分）","points":"25","topic":"質性研究信賴度","major":"社會研究法","keywords":["信賴度","trustworthiness","質性研究","嚴謹度","三角檢證"],"theories":["質性研究嚴謹度"],"laws":[],"difficulty":"中等","frequency":"低頻","qtype":"理論說明題","relate   /* ---------- 出題 ---------- */
  function build(n){
    var arr=bank().filter(function(q){ return scope==='全部科目'||q.subject===scope; });
    arr=arr.map(function(q){return {q:q,k:Math.pow(Math.random(),1/W(q))};}).sort(function(a,b){return b.k-a.k;}).map(function(x){return x.q;});
    if(n&&arr.length>n) arr=arr.slice(0,n);
    return arr;
  }

  /* ---------- 歷屆整卷 ---------- */
  function papers(){
    var seen={}, out=[];
    bank().forEach(function(q){
      var y=String(q.year||'').trim(), r=String(q.round||'').trim();
      if(!y) return;
      var key=y+'|'+r;
      if(!seen[key]){ seen[key]=true; out.push({year:y,round:r}); }
    });
    out.sort(function(a,b){
      var yd=(parseInt(b.year,10)||0)-(parseInt(a.year,10)||0);
      if(yd!==0) return yd;
      return (b.round||'').localeCompare(a.round||'');
    });
    out.forEach(function(p){ p.label=p.year+' 年'+(p.round?(' '+p.round):''); });
    return out;
  }
  function buildExam(){
    var order=subs();
    var arr=bank().filter(function(q){
      if(scope!=='全部科目' && q.subject!==scope) return false;
      return String(q.year||'').trim()===exYear && String(q.round||'').trim()===exRound;
    });
    arr.sort(function(a,b){
      if(scope==='全部科目'){
        var sa=order.indexOf(a.subject), sb=order.indexOf(b.subject);
        if(sa!==sb) return sa-sb;
      }
      return (parseInt(a.qno,10)||0)-(parseInt(b.qno,10)||0);
    });
    return arr;
  }

  /* ---------- 作答畫面 ---------- */
  function run(){
    var q=Q[idx];
    var letters=['A','B','C','D'];
    var optsHtml=letters.map(function(L){
      var txt=q.options?q.options[L]:'';
      if(txt==null||txt==='') return '';
      var sel=(ans[idx]===L)?' sel':'';
      return '<div class="mk-opt'+sel+'" id="mk-opt-'+L+'" onclick="MK.pick(\''+L+'\')"><span class="lab">('+L+')</span><span>'+E(txt)+'</span></div>';
    }).join('');
    var pal=Q.map(function(_,i){
      var c='mk-cell'+(ans[i]!=null?' done':'')+(i===idx?' cur':'');
      return '<div class="'+c+'" onclick="MK.jump('+i+')">'+(i+1)+'</div>';
    }).join('');
    var doneN=Object.keys(ans).length;
    ov.innerHTML=
      '<div class="mk-wrap">'
      +'<div class="mk-top">'
      +'<div class="mk-timer'+((limited&&left<=60)?' warn':'')+'" id="mk-timer">'+(limited?fmt(left):'∞')+'</div>'
      +'<div class="mk-prog">第 '+(idx+1)+' / '+Q.length+' 題　已答 '+doneN+'</div>'
      +'<button class="mk-btn go" style="padding:9px 14px;font-size:var(--fs-b)" onclick="MK.submit()">交卷</button>'
      +'</div>'
      +'<div class="mk-qcard">'
      +'<div class="mk-qmeta">'+E(q.subject||'')+'　'+E(q.year||'')+' '+E(q.round||'')+'　'+E(q.major||'')+'</div>'
      +'<div class="mk-q">'+E(q.q||'').replace(/\n/g,'<br>')+'</div>'
      +optsHtml
      +'</div>'
      +'<div class="mk-nav">'
      +'<button class="mk-btn ghost" onclick="MK.go(-1)" '+(idx===0?'disabled':'')+'>‹ 上一題</button>'
      +'<button class="mk-btn ghost" onclick="MK.go(1)" '+(idx===Q.length-1?'disabled':'')+'>下一題 ›</button>'
      +'</div>'
      +'<div class="mk-lab">題號（藍色＝已作答，可點跳題）</div>'
      +'<div class="mk-pal">'+pal+'</div>'
      +'<div style="margin-top:18px"><button class="mk-btn go" style="width:100%" onclick="MK.submit()">交卷看結果</button></div>'
      +'</div>';
    window.scrollTo(0,0);
  }

  function tick(){
    left--;
    var el=document.getElementById('mk-timer');
    if(el){ el.textContent=fmt(left); if(left<=60) el.classList.add('warn'); }
    if(left<=0){ clearInterval(timer); timer=null; grade(true); }
  }

  /* ---------- 結果 ---------- */
  function grade(auto){
    if(timer){clearInterval(timer);timer=null;} running=false;
    var letters=['A','B','C','D'];
    var correct=0, answered=0, bySubj={}, wrong=[];
    Q.forEach(function(q,i){
      var picked=ans[i]!=null?ans[i]:null;
      var ok=isCorrectAnswer(q,picked);
      if(ok) correct++;
      if(picked!=null){
        answered++;
        if(!bySubj[q.subject])bySubj[q.subject]={t:0,c:0};
        bySubj[q.subject].t++; if(ok)bySubj[q.subject].c++;
        try{ if(typeof record==='function') record(q,picked,ok); }catch(e){}
      }
      if(!ok) wrong.push({q:q,picked:picked});
    });
    var used=Math.max(0, Math.floor((Date.now()-t0)/1000));
    var pct=Q.length?Math.round(correct/Q.length*100):0;

    var subjHtml=Object.keys(bySubj).map(function(s){
      var o=bySubj[s], r=o.t?Math.round(o.c/o.t*100):0;
      return '<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:var(--fs-b)"><span>'+E(s)+'</span><span style="color:var(--ink-soft,#757A75)">'+o.c+'/'+o.t+'（'+r+'%）</span></div><div class="mk-bar"><i style="width:'+r+'%"></i></div></div>';
    }).join('');

    var revHtml=wrong.map(function(w){
      var q=w.q, picked=w.picked;
      var exp=q.exp||{};
      var ex='';
      if(exp.why) ex+='<div class="ln"><b style="color:var(--pine,#4F7E76)">為什麼答案對：</b>'+E(exp.why)+'</div>';
      if(exp.others) ex+='<div class="ln"><b>其他選項為何錯：</b>'+E(exp.others)+'</div>';
      if(exp.trap) ex+='<div class="ln"><b style="color:var(--wrong,#9E6155)">考場陷阱：</b>'+E(exp.trap)+'</div>';
      if(!ex&&exp.raw) ex+='<div class="ln">'+E(exp.raw)+'</div>';
      if(q.mnemonic) ex+='<div class="ln"><b>記憶法：</b>'+E(q.mnemonic)+'</div>';
      if(q.law) ex+='<div class="ln"><b>法源：</b>'+E(q.law)+'</div>';
      var pk=picked!=null?('你選 '+picked):'未作答';
      var tag=picked!=null?'<span class="mk-tag w">'+pk+'</span>':'<span class="mk-tag n">未作答</span>';
      return '<div class="mk-rev"><div class="rq">'+E(q.q||'').slice(0,140)+((q.q||'').length>140?'…':'')+'</div>'
        +'<div class="ln">'+tag+'<span class="mk-tag n">'+E((typeof answerLabel==='function')?answerLabel(q):('正解 '+(q.answer||'')))+'</span></div>'+ex+'</div>';
    }).join('');

    ov.innerHTML=
      '<div class="mk-wrap">'
      +'<div class="mk-top"><div class="mk-timer" style="color:var(--ink,#2A2C2A);font-size:var(--fs-q)">模擬考結果</div>'
      +'<div style="display:flex;align-items:center;gap:10px">'+fc()+'<button class="mk-x" onclick="MK.close()">✕</button></div></div>'
      +(auto?'<div class="mk-sub" style="color:var(--wrong,#9E6155);margin-top:14px">⏰ 時間到，已自動交卷。</div>':'')
      +'<div class="mk-score"><div class="big">'+correct+' / '+Q.length+'</div>'
      +'<div class="pct">答對率 '+pct+'%　·　作答 '+answered+' 題　·　用時 '+fmt(used)+'</div></div>'
      +(subjHtml?'<div class="mk-lab">各科表現</div>'+subjHtml:'')
      +(revHtml?'<div class="mk-lab">錯題與詳解（'+wrong.length+' 題）</div>'+revHtml:'<div class="mk-sub" style="margin-top:16px">🎉 全部答對！</div>')
      +'<div class="mk-nav" style="margin-top:18px"><button class="mk-btn ghost" onclick="MK.retry()">再考一次</button><button class="mk-btn go" onclick="MK.close()">完成</button></div>'
      +'<div class="mk-sub" style="margin-top:14px">這場的作答已記錄，去「進度」看弱點變化、去「錯題本」重練錯的題。</div>'
      +'</div>';
    window.scrollTo(0,0);
  }

  /* ---------- 對外 API ---------- */
  window.MK={
    open:function(){ mount(); setup(); },
    close:function(){
      if(running){ if(!confirm('模擬考進行中，確定要離開？這次作答不會記錄。')) return; }
      shut();
    },
    setScope:function(v){ scope=v; if(mode==='exam') setup(); },
    setMode:function(m){ mode=m; setup(); },
    setPaper:function(v){ var p=String(v).split('|'); exYear=p[0]; exRound=p[1]||''; setup(); },
    toggleTimed:function(){ limited=!limited; var t=document.getElementById('mk-tg'); if(t)t.textContent=limited?'⏱ 倒數計時':'∞ 不限時'; },
    beginExam:function(){
      if(!exYear){ alert('請先選年份。'); return; }
      var pool=buildExam();
      if(!pool.length){ alert('這份考卷目前沒有題目。'); return; }
      Q=pool; idx=0; ans={}; running=true; t0=Date.now();
      left=Math.round(Q.length*1.2)*60;
      if(timer){clearInterval(timer);timer=null;}
      if(limited){ timer=setInterval(tick,1000); }
      run();
    },
    begin:function(n){
      var pool=build(n);
      if(!pool.length){ alert('這個範圍目前沒有題目。'); return; }
      Q=pool; idx=0; ans={}; running=true; t0=Date.now();
      left=Math.round(Q.length*1.2)*60;
      if(timer){clearInterval(timer);timer=null;}
      if(limited){ timer=setInterval(tick,1000); }
      run();
    },
    pick:function(L){
      ans[idx]=L;
      ['A','B','C','D'].forEach(function(x){ var el=document.getElementById('mk-opt-'+x); if(el){ if(x===L)el.classList.add('sel'); else el.classList.remove('sel'); } });
      var cells=ov.querySelectorAll('.mk-cell'); if(cells[idx])cells[idx].classList.add('done');
      var pr=ov.querySelector('.mk-prog'); if(pr)pr.textContent='第 '+(idx+1)+' / '+Q.length+' 題　已答 '+Object.keys(ans).length;
    },
    go:function(d){ var n=idx+d; if(n<0||n>=Q.length)return; idx=n; run(); },
    jump:function(i){ if(i<0||i>=Q.length)return; idx=i; run(); },
    submit:function(){ var un=Q.length-Object.keys(ans).length; if(un>0){ if(!confirm('還有 '+un+' 題未作答，確定交卷？')) return; } grade(false); },
    retry:function(){ setup(); }
  };
})();

function loadReviewState(){
  try{
    const x=JSON.parse(localStorage.getItem(REVIEW_KEY)||'null');
    if(x&&x.version===2&&x.items&&typeof x.items==='object') return x;
  }catch(e){}
  return {version:2,migratedFromHistory:false,items:{}};
}
function saveReviewState(st){ try{localStorage.setItem(REVIEW_KEY,JSON.stringify(st)); markStorageSaved(); }catch(e){ markStorageFailure(); } }
function bootstrapReviewState(){
  const st=loadReviewState(); let changed=false;
  if(!st.migratedFromHistory){
    const h=loadHist(), latest={}, wrongCount={};
    h.forEach(x=>{ if(!x||!x.id)return; latest[x.id]=x; if(x.correct===false) wrongCount[x.id]=(wrongCount[x.id]||0)+1; });
    const now=Date.now();
    Object.keys(latest).forEach(id=>{
      if(latest[id].correct===false && !st.items[id]){
        st.items[id]={id,streak:0,wrongCount:wrongCount[id]||1,correctCount:0,dueAt:now,lastAt:latest[id].ts||now,lastResult:'wrong',mastered:false,maintenanceStep:0,maintenanceDone:false};
      }
    });
    st.migratedFromHistory=true; changed=true;
  }
  Object.values(st.items).forEach(r=>{
    if(!r||!r.id)return;
    if(r.mastered && r.maintenanceStep==null){
      r.maintenanceStep=0; r.maintenanceDone=false;
      r.dueAt=(r.masteredAt||Date.now())+14*REVIEW_DAY; changed=true;
    }
  });
  if(changed) saveReviewState(st);
  return st;
}
function updateReviewSchedule(item,correct){
  if(!item||!item.id) return;
  const st=bootstrapReviewState(), now=Date.now();
  let r=st.items[item.id];
  if(!correct){
    if(!r) r={id:item.id,streak:0,wrongCount:0,correctCount:0,dueAt:now,lastAt:now,lastResult:'wrong',mastered:false,maintenanceStep:0,maintenanceDone:false};
    r.streak=0; r.mastered=false; r.masteredAt=null; r.maintenanceStep=0; r.maintenanceDone=false;
    r.wrongCount=(r.wrongCount||0)+1; r.lastResult='wrong'; r.lastAt=now; r.dueAt=now+REVIEW_INTERVAL_DAYS[0]*REVIEW_DAY;
    st.items[item.id]=r;
  }else if(r){
    r.correctCount=(r.correctCount||0)+1; r.lastResult='correct'; r.lastAt=now;
    if(!r.mastered){
      r.streak=(r.streak||0)+1;
      if(r.streak>=3){
        r.mastered=true; r.masteredAt=now; r.maintenanceStep=0; r.maintenanceDone=false;
        r.dueAt=now+REVIEW_INTERVAL_DAYS[3]*REVIEW_DAY;
      }else{
        const days=r.streak===1?REVIEW_INTERVAL_DAYS[1]:REVIEW_INTERVAL_DAYS[2];
        r.dueAt=now+days*REVIEW_DAY;
      }
    }else if(!r.maintenanceDone){
      if((r.maintenanceStep||0)===0){
        r.maintenanceStep=1; r.dueAt=now+REVIEW_INTERVAL_DAYS[4]*REVIEW_DAY;
      }else{
        r.maintenanceStep=2; r.maintenanceDone=true; r.dueAt=0;
      }
    }
    st.items[item.id]=r;
  }
  saveReviewState(st);
}
function reviewSummary(){
  const st=bootstrapReviewState(), now=Date.now(), exists=QB.allComplete?new Set(ALL.filter(q=>!lawConfirmedChanged(q)).map(q=>q.id)):null;
  const activeIds=[], dueIds=[], maintenanceDueIds=[]; let masteredCount=0, nextDueAt=0;
  Object.values(st.items).forEach(r=>{
    if(!r||!r.id||(exists&&!exists.has(r.id))) return;
    const due=Number(r.dueAt||0);
    if(r.mastered){
      masteredCount++;
      if(!r.maintenanceDone){
        if(!due||due<=now){ dueIds.push(r.id); maintenanceDueIds.push(r.id); }
        else if(!nextDueAt||due<nextDueAt) nextDueAt=due;
      }
      return;
    }
    activeIds.push(r.id);
    if(!due||due<=now) dueIds.push(r.id);
    else if(!nextDueAt||due<nextDueAt) nextDueAt=due;
  });
  return {activeIds,dueIds,maintenanceDueIds,activeCount:activeIds.length,dueCount:dueIds.length,maintenanceDueCount:maintenanceDueIds.length,masteredCount,nextDueAt};
}

  return `${d} 天後`;
}

  h.forEach(x=>{ if(!bySubj[x.subject])bySubj[x.subject]={t:0,c:0}; bySubj[x.subject].t++; if(x.correct)bySubj[x.subject].c++; });

  return {total,correct,bySubj,wrongMajor,byMistake}; }

function normalize(r){
  let exp=null;
  /* 若欄位內仍含【】標籤（舊版匯入把整坨塞進 exp_why），載入時即時重新解析 → 不必重新匯入 */
  const blob=[r.exp_why,r.exp_others,r.exp_trap,r.exp_raw].filter(Boolean).join('\n');
  if(blob.indexOf('【')>=0){
    const pp=parseExp(blob);
    if(pp.why||pp.others||pp.trap) exp={why:pp.why||'',others:pp.others||'',trap:pp.trap||''};
    else if(pp.raw) exp={raw:pp.raw};
  } else if(r.exp_why||r.exp_others||r.exp_trap){
    exp={why:r.exp_why||'',others:r.exp_others||'',trap:r.exp_trap||''};
  } else if(r.exp_raw){ exp={raw:r.exp_raw}; }
  return {id:r.id,subject:r.subject,year:r.year,round:r.round,qno:r.qno,major:r.major||'（未分類）',
    topic:r.topic||'',keywords:r.keywords||'',q:r.question,
    options:{A:r.opt_a,B:r.opt_b,C:r.opt_c,D:r.opt_d},answer:r.answer,
    accepted_answers:Array.isArray(r.accepted_answers)?r.accepted_answers.filter(x=>['A','B','C','D'].includes(String(x))):null,
    grading_mode:GRADING_MODES.has(String(r.grading_mode))?String(r.grading_mode):(r.answer==='一律給分'||isGiveAll(r.answer)?'unknown':'standard'),exp,
    mnemonic:r.mnemonic||'',extension:r.extension||'',law:r.law||'',mistake:r.mistake||'',legal_status:r.legal_status||'unreviewed',legal_checked_at:r.legal_checked_at||'',legal_note:r.legal_note||'',legal_source_url:r.legal_source_url||''};
}

async function fetchQuestionPage(from,to,maxAttempts=3){
  let lastError=null;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      showLoadProgress(from,attempt);
      if(sb && typeof sb.from==='function'){
        const {data,error}=await sb.from('questions').select('*').range(from,to);
        if(error) throw error;
        return data||[];
      }
      const limit=to-from+1;
      const url=CONFIG.url.replace(/\/$/,'')+`/rest/v1/questions?select=*&offset=${from}&limit=${limit}`;
      const res=await fetch(url,{method:'GET',headers:{apikey:CONFIG.key,Authorization:`Bearer ${CONFIG.key}`,Accept:'application/json'},cache:'no-store'});
      if(!res.ok){
        let detail='';
        try{ detail=await res.text(); }catch(_e){}
        throw new Error(`題庫 API ${res.status}${detail?': '+detail.slice(0,120):''}`);
      }
      const data=await res.json();
      return Array.isArray(data)?data:[];
    }catch(err){
      lastError=err;
      if(attempt<maxAttempts){ await sleep(700*attempt); }
    }
  }
  throw lastError || new Error('題庫載入失敗');
}

function questionTotal(){ return QB.manifest&&Number.isFinite(QB.manifest.total_questions)?QB.manifest.total_questions:ALL.length; }
function manifestYears(){
  if(!QB.manifest||!Array.isArray(QB.manifest.shards)) return [];
  return [...new Set(QB.manifest.shards.map(x=>parseInt(x.year,10)).filter(Number.isFinite))].sort((a,b)=>b-a);
}
function validateManifest(m){
  if(!m||m.schema_version!==1||!Array.isArray(m.shards)) throw new Error('題庫目錄格式不正確');
  if(m.shard_count!==m.shards.length) throw new Error('題庫目錄分片數不一致');
  if(m.total_questions!==m.shards.length*200) throw new Error('題庫目錄總題數不一致');
  m.shards.forEach(x=>{
    if(!x||!x.year||!x.round||!x.file||x.question_count!==200||!x.sha256) throw new Error('題庫分片 metadata 不完整');
  });
  return m;
}
async function sha256Hex(text){
  if(!window.crypto||!window.crypto.subtle) return null;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function saveOfflineRecord(key,value){
  const db=await openOfflineDB();

    const tx=db.transaction(OFFLINE_STORE,'readwrite');
    tx.objectStore(OFFLINE_STORE).put(value,key);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error||new Error('離線資料儲存失敗'));
    tx.onabort=()=>reject(tx.error||new Error('離線資料儲存中止'));
  });

}
async function loadOfflineRecord(key){

  });
  db.close();
  return value;
}
async function loadQuestionManifest(){

function validateShardPayload(payload,meta){
  if(!payload||payload.schema_version!==1||String(payload.year)!==String(meta.year)||canonicalRound(payload.round)!==canonicalRound(meta.round)) throw new Error('題庫分片內容與目錄不一致');
  if(payload.question_count!==200||!Array.isArray(payload.questions)||payload.questions.length!==200) throw new Error('題庫分片題數不完整');
  const ids=new Set();
  payload.questions.forEach(q=>{
    if(!q||!q.id) throw new Error('題庫分片含無效題目');
    if(ids.has(q.id)) throw new Error('題庫分片含重複題號');
    ids.add(q.id);
    const mode=String(q.grading_mode||'');
    if(!GRADING_MODES.has(mode)) throw new Error('題庫分片 grading_mode 缺失：'+q.id);
    if((mode==='all_credit'||mode==='any_answer')&&q.answer!=='一律給分') throw new Error('特殊給分題 metadata 不一致：'+q.id);
  });
  return payload;
}
async function fetchSupabaseExamSession(meta){
  const round=meta.round;
  if(sb&&typeof sb.from==='function'){
    const {data,error}=await sb.from('questions').select('*').eq('year',String(meta.year)).eq('round',round).order('qno',{ascending:true});
    if(error) throw error;
    if(!Array.isArray(data)||data.length!==200) throw new Error('Supabase scoped fallback 題數不完整');
    return {schema_version:1,year:String(meta.year),round,question_count:data.length,questions:data};
  }
  const base=CONFIG.url.replace(/\/$/,'')+'/rest/v1/questions?select=*&year=eq.'+encodeURIComponent(String(meta.year))+'&round=eq.'+encodeURIComponent(round)+'&order=qno.asc';
  const res=await fetch(base,{headers:{apikey:CONFIG.key,Authorization:'Bearer '+CONFIG.key,Accept:'application/json'},cache:'no-store'});
  if(!res.ok) throw new Error('Supabase fallback HTTP '+res.status);
  const data=await res.json();
  if(!Array.isArray(data)||data.length!==200) throw new Error('Supabase scoped fallback 題數不完整');
  return {schema_version:1,year:String(meta.year),round,question_count:data.length,questions:data};
}
async function loadQuestionShard(meta){
  if(QB.loadedFiles.has(meta.file)) return true;
  if(QB.loading.has(meta.file)) return QB.loading.get(meta.file);
  const promise=(async()=>{
    let payload=null, lastError=null;
    try{
      const res=await fetch(QUESTION_CDN_BASE+'/'+encodeURIComponent(meta.file),{cache:'no-store'});
      if(!res.ok) throw new Error('題庫分片 HTTP '+res.status);
      const text=await res.text();
      if(meta.sha256){
        const actual=await sha256Hex(text);
        if(actual&&actual!==meta.sha256) throw new Error('題庫分片 SHA-256 不符：'+meta.file);
      }
      payload=validateShardPayload(JSON.parse(text),meta);
    }catch(e){ lastError=e; }
    if(!payload){
      try{
        const cached=await loadOfflineRecord('question-shard:'+meta.file);
        if(cached&&cached.raw) payload=validateShardPayload(JSON.parse(cached.raw),meta);
      }catch(e){ lastError=e; }
    }
    if(!payload){
      try{ payload=validateShardPayload(await fetchSupabaseExamSession(meta),meta); }
      catch(e){ lastError=e; }
    }
    if(!payload) throw lastError||new Error('題庫分片載入失敗：'+meta.file);
    const raw=payload.questions;
    const normalized=raw.map(normalize);
    const byId=new Map(ALL.map(q=>[q.id,q]));
    normalized.forEach(q=>{ if(q&&q.id&&!byId.has(q.id)){ byId.set(q.id,q); ALL.push(q); } });
    QB.loadedFiles.add(meta.file);
    try{ await saveOfflineRecord('question-shard:'+meta.file,{raw:JSON.stringify(payload),file:meta.file,sha256:meta.sha256,savedAt:Date.now()}); }catch(e){}
    window._maxY=null; window._kpF=null; window._kpFmax=1; window._tmc={}; window._cmc={};
    return true;
  })();
  QB.loading.set(meta.file,promise);
  try{return await promise;}finally{QB.loading.delete(meta.file);}
}
async function ensureShardMetasLoaded(metas){
  const unique=[...(new Map((metas||[]).map(x=>[x.file,x]))).values()];
  if(!unique.length) throw new Error('沒有符合條件的題庫分片');
  for(const meta of unique) await loadQuestionShard(meta);
  SUBJECTS=CORE_SUBJECTS.slice();
  return unique.length;
}

}

}

const AUTO_ESSAY_CACHE_KEY='swsi_auto_essays_v1';

function canonicalRound(v){
  const s=String(v||'').replace(/\s+/g,'');
  if(s.includes('二')||s.includes('2')) return '2';
  if(s.includes('一')||s.includes('1')) return '1';
  return s;
}

function logicalExamKey(x){
  const n=parseInt(String((x&&x.qno)||''),10);
  return [String((x&&x.subject)||''),String((x&&x.year)||''),canonicalRound(x&&x.round),Number.isFinite(n)?String(n):String((x&&x.qno)||'')].join('|');
}

function mergeRawQuestions(base,extra){
  // 邏輯鍵以「科目＋年度＋考次＋題號」判斷同一題。
  // 先放 Supabase 母庫，增量檔只補不存在的題；因此已分析過的 Supabase 版本永遠優先。
  const m=new Map();
  (base||[]).forEach(x=>{ if(x) m.set(logicalExamKey(x),x); });
  (extra||[]).forEach(x=>{
    if(!x) return;
    const k=logicalExamKey(x);
    if(!m.has(k)) m.set(k,x);
  });
  return [...m.values()];
}

async function loadAutoEssays(){
  let rows=await fetchAutoJSON('auto/essays_auto.json');
  if(Array.isArray(rows)&&rows.length){
    try{ localStorage.setItem(AUTO_ESSAY_CACHE_KEY,JSON.stringify(rows)); }catch(e){}
  }else{
    try{ rows=JSON.parse(localStorage.getItem(AUTO_ESSAY_CACHE_KEY)||'[]'); }catch(e){ rows=[]; }
  }
  if(!Array.isArray(rows)) rows=[];
  const list=window.ESSAYS||[];
  const seen=new Set(list.map(logicalExamKey));
  let added=0;
  rows.forEach(x=>{
    if(!x) return;
    const k=logicalExamKey(x);
    if(seen.has(k)) return;
    const e=Object.assign({},x);
    e.round = canonicalRound(e.round)==='2' ? '第2次' : canonicalRound(e.round)==='1' ? '第1次' : e.round;
    e.major = e.major || e.subject || '';
    e.topic = e.topic || '官方新題（待考點分析）';
    e.keywords = Array.isArray(e.keywords)?e.keywords:[];
    e.theories = Array.isArray(e.theories)?e.theories:[];
    e.laws = Array.isArray(e.laws)?e.laws:[];
    e.related = Array.isArray(e.related)?e.related:[];
    list.push(e); seen.add(k); added++;
  });
  window._autoEssayCount=added;
}

function openOfflineDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('此瀏覽器不支援離線題庫')); return; }
    const req=indexedDB.open(OFFLINE_DB_NAME,OFFLINE_DB_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(OFFLINE_STORE)) db.createObjectStore(OFFLINE_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('離線資料庫開啟失敗'));
  });
}

async function saveOfflineQuestions(rows){
  try{
    if(!Array.isArray(rows)||!rows.length) return;
    const db=await openOfflineDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(OFFLINE_STORE,'readwrite');
      tx.objectStore(OFFLINE_STORE).put({rows:rows,savedAt:Date.now()},OFFLINE_KEY);
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error||new Error('離線題庫儲存失敗'));
      tx.onabort=()=>reject(tx.error||new Error('離線題庫儲存中止'));
    });
    db.close();
  }catch(err){
    console.warn('離線題庫備份失敗：',err);
  }
}

async function loadOfflineQuestions(){

    req.onerror=()=>reject(req.error||new Error('離線題庫讀取失敗'));
  });

  if(!record||!Array.isArray(record.rows)||!record.rows.length) throw new Error('這台裝置還沒有離線題庫備份');

}

// ===== 出題權重：近年 + 高頻考點優先（不刪舊題，只調整出現機率）=====
function maxExamYear(){ if(QB.manifest){ const ys=manifestYears(); if(ys.length) return ys[0]; } if(window._maxY==null){ let m=0; for(const q of ALL){ const y=parseInt(q.year)||0; if(y>m)m=y; } window._maxY=m||115; } return window._maxY; }
function yearWeight(q){ const y=parseInt(q.year)||0, mx=maxExamYear(); if(!y) return 1; const d=mx-y; return d<=2?4:(d<=7?2:(d<=10?0.8:0.35)); }
function kpFreq(){ if(!window._kpF){ const m={}; let mx=1; for(const q of ALL){ const k=q.major||''; if(!k)continue; m[k]=(m[k]||0)+1; if(m[k]>mx)mx=m[k]; } window._kpF=m; window._kpFmax=mx; } return window._kpF; }
function kpWeight(q){ const m=kpFreq(); const f=m[q.major||'']||1; return 1+0.5*(f/window._kpFmax); }
function drawWeight(q){ return yearWeight(q)*kpWeight(q)*legalWeight(q); }
function yearTier(q){ const d=maxExamYear()-(parseInt(q.year)||0); return d<=2?'高':(d<=7?'中':'參'); }
/* ===== LEGAL QUALITY GUARD V1 START ===== */
const LAW_UPDATED = new Set([ /* 舊版人工清單仍保留相容；正式狀態以 legal_status='changed' 為主 */ ]);
function lawSensitive(q){
  return !!q && (q.legal_status!=='not_applicable') && (q.subject==='社會政策與社會立法' || !!q.law || q.legal_status==='verified_current' || q.legal_status==='changed');
}
function lawConfirmedChanged(q){
  return !!q && (q.legal_status==='changed' || LAW_UPDATED.has(q.id) || q.law_updated===true || q.law_updated==='1' || q.law_updated==='是');
}
function lawNeedsWatch(q){
  if(!q || lawConfirmedChanged(q) || q.legal_status==='verified_current' || !lawSensitive(q)) return false;
  const y=parseInt(q.year,10)||0;
  return !!y && (maxExamYear()-y)>=3;
}
function lawUpdated(q){ return lawConfirmedChanged(q); }
function legalWeight(q){

function focusedQuizFilter(q){
  if(subjFilter!=='全部科目' && q.subject!==subjFilter) return false;
  const y=parseInt(q.year,10)||0, mx=maxExamYear();
  /* 智慧推薦只使用最近 10 個考試年度；更舊題目保留為歷史題庫。 */
  if(homeQuizScope==='smart') return (!y || y>=mx-9) && !lawConfirmedChanged(q);
  if(homeQuizScope==='recent3') return y>=mx-2 && !lawConfirmedChanged(q);
  if(homeQuizScope==='recent5') return y>=mx-4 && !lawConfirmedChanged(q);

    if(String(q.year)!==String(homeQuizYear)) return false;
    if(homeQuizRound!=='all' && canonicalRound(q.round)!==homeQuizRound) return false;

  return true;
}

function mcqBlob(q){ if(q._sb==null) q._sb=((q.q||'')+' '+(q.topic||'')+' '+(q.major||'')+' '+(q.keywords||'')+' '+(q.mistake||'')+' '+(q.law||'')+' '+(q.subject||'')+' '+(q.year||'')).toLowerCase(); return q._sb; }
function searchAll(query){
  const terms=(query||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const r={mcq:[],theories:[],laws:[],essays:[]};
  if(!terms.length) return r;
  const hit=(b)=>terms.every(t=>b.indexOf(t)>=0);
  for(const q of ALL){ if(hit(mcqBlob(q))) r.mcq.push(q); }
  const TH=window.THEORIES||[], LW=window.LAWS||[], ES=window.ESSAYS||[];
  for(const t of TH){ if(hit(((t.n||'')+' '+(t.d||'')+' '+(t.s||'')+' '+(t.c||'')+' '+(t.a||'')+' '+((t.k||[]).join(' '))).toLowerCase())) r.theories.push(t); }
  for(const l of LW){ if(hit(((l.n||'')+' '+(l.d||'')+' '+(l.p||'')+' '+(l.c||'')+' '+(l.a||'')+' '+(l.u||'')+' '+((l.k||[]).join(' '))).toLowerCase())) r.laws.push(l); }
  for(const e of ES){ if(hit(((e.q||'')+' '+(e.topic||'')+' '+(e.major||'')+' '+((e.keywords||[]).join(' '))+' '+((e.theories||[]).join(' '))+' '+((e.laws||[]).join(' '))+' '+(e.subject||'')+' '+(e.year||'')).toLowerCase())) r.essays.push(e); }
  return r;
}
function snip(s,n){ s=String(s||'').replace(/\s+/g,' ').trim(); return s.length>n?s.slice(0,n)+'…':s; }
function studyOne(id){ const q=ALL.find(x=>x.id===id); if(!q) return; queue=[q]; idx=0; selected=null; answered=false; sessionStats={done:0,correct:0,wrongTopics:[]}; view='quiz'; window.scrollTo(0,0); render(); }
function searchQuizMcq(){ const res=searchAll(searchQ); if(!res.mcq.length) return; const ids=new Set(res.mcq.map(q=>q.id)); startQuiz(q=>ids.has(q.id)); }
function openTheory(name){ theoryQ=''; theoryOpen=THEORIES.findIndex(t=>t.n===name); go('theories'); }
function openLawCard(name){ lawQ=''; lawOpen=LAWS.findIndex(l=>l.n===name); go('laws'); }

function doSearch(val){

  const sec=(t)=>`<div style="font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.06em;margin:18px 0 9px">${t}</div>`;
  const rowS='border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff';
  let h=`<div style="font-size:12px;color:var(--ink-soft);padding:6px 2px 0">共 ${total} 筆`+(r.mcq.length?` · 選擇 ${r.mcq.length}`:'')+(r.essays.length?` · 申論 ${r.essays.length}`:'')+(r.theories.length?` · 理論 ${r.theories.length}`:'')+(r.laws.length?` · 法規 ${r.laws.length}`:'')+`</div>`;
  if(r.mcq.length){

    if(r.mcq.length>12) h+=`<div style="font-size:12px;color:var(--ink-soft);margin:-2px 2px 6px">…還有 ${r.mcq.length-12} 題，按上面藍鈕一起練。</div>`;
  }
  if(r.essays.length){
    h+=sec(`申論題 · ${r.essays.length} 題`);
    r.essays.slice(0,10).forEach(e=>{ h+=`<div style="${rowS}" onclick="openEssayCard('${e.id}','${esc(e.subject)}')"><div style="font-size:14px;line-height:1.55;color:var(--ink);margin-bottom:5px">${esc(snip(e.q,62))}</div><div style="font-size:11.5px;color:var(--ink-soft)">${esc(e.subject)} · ${esc(e.year)}年 · ${esc(e.topic||'')}</div></div>`; });
  }
  if(r.theories.length){
    h+=sec(`核心理論 · ${r.theories.length} 則`);
    r.theories.slice(0,8).forEach(t=>{ h+=`<div style="${rowS}" onclick="openTheory('${esc(t.n)}')"><div style="font-size:14px;font-weight:600;color:var(--pine);margin-bottom:4px">${esc(t.n)}</div><div style="font-size:12px;color:var(--ink-soft);line-height:1.5">${esc(snip(t.c,56))}</div></div>`; });
  }
  if(r.laws.length){
    h+=sec(`重點法規 · ${r.laws.length} 則`);
    r.laws.slice(0,8).forEach(l=>{ h+=`<div style="${rowS}" onclick="openLawCard('${esc(l.n)}')"><div style="font-size:14px;font-weight:600;color:var(--gold);margin-bottom:4px">${esc(l.n)}</div><div style="font-size:12px;color:var(--ink-soft);line-height:1.5">${esc(snip(l.c,56))}</div></div>`; });
  }
  box.innerHTML=h;
}

function renderQuiz(){
  if(!queue.length){ app.innerHTML=`<div class="empty"><div class="ico">∅</div><h3>沒有符合的題目</h3><button class="btn" style="max-width:200px;margin:18px auto 0" onclick="go('home')">回首頁</button></div>`; return; }
  const item=queue[idx]; const pct=Math.round((idx/queue.length)*100);
  let optHTML='';
  for(const k of ['A','B','C','D']){
    if(!item.options[k]) continue;
    let cls='opt';
    const mode=gradingMode(item);
    if(answered){
      if(mode==='standard'&&acceptedAnswers(item).has(k)) cls+=' correct';
      else if(k===selected && isCorrectAnswer(item,selected)) cls+=' correct';
      else if(k===selected) cls+=' wrong';
    } else if(k===selected) cls+=' sel';
    let mk='';
    if(answered&&k===selected&&isCorrectAnswer(item,selected)) mk='<span class="mk"><b class="ck ok">✓</b>'+answerLabel(item)+'</span>';

    else if(answered&&k===selected) mk='<span class="mk"><b class="ck no">✗</b>你選的</span>';
    optHTML+=`<div class="${cls}" role="radio" aria-checked="${k===selected?'true':'false'}" tabindex="0" onclick="pick('${k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick('${k}')}"><span class="lab">${k}</span><span>${esc(item.options[k]).replace(/\n/g,'<br>')}</span>${mk}</div>`;
  }
  let expHTML='';
  if(answered){
    const wrong=!ansCorrect(selected,item); let body=gradingMode(item)==='all_credit'?'<div class="pending" style="background:var(--correct-bg);color:var(--pine)"><b>⚖ 官方特殊給分：</b>本題採一律給分規則，不代表四個選項在學理上都正確。</div>':(gradingMode(item)==='any_answer'?'<div class="pending" style="background:var(--correct-bg);color:var(--pine)"><b>⚖ 官方特殊給分：</b>本題除未作答外，其餘作答均給分。</div>':'');
    if(item.exp&&(item.exp.why||item.exp.others||item.exp.trap)){
      if(item.exp.why) body+=`<div class="exp-sec"><h4><span class="dot d-green"></span>為什麼對</h4><p>${item.exp.why}</p></div>`;
      if(item.exp.others) body+=`<div class="exp-sec"><h4><span class="dot d-red"></span>其他選項為什麼錯</h4><p>${item.exp.others}</p></div>`;

    let extra='';

    expHTML=`<div class="exp"><div class="topic">考點：<b>${item.topic||item.major}</b></div>${body}${extra}
      ${wrong&&item.mistake?`<div class="mistake">這題錯因：${item.mistake}</div>`:''}
      <button class="btn" onclick="next()">${idx+1<queue.length?'下一題 →':'看結果 →'}</button></div>`;

  app.innerHTML=`

function _normKW(s){ return (s||'').replace(/\s+/g,'').toLowerCase(); }

function mcqMatchTheory(q,t,cl){
  const blob=_normKW((q.major||'')+' '+(q.topic||'')+' '+(q.keywords||'')+' '+(q.law||''));
  if(blob.indexOf(_normKW(t.n))>=0) return true;
  const ks=t.k||[]; for(let i=0;i<ks.length;i++){ if(ks[i].length>=3 && blob.indexOf(_normKW(ks[i]))>=0) return true; }
  for(let i=0;i<cl.length;i++){ if(mcqMatchCluster(q,cl[i])) return true; }
  return false;
}
function theoryMcqCount(t){
  if(!ALL.length) return 0;

  return window._tmc[t.n];
}

function cnNum(n){ const d=['','一','二','三','四','五','六','七','八','九']; if(n<10) return d[n]; if(n===10) return '十'; if(n<20) return '十'+d[n-10]; const t=Math.floor(n/10),o=n%10; return d[t]+'十'+(o?d[o]:''); }
function toRoman(n){ const m=[[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']]; let r=''; for(const x of m){ while(n>=x[0]){ r+=x[1]; n-=x[0]; } } return r; }
const FMT={
  cn:  {src:'(?:^|\\n)[ \\t]*[一二三四五六七八九十]+、',  gen:n=>cnNum(n)+'、'},
  cnp: {src:'(?:^|\\n)[ \\t]*（[一二三四五六七八九十]+）', gen:n=>'（'+cnNum(n)+'）'},
  num: {src:'(?:^|\\n)[ \\t]*\\d+、',                  gen:n=>n+'、'},
  lat: {src:'(?:^|\\n)[ \\t]*[a-z]\\.',                gen:n=>String.fromCharCode(96+n)+'.'},
  rom: {src:'(?:^|\\n)[ \\t]*\\([ivxl]+\\)',           gen:n=>'('+toRoman(n)+')'}
};
function insertFmt(id, level){
  const ta=document.getElementById('ta_'+id); if(!ta) return;
  const order=['cn','cnp','num','lat','rom'], li=order.indexOf(level);
  const f=FMT[level]; if(li<0||!f) return;
  const s=ta.selectionStart, e=ta.selectionEnd, v=ta.value, before=v.slice(0,s);
  // 找游標前「上一層」最後一個標記的位置，讓本層編號在每個上層底下重新算
  let resetPos=0;
  for(let i=0;i<li;i++){ const re=new RegExp(FMT[order[i]].src,'g'); let mm,last=-1; while((mm=re.exec(before))!==null){ last=mm.index; if(re.lastIndex===mm.index) re.lastIndex++; } if(last>resetPos) resetPos=last; }
  const seg=before.slice(resetPos);
  const cnt=(seg.match(new RegExp(f.src,'g'))||[]).length;
  const txt=f.gen(cnt+1);
  const ins=(before.length>0 && !before.endsWith('\n')?'\n':'')+txt;
  ta.value=before+ins+v.slice(e);
  const pos=s+ins.length; ta.selectionStart=ta.selectionEnd=pos;
  ta.focus(); saveDraft(id);
}

/* ---------- 手寫照片：縮圖 + 讀字 + 批改（Qwen 多模態） ---------- */
function shrinkImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=function(){
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h){ URL.revokeObjectURL(url); reject(new Error('no size')); return; }
        const m=Math.max(w,h);
        if(m>maxDim){ const s=maxDim/m; w=Math.round(w*s); h=Math.round(h*s); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',quality));
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('load fail')); };
    img.src=url;
  });
}

/* ---------- 舊版題解標籤解析 ---------- */
function parseExp(raw){
  const p={why:'',others:'',trap:'',raw:''};
  if(!raw||!String(raw).trim()) return p;
  raw=String(raw).trim();
  /* 格式一：【標籤】內容 — 題庫主格式（【白話】【為什麼答案對(…)】【其他選項為何錯】【考場陷阱】）*/
  if(raw.indexOf('【')>=0){
    const re=/【([^】]+)】\s*([\s\S]*?)(?=【[^】]+】|$)/g; let m;
    while((m=re.exec(raw))){
      const lab=m[1], body=(m[2]||'').trim(); if(!body) continue;
      if(lab.indexOf('白話')===0){ if(!p.why)p.why=body; }
      else if(lab.indexOf('為什麼')===0){ if(!p.why)p.why=body; }
      else if(lab.indexOf('其他')===0){ p.others=p.others?(p.others+' '+body):body; }
      else if(lab.indexOf('陷阱')>=0){ p.trap=p.trap?(p.trap+' '+body):body; }
      /* 記憶法／法源／延伸考點／新舊法等標籤略過（另存獨立欄位）*/
    }
    if(p.why||p.others||p.trap) return p;
  }
  /* 格式二（後備）：以「為什麼／其他／考場陷阱：」開頭的分行文字 */
  let matched=false;
  raw.split('\n').forEach(function(seg){ seg=seg.trim(); if(!seg)return;
    const body=seg.indexOf('：')>=0?seg.split('：').slice(1).join('：').trim():seg;
    if(seg.indexOf('為什麼')===0){p.why=body;matched=true;}
    else if(seg.indexOf('其他')===0){p.others=body;matched=true;}
    else if(seg.indexOf('考場陷阱')===0||seg.indexOf('陷阱')===0){p.trap=body;matched=true;}
    else { p.why=p.why?(p.why+' '+seg):seg; }
  });
  if(!matched && !(p.why||p.others||p.trap)) p.raw=raw;
  return p;
}

      +(sig.mcq_focus&&sig.mcq_focus.length?'<details class="nlr-detail"><summary>選擇題可能抓哪些事實？</summary><div class="nlr-chips">'+sig.mcq_focus.slice(0,8).map(function(x){return '<span class="nlr-chip">'+E(x)+'</span>';}).join('')+'</div></details>':'')
      +(sig.related_exam_questions&&sig.related_exam_questions.length?'<details class="nlr-detail"><summary>歷屆相關題</summary><ul>'+sig.related_exam_questions.slice(0,4).map(function(q){var label=(q.year||'')+'-'+(q.round||'')+'-'+(q.qno||'');return '<li><b>'+E(q.id||label)+'</b> '+E(q.subject||'')+(q.topic?' ・ '+E(q.topic):'')+'</li>';}).join('')+'</ul></details>':'')
      +'<details class="nlr-detail"><summary>此類事件常見的申論思考方向</summary><ul>'+pts+'</ul><div class="nlr-exam">'+E(t.exam)+'</div></details>'
      +'<a class="nlr-link" href="'+E(ev.source_url)+'" target="_blank" rel="noopener noreferrer">查看原始來源 ↗</a>'
      +'</div>';
  }
  function ensureStyle(){
    if(document.getElementById('swsi-nlr-style')) return;
    var st=document.createElement('style'); st.id='swsi-nlr-style';
    st.textContent=''
      +'.nlr-box{margin:14px 0 18px;padding:14px;border:1px solid var(--line,#ddd);border-radius:16px;background:var(--card,#fff)}'
      +'.nlr-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:4px}.nlr-h{font-weight:800;font-size:1.05rem}.nlr-badge{font-size:.75rem;padding:4px 8px;border-radius:999px;background:var(--soft,#f3f3f3);white-space:nowrap}'
      +'.nlr-help{font-size:.82rem;line-height:1.55;color:var(--muted,#666);margin:5px 0 12px}.nlr-grid{display:grid;gap:10px}'
      +'.nlr-card{border:1px solid var(--line,#ddd);border-radius:13px;padding:12px;background:var(--bg,#fff)}.nlr-head{display:flex;justify-content:space-between;gap:8px}.nlr-cat{font-size:.75rem;font-weight:700}.nlr-score{font-size:.72rem;color:var(--muted,#777)}'
      +'.nlr-title{font-weight:800;line-height:1.45;margin:6px 0}.nlr-meta,.nlr-summary{font-size:.8rem;color:var(--muted,#666);line-height:1.55}.nlr-summary{margin-top:7px}'
      +'.nlr-subs,.nlr-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.nlr-sub,.nlr-chip{font-size:.7rem;border-radius:999px;padding:3px 7px;background:var(--soft,#f2f2f2)}'
      +'.nlr-detail{margin-top:9px;font-size:.8rem;line-height:1.55}.nlr-detail summary{cursor:pointer;font-weight:700}.nlr-detail ul{padding-left:20px;margin:7px 0}.nlr-exam{margin-top:6px}.nlr-signal{margin-top:9px;font-size:.8rem}.nlr-signal-text{margin-top:5px;font-size:.78rem;line-height:1.5}.nlr-link{display:inline-block;margin-top:9px;font-size:.78rem;text-decoration:none;font-weight:700}.nlr-empty{font-size:.82rem;color:var(--muted,#777);padding:8px 0}';
    document.head.appendChild(st);
  }
  function loadLive(){
    if(loadPromise) return loadPromise;
    loadPromise=fetch('./auto/current_affairs.json',{cache:'no-store'})
      .then(function(r){if(!r.ok) throw new Error('current affairs HTTP '+r.status);return r.json();})
      .then(function(d){
        liveItems=Array.isArray(d.items)?d.items:[];
        return fetch('./auto/current_affairs_signals.json',{cache:'no-store'})
          .then(function(r){if(!r.ok) throw new Error('signals HTTP '+r.status);return r.json();})
          .then(function(s){signalItems=Array.isArray(s.items)?s.items:[];return liveItems;})
          .catch(function(){signalItems=[];return liveItems;});
      })
      .catch(function(){liveItems=[];signalItems=[];return liveItems;});
    return loadPromise;
  }
  function inject(filter){
    currentFilter=filter||currentFilter||'全部';
    var wrap=document.querySelector('.nl-wrap'); if(!wrap) return;
    var old=document.getElementById('nl-live-radar'); if(old) old.remove();
    var list=liveItems.filter(function(ev){return currentFilter==='全部'||(ev.subjects||[]).indexOf(currentFilter)>=0;}).slice(0,6);
    if(!liveItems.length) return;
    var box=document.createElement('section'); box.id='nl-live-radar'; box.className='nlr-box';
    box.innerHTML='<div class="nlr-top"><div class="nlr-h">⚡ 最新雷達</div><div class="nlr-badge">每日自動篩選</div></div>'
      +'<div class="nlr-help">台灣優先；只保留和社工師申論較相關的制度、權益、保護與服務體系事件。這裡是「題材雷達」，不是命題保證；事實細節請以原始來源為準。</div>'
      +(list.length?'<div class="nlr-grid">'+list.map(liveCard).join('')+'</div>':'<div class="nlr-empty">這個科目目前沒有新的高關聯時事。</div>');
    var chips=wrap.querySelector('.nl-chips');
    if(chips) wrap.insertBefore(box,chips); else wrap.appendChild(box);
  }
  function hook(){
    if(!window.NL||window.NL.__liveHooked) return false;
    ensureStyle();
    oldOpen=window.NL.open; oldFilter=window.NL.filter;
    window.NL.open=function(){
      currentFilter='全部'; oldOpen.apply(window.NL,arguments);
      loadLive().then(function(){inject(currentFilter);});
    };
    window.NL.filter=function(f){
      currentFilter=f||'全部'; oldFilter.apply(window.NL,arguments);
      loadLive().then(function(){inject(currentFilter);});
    };
    window.NL.__liveHooked=true;
    return true;
  }
  if(!hook()){
    var tries=0, timer=setInterval(function(){tries++;if(hook()||tries>40)clearInterval(timer);},100);
  }
})();
</script>

<script id="swsi-uiux-v1-script">
(function(){
  if(window.__SWSI_UIUX_V1__) return;
  window.__SWSI_UIUX_V1__=true;

  var vp=document.querySelector('meta[name="viewport"]');
  if(vp) vp.setAttribute('content','width=device-width, initial-scale=1.0, viewport-fit=cover');

  function relabelTabs(){
    var home=document.getElementById('t-home'), review=document.getElementById('t-review'), essay=document.getElementById('t-essay');
    var topics=document.getElementById('t-topics'), progress=document.getElementById('t-progress'), bar=document.getElementById('tabbar');
    if(home) home.innerHTML='<span class="ico">⌂</span>首頁';
    if(review) review.innerHTML='<span class="ico">↻</span>複習';
    if(essay) essay.innerHTML='<span class="ico">✒</span>申論';
    if(topics) topics.style.display='none';
    if(progress) progress.style.display='none';
    if(bar&&home&&review&&essay){ try{bar.appendChild(home);bar.appendChild(review);bar.appendChild(essay);}catch(_e){} }
  }
  relabelTabs();
  var oldFocused=typeof applyFocusedTabbar==='function'?applyFocusedTabbar:null;
  if(oldFocused){
    applyFocusedTabbar=function(){ oldFocused(); relabelTabs(); };
  }

  window.startQuickSmartV1=function(){
    homeQuizScope='smart'; homeQuizCount=20; homeQuizOpen=false; subjFilter='全部科目';
    startFocusedQuiz();
  };

  renderHome=function(){
    var offlineNote=window._usingOfflineBackup?'<div style="margin-bottom:12px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:12px;color:var(--ink-soft)">📦 目前使用這台裝置的離線題庫備援；恢復網路後重新開啟網站即可同步最新題庫。</div>':'';
    var rv=reviewSummary();
    var years=examYears();
    if(!homeQuizYear&&years.length) homeQuizYear=String(years[0]);
    var newest=years.length?years[0]:'';
    var subjOpts=['全部科目'].concat(SUBJECTS).map(function(x){return '<option value="'+esc(x)+'" '+(x===subjFilter?'selected':'')+'>'+esc(x)+'</option>';}).join('');
    var yearOpts=years.map(function(y){return '<option value="'+y+'" '+(String(y)===String(homeQuizYear)?'selected':'')+'>'+y+' 年</option>';}).join('');
    var specific=homeQuizScope==='specific';
    var reviewSub=rv.dueCount?('今天 '+rv.dueCount+' 題到期'):(rv.nextDueAt?('下一批 '+reviewDueLabel(rv.nextDueAt)):'目前沒有待複習題');
    var scopeHint=homeQuizScope==='smart'?'最近 10 年為主，近 3 年與高頻考點優先。':homeQuizScope==='specific'?'只刷你指定的年度／考次。':homeQuizScope==='all'?'包含所有歷史題目。':'只從較新的歷屆題目抽題。';

    app.innerHTML=offlineNote+
      '<div class="ux-home-intro">'+
        '<div class="eyebrow">社工師國考</div><h1>今天要練什麼？</h1><p>選一件事開始就好，進階設定需要時再打開。</p>'+
        '<div class="ux-home-meta"><span>5 科</span><span>'+ALL.length+' 題</span>'+(newest?'<span>'+newest+' 最新</span>':'')+'</div>'+
      '</div>'+
      '<div class="ux-main-card primary">'+
        '<div class="ux-card-top"><div><div class="ux-card-title">📝 刷選擇題</div><div class="ux-card-sub">直接用智慧推薦練 20 題，或自己指定歷屆範圍。</div></div></div>'+
        '<div class="ux-actions"><button class="ux-btn-main" onclick="startQuickSmartV1()">智慧刷 20 題</button><button class="ux-btn-soft" onclick="toggleHomeQuiz()">'+(homeQuizOpen?'收起設定':'自訂範圍')+'</button></div>'+
      '</div>'+
      (homeQuizOpen?('<div class="ux-custom">'+
        '<div class="ux-custom-label">刷題範圍</div><select class="subj" onchange="setHomeQuizScope(this.value)" style="margin-bottom:9px">'+
          '<option value="smart" '+(homeQuizScope==='smart'?'selected':'')+'>智慧推薦</option><option value="recent3" '+(homeQuizScope==='recent3'?'selected':'')+'>近 3 年</option><option value="recent5" '+(homeQuizScope==='recent5'?'selected':'')+'>近 5 年</option><option value="specific" '+(homeQuizScope==='specific'?'selected':'')+'>指定歷屆</option><option value="all" '+(homeQuizScope==='all'?'selected':'')+'>全部題庫（含歷史題）</option></select>'+
        (specific?('<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select class="subj" onchange="setHomeQuizYear(this.value)" style="margin-bottom:9px">'+yearOpts+'</select><select class="subj" onchange="setHomeQuizRound(this.value)" style="margin-bottom:9px"><option value="all" '+(homeQuizRound==='all'?'selected':'')+'>全部考次</option><option value="1" '+(homeQuizRound==='1'?'selected':'')+'>第一次</option><option value="2" '+(homeQuizRound==='2'?'selected':'')+'>第二次</option></select></div>'):'')+
        '<select class="subj" onchange="subjFilter=this.value" style="margin-bottom:9px">'+subjOpts+'</select>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select class="subj" onchange="setHomeQuizCount(this.value)" style="margin:0"><option value="10" '+(homeQuizCount===10?'selected':'')+'>10 題</option><option value="20" '+(homeQuizCount===20?'selected':'')+'>20 題</option><option value="50" '+(homeQuizCount===50?'selected':'')+'>50 題</option><option value="0" '+(homeQuizCount===0?'selected':'')+'>全部符合題目</option></select><button class="ux-btn-main" onclick="startFocusedQuiz()">開始刷題</button></div>'+

      '<div class="ux-tools"><button onclick="MK.open()">計時模擬考</button><button onclick="go(\'topics\')">學習工具</button></div>';
    relabelTabs();
  };

  renderReview=function(){
    var rv=reviewSummary(), ids=rv.activeIds;
    if(!ids.length&&!rv.dueCount&&!rv.nextDueAt){
      app.innerHTML='<div class="empty"><div class="ico">✓</div><h3>'+(rv.masteredCount?'今天沒有待複習題':'還沒有錯題')+'</h3><p>'+(rv.masteredCount?('已有 '+rv.masteredCount+' 題完成學習與長期確認。'): '刷題答錯後，系統會自動安排之後的複習。')+'</p><button class="btn" style="max-width:200px;margin:22px auto 0" onclick="go(\'home\')">回首頁刷題</button></div>';
      return;
    }
    var wrongQs=ids.map(function(id){return ALL.find(function(q){return q.id===id;});}).filter(Boolean);
    var byReason={}; wrongQs.forEach(function(q){var r=q.mistake||'未分類';(byReason[r]=byReason[r]||[]).push(q);});
    window._rs=[{label:'全部未熟練錯題',ids:ids}];
    var reasons=Object.entries(byReason).sort(function(a,b){return b[1].length-a[1].length;});
    reasons.forEach(function(pair){window._rs.push({label:pair[0],ids:pair[1].map(function(x){return x.id;})});});
    var html='<div class="ux-page-head"><h2>今日複習</h2><p>先處理今天到期的錯題；其他未熟練題目需要時再重練。</p></div>';
    html+='<div class="statrow" style="margin-bottom:14px"><div class="stat"><div class="v" style="color:var(--wrong)">'+rv.dueCount+'</div><div class="k">今天到期</div></div><div class="stat"><div class="v">'+rv.activeCount+'</div><div class="k">未熟練</div></div><div class="stat"><div class="v" style="color:var(--correct)">'+rv.masteredCount+'</div><div class="k">已掌握</div></div></div>';
    if(rv.dueCount) html+='<button class="btn" onclick="startDueReview()" style="margin-bottom:10px">開始今天的複習 · '+rv.dueCount+' 題</button>';
    else if(rv.nextDueAt) html+='<div style="margin-bottom:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px;color:var(--ink-soft)">✓ 今天已完成，下一批 '+reviewDueLabel(rv.nextDueAt)+'。</div>';
    if(wrongQs.length) html+='<button class="btn ghost" onclick="practiceSet(0)" style="margin-bottom:5px">重練全部未熟練 · '+wrongQs.length+' 題</button>';
    html+='<details class="ux-review-rule"><summary>複習規則</summary><p>答錯後 1 天再看；答對後逐步拉長到 3、7 天。連續答對 3 次後進入已掌握，再於 14、30 天做長期確認；之後若又答錯，會重新排入複習。</p></details>';
