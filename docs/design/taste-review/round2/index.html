</style></head><body data-theme="a" data-view="home"><noscript><p class="no-script">這份互動概念稿需要 JavaScript。請使用同資料夾的截圖檢視三個設計方向。</p></noscript><div id="root"></div><dialog id="info" class="dialog"><h2 id="info-title"></h2><p>這份概念稿供比較首頁、刷題與解析的視覺及動態。此入口的完整功能保留在原平台，這裡不連接正式資料或服務。</p><button class="solid" id="close-info">回到設計稿</button></dialog><script>
const paths={arrow:'M4 12h16m-6-6 6 6-6 6',back:'M20 12H4m6-6-6 6 6 6',play:'m8 5 11 7-11 7z',book:'M4 4h6l2 2 2-2h6v16h-6l-2 2-2-2H4zM12 6v16',pen:'m5 19 4-1L20 7l-3-3L6 15zM14 7l3 3M4 22h16',timer:'M12 8v5l3 2M8 2h8M12 2v3',review:'M4 7v5h5M4 12a8 8 0 1 1 2 6',chart:'M5 20V12M12 20V5M19 20V9',home:'m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10',person:'M4 21v-2a8 8 0 0 1 16 0v2M8 7a4 4 0 1 0 8 0 4 4 0 1 0-8 0'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.arrow}"/>${name==='timer'?'<circle cx="12" cy="13" r="8"/>':''}</svg>`;
const names={a:'A 藍白學習介面',b:'B 深色專注介面',c:'C 珊瑚橘開放編排'};
const params=new URLSearchParams(location.search);let theme=params.get('theme')||'a';if(!names[theme])theme='a';let view=params.get('view')==='quiz'?'quiz':'home',question=0,choice=-1,answered=false,large=false;
const examples=[{text:'初次會談時，社會工作者應如何與服務使用者建立合作關係？',options:['先了解對方的需要，說明服務方式與保密原則。','直接為對方決定處遇目標。','只記錄資料，不回應對方的感受。','要求對方立即承諾接受所有服務。'],correct:0,explain:'先理解對方的需要，並清楚說明服務方式與保密原則，有助於建立信任與共同討論的基礎。這是自訂示範題，不屬於官方考題。'},{text:'在服務過程中，如何讓服務使用者參與目標設定？',options:['由專業人員單方面決定所有目標。','與對方共同討論需求、可行選擇及優先順序。','忽略對方意見，直接套用標準方案。','等服務結束後，再詢問對方的想法。'],correct:1,explain:'共同討論需求、選擇及優先順序，能讓服務使用者實際參與目標設定。此段為自訂示範解析，不是 AI 的即時回饋。'}];
function feature(label,sub,ic,action,index=''){return `<button class="feature" data-action="${action}" data-title="${label}">${index?`<span class="route-num">${index}</span>`:icon(ic)}<span>${label}<small>${sub}</small></span>${icon('arrow')}</button>`}
function utilities(){return `<div class="utilities"><a href="#" data-action="info" data-title="模擬考">${icon('timer')}模擬考</a><a href="#" data-action="info" data-title="錯題本">${icon('review')}錯題本</a><a href="#" data-action="info" data-title="弱點分析">${icon('chart')}弱點分析</a></div>`}
function header(){return `<div class="review"><span>互動概念稿 · 第 2 輪 <strong>／ 與正式平台隔離</strong></span><nav class="variants" aria-label="設計方向">${Object.keys(names).map(k=>`<a href="?theme=${k}&view=${view}" ${theme===k?'aria-current="page"':''} aria-label="${names[k]}">${k.toUpperCase()}</a>`).join('')}</nav></div><header class="site-head"><a href="?theme=${theme}" class="wordmark" aria-label="SWSI 示範首頁"><span class="brand-mark" aria-hidden="true">//</span>SWSI<small>社工師<br>國考練習</small></a><nav class="head-nav" aria-label="主要導覽"><button data-action="home" class="${view==='home'?'active':''}">學習首頁</button><button data-action="quiz" class="${view==='quiz'?'active':''}">刷題練習</button><button data-action="info" data-title="申論練習">申論</button><button data-action="info" data-title="我的學習">我的學習</button></nav><span class="demo-badge">${theme.toUpperCase()} · 設計預覽</span></header>`}
function home(){if(theme==='a')return `<div class="a-home"><section class="a-hero enter"><div class="eyebrow">社工師國考練習</div><h1>現在開始，<br>多懂一題。</h1><p class="lead">從選題、作答到理解解析，<br>把注意力留給每一道題目。</p><button class="solid" data-action="quiz">開始刷題 ${icon('arrow')}</button><div class="folds" aria-hidden="true"><i></i><i></i><i></i></div></section><section class="a-routes enter delay"><div class="eyebrow">選擇你的練習方式</div><h2 class="subhead">今天，練習什麼？</h2><div class="feature-list">${feature('歷屆試題','依年份與科目，找到練習範圍。','book','info')}${feature('申論練習','從組織觀點開始，練習完整表達。','pen','info')}</div><p class="micro">每個入口都有明確的用途，<br>你可以按照自己的步調開始。</p></section><section class="a-tools enter delay"><h2 class="subhead">其他學習工具</h2>${utilities()}</section></div>`;
if(theme==='b')return `<section class="b-hero enter"><div class="text-part"><div class="eyebrow">社工師國考 / 專注練習</div><h1>進入你的<br><em>專注時段。</em></h1><p class="lead">一次一題。<br>把問題想清楚，再往下一題。</p><button class="solid" data-action="quiz">開始刷題 ${icon('arrow')}</button></div><div class="orbit" aria-hidden="true"><div class="orb-center"><strong>01</strong><span>從第一題開始</span></div><i class="orb-dot"></i></div></section><section class="b-rail enter delay" aria-label="練習入口">${feature('歷屆試題','選定年份與科目','book','info')}${feature('申論練習','寫出你的理解','pen','info')}${feature('錯題複習','回到還不熟的地方','review','info')}</section>${utilities()}`;
return `<div class="c-home"><section class="enter"><div class="c-title"><div class="eyebrow">SWSI / 社工師國考</div><h1>每一次練習，<br><em>都更有把握。</em></h1><p class="lead">選擇題、申論與複習。<br>從今天想練習的內容開始。</p></div><button class="c-start" data-action="quiz"><span class="big-index" aria-hidden="true">↗</span><span><b>開始刷題</b><small>選擇答案，再把解析讀懂。</small></span>${icon('arrow')}</button></section><section class="c-routes enter delay" aria-label="練習入口">${feature('歷屆試題','依年份、科目安排練習','book','info','選擇題')}${feature('申論練習','練習論述與組織觀點','pen','info','申論題')}${feature('錯題複習','整理錯題，重新理解','review','info','複習')}</section><section class="c-resources"><h2 class="subhead">繼續探索</h2>${utilities()}</section></div>`}
function quiz(){const q=examples[question];return `<div class="quiz-top"><button class="back" data-action="home">${icon('back')}離開練習</button><div class="font-size" aria-label="閱讀字級"><button data-action="small" aria-label="標準字級" aria-pressed="${!large}">A</button><button data-action="large" aria-label="放大字級" aria-pressed="${large}">A＋</button></div></div><div class="quiz-layout ${theme}-quiz enter"><aside class="quiz-meta"><div><div class="eyebrow">選擇題練習</div><h1>社會工作直接服務</h1></div>${theme!=='a'?`<strong class="giant">0${question+1}<span class="micro"> / 02</span></strong>`:''}<div class="step-numbers"><span class="${question===0?'current':''}">01</span><span class="${question===1?'current':''}">02</span></div><div class="progress"><i style="transform:scaleX(${question+1})"></i></div><p class="micro">自訂示範題，共 2 題。<br>不計入正式學習紀錄。</p></aside><section class="question-area"><div class="q-line"><span class="q-category">建立專業關係</span><span>示範題 ${question+1} / 2</span></div><h2 class="qtext" id="question">${q.text}</h2><fieldset class="answers"><legend>請選擇一個答案</legend>${q.options.map((t,i)=>`<div class="choice ${answered&&i===q.correct?'good':''}"><input type="radio" id="answer-${i}" name="answer" value="${i}" ${choice===i?'checked':''} ${answered?'disabled':''}><label for="answer-${i}"><span class="letter" aria-hidden="true">${'ABCD'[i]}</span><span>${t}</span>${answered&&i===q.correct?'<span class="answer-state">✓ 正確</span>':''}</label></div>`).join('')}</fieldset>${answered?`<div class="explanation" tabindex="-1" role="status"><strong>${choice===q.correct?'答對了，繼續理解原因。':'先看解析，再往下一題。'}</strong>${q.explain}</div>`:''}<div class="q-actions"><p class="micro">${answered?'這是示範回饋，未呼叫 AI 服務。':'選擇答案後，才能送出作答。'}</p><button class="solid" data-action="${answered?'next':'submit'}" ${choice<0?'disabled':''}>${answered?(question===1?'完成示範':'下一題'):'送出答案'} ${icon('arrow')}</button></div></section></div>`}
function render(){document.body.dataset.theme=theme;document.body.className=theme;document.body.dataset.view=view;document.body.style.setProperty('--reading',large?'25px':'');document.body.style.setProperty('--option-size',large?'19px':'');document.title=names[theme]+'｜SWSI 互動設計';document.querySelector('#root').innerHTML=header()+`<main class="shell">${view==='home'?home():view==='quiz'?quiz():`<section class="end-screen enter"><div class="eyebrow">互動示範完成</div><h1>兩道題，體驗完整流程。</h1><p>你已體驗選答、送出與解析切換。<br>這是設計概念稿，不會寫入正式學習紀錄。</p><button class="solid" data-action="home">回到首頁 ${icon('arrow')}</button></section>`}</main><footer class="footer"><span>SWSI 社工師國考 · 互動設計概念 ${theme.toUpperCase()}</span><span>自訂展示題 · 不連接正式資料 · 字型：Noto Sans CJK TC（OFL）</span></footer><nav class="bottom-nav" aria-label="手機導覽"><button data-action="home" class="${view==='home'?'active':''}">${icon('home')}首頁</button><button data-action="quiz">${icon('book')}刷題</button><button data-action="info" data-title="申論練習">${icon('pen')}申論</button><button data-action="info" data-title="我的學習">${icon('person')}我的</button></nav>`}
document.addEventListener('change',e=>{if(e.target.name==='answer'){choice=Number(e.target.value);document.querySelector('[data-action=submit]').disabled=false}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const action=el.dataset.action;if(action==='info'){document.querySelector('#info-title').textContent=el.dataset.title;document.querySelector('#info').showModal();return}if(action==='home'){view='home';question=0;choice=-1;answered=false}if(action==='quiz'){view='quiz';question=0;choice=-1;answered=false}if(action==='large'||action==='small'){large=action==='large';render();document.querySelector(`[data-action=${action}]`).focus();return}if(action==='submit'){if(choice<0)return;answered=true;render();document.querySelector('.explanation').focus({preventScroll:true});document.querySelector('.explanation').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});return}if(action==='next'){question++;choice=-1;answered=false;if(question>=examples.length)view='end'}render();window.scrollTo(0,0)});
document.querySelector('#close-info').onclick=()=>document.querySelector('#info').close();render();
</script></body></html>
