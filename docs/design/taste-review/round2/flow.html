color:#7c8797;font-size:16px}.study{max-width:720px;margin:auto}.study-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{border:0;background:none;color:#53627a;min-height:44px;padding:0 10px 0 0;font-size:12px}.type-controls{display:flex;background:#e7eaf0;border-radius:12px;padding:3px;gap:2px}.type-controls button{min-width:44px;height:38px;border:0;background:none;border-radius:9px;font-size:12px;color:#56637a}.type-controls button[aria-pressed=true]{background:white;color:#283f67;box-shadow:0 1px 4px #192c4e15}.study .sheet{view-transition-name:study-sheet;background:white;border-radius:26px;padding:27px 30px 0;box-shadow:0 6px 28px #253b5710}.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#748093;font-size:11px;margin-bottom:15px}.topic{color:#49648f}.progress{height:4px;background:#edf0f5;border-radius:4px;overflow:hidden;margin-bottom:29px}.progress i{display:block;width:100%;height:100%;background:#7d9bd2;transform:scaleX(var(--progress,0));transform-origin:left;transition:transform .45s}.question{padding:0 0 25px}.prompt-meta{font-size:11px;color:#748094;margin-bottom:11px}.question h1{font-size:var(--q-size,25px);font-weight:600;line-height:1.75;letter-spacing:-.3px;view-transition-name:question-copy}.prompt-note{font-size:11px;color:#738093;margin-top:13px}.answers{border:0;min-width:0;padding:0;margin:25px 0 0;display:grid;gap:11px}.answers legend{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.option{position:relative}.option input{position:absolute;opacity:0;width:1px;height:1px}.option label{display:flex;align-items:flex-start;gap:13px;background:#f5f6f8;border:1.5px solid transparent;border-radius:16px;padding:17px 18px;line-height:1.8;font-size:var(--a-size,15px);cursor:pointer;transition:background .18s,border-color .18s}.letter{display:grid;place-items:center;flex:none;width:25px;height:25px;border-radius:50%;border:1px solid #ccd3df;color:#65728a;font-size:11px;margin-top:1px}.option input:checked+label{background:#edf2fc;border-color:#7897d0}.option input:checked+label .letter{background:#4b70b8;color:white;border-color:#4b70b8}.option.correct input+label{background:#ebf5f0;border-color:#85b59e}.option.correct .letter{background:#397e5e!important;border-color:#397e5e!important;color:white}.option.wrong input+label{background:#faf0ec;border-color:#d3a08d}.option.wrong .letter{background:#a96449!important;border-color:#a96449!important;color:white}.option input:disabled+label{cursor:default}.feedback{background:#edf6f1;border-radius:18px;padding:22px;margin:0 0 25px;animation:reveal .3s both}.feedback.wrong{background:#fbf1eb}.status{display:flex;gap:9px;align-items:center;color:#30694f;font-size:13px;font-weight:600;margin-bottom:11px}.feedback.wrong .status{color:#965335}.feedback p{font-size:var(--a-size,14px);line-height:1.95;color:#4c5966}.key{font-weight:600}.checkmark{font-size:17px}.actions{position:sticky;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 0 max(17px,env(safe-area-inset-bottom));background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid #edf0f4}.actions small{font-size:11px;color:#748093}.actions .primary{min-width:175px}.result{max-width:600px;margin:45px auto}.result .sheet{view-transition-name:study-sheet;background:white;border-radius:25px;padding:35px;text-align:center}.result h1{font-size:27px;margin:16px 0 12px}.result p{color:#68778b;font-size:13px}.tag{font-size:11px;color:#60718c}.result-graphic{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 20px;background:#e9f2ed;color:#487a60;border-radius:50%;font-size:32px}.result-graphic .tile{display:none}.result-stats{display:grid;grid-template-columns:1fr 1fr;padding:22px 0;margin:24px 0;border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}.result-stats strong{display:block;font-size:38px;font-weight:600;color:#43639d}.result-stats span{font-size:11px;color:#6e7d92}.dialog{width:calc(100% - 40px);max-width:400px;border:0;border-radius:24px;padding:28px;color:#273349}.dialog::backdrop{background:#24314965;backdrop-filter:blur(5px)}.dialog h2{font-size:20px;margin-bottom:12px}.dialog p{font-size:14px;color:#637084;margin-bottom:24px}.dialog .primary{width:100%}@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}::view-transition-group(study-sheet){animation-duration:.4s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}::view-transition-old(question-copy){animation:leave .16s both}::view-transition-new(question-copy){animation:reveal .3s both}@keyframes leave{to{opacity:0;transform:translateY(-8px)}}@media(hover:hover){.primary:hover:not(:disabled){background:#2e508e}.mode:hover{filter:brightness(.97)}.subject:hover{color:#3d61aa}.option input:not(:disabled)+label:hover{border-color:#a4b4ce}}

</style></head><body><div class="notice">SWSI 互動研究稿 · 自訂展示題 · 不連接正式學習資料</div><header class="top"><button class="brand" data-action="home"><span class="mark" aria-hidden="true"></span>SWSI<small>社工師國考</small></button><nav aria-label="導覽"><button data-action="home" aria-current="page">學習</button><button data-action="info" data-title="歷屆試題">歷屆試題</button><button data-action="info" data-title="申論練習">申論</button><button data-action="info" data-title="學習紀錄">我的紀錄</button></nav></header><main class="space" id="main"></main><footer class="foot">設計概念展示 · 兩道自訂題目，不計入正式紀錄</footer><dialog class="dialog" id="info"><h2 id="info-title"></h2><p>本次展示首頁、作答、解析與完成練習的連續體驗。此功能保留在原平台，這份研究稿不連接正式服務。</p><button class="primary" id="close">返回</button></dialog><script>
const qs=[{q:'初次會談時，如何與服務使用者建立合作關係？',options:['先了解對方的需要，說明服務方式與保密原則。','直接為對方決定處遇目標。','只記錄資料，不回應對方的感受。','要求對方立即承諾接受所有服務。'],answer:0,explain:'先理解對方的需要，再說明服務方式與保密原則，能建立信任，讓雙方有共同討論的基礎。',key:'建立信任'}, {q:'在服務過程中，如何讓服務使用者參與目標設定？',options:['由專業人員單方面決定所有目標。','共同討論需求、可行選擇與優先順序。','忽略對方意見，直接套用標準方案。','等服務結束後，再詢問對方的想法。'],answer:1,explain:'共同討論需求、可行選擇與優先順序，讓服務使用者參與決策，而非只接受專業人員的安排。',key:'參與決策'}];
let view='home',idx=0,picked=-1,answered=false,large=false,answers=[],busy=false;const main=document.getElementById('main');const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const icons=['<path d="M5 5h14v15H5zM8 9h8M8 13h6M8 17h4"/>','<circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/>','<path d="M6 4h12v17l-6-4-6 4zM9 8h6"/>','<path d="m5 17-1 4 4-1L20 8l-3-3zM14 8l3 3"/>'];
function home(){return `<div class="home-heading"><div><h1>開始今天的練習</h1><p>選擇科目，依自己的步調複習。</p></div><span>SWSI 社工師國考</span></div><div class="home-layout"><section class="focus-panel"><span class="subject-label">社會工作直接服務</span><h2>建立專業關係</h2><p>從初次會談，到共同設定目標。</p><div class="focus-bottom"><span>2 題示範練習<br>作答後查看解析</span><button class="primary" data-action="start">開始練習 <span class="arrow">→</span></button></div></section><div class="quick-modes">${[['歷屆試題','依年份與考次'],['模擬考','完整計時練習'],['錯題複習','理解還不熟的題'],['申論練習','整理思考與表達']].map((x,i)=>`<button class="mode" data-action="info" data-title="${x[0]}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[i]}</svg><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div></div><section class="catalog" aria-label="科目目錄"><div class="catalog-head"><h2>依科目練習</h2><span>5 個科目</span></div><div class="subject-list">${['社會工作','人類行為與社會環境','社會工作直接服務','社會工作管理','社會政策與社會立法'].map((x,i)=>`<button class="subject" data-action="info" data-title="${x}"><span class="number">${i+1}</span><b>${x}</b><span class="arrow">›</span></button>`).join('')}</div></section>`}
function quiz(){const q=qs[idx];return `<div class="study"><div class="study-toolbar"><button class="back" data-action="home">← 結束這次示範</button><div class="type-controls"><button data-action="small" aria-label="標準字級" aria-pressed="${!large}">A</button><button data-action="large" aria-label="放大字級" aria-pressed="${large}">A＋</button></div></div><section class="sheet"><div class="sheet-top"><span class="topic">社會工作直接服務</span><span>第 ${idx+1} 題 / 共 2 題</span></div><div class="progress" role="progressbar" aria-label="示範作答進度" aria-valuenow="${answers.length}" aria-valuemin="0" aria-valuemax="2"><i style="--progress:${answers.length/2}"></i></div><div class="question"><div class="prompt"><div class="prompt-meta">建立專業關係 · 展示題</div><h1 tabindex="-1">${q.q}</h1><p class="prompt-note">選擇一個最適合的答案</p></div><fieldset class="answers"><legend>選擇一個答案</legend>${q.options.map((o,i)=>`<div class="option ${answered&&i===q.answer?'correct':answered&&i===picked?'wrong':''}"><input type="radio" name="answer" id="o${i}" value="${i}" ${picked===i?'checked':''} ${answered?'disabled':''}><label for="o${i}"><span class="letter">${answered&&i===q.answer?'✓':answered&&i===picked?'×':'ABCD'[i]}</span><span>${o}</span></label></div>`).join('')}</fieldset></div><div id="feedback-slot">${answered?feedback():''}</div><div class="actions"><small>${answered?'理解原因後，再繼續。':'選好答案後，就能送出。'}</small><button class="primary" data-action="${answered?'next':'submit'}" ${picked<0?'disabled':''}>${answered?(idx===1?'看練習結果':'下一題'):'送出答案'} <span class="arrow">→</span></button></div></section></div>`}
function feedback(){const q=qs[idx],ok=picked===q.answer;return `<section class="feedback ${ok?'':'wrong'}" role="status" tabindex="-1"><div class="status"><span class="checkmark" aria-hidden="true">${ok?'✓':'↳'}</span>${ok?'答對了。這題的重點是⋯':'這題選 '+ 'ABCD'[q.answer]+'。一起看原因。'}</div><p>${q.explain.replace(q.key,`<span class="key">${q.key}</span>`)}</p></section>`}
function result(){const correct=answers.filter((a,i)=>a===qs[i].answer).length;return `<div class="result"><section class="sheet"><div class="result-graphic" aria-hidden="true"><i class="tile"></i><i class="tile"></i><span class="tick">✓</span></div><span class="tag">這組練習已完成</span><h1>這組練習，完成。</h1><p>兩道展示題都已作答。<br>這份結果只反映本次示範。</p><div class="result-stats"><div><strong>2</strong><span>完成題數</span></div><div><strong>${correct} / 2</strong><span>答對題數</span></div></div><button class="primary" data-action="home">回到學習首頁 <span class="arrow">→</span></button></section></div>`}
function render(){document.body.dataset.view=view;main.innerHTML=view==='home'?home():view==='quiz'?quiz():result();document.body.style.setProperty('--q-size',large?'26px':'');document.body.style.setProperty('--a-size',large?'19px':'')}
async function navigate(next){if(busy)return;busy=true;const update=()=>{view=next;render();window.scrollTo(0,0)};if(document.startViewTransition&&!reduced()){const t=document.startViewTransition(update);try{await t.finished}catch(e){}}else{update();if(!reduced())main.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:250})}busy=false;const heading=main.querySelector('h1');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}
document.addEventListener('change',e=>{if(e.target.name==='answer'){picked=+e.target.value;main.querySelector('[data-action=submit]').disabled=false}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action;if(a==='info'){document.getElementById('info-title').textContent=b.dataset.title;document.getElementById('info').showModal();return}if(a==='home'){navigate('home');return}if(a==='start'){idx=0;picked=-1;answered=false;answers=[];navigate('quiz');return}if(a==='small'||a==='large'){large=a==='large';render();main.querySelector(`[data-action=${a}]`).focus();return}if(a==='submit'&&!answered&&picked>=0){answered=true;answers.push(picked);const oldScroll=scrollY;render();window.scrollTo(0,oldScroll);const feedback=main.querySelector('.feedback');feedback.focus({preventScroll:true});feedback.scrollIntoView({block:'nearest',behavior:reduced()?'instant':'smooth'});return}if(a==='next'){if(idx===qs.length-1){navigate('result')}else{idx++;picked=-1;answered=false;navigate('quiz')}}});document.getElementById('close').onclick=()=>document.getElementById('info').close();render();
</script></body></html>
