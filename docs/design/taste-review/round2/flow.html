on.wrong input+label{border-color:#bb552f;background:#fff0e9}.option.wrong .letter{background:#bb552f!important;color:white}.option input:disabled+label{cursor:default;transform:none}.feedback{background:#eaf5ef;border-left:3px solid #27805e;padding:23px 26px;margin:0 0 24px;animation:reveal .35s both}.feedback.wrong{background:#fff0e9;border-color:#bb552f}.status{font-weight:600;font-size:14px;color:#21694e;margin-bottom:8px;display:flex;gap:10px}.feedback.wrong .status{color:#a74724}.feedback p{font-size:var(--a-size,15px);line-height:1.9;color:#344f5b}.checkmark{font-size:18px}.key{font-weight:700;text-decoration:underline;text-underline-offset:4px}.actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #cfdae2;padding:23px 0;gap:20px}.actions small{color:#657f90;font-size:12px}.actions .primary{min-width:180px}.result{max-width:800px;margin:55px auto}.result .sheet{view-transition-name:study-sheet;border-top:3px solid #007d8a;padding:30px 0}.result h1{font-size:38px;letter-spacing:-1px;margin:15px 0}.result p{font-size:14px;color:#617c8d}.result-graphic{display:none}.result-stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #ccd9e1;border-bottom:1px solid #ccd9e1;margin:30px 0;padding:25px 0}.result-stats strong{display:block;font-size:60px;font-weight:400;letter-spacing:-3px;color:#007d8a}.result-stats span{font-size:12px;color:#617c8d}.dialog{width:calc(100% - 40px);max-width:430px;border:0;padding:30px;color:#153448;background:white}.dialog::backdrop{background:#102a3b90;backdrop-filter:blur(3px)}.dialog h2{font-size:22px;margin-bottom:15px}.dialog p{font-size:14px;color:#647e8e;margin-bottom:25px}.dialog .primary{width:100%}.subject{animation:reveal .45s both}.subject:nth-of-type(2){animation-delay:.05s}.subject:nth-of-type(3){animation-delay:.1s}.subject:nth-of-type(4){animation-delay:.15s}.subject:nth-of-type(5){animation-delay:.2s}@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity: </style></head><body><div class="notice">SWSI 互動研究稿 · 自訂展示題 · 不連接正式學習資料</div><header class="top"><button class="brand" data-action="home"><span class="mark" aria-hidden="true"></span>SWSI<small>社工師國考</small></button><nav aria-label="導覽"><button data-action="home" aria-current="page">學習</button><button data-action="info" data-title="歷屆試題">歷屆試題</button><button data-action="info" data-title="申論練習">申論</button><button data-action="info" data-title="學習紀錄">我的紀錄</button></nav></header><main class="space" id="main"></main><footer class="foot">設計概念展示 · 兩道自訂題目，不計入正式紀錄</footer><dialog class="dialog" id="info"><h2 id="info-title"></h2><p>本次展示首頁、作答、解析與完成練習的連續體驗。此功能保留在原平台，這份研究稿不連接正式服務。</p><button class="primary" id="close">返回</button></dialog><script>
const qs=[{q:'初次會談時，如何與服務使用者建立合作關係？',options:['先了解對方的需要，說明服務方式與保密原則。','直接為對方決定處遇目標。','只記錄資料，不回應對方的感受。','要求對方立即承諾接受所有服務。'],answer:0,explain:'先理解對方的需要，再說明服務方式與保密原則，能建立信任，讓雙方有共同討論的基礎。',key:'建立信任'}, {q:'在服務過程中，如何讓服務使用者參與目標設定？',options:['由專業人員單方面決定所有目標。','共同討論需求、可行選擇與優先順序。','忽略對方意見，直接套用標準方案。','等服務結束後，再詢問對方的想法。'],answer:1,explain:'共同討論需求、可行選擇與優先順序，讓服務使用者參與決策，而非只接受專業人員的安排。',key:'參與決策'}];
let view='home',idx=0,picked=-1,answered=false,large=false,answers=[],busy=false;const main=document.getElementById('main');const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function home(){return `<div class="home-layout"><section class="home-intro"><div class="overline">SWSI / 社工師國考練習</div><h1>讀懂觀點，<br><span>練出判斷。</span></h1><p>從一個科目開始，把讀過的知識，變成面對情境時的選擇。</p><div class="focus-panel"><span class="overline">本次示範 / 直接服務</span><h2>專業關係，<br>從理解對方開始。</h2><p>建立關係與共同設定目標</p><div class="focus-bottom"><span>2 道自訂題目<br>作答後查看解析</span><button class="primary" data-action="start">開始練習 <span class="arrow">→</span></button></div></div></section><section class="catalog" aria-label="科目目錄"><div class="catalog-head"><h2>選擇練習科目</h2><span>SUBJECTS / 05</span></div>${[['社會工作','價值、倫理與專業發展'],['人類行為與社會環境','理解個人與環境的互動'],['社會工作直接服務','個案、團體與社區工作'],['社會工作管理','組織、行政與方案管理'],['社會政策與社會立法','制度、福利與權益保障']].map((x,i)=>`<button class="subject ${i===2?'active':''}" data-action="info" data-title="${x[0]}"><span class="number">0${i+1}</span><span><b>${x[0]}</b><small>${x[1]}</small></span><span class="arrow">↗</span></button>`).join('')}</section></div><div class="tools">${[['歷屆試題','依考次選擇範圍'],['模擬考','完整計時練習'],['錯題複習','重看不熟的觀念'],['申論練習','整理與表達觀點'],['弱點分析','掌握複習方向']].map(x=>`<button data-action="info" data-title="${x[0]}"><span>${x[0]}<small>${x[1]}</small></span><span class="arrow">↗</span></button>`).join('')}</div>`}
function quiz(){const q=qs[idx];return `<div class="study"><div class="study-toolbar"><button class="back" data-action="home">← 結束這次示範</button><div class="type-controls"><button data-action="small" aria-label="標準字級" aria-pressed="${!large}">A</button><button data-action="large" aria-label="放大字級" aria-pressed="${large}">A＋</button></div></div><section class="sheet"><div class="progress" role="progressbar" aria-label="示範作答進度" aria-valuenow="${answers.length}" aria-valuemin="0" aria-valuemax="2"><i style="--progress:${answers.length/2}"></i></div><div class="sheet-top"><span class="topic"><i></i> 建立專業關係</span><span>${idx+1} / 2 · 展示題</span></div><div class="question"><div class="prompt"><div class="prompt-meta"><b>0${idx+1}</b> 社會工作直接服務</div><h1 tabindex="-1">${q.q}</h1><p class="prompt-note">單選題 · 選出最適合的處理方式</p></div><fieldset class="answers"><legend>選擇一個答案</legend>${q.options.map((o,i)=>`<div class="option ${answered&&i===q.answer?'correct':answered&&i===picked?'wrong':''}"><input type="radio" name="answer" id="o${i}" value="${i}" ${picked===i?'checked':''} ${answered?'disabled':''}><label for="o${i}"><span class="letter">${answered&&i===q.answer?'✓':answered&&i===picked?'×':'ABCD'[i]}</span><span>${o}</span></label></div>`).join('')}</fieldset></div><div id="feedback-slot">${answered?feedback():''}</div><div class="actions"><small>${answered?'理解原因後，再繼續。':'選好答案後，就能送出。'}</small><button class="primary" data-action="${answered?'next':'submit'}" ${picked<0?'disabled':''}>${answered?(idx===1?'看練習結果':'下一題'):'送出答案'} <span class="arrow">→</span></button></div></section></div>`}
function feedback(){const q=qs[idx],ok=picked===q.answer;return `<section class="feedback ${ok?'':'wrong'}" role="status" tabindex="-1"><div class="status"><span class="checkmark" aria-hidden="true">${ok?'✓':'↳'}</span>${ok?'答對了。這題的重點是⋯':'這題選 '+ 'ABCD'[q.answer]+'。一起看原因。'}</div><p>${q.explain.replace(q.key,`<span class="key">${q.key}</span>`)}</p></section>`}
function result(){const correct=answers.filter((a,i)=>a===qs[i].answer).length;return `<div class="result"><section class="sheet"><div class="result-graphic" aria-hidden="true"><i class="tile"></i><i class="tile"></i><span class="tick">✓</span></div><span class="tag">這組練習已完成</span><h1>這組練習，完成。</h1><p>兩道展示題都已作答。<br>這份結果只反映本次示範。</p><div class="result-stats"><div><strong>2</strong><span>完成題數</span></div><div><strong>${correct} / 2</strong><span>答對題數</span></div></div><button class="primary" data-action="home">回到學習首頁 <span class="arrow">→</span></button></section></div>`}
function render(){main.innerHTML=view==='home'?home():view==='quiz'?quiz():result();document.body.style.setProperty('--q-size',large?'26px':'');document.body.style.setProperty('--a-size',large?'19px':'')}
async function navigate(next){if(busy)return;busy=true;const update=()=>{view=next;render();window.scrollTo(0,0)};if(document.startViewTransition&&!reduced()){const t=document.startViewTransition(update);try{await t.finished}catch(e){}}else{update();if(!reduced())main.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:250})}busy=false;const heading=main.querySelector('h1');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}
document.addEventListener('change',e=>{if(e.target.name==='answer'){picked=+e.target.value;main.querySelector('[data-action=submit]').disabled=false}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action;if(a==='info'){document.getElementById('info-title').textContent=b.dataset.title;document.getElementById('info').showModal();return}if(a==='home'){navigate('home');return}if(a==='start'){idx=0;picked=-1;answered=false;answers=[];navigate('quiz');return}if(a==='small'||a==='large'){large=a==='large';render();main.querySelector(`[data-action=${a}]`).focus();return}if(a==='submit'&&!answered&&picked>=0){answered=true;answers.push(picked);const oldScroll=scrollY;render();window.scrollTo(0,oldScroll);const feedback=main.querySelector('.feedback');feedback.focus({preventScroll:true});feedback.scrollIntoView({block:'nearest',behavior:reduced()?'instant':'smooth'});return}if(a==='next'){if(idx===qs.length-1){navigate('result')}else{idx++;picked=-1;answered=false;navigate('quiz')}}});document.getElementById('close').onclick=()=>document.getElementById('info').close();render();
</script></body></html>
