hecked+label .letter{background:#7059ba;color:white}.option input:disabled+label{cursor:default}.option.correct label{background:#eff7f2;border-color:#8abc9c;box-shadow:inset 3px 0 #488e64}.option.correct .letter{background:#488e64!important;color:white}.option.wrong label{border-color:#cb9278;box-shadow:inset 3px 0 #b96f4f;background:#fcf3ec}.status{display:flex;align-items:center;gap:10px;color:#346144;font-size:13px;margin-bottom:10px;font-weight:600}.feedback{padding:23px 30px;background:#f0f7f2;border-top:1px solid #d7e8dc;animation:reveal .35s ease both}.feedback.wrong{background:#fbf4ed;border-color:#eddfd0}.feedback.wrong .status{color:#895130}.feedback p{font-size:var(--a-size,15px);line-height:1.9;color:#4e6256}.feedback.wrong p{color:#6e5945}.feedback .key{display:inline;background:#dceee1;padding:1px 4px;border-radius:3px}.feedback.wrong .key{background:#f3e1cf}.checkmark{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#deeee2;font-size:14px;animation:stamp .35s both}.actions{padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-top:1px solid #eae6f2}.actions small{color:#7c7189;font-size:11px}.actions .primary{min-width:165px}.primary:disabled{background:#e8e3ef;color:#8b7c9a}.result{max-width:650px;margin:auto}.result .sheet{padding:35px;text-align:center}.result h1{font-size:29px;margin:14px 0}.result p{font-size:14px;color:#776d84}.result-graphic{width:180px;height:150px;margin:5px auto 20px;position:relative;display:flex;justify-content:center;align-items:center}.result-graphic .tile{position:absolute;width:75px;height:100px;border:1px solid #c8bce5;background:#e5ddf8;border-radius:12px;transform:rotate(-18deg) translateX(-28px);animation:tile-left .7s both}.result-graphic .tile:nth-child(2){background:#7560b7;border-color:#7560b7;transform:rotate(15deg) translateX(25px);animation:tile-right .7s both}.result-graphic .tick{position:relative;color:#fff;font-s </style></head><body><div class="notice">SWSI 互動研究稿 · 自訂展示題 · 不連接正式學習資料</div><header class="top"><button class="brand" data-action="home"><span class="mark" aria-hidden="true"></span>SWSI<small>社工師國考</small></button><nav aria-label="導覽"><button data-action="home" aria-current="page">學習</button><button data-action="info" data-title="歷屆試題">歷屆試題</button><button data-action="info" data-title="申論練習">申論</button><button data-action="info" data-title="學習紀錄">我的紀錄</button></nav></header><main class="space" id="main"></main><footer class="foot">設計概念展示 · 兩道自訂題目，不計入正式紀錄</footer><dialog class="dialog" id="info"><h2 id="info-title"></h2><p>本次展示首頁、作答、解析與完成練習的連續體驗。此功能保留在原平台，這份研究稿不連接正式服務。</p><button class="primary" id="close">返回</button></dialog><script>
const qs=[{q:'初次會談時，如何與服務使用者建立合作關係？',options:['先了解對方的需要，說明服務方式與保密原則。','直接為對方決定處遇目標。','只記錄資料，不回應對方的感受。','要求對方立即承諾接受所有服務。'],answer:0,explain:'先理解對方的需要，再說明服務方式與保密原則，能建立信任，讓雙方有共同討論的基礎。',key:'建立信任'}, {q:'在服務過程中，如何讓服務使用者參與目標設定？',options:['由專業人員單方面決定所有目標。','共同討論需求、可行選擇與優先順序。','忽略對方意見，直接套用標準方案。','等服務結束後，再詢問對方的想法。'],answer:1,explain:'共同討論需求、可行選擇與優先順序，讓服務使用者參與決策，而非只接受專業人員的安排。',key:'參與決策'}];
let view='home',idx=0,picked=-1,answered=false,large=false,answers=[],busy=false;const main=document.getElementById('main');const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function home(){return `<div class="heading"><div><h1>今天，先練這一題。</h1><p>社會工作直接服務 · 建立專業關係</p></div><span class="tag">選擇題 / 練習</span></div><div class="workspace"><div><section class="sheet"><div class="sheet-top"><span class="topic"><i></i> 建立專業關係</span><span>2 題互動示範</span></div><div class="preview-body"><p class="eyebrow">從一個實際情境開始</p><h2>${qs[0].q}</h2><div class="sample-line"><b>A</b><span>${qs[0].options[0]}</span></div></div><div class="sheet-tail"><p>先作答，再看解析。<br>進度只存在這次示範中。</p><button class="primary" data-action="start">開始練習 <span class="arrow">→</span></button></div></section><div class="intro-strip">這個閱讀區會直接延續到作答畫面。</div></div><aside class="side"><h2>換一種練習方式</h2><button class="route" data-action="info" data-title="歷屆試題"><span class="route-icon" aria-hidden="true">▤</span><span><b>歷屆試題</b><small>依年份與科目，選擇練習範圍</small></span><span class="arrow">↗</span></button><button class="route" data-action="info" data-title="申論練習"><span class="route-icon" aria-hidden="true">✎</span><span><b>申論練習</b><small>從整理觀點，到完整表達</small></span><span class="arrow">↗</span></button></aside></div><div class="tools"><button data-action="info" data-title="錯題複習"><span>錯題複習<small>回到還不熟的地方</small></span><span class="arrow">↗</span></button><button data-action="info" data-title="模擬考"><span>模擬考<small>練習完整作答節奏</small></span><span class="arrow">↗</span></button><button data-action="info" data-title="弱點分析"><span>弱點分析<small>看看接下來練什麼</small></span><span class="arrow">↗</span></button></div>`}
function quiz(){const q=qs[idx];return `<div class="study"><div class="study-toolbar"><button class="back" data-action="home">← 結束這次示範</button><div class="type-controls"><button data-action="small" aria-label="標準字級" aria-pressed="${!large}">A</button><button data-action="large" aria-label="放大字級" aria-pressed="${large}">A＋</button></div></div><section class="sheet"><div class="progress" role="progressbar" aria-label="示範作答進度" aria-valuenow="${answers.length}" aria-valuemin="0" aria-valuemax="2"><i style="--progress:${answers.length/2}"></i></div><div class="sheet-top"><span class="topic"><i></i> 建立專業關係</span><span>${idx+1} / 2 · 展示題</span></div><div class="question"><h1 tabindex="-1">${q.q}</h1><fieldset class="answers"><legend>選擇一個答案</legend>${q.options.map((o,i)=>`<div class="option ${answered&&i===q.answer?'correct':answered&&i===picked?'wrong':''}"><input type="radio" name="answer" id="o${i}" value="${i}" ${picked===i?'checked':''} ${answered?'disabled':''}><label for="o${i}"><span class="letter">${answered&&i===q.answer?'✓':answered&&i===picked?'×':'ABCD'[i]}</span><span>${o}</span></label></div>`).join('')}</fieldset></div><div id="feedback-slot">${answered?feedback():''}</div><div class="actions"><small>${answered?'理解原因後，再繼續。':'選好答案後，就能送出。'}</small><button class="primary" data-action="${answered?'next':'submit'}" ${picked<0?'disabled':''}>${answered?(idx===1?'看練習結果':'下一題'):'送出答案'} <span class="arrow">→</span></button></div></section></div>`}
function feedback(){const q=qs[idx],ok=picked===q.answer;return `<section class="feedback ${ok?'':'wrong'}" role="status" tabindex="-1"><div class="status"><span class="checkmark" aria-hidden="true">${ok?'✓':'↳'}</span>${ok?'答對了。這題的重點是⋯':'這題選 '+ 'ABCD'[q.answer]+'。一起看原因。'}</div><p>${q.explain.replace(q.key,`<span class="key">${q.key}</span>`)}</p></section>`}
function result(){const correct=answers.filter((a,i)=>a===qs[i].answer).length;return `<div class="result"><section class="sheet"><div class="result-graphic" aria-hidden="true"><i class="tile"></i><i class="tile"></i><span class="tick">✓</span></div><span class="tag">這組練習已完成</span><h1>把理解，留在這一刻。</h1><p>兩道展示題都已作答。<br>這份結果只反映本次示範。</p><div class="result-stats"><div><strong>2</strong><span>完成題數</span></div><div><strong>${correct} / 2</strong><span>答對題數</span></div></div><button class="primary" data-action="home">回到學習首頁 <span class="arrow">→</span></button></section></div>`}
function render(){main.innerHTML=view==='home'?home():view==='quiz'?quiz():result();document.body.style.setProperty('--q-size',large?'26px':'');document.body.style.setProperty('--a-size',large?'19px':'')}
async function navigate(next){if(busy)return;busy=true;const update=()=>{view=next;render();window.scrollTo(0,0)};if(document.startViewTransition&&!reduced()){const t=document.startViewTransition(update);try{await t.finished}catch(e){}}else{update();if(!reduced())main.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:250})}busy=false;const heading=main.querySelector('h1');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}
document.addEventListener('change',e=>{if(e.target.name==='answer'){picked=+e.target.value;main.querySelector('[data-action=submit]').disabled=false}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||busy)return;const a=b.dataset.action;if(a==='info'){document.getElementById('info-title').textContent=b.dataset.title;document.getElementById('info').showModal();return}if(a==='home'){navigate('home');return}if(a==='start'){idx=0;picked=-1;answered=false;answers=[];navigate('quiz');return}if(a==='small'||a==='large'){large=a==='large';render();main.querySelector(`[data-action=${a}]`).focus();return}if(a==='submit'&&!answered&&picked>=0){answered=true;answers.push(picked);const oldScroll=scrollY;render();window.scrollTo(0,oldScroll);const feedback=main.querySelector('.feedback');feedback.focus({preventScroll:true});feedback.scrollIntoView({block:'nearest',behavior:reduced()?'instant':'smooth'});return}if(a==='next'){if(idx===qs.length-1){navigate('result')}else{idx++;picked=-1;answered=false;navigate('quiz')}}});document.getElementById('close').onclick=()=>document.getElementById('info').close();render();
</script></body></html>
